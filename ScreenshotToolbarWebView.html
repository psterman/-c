<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Screenshot Toolbar</title>
<style>
@font-face{font-family:"AppUi";src:local("Segoe UI");unicode-range:U+0000-024F,U+1E00-1EFF,U+2000-206F,U+20A0-20CF,U+2100-214F}
@font-face{font-family:"AppUi";src:local("DengXian"),local("Microsoft YaHei UI"),local("Microsoft YaHei");unicode-range:U+2E80-2EFF,U+2F00-2FDF,U+3000-303F,U+3040-30FF,U+3100-312F,U+31A0-31BF,U+3400-4DBF,U+4E00-9FFF,U+F900-FAFF}
:root{
  --bg:#0a0a0a;
  --panel:#0f1114;
  --panel-border:rgba(255,122,26,.34);
  --accent:#ff7a1a;
  --accent-soft:rgba(255,122,26,.12);
  --accent-border:rgba(255,122,26,.42);
  --danger:#ff8a95;
  --danger-soft:rgba(255,112,126,.16);
  --danger-border:rgba(255,112,126,.42);
  --ease:.22s cubic-bezier(.22,1,.36,1);
}
body[data-theme="light"]{
  --bg:#f7f7f7;
  --panel:#ffffff;
  --panel-border:#e5e5e5;
  --accent:#e67e22;
  --accent-soft:#fff3e8;
  --accent-border:#d35400;
  --danger:#c0392b;
  --danger-soft:#fdecea;
  --danger-border:#e6b0aa;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font:13px "AppUi","Segoe UI","DengXian","Microsoft YaHei UI","Microsoft YaHei",system-ui,sans-serif}
body{opacity:1}
body.theme-ready{opacity:1}
#shell{display:inline-flex;align-items:center;justify-content:center;padding:0;margin:0;pointer-events:auto}
#bar{
  display:inline-flex;align-items:center;gap:6px;
  width:max-content;
  height:44px;
  padding:0 10px;
  border-radius:12px;
  background:linear-gradient(180deg,#14181d,#0d1014);
  border:1px solid var(--panel-border);
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.04);
  animation:barIn .2s ease-out;
}
@keyframes barIn{from{transform:translateY(4px);opacity:.85}to{transform:translateY(0);opacity:1}}
.tb{
  width:30px;height:30px;
  display:inline-flex;align-items:center;justify-content:center;
  border-radius:8px;
  border:1px solid transparent;
  background:var(--panel);
  color:var(--accent);
  cursor:pointer;
  outline:none;
  transition:transform var(--ease),background var(--ease),border-color var(--ease),box-shadow var(--ease),color var(--ease),opacity var(--ease);
}
.tb:hover,.tb:focus-visible{
  transform:translateY(-1px);
  background:var(--accent-soft);
  border-color:var(--accent-border);
  box-shadow:0 0 0 1px rgba(255,122,26,.18),0 0 12px rgba(255,122,26,.14);
}
.tb:active{transform:translateY(0) scale(.97)}
.tb.active{background:var(--accent-soft);border-color:transparent}
.tb:disabled{opacity:.35;cursor:default}
.tb.danger{color:var(--danger);border-color:transparent}
.tb.danger:hover,.tb.danger:focus-visible{
  background:var(--danger-soft);
  border-color:var(--danger-border);
  box-shadow:0 0 0 1px rgba(255,138,149,.2),0 0 12px rgba(255,138,149,.12);
}
.sep{width:1px;height:18px;background:rgba(255,122,26,.3);margin:0 2px;flex:0 0 auto}
.lucide{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
body[data-theme="light"] #bar{
  background:#ffffff;
  box-shadow: inset 0 0 0 1px rgba(0,0,0,.02);
}
</style>
</head>
<body>
<div id="shell">
  <div id="bar" aria-label="截图工具栏"></div>
</div>

<script src="./assets/nm-bottom-dock.js"></script>
<script>
(function () {
  var __nmDock = null;
  var __schema = { items: [] };
  var __state = { annotMode: 'none', toolbarVisible: true, canUndo: false, canRedo: false };

  function post(obj) {
    try {
      if (window.chrome && window.chrome.webview) window.chrome.webview.postMessage(obj);
    } catch (e) {}
  }

  var bar = document.getElementById('bar');

  function iconSvg(cmd) {
    switch (String(cmd || '')) {
      case 'rect': return '<svg class="lucide" viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="12" rx="1"/></svg>';
      case 'ellipse': return '<svg class="lucide" viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="8" ry="6"/></svg>';
      case 'arrow': return '<svg class="lucide" viewBox="0 0 24 24"><path d="M4 16 18 6"/><path d="m18 6-1 6"/><path d="m18 6-6 1"/></svg>';
      case 'number': return '<svg class="lucide" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M10 10h3v6"/><path d="M10 16h4"/></svg>';
      case 'symbol': return '<svg class="lucide" viewBox="0 0 24 24"><path d="m12 3 2.4 7.4h7.6l-6 4.6 2.3 7-6.3-4.6-6.3 4.6 2.3-7-6-4.6h7.6z"/></svg>';
      case 'annot_text': return '<svg class="lucide" viewBox="0 0 24 24"><path d="M4 6h16"/><path d="M12 6v12"/></svg>';
      case 'mosaic': return '<svg class="lucide" viewBox="0 0 24 24"><path d="M4 4h7v7H4z"/><path d="M13 4h7v7h-7z"/><path d="M4 13h7v7H4z"/><path d="M13 13h7v7h-7z"/></svg>';
      case 'eraser': return '<svg class="lucide" viewBox="0 0 24 24"><path d="m7 21-4-4 9-9 4 4-9 9z"/><path d="M14 14l4 4"/><path d="M16 3l5 5"/></svg>';
      case 'undo': return '<svg class="lucide" viewBox="0 0 24 24"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-9-9H3"/></svg>';
      case 'redo': return '<svg class="lucide" viewBox="0 0 24 24"><path d="M21 7v6h-6"/><path d="M3 17a9 9 0 0 1 9-9h9"/></svg>';
      case 'pin': return '<svg class="lucide" viewBox="0 0 24 24"><path d="M12 17v5"/><path d="M9 3h6l1 6-2 2v5H10v-5L8 9l1-6z"/></svg>';
      case 'ocr': return '<svg class="lucide" viewBox="0 0 24 24"><path d="M7 5H5a2 2 0 0 0-2 2v2"/><path d="M17 5h2a2 2 0 0 1 2 2v2"/><path d="M7 19H5a2 2 0 0 1-2-2v-2"/><path d="M17 19h2a2 2 0 0 0 2-2v-2"/><path d="M8 11h8"/><path d="M8 15h6"/></svg>';
      case 'ocr_edit': return '<svg class="lucide" viewBox="0 0 24 24"><path d="M3 21h6"/><path d="m14.5 4.5 5 5"/><path d="M7 17l2.5-.5L19 7a1.8 1.8 0 0 0-2.5-2.5L7 14z"/></svg>';
      case 'text': return '<svg class="lucide" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><rect x="4" y="4" width="11" height="11" rx="2"/></svg>';
      case 'save': return '<svg class="lucide" viewBox="0 0 24 24"><path d="M5 4h12l2 2v14H5z"/><path d="M8 4v6h8V4"/><path d="M9 16h6"/></svg>';
      case 'ai': return '<svg class="lucide" viewBox="0 0 24 24"><path d="M12 2v4"/><path d="M12 18v4"/><path d="M4.9 4.9 7.7 7.7"/><path d="m16.3 16.3 2.8 2.8"/><path d="M2 12h4"/><path d="M18 12h4"/><path d="m4.9 19.1 2.8-2.8"/><path d="m16.3 7.7 2.8-2.8"/><circle cx="12" cy="12" r="3.5"/></svg>';
      case 'search': return '<svg class="lucide" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>';
      case 'color': return '<svg class="lucide" viewBox="0 0 24 24"><path d="m14 4 6 6"/><path d="m6 12 8-8 6 6-8 8H6z"/><path d="M4 20h6"/></svg>';
      case 'close': return '<svg class="lucide" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>';
      default: return '<svg class="lucide" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/></svg>';
    }
  }

  function applyTheme(mode) {
    var tm = String(mode || '').toLowerCase() === 'light' ? 'light' : 'dark';
    document.body.setAttribute('data-theme', tm);
    document.body.classList.add('theme-ready');
  }

  function applyState() {
    var mode = String(__state.annotMode || 'none');
    ['rect','ellipse','arrow','number','symbol','annot_text','mosaic','eraser'].forEach(function(cmd){
      var b = bar.querySelector('.tb[data-cmd="'+cmd+'"]');
      if (!b) return;
      var key = (cmd === 'annot_text') ? 'text' : cmd;
      b.classList.toggle('active', mode === key);
    });
    var pinBtn = bar.querySelector('.tb[data-cmd="pin"]');
    if (pinBtn) pinBtn.classList.toggle('active', !!__state.toolbarVisible);
    var undoBtn = bar.querySelector('.tb[data-cmd="undo"]');
    if (undoBtn) undoBtn.toggleAttribute('disabled', !__state.canUndo);
    var redoBtn = bar.querySelector('.tb[data-cmd="redo"]');
    if (redoBtn) redoBtn.toggleAttribute('disabled', !__state.canRedo);
  }

  function reportLayout() {
    try {
      var r = bar.getBoundingClientRect();
      post({ type: 'event', name: 'layout', payload: { width: Math.ceil(r.width), height: Math.ceil(r.height) } });
    } catch (e) {}
  }

  function renderToolbar() {
    var items = (__schema && Array.isArray(__schema.items)) ? __schema.items : [];
    if (!items.length) return;
    bar.innerHTML = '';
    items.forEach(function (it) {
      if (!it || it.kind === 'sep') {
        var sep = document.createElement('div');
        sep.className = 'sep';
        if (it && it.drag) sep.setAttribute('data-drag', '1');
        bar.appendChild(sep);
        return;
      }
      var cmd = String(it.id || '');
      var btn = document.createElement('button');
      btn.className = 'tb' + (it.danger ? ' danger' : '');
      btn.setAttribute('data-cmd', cmd);
      btn.setAttribute('title', it.title || cmd);
      btn.setAttribute('aria-label', it.aria || it.title || cmd);
      btn.innerHTML = iconSvg(cmd);
      bar.appendChild(btn);
    });
    applyState();
    reportLayout();
  }

  bar.addEventListener('click', function (ev) {
    var t = ev.target;
    while (t && t !== bar && !t.getAttribute('data-cmd')) t = t.parentNode;
    if (!t || t === bar) return;
    if (t.hasAttribute('disabled')) return;
    post({ type: 'action', name: 'invoke', payload: { cmd: t.getAttribute('data-cmd') } });
  });

  bar.addEventListener('mousedown', function (ev) {
    if (ev.button !== 0) return;
    var t = ev.target;
    while (t && t !== bar && !t.getAttribute('data-cmd')) t = t.parentNode;
    if (!t || t === bar) post({ type: 'action', name: 'dragWindow', payload: {} });
  });

  if (window.chrome && window.chrome.webview) {
    window.chrome.webview.addEventListener('message', function (ev) {
      var msg = ev.data || {};
      if (typeof msg === 'string') {
        try { msg = JSON.parse(msg); } catch (e) { return; }
      }
      if (__nmDock && typeof __nmDock.onHostMessage === 'function') __nmDock.onHostMessage(msg);
      if (msg && msg.type === 'RESET_STATE') return;
      if (msg.type === 'init') {
        var p = msg.payload || msg;
        applyTheme(p.themeMode || 'dark');
        if (p.schema) { __schema = p.schema; renderToolbar(); }
        return;
      }
      if (msg.type === 'state') {
        var p2 = msg.payload || msg;
        applyTheme(p2.themeMode || p2.theme || 'dark');
        __state.annotMode = p2.annotMode || 'none';
        __state.toolbarVisible = !!p2.toolbarVisible;
        __state.canUndo = !!p2.canUndo;
        __state.canRedo = !!p2.canRedo;
        applyState();
        return;
      }
    });
  }

  window.addEventListener('resize', reportLayout);
  if (window.NiumaBottomDock && typeof window.NiumaBottomDock.mount === 'function')
    __nmDock = window.NiumaBottomDock.mount({ sceneId: 'screenshot', post: post, space: 70 });
  reportLayout();
  post({ type: 'event', name: 'requestInit', payload: {} });
  post({ type: 'event', name: 'ready', payload: {} });
  requestAnimationFrame(function(){ post({ type: 'event', name: 'paint_ok', payload: {} }); reportLayout(); });
  setTimeout(reportLayout, 80);
  setTimeout(reportLayout, 260);
})();
</script>
</body>
</html>
