<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings Panel</title>
  <style>
    @font-face {
      font-family: "AppUi";
      src: local("Segoe UI");
      font-weight: 400;
      unicode-range:
        U+0000-024F,
        U+1E00-1EFF,
        U+2000-206F,
        U+20A0-20CF,
        U+2100-214F;
    }
    @font-face {
      font-family: "AppUi";
      src: local("DengXian"), local("Microsoft YaHei UI"), local("Microsoft YaHei");
      font-weight: 400;
      unicode-range:
        U+2E80-2EFF,
        U+2F00-2FDF,
        U+3000-303F,
        U+3040-30FF,
        U+3100-312F,
        U+31A0-31BF,
        U+3400-4DBF,
        U+4E00-9FFF,
        U+F900-FAFF;
    }
    @font-face {
      font-family: "AppUi";
      src: local("Segoe UI Semibold"), local("Segoe UI Bold"), local("Segoe UI");
      font-weight: 700;
      unicode-range:
        U+0000-024F,
        U+1E00-1EFF,
        U+2000-206F,
        U+20A0-20CF,
        U+2100-214F;
    }
    @font-face {
      font-family: "AppUi";
      src: local("DengXian"), local("Microsoft YaHei UI Bold"), local("Microsoft YaHei Bold"), local("Microsoft YaHei UI"), local("Microsoft YaHei");
      font-weight: 700;
      unicode-range:
        U+2E80-2EFF,
        U+2F00-2FDF,
        U+3000-303F,
        U+3040-30FF,
        U+3100-312F,
        U+31A0-31BF,
        U+3400-4DBF,
        U+4E00-9FFF,
        U+F900-FAFF;
    }
    :root {
      --bg: #0d1016; --surface: #142236; --surface2: #1b2d45; --surface3: #223955;
      --border: #2f4665; --border2: #3a567a; --orange: #e67e22;
      --text: #f0f0f0; --text-dim: #9a9a9a; --text-xs: #666; --success: #00ff41; --danger: #e74c3c;
      --row-hover: #1f324d; --row-active: #2a1b0d; --row-active-text: #f0f0f0;
      --glow: 0 0 8px #e67e2288, 0 0 18px #1b2d4544;
      --font: "AppUi", "Segoe UI", "DengXian", "Microsoft YaHei UI", "Microsoft YaHei", system-ui, sans-serif;
      --font-strong: "AppUi", "Segoe UI Semibold", "Segoe UI", "DengXian", "Microsoft YaHei UI", "Microsoft YaHei", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: var(--font); font-weight: 400; text-rendering: optimizeLegibility; -webkit-font-smoothing: antialiased; }
    #app { display: flex; width: 100%; height: 100%; }
    #sidebar { width: 190px; background: var(--surface); border-right: 1px solid var(--border); padding: 10px 8px; display: flex; flex-direction: column; gap: 6px; }
    .tab-btn { border: 1px solid var(--border2); background: var(--surface2); color: var(--text-dim); border-radius: 6px; height: 34px; cursor: pointer; font-size: 12px; text-align: left; padding: 0 12px; transition: .15s; font-family: var(--font-strong); font-weight: 700; }
    .tab-btn:hover { color: var(--text); border-color: var(--orange); }
    .tab-btn.active { color: var(--orange); border-color: var(--orange); box-shadow: var(--glow); }
    #content { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    #header { height: 48px; border-bottom: 1px solid var(--border); background: var(--surface2); display: flex; align-items: center; justify-content: space-between; padding: 0 14px; }
    #status { font-size: 12px; color: var(--text-dim); font-family: var(--font); font-weight: 400; }
    #panel { flex: 1; overflow: auto; padding: 16px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 14px; margin-bottom: 12px; }
    .title { font-size: 14px; margin-bottom: 10px; color: var(--text); font-family: var(--font-strong); font-weight: 700; letter-spacing: .01em; }
    .row { display: grid; grid-template-columns: 240px 1fr; align-items: center; gap: 12px; margin-bottom: 10px; }
    .label { font-size: 12px; color: var(--text-dim); font-family: var(--font-strong); font-weight: 700; }
    input[type="text"], input[type="number"], textarea, select { width: 100%; background: var(--surface3); border: 1px solid var(--border2); border-radius: 6px; color: var(--text); padding: 8px 10px; outline: none; font-family: var(--font); font-weight: 400; }
    input[type="text"], input[type="number"], select { height: 34px; }
    textarea { min-height: 120px; resize: vertical; }
    input:focus, textarea:focus, select:focus { border-color: var(--orange); }
    .inline { display: flex; gap: 8px; align-items: center; }
    .btn { height: 34px; border: 1px solid var(--border2); border-radius: 6px; background: var(--surface2); color: var(--text); padding: 0 12px; cursor: pointer; transition: .15s; font-family: var(--font-strong); font-weight: 700; }
    .btn:hover { border-color: var(--orange); color: var(--orange); }
    .btn.primary { background: #2a1605; border-color: var(--orange); color: var(--orange); }
    .btn.primary:hover { box-shadow: var(--glow); }
    .hint { font-size: 11px; color: var(--text-xs); margin-top: 4px; }
    #footer { display: none; }
    .ok { color: var(--success); } .err { color: var(--danger); }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .qa-row { display: grid; grid-template-columns: 70px 1fr 130px; gap: 8px; margin-bottom: 8px; }
    .tag-wrap { display: flex; flex-wrap: wrap; gap: 8px; }
    .tag { border: 1px solid var(--border2); border-radius: 14px; padding: 4px 10px; font-size: 12px; font-family: var(--font); font-weight: 400; }
    .subtabs { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
    .subtab-btn { border: 1px solid var(--border2); background: var(--surface2); color: var(--text-dim); border-radius: 6px; height: 30px; padding: 0 12px; cursor: pointer; font-size: 12px; font-family: var(--font-strong); font-weight: 700; }
    .subtab-btn.active { color: var(--orange); border-color: var(--orange); }
    .prompt-grid { display: grid; grid-template-columns: 420px 1fr; gap: 12px; }
    .list-panel { border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
    .list-head, .list-row { display: grid; grid-template-columns: 120px 1fr; gap: 8px; padding: 8px 10px; }
    .list-head { background: var(--surface2); color: var(--text-dim); font-size: 12px; border-bottom: 1px solid var(--border); }
    .list-body { overflow: visible; }
    .list-row { cursor: pointer; border-bottom: 1px solid var(--border); font-size: 12px; }
    .list-row:hover { background: var(--row-hover); }
    .list-row.active { background: var(--row-active); border-left: 2px solid var(--orange); color: var(--row-active-text); }
    .compact-row { display: grid; grid-template-columns: 90px 1fr; align-items: center; gap: 8px; margin-bottom: 8px; }
    .editor-toolbar { display: flex; gap: 6px; margin: 6px 0 8px; flex-wrap: wrap; }
    .editor-toolbar .btn { height: 28px; padding: 0 10px; font-size: 12px; }
    .search-row { margin-bottom: 8px; }
    .multi-dd { position: relative; }
    .multi-dd-btn { width: 100%; height: 34px; border: 1px solid var(--border2); border-radius: 6px; background: var(--surface3); color: var(--text); text-align: left; padding: 0 10px; cursor: pointer; }
    .multi-dd-panel { position: absolute; z-index: 20; top: 38px; left: 0; right: 0; border: 1px solid var(--border2); border-radius: 6px; background: var(--surface2); padding: 8px; display: none; max-height: 260px; overflow: auto; }
    .multi-dd.open .multi-dd-panel { display: block; }
    .multi-dd-item { display: flex; align-items: center; gap: 8px; padding: 6px 4px; font-size: 12px; }
    .multi-dd-item img { width: 16px; height: 16px; border-radius: 3px; object-fit: cover; border: 1px solid var(--border2); }
    .ft-console { border: 1px solid var(--border); border-radius: 12px; background: var(--surface2); padding: 12px; margin-top: 12px; }
    .ft-title { font-size: 13px; color: var(--title-text); margin-bottom: 8px; font-weight: 700; font-family: var(--font-strong); }
    .ft-light-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
    .ft-light { width: 10px; height: 10px; border-radius: 50%; background: #3f3f3f; box-shadow: 0 0 0 1px rgba(255,255,255,.08) inset; opacity: .7; }
    .ft-light.active { background: #67e8f9; box-shadow: 0 0 10px rgba(103,232,249,.8); animation: ft-breath 1.4s ease-in-out infinite; }
    .ft-light.ready { background: #4ade80; box-shadow: 0 0 10px rgba(74,222,128,.9); }
    .ft-light.warn { background: #f97316; box-shadow: 0 0 10px rgba(249,115,22,.9); animation: ft-breath 1s ease-in-out infinite; }
    .ft-kv { font-size: 12px; color: var(--text-dim); font-family: var(--font); font-weight: 400; }
    .ft-progress { height: 8px; border-radius: 999px; background: rgba(255,255,255,.08); overflow: hidden; margin: 8px 0 10px; }
    .ft-progress-bar { height: 100%; width: 0; background: linear-gradient(90deg, #22d3ee, #4ade80); transition: width .2s ease; }
    .ft-file { font-size: 11px; color: var(--text-xs); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ft-mode-grid { display: grid; grid-template-columns: 1fr auto auto auto; gap: 8px; align-items: center; margin: 8px 0 6px; }
    .ft-mode-grid select { min-width: 130px; }
    .ft-probe-summary { font-size: 12px; color: var(--text-dim); margin-top: 6px; font-family: var(--font); font-weight: 400; }
    .ft-probe-list { margin-top: 6px; display: grid; gap: 6px; }
    .ft-probe-item { border: 1px solid var(--border2); border-radius: 8px; padding: 6px 8px; font-size: 11px; color: var(--text-dim); background: rgba(255,255,255,.02); font-family: var(--font); font-weight: 400; }
    .ft-probe-ok { color: #4ade80; }
    .ft-probe-bad { color: #f97316; }
    @keyframes ft-breath {
      0% { transform: scale(1); opacity: .55; }
      50% { transform: scale(1.25); opacity: 1; }
      100% { transform: scale(1); opacity: .55; }
    }

    /* SearchCenter-style UI overrides (style only, no logic changes) */
    :root {
      --bg: #111315;
      --app-bg: radial-gradient(circle at top right, rgba(58,107,168,.18), transparent 34%), linear-gradient(180deg, #0c1119 0%, #132238 100%);
      --color-scheme: dark;
      --surface: #142236;
      --surface2: #1a2c43;
      --surface3: #22354f;
      --border: #2d4361;
      --border2: #365172;
      --panel-border: rgba(255,255,255,.12);
      --glass-edge: rgba(255,255,255,.28);
      --glass-edge-soft: rgba(255,255,255,.08);
      --glass-warm: rgba(255,171,92,.2);
      --orange: #ff8d2a;
      --orange-dk: #ff7a14;
      --orange-lt: #ffb347;
      --text: #e7ebef;
      --text-dim: #93a0ad;
      --text-xs: #6f7d8b;
      --title-text: #ffffff;
      --on-accent: #ffffff;
      --btn-hover-bg: linear-gradient(180deg, rgba(255,179,71,.12), rgba(255,141,42,.08));
      --tab-hover-bg: linear-gradient(180deg, rgba(255,179,71,.1), rgba(255,141,42,.08));
      --tab-hover-border: rgba(255,179,71,.5);
      --tab-active-bg: linear-gradient(180deg, rgba(255,179,71,.16), rgba(255,141,42,.12));
      --tab-active-border: rgba(255,179,71,.5);
      --tab-active-text: #ffffff;
      --subtab-active-bg: linear-gradient(180deg, rgba(255,179,71,.16), rgba(255,141,42,.12));
      --subtab-active-border: rgba(255,179,71,.5);
      --subtab-active-text: #ffffff;
      --preview-bg: var(--surface2);
      --preview-hint-text: var(--text-dim);
      --row-hover: rgba(255,255,255,.03);
      --row-active: rgba(255,141,42,.14);
      --row-active-text: #ffffff;
      --glow: 0 18px 42px rgba(0,0,0,.35);
      --glow-hot: 0 0 0 1px rgba(255,179,71,.24), 0 14px 34px rgba(0,0,0,.28);
    }
    html, body {
      background: var(--app-bg);
      color-scheme: var(--color-scheme);
    }
    #app {
      gap: 12px;
      padding: 14px 16px 16px;
    }
    #sidebar,
    #header,
    .card,
    .list-panel {
      position: relative;
      overflow: hidden;
      border: 1px solid var(--panel-border);
      border-radius: 16px;
      background: linear-gradient(180deg, rgba(255,255,255,.02), rgba(255,255,255,0)), var(--surface);
      box-shadow: var(--glow);
    }
    #sidebar::after,
    #header::after,
    .card::after,
    .list-panel::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      padding: 1px;
      background: linear-gradient(135deg, var(--glass-edge), var(--glass-edge-soft) 45%, var(--glass-warm));
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
      opacity: .72;
    }
    #sidebar {
      width: 204px;
      border-right: 1px solid var(--panel-border);
      padding: 12px 10px;
      gap: 8px;
    }
    .tab-btn {
      height: 38px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--surface2);
      color: var(--text-dim);
      transition: .15s ease;
    }
    .tab-btn:hover {
      color: var(--text);
      border-color: var(--tab-hover-border);
      background: var(--tab-hover-bg);
    }
    .tab-btn.active {
      color: var(--tab-active-text);
      border-color: var(--tab-active-border);
      background: var(--tab-active-bg);
      box-shadow: var(--glow-hot);
    }
    #content { min-width: 0; }
    #header {
      min-height: 52px;
      margin-bottom: 12px;
      border-bottom: none;
      padding: 0 16px;
    }
    #panel { padding: 0 2px; }
    .card {
      padding: 14px;
      margin-bottom: 12px;
    }
    .title { color: var(--title-text); font-weight: 700; }
    input[type="text"], input[type="number"], textarea, select {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
    }
    input[type="text"], input[type="number"], select { height: 38px; }
    textarea { line-height: 1.55; }
    input:focus, textarea:focus, select:focus { border-color: var(--orange); }
    .btn {
      height: 36px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface2);
      color: var(--text);
      transition: .15s ease;
    }
    .btn:hover {
      color: var(--orange-dk);
      border-color: var(--orange-dk);
      background: var(--btn-hover-bg);
    }
    .btn.primary {
      background: var(--orange);
      border-color: var(--orange);
      color: var(--on-accent);
      font-weight: 700;
    }
    .btn.primary:hover {
      background: var(--orange-dk);
      border-color: var(--orange-dk);
      color: var(--on-accent);
      box-shadow: var(--glow-hot);
    }
    .btn.legacy-compact {
      height: 30px;
      padding: 0 10px;
      border-radius: 8px;
      font-size: 12px;
    }
    .legacy-tools {
      position: relative;
    }
    .legacy-tools > summary {
      list-style: none;
    }
    .legacy-tools > summary::-webkit-details-marker {
      display: none;
    }
    .legacy-tools-menu {
      position: absolute;
      right: 0;
      top: 42px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 180px;
      padding: 8px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface);
      box-shadow: var(--glow);
      z-index: 30;
    }
    .legacy-tools-menu .btn {
      width: 100%;
      justify-content: flex-start;
      text-align: left;
    }
    #header > div:first-child,
    .apple-group-title,
    .activation-mode-title,
    .mode-preview-title,
    .cfg-menu-tile-fixed .cfg-menu-line1,
    .list-head,
    .list-row.active {
      font-family: var(--font-strong);
      font-weight: 700;
    }
    select option,
    select optgroup {
      font-family: var(--font);
      font-weight: 400;
    }
    .tag {
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 6px 10px;
      background: var(--surface2);
    }
    .subtab-btn {
      height: 32px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--surface2);
      color: var(--text-dim);
      transition: .15s ease;
    }
    .subtab-btn.active {
      color: var(--subtab-active-text);
      border-color: var(--subtab-active-border);
      background: var(--subtab-active-bg);
    }
    .list-head {
      background: rgba(255,255,255,.02);
      border-bottom: 1px solid var(--border);
    }
    .list-row:hover { background: var(--row-hover); }
    .list-row.active {
      background: linear-gradient(180deg, rgba(255,141,42,.16), rgba(255,141,42,.06));
      border-left: 2px solid var(--orange-lt);
      color: var(--row-active-text);
    }
    .editor-toolbar .btn {
      height: 30px;
      border-radius: 999px;
    }
    .multi-dd-btn {
      height: 38px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--surface2);
      color: var(--text);
    }
    .multi-dd-panel {
      top: 42px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--surface);
      box-shadow: var(--glow);
    }
    .multi-dd-item {
      padding: 7px 6px;
      border-radius: 8px;
    }
    .multi-dd-item:hover { background: rgba(255,255,255,.03); }
    #panel::-webkit-scrollbar,
    .multi-dd-panel::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    #panel::-webkit-scrollbar-thumb,
    .multi-dd-panel::-webkit-scrollbar-thumb {
      background: var(--border2);
      border-radius: 999px;
    }
    @media (max-width: 1024px) {
      #app { padding: 12px; gap: 10px; }
      #sidebar { width: 172px; }
      .row { grid-template-columns: 1fr; gap: 6px; }
      .prompt-grid { grid-template-columns: 1fr; }
    }
    .hint { display: none !important; }
    .apple-toolbar-wrap { display: grid; grid-template-columns: 1fr; gap: 14px; }
    .apple-group {
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--surface);
      padding: 14px;
    }
    .apple-group-title {
      font-size: 13px;
      color: var(--title-text);
      font-weight: 700;
      margin-bottom: 10px;
      letter-spacing: .2px;
    }
    .apple-list {
      width: 100%;
      min-height: 270px;
      padding: 8px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: var(--surface2);
      color: var(--text);
      outline: none;
      font-size: 13px;
    }
    .apple-list:focus { border-color: rgba(255,179,71,.7); box-shadow: 0 0 0 2px rgba(255,179,71,.15); }
    .apple-controls {
      margin-top: 10px;
      display: grid;
      grid-template-columns: 1fr auto auto auto auto;
      gap: 8px;
      align-items: stretch;
    }
    .apple-controls select { min-width: 260px; }
    .apple-mini-btn {
      min-width: 56px;
      height: 38px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--surface2);
      color: var(--text);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .apple-mini-btn:hover {
      border-color: var(--orange-dk);
      color: var(--orange-dk);
      background: var(--btn-hover-bg);
    }
    @media (max-width: 1180px) {
      .apple-controls { grid-template-columns: 1fr 1fr; }
      .apple-controls select { min-width: 0; }
    }
    .advanced-split {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
      align-items: start;
    }
    .advanced-workbench-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 14px;
      align-items: start;
    }
    @media (max-width: 1200px) {
      .advanced-workbench-row { grid-template-columns: 1fr; }
    }
    .ftb-workbench-card .ftb-pool-hint {
      font-size: 11px;
      color: var(--text-xs);
      margin: 10px 0 6px;
      line-height: 1.45;
    }
    .ftb-mock-strip {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 8px;
      border-radius: 10px;
      background: var(--surface);
      border: 1px solid var(--border);
      box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.03);
      min-height: 52px;
    }
    .ftb-mock-logo {
      width: 40px;
      height: 40px;
      flex-shrink: 0;
      border-radius: 8px;
      background: var(--surface2);
      border: 1px dashed var(--border2);
    }
    .ftb-mock-btns {
      display: flex;
      flex-direction: row;
      flex-wrap: wrap;
      align-items: center;
      gap: 5px;
      flex: 1;
      min-width: 0;
    }
    .ftb-mock-pool {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      align-items: flex-start;
      min-height: 88px;
      padding: 10px;
      border-radius: 10px;
      border: 1px dashed var(--border2);
      background: var(--surface2);
    }
    .cfg-ftb-tile {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      width: 56px;
      min-height: 58px;
      padding: 6px 4px 4px;
      border-radius: 8px;
      cursor: grab;
      color: var(--orange);
      border: 1px solid var(--border);
      background: var(--surface);
      flex-shrink: 0;
      transition: background 0.15s ease, border-color 0.15s ease;
    }
    .cfg-ftb-tile.cfg-ftb-tile-compact {

        panel.innerHTML = `<div class="card"><div class="title">搜索设置</div><div class="row"><div class="label">默认搜索引擎（多选）</div><div class="multi-dd" id="ddDefaultEngine"><button type="button" class="multi-dd-btn" id="btnDefaultEngine">${esc(defaultSummary)}</button><div class="multi-dd-panel">${defaultOptions}</div></div></div><div class="row"><div class="label">AI/CLI 搜索引擎（多选）</div><div class="multi-dd" id="ddAiCliEngine"><button type="button" class="multi-dd-btn" id="btnAiCliEngine">${esc(aiCliSummary)}</button><div class="multi-dd-panel">${aiCliOptions}</div></div></div><div class="row"><div class="label">自动加载选中文本</div><div><input id="autoLoadSelectedText" type="checkbox" ${checked(d.autoLoadSelectedText)}></div></div><div class="row"><div class="label">自动更新语音输入</div><div><input id="autoUpdateVoiceInput" type="checkbox" ${checked(d.autoUpdateVoiceInput)}></div></div><div class="label">启用分类</div><div class="tag-wrap">${catRows}</div><div class="inline" style="margin-top:8px;"><button class="btn legacy-compact" id="btnOpenLegacySearch">打开原版搜索设置</button></div></div>
<div class="card">
  <div class="title">全文索引控制台</div>
  <div class="ft-console">
    <div class="ft-title">引擎状态</div>
    <div class="ft-light-row">${lightHtml}<span id="ftSummary" class="ft-kv">${ft.running ? "运行中" : "已停止"} · ${ft.ready ? "已就绪" : "构建中"} · ${esc(ft.progressText || "0.0%")}</span><span id="ftVersion" class="ft-kv">索引版本 ${esc(ft.indexVersion || "-")}</span></div>
    <div class="ft-progress"><div id="ftProgressBar" class="ft-progress-bar" style="width:${progressNum.toFixed(1)}%"></div></div>
    <div id="ftCurrentFile" class="ft-file" title="${esc(buildFullTextTaskText(ft))}">${esc(buildFullTextTaskText(ft))}</div>
    <div class="inline" style="margin-top:10px;">
      <button class="btn" id="btnFtToggle">启动索引</button>
      <button class="btn" id="btnFtRebuild">强制重建索引</button>
      <button class="btn" id="btnFtRefresh">刷新状态</button>
      <button class="btn" id="btnFtProbe">检测可行性</button>
      <button class="btn" id="btnFtRecommend">应用推荐方式</button>
    </div>
    <div class="ft-mode-grid">
      <select id="ftScanScheme" data-nosave="1" title="扫描方式">
        <option value="auto"${(ftCfg.scanScheme||"auto")==="auto"?" selected":""}>自动选择（推荐）</option>
        <option value="mft"${ftCfg.scanScheme==="mft"?" selected":""}>高速扫描（推荐）</option>
        <option value="everything"${ftCfg.scanScheme==="everything"?" selected":""}>快速扫描（需 Everything）</option>
        <option value="walk"${ftCfg.scanScheme==="walk"?" selected":""}>兼容扫描（最稳定）</option>
      </select>
      <label class="inline"><input id="ftUseUSN" data-nosave="1" type="checkbox" ${checked(ftCfg.useUSN !== false)}> 实时更新</label>
      <span id="ftProbeSummary" class="ft-probe-summary"></span>
    </div>
    <div id="ftProbeList" class="ft-probe-list"></div>
    <div class="row" style="margin-top:10px;">
      <div class="label">索引存储目录</div>
      <div class="inline"><input id="ftIndexDir" data-nosave="1" type="text" value="${esc(ftCfg.indexDir || "")}" placeholder="例如：D:\\SearchCenterIndex"><button class="btn" id="btnFtPickDir" type="button">选择目录</button></div>
    </div>
    <div class="row"><div class="label">后台自启动索引</div><div><input id="ftAutoStart" data-nosave="1" type="checkbox" ${checked(ftCfg.autoStart !== false)}></div></div>
    <div class="row"><div class="label">多线程并发（Worker Pool）</div><div><input id="ftWorkers" data-nosave="1" type="number" min="1" max="32" step="1" value="${esc(ftCfg.workers || 2)}"></div></div>
    <div class="row"><div class="label">扫描速度策略</div><div><select id="ftScanSpeed" data-nosave="1"><option value="slow"${ftCfg.scanSpeed==="slow"?" selected":""}>slow</option><option value="normal"${ftCfg.scanSpeed==="normal"?" selected":""}>normal</option><option value="fast"${ftCfg.scanSpeed==="fast"?" selected":""}>fast</option></select></div></div>
    <div class="row"><div class="label">初次扫描延迟（秒）</div><div><input id="ftInitialDelay" data-nosave="1" type="number" min="1" max="120" step="1" value="${esc(ftCfg.initialDelaySec || 1)}"></div></div>
    <div class="row"><div class="label">单文件间隔（ms）</div><div><input id="ftPauseMS" data-nosave="1" type="number" min="0" max="100" step="1" value="${esc(ftCfg.pauseMS ?? 5)}"></div></div>
    <div class="row"><div class="label">超大文本扫描</div><div class="inline"><input id="ftIncludeLarge" data-nosave="1" type="checkbox" ${checked(ftCfg.includeLargeText)}><span class="ft-kv">允许扫描超过 2MB 文本</span></div></div>
    <div class="row"><div class="label">超大文本大小上限（MB）</div><div><input id="ftMaxFileMB" data-nosave="1" type="number" min="1" max="512" step="1" value="${esc(ftCfg.maxFileSizeMB || 8)}"></div></div>
    <div id="ftHint" class="hint">${ft.lastError ? esc(ft.lastError) : "设置会自动保存并自动应用到索引引擎。"}</div>
  </div>
</div>`;
        const bindDropdown = (wrapId, btnId, target) => {
          const wrap = document.getElementById(wrapId);
          const btn = document.getElementById(btnId);
          btn.addEventListener("click", () => wrap.classList.toggle("open"));
          wrap.querySelectorAll(`input[data-engine-target="${target}"]`).forEach(chk => chk.addEventListener("change", () => {
            const vals = Array.from(wrap.querySelectorAll(`input[data-engine-target="${target}"]:checked`)).map(el => el.value);
            btn.textContent = vals.length ? vals.join(", ") : (target === "default" ? "请选择搜索引擎" : "请选择 AI/CLI 搜索引擎");
          }));
          document.addEventListener("click", (e) => { if (!wrap.contains(e.target)) wrap.classList.remove("open"); });
        };
        bindDropdown("ddDefaultEngine", "btnDefaultEngine", "default");
        bindDropdown("ddAiCliEngine", "btnAiCliEngine", "ai-cli");
        document.getElementById("btnOpenLegacySearch").addEventListener("click", () => post({ type: "invokeAction", op: "openLegacyTab", tab: "search" }));
        bindFullTextConsoleControls();
        refreshFullTextConsoleDom();
      }
      bindAutoSaveControls();
    }
    function validate(d) {
      if (!d.cursorPath) return "Cursor 路径不能为空";
      if (!(d.capslockHoldTimeSeconds >= 0.1 && d.capslockHoldTimeSeconds <= 5.0)) return "CapsLock Hold Time 需要在 0.1 到 5.0 之间";
      if (!Number.isInteger(d.popupScreenIndex) || d.popupScreenIndex < 1) return "弹窗屏幕序号非法";
      const maxMonitors = Math.max(1, Number(d.monitorCount || 1));
      if (d.popupScreenIndex > maxMonitors) return "弹窗屏幕序号超出显示器范围";
      if (!["anchor","fixed","relative"].includes(String(d.holePositionMode || "anchor"))) return "黑洞位置模式非法";
      if (!Number.isFinite(Number(d.holeTriggerDistance)) || Number(d.holeTriggerDistance) < 80 || Number(d.holeTriggerDistance) > 1200) return "黑洞触发距离非法";
      if (!Number.isFinite(Number(d.holeDismissDistance)) || Number(d.holeDismissDistance) < 120 || Number(d.holeDismissDistance) > 1600) return "黑洞消失距离非法";
      if (!Number.isFinite(Number(d.holeSizeScale)) || Number(d.holeSizeScale) < 0.6 || Number(d.holeSizeScale) > 1.8) return "黑洞大小缩放非法";
      if (!Number.isFinite(Number(d.holeAnimLevel)) || Number(d.holeAnimLevel) < 0.4 || Number(d.holeAnimLevel) > 2.2) return "黑洞动画强度非法";
      if (!Number.isInteger(d.aiSleepTime) || d.aiSleepTime < 50) return "AI 等待时间非法";
      if (!(d.launchDelaySeconds >= 0.5 && d.launchDelaySeconds <= 10)) return "启动延迟时间非法";
      if (!d.hotkeys || typeof d.hotkeys !== "object") return "快捷键数据无效";
      if (!Array.isArray(d.quickActions) || d.quickActions.length !== 5) return "快速操作必须为 5 项";
      return "";
    }
    document.querySelectorAll(".tab-btn").forEach(btn => btn.addEventListener("click", () => {
      state.data = readFromUI();
      state.activeTab = btn.dataset.tab;
      document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      render();
      if (state.activeTab === "search")
        requestFullTextStatus(true);
    }));
    const panelRoot = document.getElementById("panel");
    panelRoot.addEventListener("input", (e) => {
      const t = e.target;
      if (!t || !(t.matches?.("input,textarea,select"))) return;
      if (t.dataset?.nosave === "1") return;
      scheduleAutoSave();
    });
    panelRoot.addEventListener("change", (e) => {
      const t = e.target;
      if (t && t.name === "activationMode") {
        state.appearanceActivationMode = normalizeActivationMode(t.value);
        state.data.appearanceActivationMode = state.appearanceActivationMode;
        saveAppearanceActivationMode();
      }
      if (!t || !(t.matches?.("input,textarea,select"))) return;
      if (t.id === "themeMode") {
        state.data.themeMode = t.value;
        applyWebTheme(t.value);
        try { localStorage.setItem("settings_themeMode", t.value); } catch (_) {}
      }
      if (t.dataset?.nosave === "1") return;
      scheduleAutoSave(50);
    });
    document.getElementById("btn-open-legacy").addEventListener("click", () => post({ type: "invokeAction", op: "openLegacySettings" }));
    document.getElementById("btn-open-compare").addEventListener("click", () => post({ type: "invokeAction", op: "openCompareSettings" }));
    document.getElementById("btn-cancel").addEventListener("click", () => post({ type: "cancel" }));
    document.getElementById("btn-save").addEventListener("click", () => { const d = readFromUI(); const err = validate(d); if (err) return setStatus(err, "err"); post({ type: "saveSettings", payload: d }); });
    document.addEventListener("keydown", (e) => {
      if (e.key !== "Escape") return;
      e.preventDefault();
      post({ type: "cancel" });
    });
    function handleHostMessage(msg) {
      if (!msg || !msg.type) return;
      if (msg.type === "initData") {
        suppressAutoSave = true;
        const p = msg.payload || {};
        let cachedTheme = "";
        try {
          const c = localStorage.getItem("settings_themeMode");
          if (c === "light" || c === "dark") cachedTheme = c;
        } catch (_) {}
        const incomingTheme = (typeof p.themeMode === "string" && p.themeMode) ? p.themeMode : "";
        state.data = { ...state.data, ...p, hotkeys: { ...state.data.hotkeys, ...(p.hotkeys || {}) }, quickActions: (p.quickActions?.length ? p.quickActions : state.data.quickActions) };
        state.data.themeMode = incomingTheme || cachedTheme || state.data.themeMode || "dark";
        // 持久化到 localStorage，下次打开时立即应用，无需等 AHK 推送
        try { localStorage.setItem("settings_themeMode", state.data.themeMode); } catch (_) {}
        state.appearanceActivationMode = normalizeActivationMode(p.appearanceActivationMode || state.appearanceActivationMode);
        state.data.appearanceActivationMode = state.appearanceActivationMode;
        saveAppearanceActivationMode();
        if (Array.isArray(p.keybinderToolbarLayout)) state.data.keybinderToolbarLayout = normalizeToolbarLayoutRows(p.keybinderToolbarLayout);
        if (Array.isArray(p.keybinderCommands)) state.data.keybinderCommands = p.keybinderCommands;
        if (Array.isArray(p.keybinderContextMenuLayout)) state.data.keybinderContextMenuLayout = p.keybinderContextMenuLayout;
        const startTab = (msg.payload || {}).defaultStartTab;
        const validStartTabs = new Set(["general","appearance","prompts","hotkeys","advanced","screenshot","search"]);
        if (startTab && validStartTabs.has(startTab)) {
          state.activeTab = startTab;
          document.querySelectorAll(".tab-btn").forEach(b => b.classList.toggle("active", b.dataset.tab === startTab));
        }
        const ids = (state.data.promptTemplateSummary || []).map(t => t.id);
        if (state.selectedPromptTemplateId && !ids.includes(state.selectedPromptTemplateId))
          state.selectedPromptTemplateId = "";
        render();
        setStatus("已连接", "ok");
        lastSavedHash = stableStringify(state.data);
        lastSentHash = lastSavedHash;
        pendingSaveHash = "";
        saveInFlight = false;
        if (state.activeTab === "search")
          requestFullTextStatus(true);
        initDataReceived = true;
        setTimeout(() => { suppressAutoSave = false; }, 0);
        return;
      }
      if (msg.type === "browseCursorPathResult" && msg.path) { state.data.cursorPath = msg.path; render(); return; }
      if (msg.type === "fulltextStatus") {
        state.fullText = normalizeFullTextPayload(msg.payload || {});
        refreshFullTextConsoleDom();
        return;
      }
      if (msg.type === "fulltextConfigResult") {
        setStatus(msg.ok ? "全文索引配置已应用" : (msg.error || "全文索引配置失败"), msg.ok ? "ok" : "err");
        requestFullTextStatus(true);
        return;
      }
      if (msg.type === "fulltextActionResult") {
        if (msg.ok && (msg.action === "rebuild" || msg.action === "fullsync")) {
          setStatus("强制重建已启动，单字检索将在新索引中生效", "ok");
        } else {
          setStatus(msg.ok ? "全文索引操作成功" : (msg.error || "全文索引操作失败"), msg.ok ? "ok" : "err");
        }
        requestFullTextStatus(true);
        return;
      }
      if (msg.type === "fulltextBrowseResult") {
        const path = String(msg.path || "").trim();
        if (!path) return;
        const el = document.getElementById("ftIndexDir");
        if (el) {
          el.value = path;
          scheduleFullTextApply(10);
        }
        return;
      }
      if (msg.type === "fulltextProbeResult") {
        state.fullTextProbe.busy = false;
        if (msg.ok) {
          renderFullTextProbe(msg.probe || {});
          setStatus("可行性检测完成", "ok");
        } else {
          setFullTextProbeSummary(msg.error || "可行性检测失败");
          setStatus(msg.error || "可行性检测失败", "err");
        }
        return;
      }
      if (msg.type === "saveResult") {
        saveInFlight = false;
        if (msg.ok) {
          lastSavedHash = lastSentHash || stableStringify(readFromUI());
          setStatus("保存成功", "ok");
          if (pendingSaveHash && pendingSaveHash !== lastSavedHash) {
            scheduleAutoSave(10);
          }
        } else {
          setStatus(msg.error || "保存失败", "err");
        }
        return;
      }
      if (msg.type === "saveKeybinderToolbarLayoutResult") {
        setStatus(msg.ok ? "工具栏与右键菜单已写入配置" : (msg.error || "保存失败"), msg.ok ? "ok" : "err");
        return;
      }
      if (msg.type === "saveHoleResult") {
        setStatus(msg.ok ? "黑洞设置已应用" : (msg.error || "黑洞设置应用失败"), msg.ok ? "ok" : "err");
        return;
      }
      if (msg.type === "actionResult") { setStatus(msg.ok ? "操作成功" : (msg.error || "操作失败"), msg.ok ? "ok" : "err"); }
    }
    loadCustomCategories();
    loadAppearanceActivationMode();
    setInterval(() => {
      if (state.activeTab === "search")
        requestFullTextStatus(false);
    }, 1500);
    // 页面加载时立即从 localStorage 读取主题并应用，消除 initData 到达前的深色闪烁
    (function() {
      try {
        const cached = localStorage.getItem("settings_themeMode");
        if (cached === "light" || cached === "dark") {
          state.data.themeMode = cached;
          applyWebTheme(cached);
        }
      } catch (_) {}
    })();
    if (window.chrome && window.chrome.webview) {
      window.chrome.webview.addEventListener("message", e => {
        const data = typeof e.data === "string" ? JSON.parse(e.data) : e.data;
        if (__nmDock && typeof __nmDock.onHostMessage === "function") __nmDock.onHostMessage(data);
        handleHostMessage(data);
      });
      if (window.NiumaBottomDock && typeof window.NiumaBottomDock.mount === "function")
        __nmDock = window.NiumaBottomDock.mount({ sceneId: "settings", post: post });
      render();
      post({ type: "ready" });
      setStatus("正在连接...");
    } else {
      render();
      setStatus("预览模式");
    }
</script>
</body>
</html>
