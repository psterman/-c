<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hole Overlay</title>
  <style>
    /* 引入 CSS 变量动画支持，用于完美的圆锥渐变旋转 */
    @property --bg-angle {
      syntax: '<angle>';
      initial-value: 0deg;
      inherits: false;
    }

    :root {
      --p: 0;
      /* AI 流光色彩板 (参考截图风格) */
      --ai-red: #ea4335;
      --ai-yellow: #fbbc05;
      --ai-green: #34a853;
      --ai-blue: #4285f4;
    }
    
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
    html.drop-active, body.drop-active { pointer-events: auto !important; }
    #root {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: transparent !important;
      --hx: 50vw;
      --hy: calc(100vh - 220px);
      --hole-scale: 1;
      --anim-level: 1;
    }
    #root.show { pointer-events: auto; }
    .hole-wrap {
      position: absolute;
      left: var(--hx);
      top: var(--hy);
      width: 180px;
      height: 206px;
      transform: translateZ(0) scale(var(--hole-scale));
      opacity: 0;
      transition: opacity 180ms ease, transform calc(220ms / var(--anim-level)) ease;
    }

    /* 气泡提示框：增加流光边框 */
    .hint {
      position: absolute;
      left: 50%;
      bottom: 166px;
      transform: translateX(-50%);
      min-width: 136px;
      max-width: 220px;
      text-align: center;
      font: 600 12px/1.2 "Segoe UI","Microsoft YaHei",sans-serif;
      color: rgba(255, 255, 255, 0.95);
      letter-spacing: .02em;
      padding: 8px 14px;
      border-radius: 999px;
      border: 1px solid transparent;
      background: linear-gradient(180deg, rgba(32, 32, 36, 0.95), rgba(18, 18, 22, 0.98));
      box-shadow: 0 4px 18px rgba(0,0,0,0.5);
      opacity: 0;
      transition: opacity 140ms ease, transform 180ms ease, box-shadow 180ms ease;
      pointer-events: none;
    }
    /* 气泡的彩色动态边框 */
    .hint::before {
      content: '';
      position: absolute;
      inset: -1.5px;
      border-radius: 999px;
      padding: 1.5px; /* 边框粗细 */
      background: linear-gradient(90deg, var(--ai-red), var(--ai-yellow), var(--ai-green), var(--ai-blue), var(--ai-red));
      background-size: 200% 100%;
      /* 使用 mask 技术完美镂空内部，只保留渐变边框 */
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      z-index: -1;
      animation: gradientShift 3s linear infinite;
    }
    .show .hint { opacity: .9; transform: translateX(-50%) translateY(0); }
    .near .hint {
      opacity: 1;
      box-shadow: 0 8px 24px rgba(66, 133, 244, 0.25), 0 0 50px rgba(0,0,0,0.6);
      transform: translateX(-50%) translateY(-2px);
    }

    /* 底部环境光 */
    .local-fx {
      position: absolute;
      left: 50%;
      bottom: 0;
      width: 180px;
      height: 120px;
      transform: translateX(-50%);
      border-radius: 50%;
      pointer-events: none;
      opacity: .4;
      filter: blur(20px);
      background: radial-gradient(ellipse at 50% 62%,
          rgba(66, 133, 244, 0.25) 0%,
          rgba(234, 67, 53, 0.1) 40%,
          rgba(255, 255, 255, 0) 70%);
      animation: localAuraBreath 2.8s ease-in-out infinite;
    }
    .safe-mode .local-fx { opacity: .1; animation: none; }
    .show .hole-wrap { opacity: 1; transform: translateZ(0) scale(var(--hole-scale)); }
    
    .base-hole, .aura, .ring, .well {
      position: absolute; left: 50%; transform: translateX(-50%); border-radius: 50%;
    }
    
    /* 黑洞深邃底座 */
    .base-hole {
      bottom: 26px; width: 58%; height: 25%;
      background: radial-gradient(ellipse at 50% 52%, #181820 0%, #0a0a0e 58%, #000000 100%);
      box-shadow: inset 0 8px 16px rgba(255,255,255,0.05), inset 0 -10px 22px rgba(0,0,0,0.9);
    }

    /* 散发的彩色光晕 */
    .aura {
      bottom: 12px; width: 92%; height: 46%; filter: blur(14px);
      background: conic-gradient(from var(--bg-angle),
        rgba(66, 133, 244, 0.5) 0%,
        rgba(52, 168, 83, 0.5) 25%,
        rgba(251, 188, 5, 0.5) 50%,
        rgba(234, 67, 53, 0.5) 75%,
        rgba(66, 133, 244, 0.5) 100%
      );
      opacity: calc(.3 + var(--p) * .5);
      transform: translateX(-50%) scale(calc(.92 + var(--p) * .24));
      animation: spinHalo 4s linear infinite;
    }
    .safe-mode .aura { opacity: calc(.14 + var(--p) * .45); }

    /* 黑洞边缘的流光环 */
    .ring {
      bottom: 24px; width: 60%; height: 27%;
      opacity: calc(.5 + var(--p) * .5);
      transform: translateX(-50%) scale(calc(.9 + var(--p) * .24));
    }
    /* 实线流光边框 */
    .ring::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 50%;
      padding: 2.5px;
      background: conic-gradient(from var(--bg-angle), var(--ai-blue), var(--ai-green), var(--ai-yellow), var(--ai-red), var(--ai-blue));
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      animation: spinHalo 3s linear infinite;
    }
    /* 边框泛光效果 */
    .ring::after {
      content: '';
      position: absolute;
      inset: -1px;
      border-radius: 50%;
      padding: 2.5px;
      background: conic-gradient(from var(--bg-angle), var(--ai-blue), var(--ai-green), var(--ai-yellow), var(--ai-red), var(--ai-blue));
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      filter: blur(6px);
      animation: spinHalo 3s linear infinite;
      opacity: 0.85;
    }

    /* 黑洞内部纵深 */
    .well {
      bottom: 29px; width: 45%; height: 17%;
      background: radial-gradient(ellipse at 50% 52%, rgba(66,133,244,0.15) 0%, rgba(10,10,15,0.7) 44%, #000 100%);
      opacity: calc(.4 + var(--p) * .6);
      transform: translateX(-50%) scale(calc(.98 - var(--p) * .12));
    }

    /* 拖入时的动画覆盖 (保持原有逻辑不变) */
    .drop .ring { animation: ringCollapse 620ms cubic-bezier(.13,.84,.24,1); }
    .drop .well { animation: wellCollapse 620ms cubic-bezier(.13,.84,.24,1); }
    .drop .aura { animation: auraFlash 620ms cubic-bezier(.13,.84,.24,1); }
    .drop .local-fx { animation: localAuraDrop 620ms cubic-bezier(.13,.84,.24,1); }
    .drop .hint { opacity: 1; }
    .safe-mode.drop .ring,
    .safe-mode.drop .well,
    .safe-mode.drop .aura,
    .safe-mode.drop .local-fx {
      animation-duration: 320ms;
    }

    /* 性能监控浮层样式保留 */
    .perf-box { position: fixed; right: 10px; top: 10px; width: 30px; height: 30px; border-radius: 6px; border: 1px solid rgba(255,255,255,.35); background: #1f9d45; box-shadow: 0 0 10px rgba(0,0,0,.25); pointer-events: none; opacity: 0; z-index: 9999; transition: opacity 120ms ease; }
    .perf-label { position: fixed; right: 46px; top: 10px; min-width: 320px; max-width: 460px; padding: 4px 7px; border-radius: 6px; border: 1px solid rgba(255,255,255,.2); background: rgba(12, 16, 24, .78); color: rgba(242, 247, 255, .96); font: 600 11px/1.35 "Segoe UI","Microsoft YaHei",sans-serif; letter-spacing: .01em; pointer-events: none; z-index: 9998; white-space: normal; overflow: visible; text-overflow: clip; opacity: 0; transition: opacity 120ms ease; }
    body.hole-visible .perf-box, body.hole-visible .perf-label { opacity: .95; }

    /* --- 新增关键动画 --- */
    @keyframes spinHalo {
      0% { --bg-angle: 0deg; }
      100% { --bg-angle: 360deg; }
    }
    @keyframes gradientShift {
      0% { background-position: 0% 0; }
      100% { background-position: -200% 0; }
    }
    @keyframes localAuraBreath {
      0% { transform: translateX(-50%) scale(.96); opacity: .3; }
      50% { transform: translateX(-50%) scale(1.04); opacity: .5; }
      100% { transform: translateX(-50%) scale(.96); opacity: .3; }
    }
    @keyframes localAuraDrop {
      0% { transform: translateX(-50%) scale(1); opacity: .4; }
      40% { transform: translateX(-50%) scale(1.14); opacity: .6; }
      100% { transform: translateX(-50%) scale(1.28); opacity: .08; }
    }
    @keyframes ringCollapse {
      0% { transform: translateX(-50%) scale(1.06); opacity: 1; }
      36% { transform: translateX(-50%) scale(.72); opacity: .98; }
      72% { transform: translateX(-50%) scale(1.16); opacity: .88; }
      100% { transform: translateX(-50%) scale(.9); opacity: .4; }
    }
    @keyframes wellCollapse {
      0% { transform: translateX(-50%) scale(1); opacity: .9; }
      44% { transform: translateX(-50%) scale(.66); opacity: 1; }
      100% { transform: translateX(-50%) scale(1.08); opacity: .34; }
    }
    @keyframes auraFlash {
      0% { transform: translateX(-50%) scale(1); opacity: .86; }
      44% { transform: translateX(-50%) scale(1.16); opacity: 1; }
      100% { transform: translateX(-50%) scale(1.36); opacity: .18; }
    }
  </style>
</head>
<body>
  <div id="perfBox" class="perf-box" aria-hidden="true"></div>
  <div id="perfLabel" class="perf-label" aria-hidden="true">FPS: -- | 帧: --ms | Host: --ms | 诊断: --</div>
  <div id="root">
    <div class="hole-wrap">
      <div id="hint" class="hint">拖到这里开始搜索</div>
      <div class="local-fx"></div>
      <div class="base-hole"></div>
      <div class="aura"></div>
      <div class="ring"></div>
      <div class="well"></div>
    </div>
  </div>
  <script>
    (function () {
      var root = document.getElementById('root');
      var p = 0;
      function setP(v) {
        p = Math.max(0, Math.min(1, Number(v) || 0));
        root.style.setProperty('--p', String(p));
      }
      var pos = { x: Math.max(12, Math.round(window.innerWidth / 2 - 90)), y: Math.max(12, Math.round(window.innerHeight - 240)) };
      var hint = document.getElementById('hint');
      var perfBox = document.getElementById('perfBox');
      var perfLabel = document.getElementById('perfLabel');
      var payloadType = 'text';
      var isNear = false;
      var lastHintText = '';
      var dragUpdateActive = false;
      var lastUpdateTick = 0;
      var DRAG_HEARTBEAT_TIMEOUT_MS = 220;
      var perfStats = { fps: 60, frameMs: 16.7, state: 'green', dropped: false, ts: Date.now(), hostGapMs: -1, hostAgeMs: 0, hostStall: false };
      var perfLastTs = (typeof performance !== 'undefined' && performance.now) ? performance.now() : Date.now();
      var lastHostUpdateTs = perfLastTs;
      var perfDiagnosis = '状态正常';
      var nativeState = { session: '-', kind: '-', dispatch: '-', at: 0, active: '-', overHole: '-', wasOverHole: '-', payload: '-' };
      function updatePerfLabel() {
        if (!perfLabel) return;
        var hostDeltaText = perfStats.hostGapMs >= 0 ? Number(perfStats.hostGapMs).toFixed(1) + 'ms' : '--';
        perfLabel.textContent = 'FPS: ' + Number(perfStats.fps).toFixed(1)
          + ' | 帧: ' + Number(perfStats.frameMs).toFixed(1) + 'ms'
          + ' | HostΔ: ' + hostDeltaText
          + ' | HostAge: ' + Number(perfStats.hostAgeMs).toFixed(1) + 'ms'
          + ' | 诊断: ' + perfDiagnosis
          + ' | Native: ' + String(nativeState.kind || '-')
          + ' | Dispatch: ' + String(nativeState.dispatch || '-')
          + ' | A:' + String(nativeState.active || '-')
          + ' O:' + String(nativeState.overHole || '-')
          + ' W:' + String(nativeState.wasOverHole || '-')
          + ' P:' + String(nativeState.payload || '-');
      }
      function updatePerfBox() {
        if (!perfBox) return;
        var fps = perfStats.fps;
        if (perfStats.hostStall || perfStats.hostAgeMs > 420 || fps < 30) {
          perfDiagnosis = perfStats.hostStall || perfStats.hostAgeMs > 420 ? '宿主更新阻塞' : '渲染严重掉帧';
          perfStats.state = 'red';
          perfStats.dropped = true;
          perfBox.style.background = '#d73a49';
        } else if (perfStats.hostAgeMs > 220 || fps < 55) {
          perfDiagnosis = perfStats.hostAgeMs > 220 ? '宿主更新变慢' : '渲染轻度掉帧';
          perfStats.state = 'yellow';
          perfStats.dropped = false;
          perfBox.style.background = '#e3b341';
        } else if (fps > 55) {
          perfDiagnosis = '状态正常';
          perfStats.state = 'green';
          perfStats.dropped = false;
          perfBox.style.background = '#1f9d45';
        } else {
          perfDiagnosis = '轻微波动';
          perfStats.state = 'yellow';
          perfStats.dropped = false;
          perfBox.style.background = '#e3b341';
        }
        updatePerfLabel();
      }
      function perfTick(ts) {
        var now = (typeof ts === 'number') ? ts : ((typeof performance !== 'undefined' && performance.now) ? performance.now() : Date.now());
        var dt = Math.max(1, now - perfLastTs);
        perfLastTs = now;
        var instFps = 1000 / dt;
        perfStats.fps = perfStats.fps * 0.85 + instFps * 0.15;
        perfStats.frameMs = dt;
        if (dragUpdateActive) {
          var staleFor = Date.now() - lastUpdateTick;
          if (staleFor > DRAG_HEARTBEAT_TIMEOUT_MS) {
            dragUpdateActive = false;
            isNear = false;
            root.classList.remove('near');
            hintTextByState('idle');
          }
        }
        var showing = root.classList.contains('show');
        if (showing && dragUpdateActive) {
          var age = Math.max(0, now - lastHostUpdateTs);
          perfStats.hostAgeMs = age;
          perfStats.hostStall = age > 420;
        } else {
          perfStats.hostGapMs = -1;
          perfStats.hostAgeMs = 0;
          perfStats.hostStall = false;
        }
        perfStats.ts = Date.now();
        updatePerfBox();
        window.requestAnimationFrame(perfTick);
      }
      function applyPos() {
        root.style.setProperty('--hx', String(pos.x) + 'px');
        root.style.setProperty('--hy', String(pos.y) + 'px');
      }
      function clampPos(x, y) {
        var maxX = Math.max(12, window.innerWidth - 180 - 12);
        var maxY = Math.max(12, window.innerHeight - 206 - 12);
        pos.x = Math.max(12, Math.min(maxX, Math.round(Number(x) || 0)));
        pos.y = Math.max(12, Math.min(maxY, Math.round(Number(y) || 0)));
        applyPos();
      }
      function hintTextByState(state) {
        if (!hint) return;
        var next = '';
        if (state === 'drop') {
          next = payloadType === 'text' ? '已接收文本' : '已接收文件';
          if (next !== lastHintText) {
            hint.textContent = next;
            lastHintText = next;
          }
          return;
        }
        if (state === 'near') {
          next = payloadType === 'text' ? '松手即可搜索文本' : '松手即可处理文件';
          if (next !== lastHintText) {
            hint.textContent = next;
            lastHintText = next;
          }
          return;
        }
        next = payloadType === 'text' ? '拖到这里开始搜索' : '拖到这里处理文件';
        if (next !== lastHintText) {
          hint.textContent = next;
          lastHintText = next;
        }
      }
      function setSafeMode(on) {
        root.classList.toggle('safe-mode', !!on);
      }
      function setTheme(mode) {
        // 当前统一调整为深色星空主题，此函数保留用于不破坏原生调用
        var m = String(mode || '').toLowerCase();
        if (m !== 'light' && m !== 'dark') {
          document.documentElement.removeAttribute('data-theme');
          return;
        }
        document.documentElement.setAttribute('data-theme', m);
      }
      function show(payload) {
        if (payload === 'text' || payload === 'file') payloadType = payload;
        setSafeMode(true);
        document.body.classList.add('hole-visible');
        var alreadyShown = root.classList.contains('show');
        root.classList.add('show');
        if (!alreadyShown && !isNear) {
          hintTextByState('idle');
        }
      }
      function hide() {
        document.documentElement.classList.remove('drop-active');
        document.body.classList.remove('drop-active');
        document.body.classList.remove('hole-visible');
        root.classList.remove('show');
        root.classList.remove('drop');
        root.classList.remove('near');
        setSafeMode(false);
        dragUpdateActive = false;
        lastUpdateTick = 0;
        perfStats.hostGapMs = -1;
        perfStats.hostAgeMs = 0;
        perfStats.hostStall = false;
        setP(0);
      }
      function setStyle(scale, animLevel) {
        var s = Number(scale);
        if (!Number.isFinite(s)) s = 1;
        if (s < 0.6) s = 0.6;
        if (s > 1.8) s = 1.8;
        var a = Number(animLevel);
        if (!Number.isFinite(a)) a = 1;
        if (a < 0.4) a = 0.4;
        if (a > 2.2) a = 2.2;
        root.style.setProperty('--hole-scale', String(s));
        root.style.setProperty('--anim-level', String(a));
      }
      window.HoleOverlay = {
        show: function (payload) { show(payload); setP(0.2); },
        setStyle: function (o) { if (o) setStyle(o.scale, o.animLevel); },
        setTheme: function (o) {
          if (typeof o === 'string') setTheme(o);
          else if (o && typeof o.theme === 'string') setTheme(o.theme);
          else if (o && typeof o.themeMode === 'string') setTheme(o.themeMode);
        },
        moveTo: function (o) {
          if (!o) return;
          clampPos(o.x, o.y);
          show();
        },
        update: function (o) {
          show();
          var nowHost = (typeof performance !== 'undefined' && performance.now) ? performance.now() : Date.now();
          perfStats.hostGapMs = Math.max(0, nowHost - lastHostUpdateTs);
          lastHostUpdateTs = nowHost;
          dragUpdateActive = true;
          lastUpdateTick = Date.now();
          if (o && typeof o.proximity === 'number') setP(o.proximity);
          else if (o && typeof o.x === 'number' && typeof o.y === 'number') {
            var cx = pos.x + 90;
            var cy = pos.y + 150;
            var dx = o.x - cx, dy = o.y - cy;
            var d = Math.sqrt(dx * dx + dy * dy);
            var r = 260;
            setP(1 - d / r);
          } else setP(0.45);
          var enterNear = 0.62;
          var leaveNear = 0.48;
          if (!isNear && p >= enterNear) isNear = true;
          else if (isNear && p <= leaveNear) isNear = false;
          if (isNear) {
            root.classList.add('near');
            hintTextByState('near');
          } else {
            root.classList.remove('near');
            hintTextByState('idle');
          }
        },
        drop: function (o) {
          if (o && (o.payload === 'text' || o.payload === 'file')) payloadType = o.payload;
          document.documentElement.classList.add('drop-active');
          document.body.classList.add('drop-active');
          window.requestAnimationFrame(function () {
            postHostMessage({ type: 'hole_drop_ack', phase: 'first_frame', payload: payloadType, ts: Date.now() });
          });
          root.classList.remove('drop');
          void root.offsetWidth;
          root.classList.add('drop');
          root.classList.remove('near');
          isNear = false;
          dragUpdateActive = false;
          hintTextByState('drop');
          setTimeout(function () { hide(); }, 700);
        },
        hide: function () { root.classList.remove('near'); isNear = false; dragUpdateActive = false; hide(); }
      };
      window.HoleOverlay.setNativeState = function (o) {
        if (!o || typeof o !== 'object') return;
        if (typeof o.session !== 'undefined') nativeState.session = o.session;
        if (typeof o.kind !== 'undefined') nativeState.kind = o.kind;
        if (typeof o.dispatch !== 'undefined') nativeState.dispatch = o.dispatch;
        if (typeof o.active !== 'undefined') nativeState.active = o.active;
        if (typeof o.overHole !== 'undefined') nativeState.overHole = o.overHole;
        if (typeof o.wasOverHole !== 'undefined') nativeState.wasOverHole = o.wasOverHole;
        if (typeof o.payload !== 'undefined') nativeState.payload = o.payload;
        nativeState.at = Date.now();
        updatePerfLabel();
      };
      window.getPerfStats = function () {
        return {
          fps: Number(perfStats.fps.toFixed(1)),
          frameMs: Number(perfStats.frameMs.toFixed(2)),
          hostGapMs: perfStats.hostGapMs >= 0 ? Number(perfStats.hostGapMs.toFixed(1)) : null,
          hostAgeMs: Number(perfStats.hostAgeMs.toFixed(1)),
          hostStall: !!perfStats.hostStall,
          diagnosis: perfDiagnosis,
          state: perfStats.state,
          dropped: !!perfStats.dropped,
          ts: perfStats.ts
        };
      };
      function postHostMessage(msg) {
        try {
          if (window.chrome && window.chrome.webview && window.chrome.webview.postMessage)
            window.chrome.webview.postMessage(msg);
        } catch (_) {}
      }
      function readAsBase64(file) {
        return new Promise(function (resolve, reject) {
          try {
            var rd = new FileReader();
            rd.onload = function () {
              var str = String(rd.result || '');
              var comma = str.indexOf(',');
              resolve(comma >= 0 ? str.slice(comma + 1) : str);
            };
            rd.onerror = function () { reject(new Error('read base64 failed')); };
            rd.readAsDataURL(file);
          } catch (e) {
            reject(e);
          }
        });
      }
      function stripHtmlToText(html) {
        try {
          var div = document.createElement('div');
          div.innerHTML = String(html || '');
          return String(div.textContent || div.innerText || '').trim();
        } catch (_) {
          return '';
        }
      }
      function getDataTransferText(dt) {
        try {
          var direct = String((dt && (dt.getData('text/plain') || dt.getData('Text') || dt.getData('text/uri-list'))) || '').trim();
          if (direct) return direct;
        } catch (_) {}
        try {
          var html = String((dt && dt.getData && dt.getData('text/html')) || '').trim();
          if (html) {
            var textFromHtml = stripHtmlToText(html);
            if (textFromHtml) return textFromHtml;
          }
        } catch (_) {}
        return '';
      }
      function readItemString(item) {
        return new Promise(function (resolve) {
          try {
            if (!item || typeof item.getAsString !== 'function') return resolve('');
            item.getAsString(function (value) {
              resolve(String(value || '').trim());
            });
          } catch (_) {
            resolve('');
          }
        });
      }
      async function readDropPayload(dt) {
        var files = [];
        var text = '';
        var rawFiles = [];
        try { rawFiles = Array.from((dt && dt.files) || []); } catch (_) { rawFiles = []; }
        for (var i = 0; i < rawFiles.length; i++) {
          var f = rawFiles[i];
          if (!f) continue;
          var sz = Number((f && f.size) || 0);
          if (sz > 20 * 1024 * 1024) continue;
          var item = {
            name: String((f && f.name) || ''),
            type: String((f && f.type) || ''),
            size: sz,
            path: String((f && (f.path || '')) || ''),
            contentBase64: ''
          };
          try {
            item.contentBase64 = await readAsBase64(f);
          } catch (_) {
            item.contentBase64 = '';
          }
          if (item.contentBase64 || item.path || item.name) files.push(item);
        }
        text = getDataTransferText(dt);
        if (!text) {
          try {
            var items = Array.from((dt && dt.items) || []);
            for (var j = 0; j < items.length; j++) {
              var it = items[j];
              if (!it) continue;
              var kind = String(it.kind || '').toLowerCase();
              var type = String(it.type || '').toLowerCase();
              if (kind !== 'string') continue;
              if (!(type.indexOf('text/plain') >= 0 || type.indexOf('text/html') >= 0 || type.indexOf('text/uri-list') >= 0)) continue;
              var itemText = await readItemString(it);
              if (!itemText) continue;
              if (type.indexOf('text/html') >= 0) itemText = stripHtmlToText(itemText);
              itemText = String(itemText || '').trim();
              if (itemText) {
                text = itemText;
                break;
              }
            }
          } catch (_) {}
        }
        if (files.length > 0)
          return { kind: 'file', files: files, text: text };
        if (text)
          return { kind: 'text', text: text, files: [] };
        return { kind: 'none', text: '', files: [] };
      }
      window.addEventListener('dragover', function (e) {
        e.preventDefault();
        try { if (e.dataTransfer) e.dataTransfer.dropEffect = 'copy'; } catch (_) {}
      }, true);
      window.addEventListener('drop', async function (e) {
        e.preventDefault();
        e.stopPropagation();
        var payload = await readDropPayload(e.dataTransfer);
        if (payload.kind === 'none')
          return;
        try { window.HoleOverlay.drop({ payload: payload.kind === 'text' ? 'text' : 'file' }); } catch (_) {}
        postHostMessage({ type: 'hole_drop', payload: payload });
      }, true);
      window.addEventListener('resize', function () { clampPos(pos.x, pos.y); });
      applyPos();
      window.requestAnimationFrame(perfTick);
      
      // 自动预览逻辑优化：如果检测到没有在 WebView2 中运行（比如在普通浏览器中双击打开），
      // 就会自动赋予一个深色背景并主动展示出黑洞，方便你随时预览。
      try {
        var isWebView = window.chrome && window.chrome.webview;
        var qp = new URLSearchParams(window.location.search || '');
        if (!isWebView || qp.get('preview') === '1') {
          document.body.style.background = '#0a0a0e'; // 给普通浏览器加上深色星空底色
          show();
          setP(0.65); // 稍微模拟一下拖拽文件靠近时的放大发光效果
        }
      } catch (_) {}
    })();
  </script>
</body>
