<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Screenshot Editor Shell</title>
<style>
:root{
  --bg:#0c1220;
  --panel:#0f1a2b;
  --panel-border:rgba(255,122,26,.34);
  --accent:#ff7a1a;
  --text:#eaf0ff;
  --muted:#9aa8bf;
}
body[data-theme="light"]{
  --bg:#f4f7fb;
  --panel:#ffffff;
  --panel-border:#e3e7ef;
  --accent:#e67e22;
  --text:#1e293b;
  --muted:#64748b;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;height:100%;background:var(--bg);color:var(--text);font:13px "Segoe UI","Microsoft YaHei UI",sans-serif;overflow:hidden}
#root{height:100%;display:flex;flex-direction:column}
#previewWrap{position:relative;flex:1;padding:10px}
#preview{
  width:100%;height:100%;display:flex;align-items:center;justify-content:center;
  border:1px solid var(--panel-border);border-radius:10px;background:var(--panel);overflow:hidden;
  position:relative;
  touch-action:none;
}
#preview img{max-width:none;max-height:none;object-fit:contain;user-select:none;-webkit-user-drag:none;transform-origin:center center;cursor:grab}
#preview img.dragging{cursor:grabbing}
#empty{color:var(--muted)}
#ctx{
  position:fixed;display:none;min-width:170px;padding:6px;background:var(--panel);border:1px solid var(--panel-border);
  border-radius:10px;box-shadow:0 10px 24px rgba(0,0,0,.28);z-index:9999
}
.mi{height:30px;padding:0 10px;border-radius:8px;display:flex;align-items:center;gap:8px;color:var(--text);cursor:pointer}
.mi:hover{background:rgba(255,122,26,.12)}
#debugPanel{
  position:fixed;left:8px;bottom:8px;z-index:10000;max-width:52vw;max-height:34vh;overflow:auto;
  padding:8px 10px;border-radius:8px;border:1px solid var(--panel-border);
  background:rgba(0,0,0,.65);color:#d1d5db;font:12px Consolas, "Segoe UI", monospace;
}
body[data-theme="light"] #debugPanel{background:rgba(255,255,255,.94);color:#111827}
.dbg{white-space:pre-wrap;line-height:1.3}

#textBox{
  position:absolute;display:none;min-width:120px;min-height:34px;max-width:70%;
  padding:8px 10px;border-radius:10px;border:1px solid var(--panel-border);
  background:rgba(15,26,43,.95);color:var(--text);
  box-shadow:0 10px 24px rgba(0,0,0,.28);
}
body[data-theme="light"] #textBox{background:rgba(255,255,255,.97)}
#textBox textarea{
  width:100%;height:100%;resize:both;min-height:34px;min-width:140px;
  border:0;outline:none;background:transparent;color:inherit;font:14px "Segoe UI","Microsoft YaHei UI",sans-serif;
}
#textHint{margin-top:6px;color:var(--muted);font-size:12px}
#mosaicPanel{
  position:absolute;right:12px;top:12px;z-index:9000;display:none;
  width:220px;padding:10px;border-radius:10px;border:1px solid var(--panel-border);
  background:rgba(15,26,43,.93);box-shadow:0 10px 24px rgba(0,0,0,.28)
}
body[data-theme="light"] #mosaicPanel{background:rgba(255,255,255,.97)}
.mp-row{display:flex;align-items:center;gap:8px;margin:6px 0}
.mp-row label{width:72px;color:var(--muted);font-size:12px}
.mp-row input[type="range"]{flex:1}
.mp-val{width:36px;text-align:right;font:12px Consolas,monospace;color:var(--text)}
</style>
</head>
<body>
<div id="root">
  <div id="previewWrap">
    <div id="preview">
      <div id="empty">等待截图内容...</div>
      <img id="img" style="display:none">
      <div id="mosaicPanel">
        <div class="mp-row"><label>Size</label><input id="mpSize" type="range" min="12" max="120" step="2"><span id="mpSizeV" class="mp-val"></span></div>
        <div class="mp-row"><label>Intensity</label><input id="mpIntensity" type="range" min="4" max="48" step="2"><span id="mpIntensityV" class="mp-val"></span></div>
        <div class="mp-row"><label>Opacity</label><input id="mpOpacity" type="range" min="10" max="100" step="5"><span id="mpOpacityV" class="mp-val"></span></div>
      </div>
      <div id="textBox">
        <textarea id="textArea" placeholder="输入文字，Enter 确认，Esc 取消"></textarea>
        <div id="textHint">Enter 提交，Shift+Enter 换行</div>
      </div>
    </div>
  </div>
</div>
<div id="ctx"></div>
<div id="debugPanel" style="display:none"></div>
<script>
(function(){
  const post = (o)=>{ try{ window.chrome?.webview?.postMessage(o);}catch(_){} };
  const img = document.getElementById('img');
  const empty = document.getElementById('empty');
  const ctx = document.getElementById('ctx');
  const preview = document.getElementById('preview');
  const textBox = document.getElementById('textBox');
  const textArea = document.getElementById('textArea');
  const debugPanel = document.getElementById('debugPanel');
  const mosaicPanel = document.getElementById('mosaicPanel');
  const mpSize = document.getElementById('mpSize');
  const mpIntensity = document.getElementById('mpIntensity');
  const mpOpacity = document.getElementById('mpOpacity');
  const mpSizeV = document.getElementById('mpSizeV');
  const mpIntensityV = document.getElementById('mpIntensityV');
  const mpOpacityV = document.getElementById('mpOpacityV');

  const st = { drag:false, sx:0, sy:0, ox:0, oy:0, pid:null, tx:0, ty:0, scale:1 };
  const annot = { active:false, pointerId:null };
  const host = { themeMode:'dark', annotMode:'none', previewSrc:'', zoomScale:1, imgW:0, imgH:0, mosaicOptions:{ size:56, intensity:18, opacity:100 } };
  const dbg = { enabled:true, sessionId:'', seq:0 };
  let pendingTextAt = null; // {x,y} in image coordinates

  function isTextBoxVisible(){
    return window.getComputedStyle(textBox).display !== 'none';
  }

  function logDebug(line){
    if (!dbg.enabled) return;
    debugPanel.style.display = '';
    const div = document.createElement('div');
    div.className = 'dbg';
    div.textContent = line;
    debugPanel.appendChild(div);
    while (debugPanel.childNodes.length > 40) debugPanel.removeChild(debugPanel.firstChild);
    debugPanel.scrollTop = debugPanel.scrollHeight;
  }

  function applyTransform(){
    img.style.transform = `translate(${st.tx}px, ${st.ty}px) scale(${st.scale})`;
  }

  function applyCursorByMode(){
    const mode = normalizeAnnotMode(host.annotMode);
    if (mode === 'none') {
      img.style.cursor = st.drag ? 'grabbing' : 'grab';
    } else if (mode === 'text') {
      img.style.cursor = 'text';
    } else {
      img.style.cursor = 'crosshair';
    }
  }

  function applyTheme(mode){
    const tm = String(mode||'').toLowerCase()==='light'?'light':'dark';
    document.body.setAttribute('data-theme', tm);
  }

  function applyMosaicPanel(){
    const show = normalizeAnnotMode(host.annotMode) === 'mosaic';
    mosaicPanel.style.display = show ? '' : 'none';
    if (!show) return;
    const mo = host.mosaicOptions || {};
    mpSize.value = String(mo.size || 56);
    mpIntensity.value = String(mo.intensity || 18);
    mpOpacity.value = String(mo.opacity || 100);
    mpSizeV.textContent = mpSize.value;
    mpIntensityV.textContent = mpIntensity.value;
    mpOpacityV.textContent = mpOpacity.value + '%';
  }

  function postMosaicOptions(){
    const payload = {
      size: Number(mpSize.value || 56),
      intensity: Number(mpIntensity.value || 18),
      opacity: Number(mpOpacity.value || 100)
    };
    host.mosaicOptions = payload;
    mpSizeV.textContent = String(payload.size);
    mpIntensityV.textContent = String(payload.intensity);
    mpOpacityV.textContent = String(payload.opacity) + '%';
    post({ type:'action', name:'updateToolOptions', payload:{ tool:'mosaic', options: payload } });
    logDebug(`TX mosaic opts size=${payload.size} intensity=${payload.intensity} opacity=${payload.opacity}`);
  }

  function setImage(src){
    if(!src){ img.style.display='none'; empty.style.display=''; return; }
    img.src = src; img.style.display=''; empty.style.display='none';
    st.tx = 0; st.ty = 0; st.scale = 1;
    applyTransform();
  }

  function renderMenu(items, x, y){
    if(!Array.isArray(items) || !items.length){ ctx.style.display='none'; return; }
    ctx.innerHTML = '';
    items.forEach(it=>{
      const div = document.createElement('div');
      div.className = 'mi';
      div.textContent = it.label || it.id || '';
      div.onclick = ()=>{ post({type:'action', name:'menuInvoke', payload:{ id: it.id||'' }}); ctx.style.display='none'; };
      ctx.appendChild(div);
    });
    ctx.style.left = x+'px'; ctx.style.top = y+'px'; ctx.style.display='block';
  }

  function hideTextBox(){
    textBox.style.display = 'none';
    textArea.value = '';
    pendingTextAt = null;
  }

  function showTextBoxAtClient(clientX, clientY, imgX, imgY){
    pendingTextAt = { x: imgX, y: imgY };
    textBox.style.left = Math.max(12, Math.min(preview.clientWidth - 160, clientX - preview.getBoundingClientRect().left)) + 'px';
    textBox.style.top = Math.max(12, Math.min(preview.clientHeight - 60, clientY - preview.getBoundingClientRect().top)) + 'px';
    textBox.style.display = 'block';
    textArea.focus();
    textArea.select();
  }

  function commitText(){
    const t = String(textArea.value || '').replace(/\r\n/g, '\n').trimEnd();
    if(!pendingTextAt || !t){ hideTextBox(); return; }
    post({ type:'action', name:'addText', payload:{ x: pendingTextAt.x, y: pendingTextAt.y, text: t } });
    hideTextBox();
  }

  document.addEventListener('click', ()=> ctx.style.display='none');
  document.addEventListener('keydown', (ev)=>{
    if (isTextBoxVisible()) {
      if (ev.key === 'Escape') { ev.preventDefault(); hideTextBox(); return; }
      if (ev.key === 'Enter' && !ev.shiftKey) { ev.preventDefault(); commitText(); return; }
    }
  });

  preview.addEventListener('contextmenu', (ev)=>{
    ev.preventDefault();
    post({ type:'event', name:'contextMenuRequest', payload:{ x:ev.clientX, y:ev.clientY }});
  });

  preview.addEventListener('wheel', (ev)=>{
    ev.preventDefault();
    const d = ev.deltaY < 0 ? 1 : -1;
    post({ type:'event', name:'wheel', payload:{ delta:d }});
  }, {passive:false});

  function imgPointFromClient(ev){
    const r = img.getBoundingClientRect();
    const nx = (ev.clientX - r.left) / Math.max(1, r.width);
    const ny = (ev.clientY - r.top) / Math.max(1, r.height);
    let iw = host.imgW || img.naturalWidth || 0;
    let ih = host.imgH || img.naturalHeight || 0;
    // Fallback when intrinsic size is not ready yet.
    if (!(iw > 0) || !(ih > 0)) {
      iw = Math.max(1, r.width);
      ih = Math.max(1, r.height);
    }
    const x = Math.max(0, Math.min(iw, nx * iw));
    const y = Math.max(0, Math.min(ih, ny * ih));
    return { x, y, iw, ih };
  }

  function sendPointer(ev, phase){
    try {
      if(img.style.display === 'none') { logDebug('TX skipped: img hidden'); return; }
      const pt = imgPointFromClient(ev);
      const seq = ++dbg.seq;
      post({
        type:'event',
        name:'pointer',
        payload:{
          sessionId: dbg.sessionId || '',
          seq,
          phase,
          x: pt.x, y: pt.y,
          buttons: ev.buttons || 0,
          pointerId: ev.pointerId || 0,
          shiftKey: !!ev.shiftKey, altKey: !!ev.altKey, ctrlKey: !!ev.ctrlKey,
          pressure: typeof ev.pressure === 'number' ? ev.pressure : 0
        }
      });
      logDebug(`TX pointer #${seq} ${phase} (${Math.round(pt.x)},${Math.round(pt.y)})`);
    } catch (e) {
      logDebug(`TX error ${phase}: ${e && e.message ? e.message : e}`);
    }
  }

  // Pan only when not in annotation mode.
  function normalizeAnnotMode(mode){
    const m = String(mode || 'none').toLowerCase();
    if (m === 'annot_text') return 'text';
    if (m === 'annot_mosaic') return 'mosaic';
    return m;
  }

  function onAnnotPointerDown(ev){
    try {
      const mode = normalizeAnnotMode(host.annotMode);
      logDebug(`RAW down target=${(ev.target && ev.target.id) ? ev.target.id : ev.target.tagName} btn=${ev.button} mode=${mode}`);
      ev.stopPropagation();
      if(ev.button !== 0) return;
      if (isTextBoxVisible()) return;
      if (mode === 'text') {
        ev.preventDefault();
        const pt = imgPointFromClient(ev);
        showTextBoxAtClient(ev.clientX, ev.clientY, pt.x, pt.y);
        return;
      }
      if (mode !== 'none') {
        ev.preventDefault();
        annot.active = true;
        annot.pointerId = ev.pointerId;
        try { (ev.currentTarget || preview).setPointerCapture(ev.pointerId); } catch(_) {}
        logDebug(`MODE draw start pid=${annot.pointerId}`);
        sendPointer(ev, 'down');
        return;
      }
      ev.preventDefault();
      st.drag = true; st.sx = ev.clientX; st.sy = ev.clientY; st.ox = st.tx; st.oy = st.ty;
      st.pid = ev.pointerId;
      try { (ev.currentTarget || preview).setPointerCapture(ev.pointerId); } catch(_) {}
      img.classList.add('dragging');
      applyCursorByMode();
    } catch (e) {
      logDebug(`DOWN error: ${e && e.message ? e.message : e}`);
    }
  }
  preview.addEventListener('pointerdown', onAnnotPointerDown);

  function onAnnotPointerMove(ev){
    if (normalizeAnnotMode(host.annotMode) !== 'none') {
      if (!annot.active) return;
      if (annot.pointerId !== null && ev.pointerId !== annot.pointerId) return;
      sendPointer(ev, 'move');
      return;
    }
    if(!st.drag || ev.pointerId !== st.pid) return;
    st.tx = st.ox + (ev.clientX - st.sx);
    st.ty = st.oy + (ev.clientY - st.sy);
    applyTransform();
  }
  preview.addEventListener('pointermove', onAnnotPointerMove);

  function stopDrag(ev){
    if (normalizeAnnotMode(host.annotMode) !== 'none') {
      if (!annot.active) return;
      if (ev && annot.pointerId !== null && ev.pointerId !== annot.pointerId) return;
      if (ev) sendPointer(ev, 'up');
      logDebug(`MODE draw end pid=${annot.pointerId}`);
      try {
        if (annot.pointerId !== null && ev && ev.currentTarget)
          ev.currentTarget.releasePointerCapture(annot.pointerId);
      } catch(_) {}
      annot.active = false;
      annot.pointerId = null;
      return;
    }
    if (!st.drag) return;
    if (ev && st.pid !== null && ev.pointerId !== st.pid) return;
    st.drag = false; img.classList.remove('dragging');
    try { if (st.pid !== null) img.releasePointerCapture(st.pid); } catch(_) {}
    st.pid = null;
    applyCursorByMode();
  }
  preview.addEventListener('pointerup', stopDrag);
  preview.addEventListener('pointercancel', stopDrag);
  preview.addEventListener('lostpointercapture', stopDrag);
  img.addEventListener('dblclick', ()=>{ st.tx = 0; st.ty = 0; applyTransform(); });
  [mpSize, mpIntensity, mpOpacity].forEach(el=>{
    el.addEventListener('input', postMosaicOptions);
    el.addEventListener('change', postMosaicOptions);
  });

  window.chrome?.webview?.addEventListener('message',(ev)=>{
    let msg = ev.data||{};
    if(typeof msg==='string'){ try{ msg=JSON.parse(msg);}catch{return;} }
    if(msg.type==='init'){
      const p = msg.payload || msg;
      host.themeMode = p.themeMode || host.themeMode;
      dbg.enabled = (p.debugEnabled !== false);
      dbg.sessionId = String(p.sessionId || '');
      dbg.seq = 0;
      applyTheme(host.themeMode);
      logDebug(`INIT session=${dbg.sessionId}`);
      return;
    }
    if(msg.type==='state'){
      const p = msg.payload || msg;
      host.themeMode = p.themeMode || host.themeMode;
      host.annotMode = normalizeAnnotMode(p.annotMode || host.annotMode);
      host.previewSrc = p.previewSrc || host.previewSrc;
      host.zoomScale = (typeof p.zoomScale === 'number' && isFinite(p.zoomScale)) ? p.zoomScale : host.zoomScale;
      host.imgW = Number(p.imageWidth || p.imgW || host.imgW || 0);
      host.imgH = Number(p.imageHeight || p.imgH || host.imgH || 0);
      host.mosaicOptions = p.mosaicOptions || host.mosaicOptions;
      logDebug(`STATE mode=${host.annotMode} img=${Math.round(host.imgW)}x${Math.round(host.imgH)} zoom=${host.zoomScale}`);
      applyTheme(host.themeMode);
      if(p.previewSrc) setImage(p.previewSrc);
      if(typeof host.zoomScale === 'number' && isFinite(host.zoomScale)){
        st.scale = Math.max(0.05, host.zoomScale);
        applyTransform();
      }
      applyCursorByMode();
      applyMosaicPanel();
      return;
    }
    if (msg.type === 'event') {
      const name = String(msg.name || '');
      const p = msg.payload || {};
      if (name === 'eventAck') {
        logDebug(`ACK pointer #${p.seq||'?'} ${p.phase||''}`);
      } else if (name === 'commitAck') {
        logDebug(`COMMIT ${p.ok ? 'ok' : 'fail'} op=${p.op||''} reason=${p.reason||''}`);
      } else if (name === 'debugTrace') {
        logDebug(`HOST ${p.stage||''} ${p.detail||''}`);
      } else if (name === 'error') {
        logDebug(`ERROR ${p.code||''} ${p.message||''}`);
      }
      return;
    }
    if(msg.type==='contextMenu'){ renderMenu(msg.items||[], Number(msg.x||0), Number(msg.y||0)); return; }
  });

  post({ type:'event', name:'requestInit', payload:{} });
  post({ type:'event', name:'ready', payload:{} });
  applyCursorByMode();
  applyMosaicPanel();
})();
</script>
</body>
</html>
