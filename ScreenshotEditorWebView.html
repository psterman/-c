<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Screenshot Editor Shell</title>
<style>
:root{
  --bg:#0c1220;
  --panel:#0f1a2b;
  --panel-border:rgba(255,122,26,.34);
  --accent:#ff7a1a;
  --text:#eaf0ff;
  --muted:#9aa8bf;
}
body[data-theme="light"]{
  --bg:#f4f7fb;
  --panel:#ffffff;
  --panel-border:#e3e7ef;
  --accent:#e67e22;
  --text:#1e293b;
  --muted:#64748b;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;height:100%;background:var(--bg);color:var(--text);font:13px "Segoe UI","Microsoft YaHei UI",sans-serif;overflow:hidden}
#root{height:100%;display:flex;flex-direction:column}
#previewWrap{position:relative;flex:1;padding:10px}
#preview{
  width:100%;height:100%;display:flex;align-items:center;justify-content:center;
  border:1px solid var(--panel-border);border-radius:10px;background:var(--panel);overflow:hidden;
  position:relative;
}
#preview img{max-width:none;max-height:none;object-fit:contain;user-select:none;-webkit-user-drag:none;transform-origin:center center;cursor:grab}
#preview img.dragging{cursor:grabbing}
#empty{color:var(--muted)}
#ctx{
  position:fixed;display:none;min-width:170px;padding:6px;background:var(--panel);border:1px solid var(--panel-border);
  border-radius:10px;box-shadow:0 10px 24px rgba(0,0,0,.28);z-index:9999
}
.mi{height:30px;padding:0 10px;border-radius:8px;display:flex;align-items:center;gap:8px;color:var(--text);cursor:pointer}
.mi:hover{background:rgba(255,122,26,.12)}

#textBox{
  position:absolute;display:none;min-width:120px;min-height:34px;max-width:70%;
  padding:8px 10px;border-radius:10px;border:1px solid var(--panel-border);
  background:rgba(15,26,43,.95);color:var(--text);
  box-shadow:0 10px 24px rgba(0,0,0,.28);
}
body[data-theme="light"] #textBox{background:rgba(255,255,255,.97)}
#textBox textarea{
  width:100%;height:100%;resize:both;min-height:34px;min-width:140px;
  border:0;outline:none;background:transparent;color:inherit;font:14px "Segoe UI","Microsoft YaHei UI",sans-serif;
}
#textHint{margin-top:6px;color:var(--muted);font-size:12px}
</style>
</head>
<body>
<div id="root">
  <div id="previewWrap">
    <div id="preview">
      <div id="empty">等待截图内容...</div>
      <img id="img" style="display:none">
      <div id="textBox">
        <textarea id="textArea" placeholder="输入文字，Enter 确认，Esc 取消"></textarea>
        <div id="textHint">Enter 提交，Shift+Enter 换行</div>
      </div>
    </div>
  </div>
</div>
<div id="ctx"></div>
<script>
(function(){
  const post = (o)=>{ try{ window.chrome?.webview?.postMessage(o);}catch(_){} };
  const img = document.getElementById('img');
  const empty = document.getElementById('empty');
  const ctx = document.getElementById('ctx');
  const preview = document.getElementById('preview');
  const textBox = document.getElementById('textBox');
  const textArea = document.getElementById('textArea');

  const st = { drag:false, sx:0, sy:0, ox:0, oy:0, pid:null, tx:0, ty:0, scale:1 };
  const host = { themeMode:'dark', annotMode:'none', previewSrc:'', zoomScale:1, imgW:0, imgH:0 };
  let pendingTextAt = null; // {x,y} in image coordinates

  function applyTransform(){
    img.style.transform = `translate(${st.tx}px, ${st.ty}px) scale(${st.scale})`;
  }

  function applyTheme(mode){
    const tm = String(mode||'').toLowerCase()==='light'?'light':'dark';
    document.body.setAttribute('data-theme', tm);
  }

  function setImage(src){
    if(!src){ img.style.display='none'; empty.style.display=''; return; }
    img.src = src; img.style.display=''; empty.style.display='none';
    st.tx = 0; st.ty = 0; st.scale = 1;
    applyTransform();
  }

  function renderMenu(items, x, y){
    if(!Array.isArray(items) || !items.length){ ctx.style.display='none'; return; }
    ctx.innerHTML = '';
    items.forEach(it=>{
      const div = document.createElement('div');
      div.className = 'mi';
      div.textContent = it.label || it.id || '';
      div.onclick = ()=>{ post({type:'action', name:'menuInvoke', payload:{ id: it.id||'' }}); ctx.style.display='none'; };
      ctx.appendChild(div);
    });
    ctx.style.left = x+'px'; ctx.style.top = y+'px'; ctx.style.display='block';
  }

  function hideTextBox(){
    textBox.style.display = 'none';
    textArea.value = '';
    pendingTextAt = null;
  }

  function showTextBoxAtClient(clientX, clientY, imgX, imgY){
    pendingTextAt = { x: imgX, y: imgY };
    textBox.style.left = Math.max(12, Math.min(preview.clientWidth - 160, clientX - preview.getBoundingClientRect().left)) + 'px';
    textBox.style.top = Math.max(12, Math.min(preview.clientHeight - 60, clientY - preview.getBoundingClientRect().top)) + 'px';
    textBox.style.display = 'block';
    textArea.focus();
    textArea.select();
  }

  function commitText(){
    const t = String(textArea.value || '').replace(/\r\n/g, '\n').trimEnd();
    if(!pendingTextAt || !t){ hideTextBox(); return; }
    post({ type:'action', name:'addText', payload:{ x: pendingTextAt.x, y: pendingTextAt.y, text: t } });
    hideTextBox();
  }

  document.addEventListener('click', ()=> ctx.style.display='none');
  document.addEventListener('keydown', (ev)=>{
    if (textBox.style.display !== 'none') {
      if (ev.key === 'Escape') { ev.preventDefault(); hideTextBox(); return; }
      if (ev.key === 'Enter' && !ev.shiftKey) { ev.preventDefault(); commitText(); return; }
    }
  });

  preview.addEventListener('contextmenu', (ev)=>{
    ev.preventDefault();
    post({ type:'event', name:'contextMenuRequest', payload:{ x:ev.clientX, y:ev.clientY }});
  });

  preview.addEventListener('wheel', (ev)=>{
    ev.preventDefault();
    const d = ev.deltaY < 0 ? 1 : -1;
    post({ type:'event', name:'wheel', payload:{ delta:d }});
  }, {passive:false});

  function imgPointFromClient(ev){
    const r = img.getBoundingClientRect();
    const nx = (ev.clientX - r.left) / Math.max(1, r.width);
    const ny = (ev.clientY - r.top) / Math.max(1, r.height);
    const iw = host.imgW || img.naturalWidth || 0;
    const ih = host.imgH || img.naturalHeight || 0;
    const x = Math.max(0, Math.min(iw, nx * iw));
    const y = Math.max(0, Math.min(ih, ny * ih));
    return { x, y, iw, ih };
  }

  function sendPointer(ev, phase){
    if(img.style.display === 'none') return;
    const pt = imgPointFromClient(ev);
    post({
      type:'event',
      name:'pointer',
      payload:{
        phase,
        x: pt.x, y: pt.y,
        buttons: ev.buttons || 0,
        pointerId: ev.pointerId || 0,
        shiftKey: !!ev.shiftKey, altKey: !!ev.altKey, ctrlKey: !!ev.ctrlKey,
        pressure: typeof ev.pressure === 'number' ? ev.pressure : 0
      }
    });
  }

  // Pan only when not in annotation mode.
  img.addEventListener('pointerdown', (ev)=>{
    if(ev.button !== 0) return;
    if (textBox.style.display !== 'none') return;
    if (String(host.annotMode || 'none') === 'text') {
      ev.preventDefault();
      const pt = imgPointFromClient(ev);
      showTextBoxAtClient(ev.clientX, ev.clientY, pt.x, pt.y);
      return;
    }
    if (String(host.annotMode || 'none') !== 'none') {
      ev.preventDefault();
      sendPointer(ev, 'down');
      return;
    }
    ev.preventDefault();
    st.drag = true; st.sx = ev.clientX; st.sy = ev.clientY; st.ox = st.tx; st.oy = st.ty;
    st.pid = ev.pointerId;
    try { img.setPointerCapture(ev.pointerId); } catch(_) {}
    img.classList.add('dragging');
  });

  img.addEventListener('pointermove', (ev)=>{
    if (String(host.annotMode || 'none') !== 'none') {
      if (ev.buttons & 1) sendPointer(ev, 'move');
      return;
    }
    if(!st.drag || ev.pointerId !== st.pid) return;
    st.tx = st.ox + (ev.clientX - st.sx);
    st.ty = st.oy + (ev.clientY - st.sy);
    applyTransform();
  });

  function stopDrag(ev){
    if (String(host.annotMode || 'none') !== 'none') {
      if (ev && (ev.buttons === 0 || ev.type === 'pointerup' || ev.type === 'pointercancel')) sendPointer(ev, 'up');
      return;
    }
    if (!st.drag) return;
    if (ev && st.pid !== null && ev.pointerId !== st.pid) return;
    st.drag = false; img.classList.remove('dragging');
    try { if (st.pid !== null) img.releasePointerCapture(st.pid); } catch(_) {}
    st.pid = null;
  }
  img.addEventListener('pointerup', stopDrag);
  img.addEventListener('pointercancel', stopDrag);
  img.addEventListener('lostpointercapture', stopDrag);
  img.addEventListener('dblclick', ()=>{ st.tx = 0; st.ty = 0; applyTransform(); });

  window.chrome?.webview?.addEventListener('message',(ev)=>{
    let msg = ev.data||{};
    if(typeof msg==='string'){ try{ msg=JSON.parse(msg);}catch{return;} }
    if(msg.type==='init'){
      const p = msg.payload || msg;
      host.themeMode = p.themeMode || host.themeMode;
      applyTheme(host.themeMode);
      return;
    }
    if(msg.type==='state'){
      const p = msg.payload || msg;
      host.themeMode = p.themeMode || host.themeMode;
      host.annotMode = p.annotMode || host.annotMode;
      host.previewSrc = p.previewSrc || host.previewSrc;
      host.zoomScale = (typeof p.zoomScale === 'number' && isFinite(p.zoomScale)) ? p.zoomScale : host.zoomScale;
      host.imgW = Number(p.imageWidth || p.imgW || host.imgW || 0);
      host.imgH = Number(p.imageHeight || p.imgH || host.imgH || 0);
      applyTheme(host.themeMode);
      if(p.previewSrc) setImage(p.previewSrc);
      if(typeof host.zoomScale === 'number' && isFinite(host.zoomScale)){
        st.scale = Math.max(0.05, host.zoomScale);
        applyTransform();
      }
      return;
    }
    if(msg.type==='contextMenu'){ renderMenu(msg.items||[], Number(msg.x||0), Number(msg.y||0)); return; }
  });

  post({ type:'event', name:'requestInit', payload:{} });
  post({ type:'event', name:'ready', payload:{} });
})();
</script>
</body>
</html>
