<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hole Overlay</title>
  <style>
    @property --ring-angle {
      syntax: '<angle>';
      initial-value: 0deg;
      inherits: false;
    }
    :root {
      --p: 0;
      --ai-red: #ea4335;
      --ai-yellow: #fbbc05;
      --ai-green: #34a853;
      --ai-blue: #4285f4;
      --hint-text: rgba(218, 247, 255, .96);
      --hint-border: rgba(150, 238, 255, .44);
      --hint-bg1: rgba(20,58,88,.72);
      --hint-bg2: rgba(15,36,60,.74);
      --hint-shadow1: rgba(115, 229, 255, .45);
      --hint-shadow2: rgba(232, 159, 255, .22);
      --local-a1: rgba(118, 235, 255, .34);
      --local-a2: rgba(118, 235, 255, .15);
      --local-a3: rgba(236, 170, 255, .10);
      --base-1: rgba(187,210,229,.9);
      --base-2: rgba(133,161,187,.76);
      --base-3: rgba(107,135,162,.68);
      --base-inset-1: rgba(216,232,245,.55);
      --base-inset-2: rgba(80,111,139,.45);
      --aura-1: rgba(123,240,255,.7);
      --aura-2: rgba(123,240,255,.2);
      --ring-border: rgba(210,248,255,.35);
      --ring-1: rgba(255,255,255,0);
      --ring-2: rgba(130,245,255,.98);
      --ring-3: rgba(86,223,255,.94);
      --ring-4: rgba(240,166,255,.9);
      --ring-5: rgba(134,255,225,.9);
      --ring-glow-1: rgba(122,235,255,.45);
      --ring-glow-2: rgba(235,171,255,.35);
      --well-1: rgba(98,174,196,.38);
      --well-2: rgba(24,61,104,.48);
      --well-3: rgba(10,32,64,.76);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --hint-text: rgba(255, 214, 176, .96);
        --hint-border: rgba(255, 124, 42, .58);
        --hint-bg1: rgba(28,16,12,.9);
        --hint-bg2: rgba(12,8,6,.94);
        --hint-shadow1: rgba(255, 110, 20, .48);
        --hint-shadow2: rgba(255, 72, 10, .28);
        --local-a1: rgba(255, 122, 28, .4);
        --local-a2: rgba(255, 88, 12, .2);
        --local-a3: rgba(255, 168, 84, .1);
        --base-1: rgba(54,36,27,.95);
        --base-2: rgba(24,16,12,.92);
        --base-3: rgba(7,5,4,.95);
        --base-inset-1: rgba(255,148,70,.24);
        --base-inset-2: rgba(0,0,0,.78);
        --aura-1: rgba(255, 116, 26, .86);
        --aura-2: rgba(255, 80, 10, .3);
        --ring-border: rgba(255, 142, 68, .58);
        --ring-1: rgba(255,240,220,.16);
        --ring-2: rgba(255,150,58,.98);
        --ring-3: rgba(255,108,26,.95);
        --ring-4: rgba(255,66,12,.9);
        --ring-5: rgba(255,186,106,.88);
        --ring-glow-1: rgba(255, 112, 20, .7);
        --ring-glow-2: rgba(255, 62, 8, .52);
        --well-1: rgba(255,132,58,.36);
        --well-2: rgba(70,28,10,.62);
        --well-3: rgba(4,3,3,.96);
      }
    }
    :root[data-theme="light"] {}
    :root[data-theme="dark"] {
      --ai-red: #ff6f3d;
      --ai-yellow: #ffb347;
      --ai-green: #4fd18b;
      --ai-blue: #64a8ff;
      --hint-text: rgba(255, 214, 176, .96);
      --hint-border: rgba(255, 124, 42, .58);
      --hint-bg1: rgba(28,16,12,.9);
      --hint-bg2: rgba(12,8,6,.94);
      --hint-shadow1: rgba(255, 110, 20, .48);
      --hint-shadow2: rgba(255, 72, 10, .28);
      --local-a1: rgba(255, 122, 28, .4);
      --local-a2: rgba(255, 88, 12, .2);
      --local-a3: rgba(255, 168, 84, .1);
      --base-1: rgba(54,36,27,.95);
      --base-2: rgba(24,16,12,.92);
      --base-3: rgba(7,5,4,.95);
      --base-inset-1: rgba(255,148,70,.24);
      --base-inset-2: rgba(0,0,0,.78);
      --aura-1: rgba(255, 116, 26, .86);
      --aura-2: rgba(255, 80, 10, .3);
      --ring-border: rgba(255, 142, 68, .58);
      --ring-1: rgba(255,240,220,.16);
      --ring-2: rgba(255,150,58,.98);
      --ring-3: rgba(255,108,26,.95);
      --ring-4: rgba(255,66,12,.9);
      --ring-5: rgba(255,186,106,.88);
      --ring-glow-1: rgba(255, 112, 20, .7);
      --ring-glow-2: rgba(255, 62, 8, .52);
      --well-1: rgba(255,132,58,.36);
      --well-2: rgba(70,28,10,.62);
      --well-3: rgba(4,3,3,.96);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
    html.drop-active, body.drop-active { pointer-events: auto !important; }
    #root {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: transparent !important;
      --hx: 50vw;
      --hy: calc(100vh - 220px);
      --hole-scale: 1;
      --anim-level: 1;
      --ring-speed: 3.2s;
      --aura-speed: 6.4s;
      --focus-amount: 0;
    }
    #root.show { pointer-events: auto; }
    .hole-wrap {
      position: absolute;
      left: var(--hx);
      top: var(--hy);
      width: 180px;
      height: 206px;
      transform: translateZ(0) scale(var(--hole-scale));
      opacity: 0;
      transition: opacity 180ms ease, transform calc(320ms / var(--anim-level)) cubic-bezier(.2,.85,.24,1);
    }
    .hint {
      position: absolute;
      left: 50%;
      bottom: 166px;
      transform: translateX(-50%);
      min-width: 136px;
      max-width: 220px;
      text-align: center;
      font: 600 12px/1.2 "Segoe UI","Microsoft YaHei",sans-serif;
      color: var(--hint-text);
      letter-spacing: .02em;
      padding: 7px 10px;
      border-radius: 999px;
      border: 1px solid var(--hint-border);
      background: linear-gradient(180deg, var(--hint-bg1), var(--hint-bg2));
      box-shadow: 0 0 18px var(--hint-shadow1);
      opacity: 0;
      transition: opacity 140ms ease, transform 180ms ease, box-shadow 180ms ease;
      pointer-events: none;
    }
    .show .hint { opacity: .74; transform: translateX(-50%) translateY(0); }
    .near .hint {
      opacity: 1;
      box-shadow: 0 0 18px var(--hint-shadow1), 0 0 30px var(--hint-shadow2);
      transform: translateX(-50%) translateY(-2px);
    }
    .local-fx {
      position: absolute;
      left: 50%;
      bottom: 0;
      width: 180px;
      height: 120px;
      transform: translateX(-50%);
      border-radius: 50%;
      pointer-events: none;
      opacity: .13;
      filter: blur(12px) saturate(.85);
      background:
        radial-gradient(ellipse at 50% 62%,
          color-mix(in srgb, var(--ai-blue) 24%, transparent) 0%,
          color-mix(in srgb, var(--ai-green) 18%, transparent) 30%,
          color-mix(in srgb, var(--ai-red) 14%, transparent) 52%,
          rgba(255, 255, 255, 0) 74%);
      animation: localAuraBreath 3.6s ease-in-out infinite;
    }
    .safe-mode .local-fx {
      filter: none;
      opacity: .1;
      animation: none;
    }
    .show .hole-wrap { opacity: 1; transform: translateZ(0) scale(var(--hole-scale)); }
    .base-hole,.aura,.ring,.well {
      position: absolute; left: 50%; transform: translateX(-50%); border-radius: 50%;
    }
    .base-hole {
      bottom: 26px; width: 58%; height: 25%;
      background: radial-gradient(ellipse at 50% 52%, var(--base-1) 0%, var(--base-2) 58%, var(--base-3) 100%);
      box-shadow: inset 0 8px 16px var(--base-inset-1), inset 0 -10px 22px var(--base-inset-2);
    }
    .aura {
      bottom: 12px; width: 92%; height: 46%; filter: blur(11px);
      background: conic-gradient(from var(--ring-angle),
        color-mix(in srgb, var(--ai-blue) 68%, transparent) 0%,
        color-mix(in srgb, var(--ai-green) 64%, transparent) 25%,
        color-mix(in srgb, var(--ai-yellow) 60%, transparent) 50%,
        color-mix(in srgb, var(--ai-red) 64%, transparent) 75%,
        color-mix(in srgb, var(--ai-blue) 68%, transparent) 100%);
      opacity: calc(.08 + var(--p) * .22);
      transform: translateX(-50%) scale(calc(.94 + var(--p) * .12));
      animation: ringOrbit var(--aura-speed) linear infinite, auraBreathSoft 4.4s ease-in-out infinite;
    }
    .safe-mode .aura {
      filter: none;
      opacity: calc(.08 + var(--p) * .24);
    }
    .ring {
      bottom: 24px; width: 60%; height: 27%;
      border: 1px solid color-mix(in srgb, var(--ai-blue) 35%, rgba(255,255,255,.22));
      background:
        radial-gradient(ellipse at center, rgba(255,255,255,0) 66%, rgba(255,255,255,.02) 74%, rgba(255,255,255,0) 100%),
        conic-gradient(from var(--ring-angle), var(--ai-blue), var(--ai-green), var(--ai-yellow), var(--ai-red), var(--ai-blue));
      opacity: calc(.28 + var(--p) * .72);
      transform: translateX(-50%) scale(calc(.92 + var(--p) * .08));
      box-shadow:
        0 0 calc(4px + var(--p) * 6px) color-mix(in srgb, var(--ai-blue) 20%, transparent),
        0 0 calc(10px + var(--p) * 10px) color-mix(in srgb, var(--ai-green) 14%, transparent);
      animation: ringOrbit var(--ring-speed) linear infinite;
    }
    .safe-mode .ring {
      box-shadow: none;
      background: conic-gradient(from var(--ring-angle), color-mix(in srgb, var(--ai-blue) 74%, transparent), color-mix(in srgb, var(--ai-green) 72%, transparent), color-mix(in srgb, var(--ai-yellow) 70%, transparent), color-mix(in srgb, var(--ai-red) 72%, transparent), color-mix(in srgb, var(--ai-blue) 74%, transparent));
      border-color: color-mix(in srgb, var(--ai-blue) 30%, rgba(255,255,255,.2));
    }
    .near {
      --ring-speed: 1.7s;
      --aura-speed: 4.2s;
    }
    .near .ring {
      box-shadow:
        0 0 calc(5px + var(--p) * 7px) color-mix(in srgb, var(--ai-blue) 22%, transparent),
        0 0 calc(12px + var(--p) * 12px) color-mix(in srgb, var(--ai-green) 16%, transparent);
    }
    .near .aura {
      opacity: calc(.08 + var(--p) * .2);
      filter: blur(11px) saturate(.84);
    }
    .well {
      bottom: 29px; width: 45%; height: 17%;
      background: radial-gradient(ellipse at 50% 52%, var(--well-1) 0%, var(--well-2) 44%, var(--well-3) 100%);
      opacity: calc(.11 + var(--p) * .34);
      transform: translateX(-50%) scale(calc(.99 - var(--p) * .06));
    }
    .preview-core {
      position: absolute;
      left: 50%;
      bottom: 20px;
      width: 42%;
      height: 16%;
      transform: translateX(-50%) scale(.94);
      border-radius: 999px;
      background: rgba(6, 9, 14, .92);
      border: 1px solid rgba(255,255,255,.08);
      color: rgba(230, 242, 255, .9);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 10px;
      font: 600 11px/1 "Segoe UI","Microsoft YaHei",sans-serif;
      letter-spacing: .01em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      opacity: 0;
      pointer-events: none;
      z-index: 3;
      transition: opacity 260ms cubic-bezier(.2,.85,.24,1), transform 320ms cubic-bezier(.2,.85,.24,1), width 320ms cubic-bezier(.2,.85,.24,1), height 320ms cubic-bezier(.2,.85,.24,1), bottom 320ms cubic-bezier(.2,.85,.24,1);
    }
    :root[data-theme="dark"] #root.text-focus .ring {
      width: 120%;
      height: 54%;
      bottom: 8px;
      border: 0;
      background: conic-gradient(from var(--ring-angle), var(--ai-blue), var(--ai-green), var(--ai-yellow), var(--ai-red), var(--ai-blue));
      -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 2px), #000 calc(100% - 1px));
      mask: radial-gradient(farthest-side, transparent calc(100% - 2px), #000 calc(100% - 1px));
      box-shadow:
        0 0 14px color-mix(in srgb, var(--ai-blue) 44%, transparent),
        0 0 28px color-mix(in srgb, var(--ai-green) 34%, transparent),
        0 0 40px color-mix(in srgb, var(--ai-red) 24%, transparent);
      transform: translateX(-50%) scale(1);
      transition: width 340ms cubic-bezier(.2,.85,.24,1), height 340ms cubic-bezier(.2,.85,.24,1), bottom 340ms cubic-bezier(.2,.85,.24,1), box-shadow 260ms ease;
      animation: ringOrbit .92s linear infinite;
    }
    :root[data-theme="dark"] #root.text-focus .base-hole {
      width: 108%;
      height: 44%;
      bottom: 10px;
      opacity: .98;
      background:
        radial-gradient(ellipse at 50% 52%,
          rgba(16,20,30,.88) 0%,
          rgba(8,10,16,.94) 38%,
          rgba(2,3,7,.98) 68%,
          rgba(0,0,0,1) 100%),
        radial-gradient(circle at 26% 34%, rgba(182, 212, 255, .22) 0 1px, transparent 2px),
        radial-gradient(circle at 64% 42%, rgba(132, 182, 255, .18) 0 1px, transparent 2px),
        radial-gradient(circle at 48% 60%, rgba(255, 255, 255, .12) 0 1px, transparent 2px),
        radial-gradient(circle at 74% 56%, rgba(170, 204, 255, .16) 0 1px, transparent 2px);
      box-shadow:
        inset 0 14px 22px rgba(42,48,64,.14),
        inset 0 -16px 24px rgba(0,0,0,.92),
        0 8px 20px rgba(0,0,0,.42);
      transform: translateX(-50%) scale(1);
      transition: width 340ms cubic-bezier(.2,.85,.24,1), height 340ms cubic-bezier(.2,.85,.24,1), bottom 340ms cubic-bezier(.2,.85,.24,1), box-shadow 260ms ease;
      z-index: 2;
    }
    :root[data-theme="dark"] #root.text-focus .well {
      width: 72%;
      height: 26%;
      bottom: 18px;
      opacity: .9;
      background:
        radial-gradient(ellipse at 50% 50%,
          rgba(18,24,38,.5) 0%,
          rgba(8,10,16,.78) 34%,
          rgba(2,3,7,.95) 70%,
          rgba(0,0,0,1) 100%);
      transform: translateX(-50%) scale(1);
      transition: width 340ms cubic-bezier(.2,.85,.24,1), height 340ms cubic-bezier(.2,.85,.24,1), bottom 340ms cubic-bezier(.2,.85,.24,1), opacity 220ms ease;
      z-index: 2;
    }
    :root[data-theme="dark"] #root.text-focus .aura {
      opacity: .2;
      filter: blur(12px) saturate(1);
      transform: translateX(-50%) scale(1.08);
      animation: ringOrbit 2.8s linear infinite, auraBreathSoft 2.1s ease-in-out infinite;
    }
    :root[data-theme="dark"] #root.text-focus .local-fx {
      opacity: .18;
      filter: blur(13px) saturate(1.02);
      animation: localAuraBreath 2.0s ease-in-out infinite;
    }
    :root[data-theme="dark"] #root.text-focus .preview-core {
      opacity: .96;
      width: 70%;
      height: 30%;
      bottom: 18px;
      transform: translateX(-50%) scale(1);
      background: linear-gradient(180deg, rgba(16,20,30,.78), rgba(8,10,16,.86));
      border-color: transparent;
      color: rgba(220, 236, 255, .95);
      text-shadow: 0 0 6px rgba(110, 168, 255, .25);
      box-shadow: inset 0 0 16px rgba(0,0,0,.44);
      z-index: 4;
    }
    .drop .ring { animation: ringCollapse 620ms cubic-bezier(.13,.84,.24,1); }
    .drop .well { animation: wellCollapse 620ms cubic-bezier(.13,.84,.24,1); }
    .drop .aura { animation: auraFlash 620ms cubic-bezier(.13,.84,.24,1); }
    .drop .local-fx { animation: localAuraDrop 620ms cubic-bezier(.13,.84,.24,1); }
    .drop .hint { opacity: 1; }
    .safe-mode.drop .ring,
    .safe-mode.drop .well,
    .safe-mode.drop .aura,
    .safe-mode.drop .local-fx {
      animation-duration: 320ms;
    }
    .perf-box {
      position: fixed;
      right: 10px;
      top: 10px;
      width: 30px;
      height: 30px;
      border-radius: 6px;
      border: 1px solid rgba(255,255,255,.35);
      background: #1f9d45;
      box-shadow: 0 0 10px rgba(0,0,0,.25);
      pointer-events: none;
      opacity: 0;
      z-index: 9999;
      transition: opacity 120ms ease;
    }
    .perf-label {
      position: fixed;
      right: 46px;
      top: 10px;
      min-width: 320px;
      max-width: 460px;
      padding: 4px 7px;
      border-radius: 6px;
      border: 1px solid rgba(255,255,255,.2);
      background: rgba(12, 16, 24, .78);
      color: rgba(242, 247, 255, .96);
      font: 600 11px/1.35 "Segoe UI","Microsoft YaHei",sans-serif;
      letter-spacing: .01em;
      pointer-events: none;
      z-index: 9998;
      white-space: normal;
      overflow: visible;
      text-overflow: clip;
      opacity: 0;
      transition: opacity 120ms ease;
    }
    body.hole-visible .perf-box,
    body.hole-visible .perf-label {
      opacity: .95;
    }
    @keyframes localAuraBreath {
      0% { transform: translateX(-50%) scale(.96); opacity: .1; }
      50% { transform: translateX(-50%) scale(1.02); opacity: .17; }
      100% { transform: translateX(-50%) scale(.96); opacity: .1; }
    }
    @keyframes auraBreathSoft {
      0% { filter: blur(10px) saturate(.86); }
      50% { filter: blur(13px) saturate(.8); }
      100% { filter: blur(10px) saturate(.86); }
    }
    @keyframes ringOrbit {
      0% { --ring-angle: 0deg; }
      100% { --ring-angle: 360deg; }
    }
    @keyframes localAuraDrop {
      0% { transform: translateX(-50%) scale(1); opacity: .3; }
      40% { transform: translateX(-50%) scale(1.14); opacity: .44; }
      100% { transform: translateX(-50%) scale(1.28); opacity: .08; }
    }
    @keyframes ringCollapse {
      0% { transform: translateX(-50%) scale(1.06); opacity: 1; }
      36% { transform: translateX(-50%) scale(.72); opacity: .98; }
      72% { transform: translateX(-50%) scale(1.16); opacity: .88; }
      100% { transform: translateX(-50%) scale(.9); opacity: .4; }
    }
    @keyframes wellCollapse {
      0% { transform: translateX(-50%) scale(1); opacity: .9; }
      44% { transform: translateX(-50%) scale(.66); opacity: 1; }
      100% { transform: translateX(-50%) scale(1.08); opacity: .34; }
    }
    @keyframes auraFlash {
      0% { transform: translateX(-50%) scale(1); opacity: .86; }
      44% { transform: translateX(-50%) scale(1.16); opacity: 1; }
      100% { transform: translateX(-50%) scale(1.36); opacity: .18; }
    }
  </style>
</head>
<body>
  <div id="perfBox" class="perf-box" aria-hidden="true"></div>
  <div id="perfLabel" class="perf-label" aria-hidden="true">FPS: -- | 帧: --ms | Host: --ms | 诊断: --</div>
  <div id="root">
    <div class="hole-wrap">
      <div id="hint" class="hint">拖到这里开始搜索</div>
      <div class="local-fx"></div>
      <div class="base-hole"></div>
      <div class="aura"></div>
      <div class="ring"></div>
      <div class="well"></div>
      <div id="previewCore" class="preview-core">拖动文本到黑洞</div>
    </div>
  </div>
  <script>
    (function () {
      var root = document.getElementById('root');
      var p = 0;
      function setP(v) {
        p = Math.max(0, Math.min(1, Number(v) || 0));
        root.style.setProperty('--p', String(p));
      }
      var pos = { x: Math.max(12, Math.round(window.innerWidth / 2 - 90)), y: Math.max(12, Math.round(window.innerHeight - 240)) };
      var hint = document.getElementById('hint');
      var previewCore = document.getElementById('previewCore');
      var perfBox = document.getElementById('perfBox');
      var perfLabel = document.getElementById('perfLabel');
      var payloadType = 'text';
      var dragPreviewText = '';
      var isNear = false;
      var lastHintText = '';
      var dragUpdateActive = false;
      var lastUpdateTick = 0;
      var DRAG_HEARTBEAT_TIMEOUT_MS = 220;
      var perfStats = { fps: 60, frameMs: 16.7, state: 'green', dropped: false, ts: Date.now(), hostGapMs: -1, hostAgeMs: 0, hostStall: false };
      var perfLastTs = (typeof performance !== 'undefined' && performance.now) ? performance.now() : Date.now();
      var lastHostUpdateTs = perfLastTs;
      var perfDiagnosis = '状态正常';
      var nativeState = { session: '-', kind: '-', dispatch: '-', at: 0, active: '-', overHole: '-', wasOverHole: '-', payload: '-' };
      function updatePerfLabel() {
        if (!perfLabel) return;
        var hostDeltaText = perfStats.hostGapMs >= 0 ? Number(perfStats.hostGapMs).toFixed(1) + 'ms' : '--';
        perfLabel.textContent = 'FPS: ' + Number(perfStats.fps).toFixed(1)
          + ' | 帧: ' + Number(perfStats.frameMs).toFixed(1) + 'ms'
          + ' | HostΔ: ' + hostDeltaText
          + ' | HostAge: ' + Number(perfStats.hostAgeMs).toFixed(1) + 'ms'
          + ' | 诊断: ' + perfDiagnosis
          + ' | Native: ' + String(nativeState.kind || '-')
          + ' | Dispatch: ' + String(nativeState.dispatch || '-')
          + ' | A:' + String(nativeState.active || '-')
          + ' O:' + String(nativeState.overHole || '-')
          + ' W:' + String(nativeState.wasOverHole || '-')
          + ' P:' + String(nativeState.payload || '-');
      }
      function updatePerfBox() {
        if (!perfBox) return;
        var fps = perfStats.fps;
        if (perfStats.hostStall || perfStats.hostAgeMs > 420 || fps < 30) {
          perfDiagnosis = perfStats.hostStall || perfStats.hostAgeMs > 420 ? '宿主更新阻塞' : '渲染严重掉帧';
          perfStats.state = 'red';
          perfStats.dropped = true;
          perfBox.style.background = '#d73a49';
        } else if (perfStats.hostAgeMs > 220 || fps < 55) {
          perfDiagnosis = perfStats.hostAgeMs > 220 ? '宿主更新变慢' : '渲染轻度掉帧';
          perfStats.state = 'yellow';
          perfStats.dropped = false;
          perfBox.style.background = '#e3b341';
        } else if (fps > 55) {
          perfDiagnosis = '状态正常';
          perfStats.state = 'green';
          perfStats.dropped = false;
          perfBox.style.background = '#1f9d45';
        } else {
          perfDiagnosis = '轻微波动';
          perfStats.state = 'yellow';
          perfStats.dropped = false;
          perfBox.style.background = '#e3b341';
        }
        updatePerfLabel();
      }
      function perfTick(ts) {
        var now = (typeof ts === 'number') ? ts : ((typeof performance !== 'undefined' && performance.now) ? performance.now() : Date.now());
        var dt = Math.max(1, now - perfLastTs);

        var instFps = 1000 / dt;
        perfStats.fps = perfStats.fps * 0.85 + instFps * 0.15;
        perfStats.frameMs = dt;

          var staleFor = Date.now() - lastUpdateTick;
          if (staleFor > DRAG_HEARTBEAT_TIMEOUT_MS) {

            isNear = false;
            root.classList.remove('near');
            hintTextByState('idle');
          }
        }
        var showing = root.classList.contains('show');
        if (showing && dragUpdateActive) {
          var age = Math.max(0, now - lastHostUpdateTs);
          perfStats.hostAgeMs = age;
          perfStats.hostStall = age > 420;
        } else {
          perfStats.hostGapMs = -1;
          perfStats.hostAgeMs = 0;
          perfStats.hostStall = false;
        }
        perfStats.ts = Date.now();
        updatePerfBox();
        window.requestAnimationFrame(perfTick);
      }
      function applyPos() {
        root.style.setProperty('--hx', String(pos.x) + 'px');
        root.style.setProperty('--hy', String(pos.y) + 'px');
      }
      function clampPos(x, y) {
        var maxX = Math.max(12, window.innerWidth - 180 - 12);
        var maxY = Math.max(12, window.innerHeight - 206 - 12);
        pos.x = Math.max(12, Math.min(maxX, Math.round(Number(x) || 0)));
        pos.y = Math.max(12, Math.min(maxY, Math.round(Number(y) || 0)));
        applyPos();
      }
      function hintTextByState(state) {
        if (!hint) return;
        var next = '';
        if (state === 'drop') {
          next = payloadType === 'text' ? '已接收文本' : '已接收文件';
          if (next !== lastHintText) {
            hint.textContent = next;
            lastHintText = next;
          }
          return;
        }
        if (state === 'near') {
          next = payloadType === 'text' ? '松手即可搜索文本' : '松手即可处理文件';
          if (next !== lastHintText) {
            hint.textContent = next;
            lastHintText = next;
          }
          return;
        }
        next = payloadType === 'text' ? '拖到这里开始搜索' : '拖到这里处理文件';
        if (next !== lastHintText) {
          hint.textContent = next;
          lastHintText = next;
        }
      }
      function updatePreviewCore() {
        if (!previewCore) return;
        var txt = String(dragPreviewText || '').trim();
        if (!txt) {
          previewCore.textContent = payloadType === 'text' ? '拖动文本到黑洞' : '拖动内容到黑洞';
          return;
        }
        if (txt.length > 46) txt = txt.slice(0, 46) + '…';
        previewCore.textContent = txt;
      }
      function updateTextFocusState() {
        var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
        var engage = isDark && payloadType === 'text' && root.classList.contains('show') && (isNear || p >= 0.48);
        root.classList.toggle('text-focus', !!engage);
      }
      function setSafeMode(on) {
        root.classList.toggle('safe-mode', !!on);
      }
      function setTheme(mode) {
        var m = String(mode || '').toLowerCase();
        if (m !== 'light' && m !== 'dark') {
          document.documentElement.removeAttribute('data-theme');
          return;
        }
        document.documentElement.setAttribute('data-theme', m);
        updateTextFocusState();
      }
      function show(payload) {
        if (payload === 'text' || payload === 'file') payloadType = payload;
        setSafeMode(true);
        document.body.classList.add('hole-visible');
        var alreadyShown = root.classList.contains('show');
        root.classList.add('show');
        if (!alreadyShown && !isNear) {
          hintTextByState('idle');
        }
        updatePreviewCore();
        updateTextFocusState();
      }
      function hide() {
        document.documentElement.classList.remove('drop-active');
        document.body.classList.remove('drop-active');
        document.body.classList.remove('hole-visible');
        root.classList.remove('show');
        root.classList.remove('drop');
        root.classList.remove('near');
        setSafeMode(false);
        dragUpdateActive = false;
        lastUpdateTick = 0;
        perfStats.hostGapMs = -1;
        perfStats.hostAgeMs = 0;
        perfStats.hostStall = false;
        setP(0);
        root.classList.remove('text-focus');
      }
      function setStyle(scale, animLevel) {
        var s = Number(scale);
        if (!Number.isFinite(s)) s = 1;
        if (s < 0.6) s = 0.6;
        if (s > 1.8) s = 1.8;
        var a = Number(animLevel);
        if (!Number.isFinite(a)) a = 1;
        if (a < 0.4) a = 0.4;
        if (a > 2.2) a = 2.2;
        root.style.setProperty('--hole-scale', String(s));
        root.style.setProperty('--anim-level', String(a));
      }
      window.HoleOverlay = {
        show: function (payload) { show(payload); setP(0.2); },
        setStyle: function (o) { if (o) setStyle(o.scale, o.animLevel); },
        setTheme: function (o) {
          if (typeof o === 'string') setTheme(o);
          else if (o && typeof o.theme === 'string') setTheme(o.theme);
          else if (o && typeof o.themeMode === 'string') setTheme(o.themeMode);
        },
        moveTo: function (o) {
          if (!o) return;
          clampPos(o.x, o.y);
          show();
        },
        update: function (o) {
          show();
          var nowHost = (typeof performance !== 'undefined' && performance.now) ? performance.now() : Date.now();
          perfStats.hostGapMs = Math.max(0, nowHost - lastHostUpdateTs);
          lastHostUpdateTs = nowHost;
          dragUpdateActive = true;
          lastUpdateTick = Date.now();
          if (o && typeof o.proximity === 'number') setP(o.proximity);
          else if (o && typeof o.x === 'number' && typeof o.y === 'number') {
            var cx = pos.x + 90;
            var cy = pos.y + 150;
            var dx = o.x - cx, dy = o.y - cy;
            var d = Math.sqrt(dx * dx + dy * dy);
            var r = 260;
            setP(1 - d / r);
          } else setP(0.45);
          var enterNear = 0.62;
          var leaveNear = 0.48;
          if (!isNear && p >= enterNear) isNear = true;
          else if (isNear && p <= leaveNear) isNear = false;
          if (isNear) {
            root.classList.add('near');
            hintTextByState('near');
          } else {
            root.classList.remove('near');
            hintTextByState('idle');
          }
          updateTextFocusState();
        },
        drop: function (o) {
          if (o && (o.payload === 'text' || o.payload === 'file')) payloadType = o.payload;
          document.documentElement.classList.add('drop-active');
          document.body.classList.add('drop-active');
          window.requestAnimationFrame(function () {
            postHostMessage({ type: 'hole_drop_ack', phase: 'first_frame', payload: payloadType, ts: Date.now() });
          });
          root.classList.remove('drop');
          void root.offsetWidth;
          root.classList.add('drop');
          root.classList.remove('near');
          isNear = false;
          dragUpdateActive = false;
          hintTextByState('drop');
          setTimeout(function () { hide(); }, 700);
        },
        hide: function () { root.classList.remove('near'); isNear = false; dragUpdateActive = false; hide(); }
      };
      window.HoleOverlay.setNativeState = function (o) {
        if (!o || typeof o !== 'object') return;
        if (typeof o.session !== 'undefined') nativeState.session = o.session;
        if (typeof o.kind !== 'undefined') nativeState.kind = o.kind;
        if (typeof o.dispatch !== 'undefined') nativeState.dispatch = o.dispatch;
        if (typeof o.active !== 'undefined') nativeState.active = o.active;
        if (typeof o.overHole !== 'undefined') nativeState.overHole = o.overHole;
        if (typeof o.wasOverHole !== 'undefined') nativeState.wasOverHole = o.wasOverHole;
        if (typeof o.payload !== 'undefined') nativeState.payload = o.payload;
        if (typeof o.previewText === 'string') {
          dragPreviewText = o.previewText;
          updatePreviewCore();
        }
        nativeState.at = Date.now();
        updatePerfLabel();
        updateTextFocusState();
      };
      window.getPerfStats = function () {
        return {
          fps: Number(perfStats.fps.toFixed(1)),
          frameMs: Number(perfStats.frameMs.toFixed(2)),
          hostGapMs: perfStats.hostGapMs >= 0 ? Number(perfStats.hostGapMs.toFixed(1)) : null,
          hostAgeMs: Number(perfStats.hostAgeMs.toFixed(1)),
          hostStall: !!perfStats.hostStall,
          diagnosis: perfDiagnosis,
          state: perfStats.state,
          dropped: !!perfStats.dropped,
          ts: perfStats.ts
        };
      };
      function postHostMessage(msg) {
        try {
          if (window.chrome && window.chrome.webview && window.chrome.webview.postMessage)
            window.chrome.webview.postMessage(msg);
        } catch (_) {}
      }
      function readAsBase64(file) {
        return new Promise(function (resolve, reject) {
          try {
            var rd = new FileReader();
            rd.onload = function () {
              var str = String(rd.result || '');
              var comma = str.indexOf(',');
              resolve(comma >= 0 ? str.slice(comma + 1) : str);
            };
            rd.onerror = function () { reject(new Error('read base64 failed')); };
            rd.readAsDataURL(file);
          } catch (e) {
            reject(e);
          }
        });
      }
      function stripHtmlToText(html) {
        try {
          var div = document.createElement('div');
          div.innerHTML = String(html || '');
          return String(div.textContent || div.innerText || '').trim();
        } catch (_) {
          return '';
        }
      }
      function getDataTransferText(dt) {
        try {
          var direct = String((dt && (dt.getData('text/plain') || dt.getData('Text') || dt.getData('text/uri-list'))) || '').trim();
          if (direct) return direct;
        } catch (_) {}
        try {
          var html = String((dt && dt.getData && dt.getData('text/html')) || '').trim();
          if (html) {
            var textFromHtml = stripHtmlToText(html);
            if (textFromHtml) return textFromHtml;
          }
        } catch (_) {}
        return '';
      }
      function readItemString(item) {
        return new Promise(function (resolve) {
          try {
            if (!item || typeof item.getAsString !== 'function') return resolve('');
            item.getAsString(function (value) {
              resolve(String(value || '').trim());
            });
          } catch (_) {
            resolve('');
          }
        });
      }
      async function readDropPayload(dt) {
        var files = [];
        var text = '';
        var rawFiles = [];
        try { rawFiles = Array.from((dt && dt.files) || []); } catch (_) { rawFiles = []; }
        for (var i = 0; i < rawFiles.length; i++) {
          var f = rawFiles[i];
          if (!f) continue;
          var sz = Number((f && f.size) || 0);
          if (sz > 20 * 1024 * 1024) continue;
          var item = {
            name: String((f && f.name) || ''),
            type: String((f && f.type) || ''),
            size: sz,
            path: String((f && (f.path || '')) || ''),
            contentBase64: ''
          };
          try {
            item.contentBase64 = await readAsBase64(f);
          } catch (_) {
            item.contentBase64 = '';
          }
          if (item.contentBase64 || item.path || item.name) files.push(item);
        }
        text = getDataTransferText(dt);
        if (!text) {
          try {
            var items = Array.from((dt && dt.items) || []);
            for (var j = 0; j < items.length; j++) {
              var it = items[j];
              if (!it) continue;
              var kind = String(it.kind || '').toLowerCase();
              var type = String(it.type || '').toLowerCase();
              if (kind !== 'string') continue;
              if (!(type.indexOf('text/plain') >= 0 || type.indexOf('text/html') >= 0 || type.indexOf('text/uri-list') >= 0)) continue;
              var itemText = await readItemString(it);
              if (!itemText) continue;
              if (type.indexOf('text/html') >= 0) itemText = stripHtmlToText(itemText);
              itemText = String(itemText || '').trim();
              if (itemText) {
                text = itemText;
                break;
              }
            }
          } catch (_) {}
        }
        if (files.length > 0)
          return { kind: 'file', files: files, text: text };
        if (text)
          return { kind: 'text', text: text, files: [] };

        try { if (e.dataTransfer) e.dataTransfer.dropEffect = 'copy'; } catch (_) {}

        e.preventDefault();
        e.stopPropagation();
        var payload = await readDropPayload(e.dataTransfer);

      }, true);
      window.addEventListener('resize', function () { clampPos(pos.x, pos.y); });
      applyPos();
      window.requestAnimationFrame(perfTick);
      try {
        var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        setTheme(prefersDark ? 'dark' : 'light');
      } catch (_) {}
      // Optional standalone preview mode: enable only with ?preview=1
      try {
        var qp = new URLSearchParams(window.location.search || '');
        if (qp.get('preview') === '1') {
          show();
          setP(0.35);
        }
      } catch (_) {}
    })();
  </script>
