<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hole Overlay</title>
  <style>
    :root { --p: 0; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
    #root {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: transparent !important;
      --hx: 50vw;
      --hy: calc(100vh - 220px);
      --hole-scale: 1;
      --anim-level: 1;
    }
    .hole-wrap {
      position: absolute;
      left: var(--hx);
      top: var(--hy);
      width: 180px;
      height: 206px;
      transform: translateZ(0) scale(var(--hole-scale));
      opacity: 0;
      transition: opacity 180ms ease, transform calc(220ms / var(--anim-level)) ease;
    }
    .hint {
      position: absolute;
      left: 50%;
      bottom: 166px;
      transform: translateX(-50%);
      min-width: 136px;
      max-width: 220px;
      text-align: center;
      font: 600 12px/1.2 "Segoe UI","Microsoft YaHei",sans-serif;
      color: rgba(218, 247, 255, .96);
      letter-spacing: .02em;
      padding: 7px 10px;
      border-radius: 999px;
      border: 1px solid rgba(150, 238, 255, .44);
      background: linear-gradient(180deg, rgba(20,58,88,.72), rgba(15,36,60,.74));
      box-shadow: 0 0 18px rgba(115, 229, 255, .25);
      opacity: 0;
      transition: opacity 140ms ease, transform 180ms ease, box-shadow 180ms ease;
      pointer-events: none;
    }
    .show .hint { opacity: .74; transform: translateX(-50%) translateY(0); }
    .near .hint {
      opacity: 1;
      box-shadow: 0 0 24px rgba(115, 229, 255, .45), 0 0 50px rgba(232, 159, 255, .22);
      transform: translateX(-50%) translateY(-2px);
    }
    .local-fx {
      position: absolute;
      left: 50%;
      bottom: 0;
      width: 180px;
      height: 120px;
      transform: translateX(-50%);
      border-radius: 50%;
      pointer-events: none;
      opacity: .22;
      filter: blur(16px);
      background:
        radial-gradient(ellipse at 50% 62%,
          rgba(118, 235, 255, .34) 0%,
          rgba(118, 235, 255, .15) 34%,
          rgba(236, 170, 255, .10) 54%,
          rgba(255, 255, 255, 0) 76%);
      animation: localAuraBreath 2.8s ease-in-out infinite;
    }
    .safe-mode .local-fx {
      filter: none;
      opacity: .1;
      animation: none;
    }
    .show .hole-wrap { opacity: 1; transform: translateZ(0) scale(var(--hole-scale)); }
    .base-hole,.aura,.ring,.well {
      position: absolute; left: 50%; transform: translateX(-50%); border-radius: 50%;
    }
    .base-hole {
      bottom: 26px; width: 58%; height: 25%;
      background: radial-gradient(ellipse at 50% 52%, rgba(187,210,229,.9) 0%, rgba(133,161,187,.76) 58%, rgba(107,135,162,.68) 100%);
      box-shadow: inset 0 8px 16px rgba(216,232,245,.55), inset 0 -10px 22px rgba(80,111,139,.45);
    }
    .aura {
      bottom: 12px; width: 92%; height: 46%; filter: blur(11px);
      background: radial-gradient(ellipse at 50% 58%, rgba(123,240,255,.7), rgba(123,240,255,.2) 48%, rgba(123,240,255,0) 74%);
      opacity: calc(.2 + var(--p) * .75);
      transform: translateX(-50%) scale(calc(.92 + var(--p) * .24));
    }
    .safe-mode .aura {
      filter: none;
      opacity: calc(.14 + var(--p) * .45);
    }
    .ring {
      bottom: 24px; width: 60%; height: 27%;
      border: 1.5px solid rgba(210,248,255, calc(.35 + var(--p) * .6));
      background: conic-gradient(from 0deg, rgba(255,255,255,0) 0 16%, rgba(130,245,255,.98) 30%, rgba(86,223,255,.94) 44%, rgba(240,166,255,.9) 58%, rgba(134,255,225,.9) 72%, rgba(255,255,255,0) 100%);
      opacity: calc(.28 + var(--p) * .72);
      transform: translateX(-50%) scale(calc(.9 + var(--p) * .24));
      box-shadow: 0 0 calc(8px + var(--p) * 20px) rgba(122,235,255, calc(.3 + var(--p) * .45)), 0 0 calc(20px + var(--p) * 42px) rgba(235,171,255, calc(.12 + var(--p) * .35));
    }
    .safe-mode .ring {
      box-shadow: none;
      background: rgba(130,245,255, calc(.2 + var(--p) * .55));
      border-color: rgba(190,245,255, calc(.28 + var(--p) * .45));
    }
    .well {
      bottom: 29px; width: 45%; height: 17%;
      background: radial-gradient(ellipse at 50% 52%, rgba(98,174,196,.38) 0%, rgba(24,61,104,.48) 44%, rgba(10,32,64,.76) 100%);
      opacity: calc(.18 + var(--p) * .64);
      transform: translateX(-50%) scale(calc(.98 - var(--p) * .12));
    }
    .drop .ring { animation: ringCollapse 620ms cubic-bezier(.13,.84,.24,1); }
    .drop .well { animation: wellCollapse 620ms cubic-bezier(.13,.84,.24,1); }
    .drop .aura { animation: auraFlash 620ms cubic-bezier(.13,.84,.24,1); }
    .drop .local-fx { animation: localAuraDrop 620ms cubic-bezier(.13,.84,.24,1); }
    .drop .hint { opacity: 1; }
    .safe-mode.drop .ring,
    .safe-mode.drop .well,
    .safe-mode.drop .aura,
    .safe-mode.drop .local-fx {
      animation-duration: 320ms;
    }
    @keyframes localAuraBreath {
      0% { transform: translateX(-50%) scale(.96); opacity: .16; }
      50% { transform: translateX(-50%) scale(1.04); opacity: .28; }
      100% { transform: translateX(-50%) scale(.96); opacity: .16; }
    }
    @keyframes localAuraDrop {
      0% { transform: translateX(-50%) scale(1); opacity: .3; }
      40% { transform: translateX(-50%) scale(1.14); opacity: .44; }
      100% { transform: translateX(-50%) scale(1.28); opacity: .08; }
    }
    @keyframes ringCollapse {
      0% { transform: translateX(-50%) scale(1.06); opacity: 1; }
      36% { transform: translateX(-50%) scale(.72); opacity: .98; }
      72% { transform: translateX(-50%) scale(1.16); opacity: .88; }
      100% { transform: translateX(-50%) scale(.9); opacity: .4; }
    }
    @keyframes wellCollapse {
      0% { transform: translateX(-50%) scale(1); opacity: .9; }
      44% { transform: translateX(-50%) scale(.66); opacity: 1; }
      100% { transform: translateX(-50%) scale(1.08); opacity: .34; }
    }
    @keyframes auraFlash {
      0% { transform: translateX(-50%) scale(1); opacity: .86; }
      44% { transform: translateX(-50%) scale(1.16); opacity: 1; }
      100% { transform: translateX(-50%) scale(1.36); opacity: .18; }
    }
  </style>
</head>
<body>
  <div id="root">
    <div class="hole-wrap">
      <div id="hint" class="hint">拖到这里开始搜索</div>
      <div class="local-fx"></div>
      <div class="base-hole"></div>
      <div class="aura"></div>
      <div class="ring"></div>
      <div class="well"></div>
    </div>
  </div>
  <script>
    (function () {
      var root = document.getElementById('root');
      var p = 0;
      function setP(v) {
        p = Math.max(0, Math.min(1, Number(v) || 0));
        root.style.setProperty('--p', String(p));
      }
      var pos = { x: Math.max(12, Math.round(window.innerWidth / 2 - 90)), y: Math.max(12, Math.round(window.innerHeight - 240)) };
      var hint = document.getElementById('hint');
      var payloadType = 'text';
      var isNear = false;
      var lastHintText = '';
      var dragUpdateActive = false;
      var lastUpdateTick = 0;
      function applyPos() {
        root.style.setProperty('--hx', String(pos.x) + 'px');
        root.style.setProperty('--hy', String(pos.y) + 'px');
      }
      function clampPos(x, y) {
        var maxX = Math.max(12, window.innerWidth - 180 - 12);
        var maxY = Math.max(12, window.innerHeight - 206 - 12);
        pos.x = Math.max(12, Math.min(maxX, Math.round(Number(x) || 0)));
        pos.y = Math.max(12, Math.min(maxY, Math.round(Number(y) || 0)));
        applyPos();
      }
      function hintTextByState(state) {
        if (!hint) return;
        var next = '';
        if (state === 'drop') {
          next = payloadType === 'text' ? '已接收文本' : '已接收文件';
          if (next !== lastHintText) {
            hint.textContent = next;
            lastHintText = next;
          }
          return;
        }
        if (state === 'near') {
          next = payloadType === 'text' ? '松手即可搜索文本' : '松手即可处理文件';
          if (next !== lastHintText) {
            hint.textContent = next;
            lastHintText = next;
          }
          return;
        }
        next = payloadType === 'text' ? '拖到这里开始搜索' : '拖到这里处理文件';
        if (next !== lastHintText) {
          hint.textContent = next;
          lastHintText = next;
        }
      }
      function setSafeMode(on) {
        root.classList.toggle('safe-mode', !!on);
      }
      function show(payload) {
        if (payload === 'text' || payload === 'file') payloadType = payload;
        setSafeMode(true);
        var alreadyShown = root.classList.contains('show');
        root.classList.add('show');
        if (!alreadyShown && !isNear) {
          hintTextByState('idle');
        }
      }
      function hide() {
        root.classList.remove('show');
        root.classList.remove('drop');
        root.classList.remove('near');
        setSafeMode(false);
        dragUpdateActive = false;
        lastUpdateTick = 0;
        setP(0);
      }
      function setStyle(scale, animLevel) {
        var s = Number(scale);
        if (!Number.isFinite(s)) s = 1;
        if (s < 0.6) s = 0.6;
        if (s > 1.8) s = 1.8;
        var a = Number(animLevel);
        if (!Number.isFinite(a)) a = 1;
        if (a < 0.4) a = 0.4;
        if (a > 2.2) a = 2.2;
        root.style.setProperty('--hole-scale', String(s));
        root.style.setProperty('--anim-level', String(a));
      }
      window.HoleOverlay = {
        show: function (payload) { show(payload); setP(0.2); },
        setStyle: function (o) { if (o) setStyle(o.scale, o.animLevel); },
        moveTo: function (o) {
          if (!o) return;
          clampPos(o.x, o.y);
          show();
        },
        update: function (o) {
          show();
          dragUpdateActive = true;
          lastUpdateTick = Date.now();
          if (o && typeof o.proximity === 'number') setP(o.proximity);
          else if (o && typeof o.x === 'number' && typeof o.y === 'number') {
            var cx = pos.x + 90;
            var cy = pos.y + 150;
            var dx = o.x - cx, dy = o.y - cy;
            var d = Math.sqrt(dx * dx + dy * dy);
            var r = 260;
            setP(1 - d / r);
          } else setP(0.45);
          if ((Date.now() - lastUpdateTick) > 180) {
            dragUpdateActive = false;
          }
          if (!dragUpdateActive) {
            isNear = false;
            root.classList.remove('near');
            hintTextByState('idle');
            return;
          }
          var enterNear = 0.62;
          var leaveNear = 0.48;
          if (!isNear && p >= enterNear) isNear = true;
          else if (isNear && p <= leaveNear) isNear = false;
          if (isNear) {
            root.classList.add('near');
            hintTextByState('near');
          } else {
            root.classList.remove('near');
            hintTextByState('idle');
          }
        },
        drop: function (o) {
          if (o && (o.payload === 'text' || o.payload === 'file')) payloadType = o.payload;
          root.classList.remove('drop');
          void root.offsetWidth;
          root.classList.add('drop');
          root.classList.remove('near');
          isNear = false;
          dragUpdateActive = false;
          hintTextByState('drop');
          setTimeout(function () { hide(); }, 700);
        },
        hide: function () { root.classList.remove('near'); isNear = false; dragUpdateActive = false; hide(); }
      };
      window.addEventListener('resize', function () { clampPos(pos.x, pos.y); });
      applyPos();
      // 独立打开 HTML 时默认显示，便于预览；运行态仍由 AHK 控制 update/drop。
      show();
      setP(0.35);
    })();
  </script>
</body>
</html>
