<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Deep Space - Precision Starfield</title>
  <style>
    @property --ring-angle {
      syntax: '<angle>';
      initial-value: 0deg;
      inherits: false;
    }
    :root {
      --p: 0;
      --preview-scale: 0;
      --preview-canvas-alpha: 0;
      --ring-w: 150px;
      --ring-h: 50px;
      --ai-red: #ea4335;
      --ai-yellow: #fbbc05;
      --ai-green: #34a853;
      --ai-blue: #4285f4;
      --hx: 310px;
      --hy: 310px;
    }
    
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; user-select: none; }
    
    #root {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 9999;
    }
    #root.show, #root.drop { pointer-events: auto; }

    .hole-wrap {
      position: absolute;
      left: var(--hx);
      top: var(--hy);
      /* 瀹瑰櫒璁句负 0 灏哄锛屽唴閮ㄥ厓绱犵粷瀵瑰眳涓墿寮?*/
      width: 0;
      height: 0;
      opacity: 0;
      transition: opacity 400ms ease;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .show .hole-wrap { opacity: 1; }

    /* 鐜粫鍏夊奖灞?*/
    .aura {
      position: absolute;
      width: 160px;
      height: 60px;
      filter: blur(25px);
      background: conic-gradient(from var(--ring-angle), var(--ai-blue), var(--ai-green), var(--ai-yellow), var(--ai-red), var(--ai-blue));
      opacity: calc(0.1 + var(--p) * 0.4);
      animation: spin 6s linear infinite;
      border-radius: 50%;
      z-index: 0;
      transition: all 1.2s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.5s;
    }

    /* 鏍稿績褰╃幆 */
    .ring {
      position: absolute;
      /* proximity drives ellipse -> circle morph */
      width: var(--ring-w);
      height: var(--ring-h);
      border-radius: 50%;
      opacity: calc(0.4 + var(--p) * 0.6);
      z-index: 4;
      transition: width 140ms linear, height 140ms linear, opacity 140ms linear, transform 180ms ease;
      transform: scale(calc(1 + var(--preview-scale)));
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .ring::before {
      content: '';
      position: absolute; inset: -2px; border-radius: 50%;
      padding: 2.5px;
      background: conic-gradient(from var(--ring-angle), var(--ai-blue), var(--ai-green), var(--ai-yellow), var(--ai-red), var(--ai-blue));
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      animation: spin 4s linear infinite;
    }

    /* 鏄熺┖瀹瑰櫒 */
    .well {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      overflow: hidden;
      background: #000;
      z-index: 2;
    }

    #galaxyCanvas {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      background: #000;
      width: 800px;
      height: 800px;
      opacity: var(--preview-canvas-alpha);
      transition: opacity 800ms ease;
    }

    /* 鏀惧ぇ閫昏緫锛氱‘淇濆彉涓轰弗鏍兼鍦?*/
    .drop .aura { 
      opacity: 0; 
      width: 450px;
      height: 450px;
    }
    
    .drop .ring { 
      width: 450px;  /* 3鍊嶅搴?*/
      height: 450px; /* 寮哄埗楂樺害绛変簬瀹藉害锛岀‘淇濇鍦?*/
      opacity: 1;
    }
    .drop #galaxyCanvas { opacity: 1; }
    .drop.expanding .ring { transform: scale(0.88); }
    .drop.expanding .aura { transform: scale(0.92); }
    .drop.expanded .ring { transform: scale(1); }
    .drop.expanded .aura { transform: scale(1); }

    @keyframes spin { to { --ring-angle: 360deg; } }
  </style>
</head>
<body>
  <div id="root">
    <div class="hole-wrap" id="holeBody">
      <div class="aura"></div>
      <div class="ring">
        <div class="well">
          <canvas id="galaxyCanvas"></canvas>
        </div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      const root = document.getElementById('root');
      const canvas = document.getElementById('galaxyCanvas');
      const ctx = canvas.getContext('2d', { alpha: false });
      const holeBody = document.getElementById('holeBody');

      let p = 0;
      let isGalaxyOpen = false;
      let stars = [];
      let payloadType = 'text';
      let lastX = 310;
      let lastY = 310;
      let sleepMode = false;
      let rafId = 0;
      let expandTimer = 0;

      function initGalaxy() {
        const dpr = window.devicePixelRatio || 1;
        canvas.width = 800 * dpr;
        canvas.height = 800 * dpr;
        ctx.scale(dpr, dpr);

        const w = 800;
        const h = 800;

        stars = [];
        for (let i = 0; i < 400; i++) {
          const rand = Math.random();
          let type = 'fine'; 
          let size = 0.2 + Math.random() * 0.4;
          let color = '#ffffff';

          if (rand > 0.95) {
            type = 'bright'; 
            size = 0.8 + Math.random() * 0.5;
            const c = Math.random();
            color = c > 0.8 ? '#dbebff' : (c > 0.6 ? '#fff5e6' : '#ffffff');
          } else if (rand > 0.8) {
            type = 'medium';
            size = 0.4 + Math.random() * 0.3;
          }

          stars.push({
            x: Math.random() * w,
            y: Math.random() * h,
            size: size,
            type: type,
            twinkleSpeed: 0.12 + Math.random() * 0.2,
            phase: Math.random() * Math.PI * 2,
            baseAlpha: type === 'fine' ? 0.2 : 0.5,
            color: color
          });
        }
      }

      function render(time) {
        if (sleepMode) {
          rafId = 0;
          return;
        }
        if (!isGalaxyOpen && p < 0.01 && !root.classList.contains('show')) {
          rafId = 0;
          return;
        }

        ctx.fillStyle = '#000000';
        ctx.fillRect(0, 0, 800, 800);

        stars.forEach(s => {
          const t = time * s.twinkleSpeed + s.phase;
          const noise = Math.sin(t) * Math.cos(t * 0.7);
          let alpha = s.baseAlpha + noise * 0.35;
          
          ctx.globalAlpha = Math.max(0.1, Math.min(1, alpha));
          
          if (s.type === 'bright') {
            const cx = s.x, cy = s.y;
            ctx.strokeStyle = s.color;
            ctx.lineWidth = 0.5;
            const spikeLen = s.size * 5 * alpha;
            ctx.beginPath();
            ctx.moveTo(cx - spikeLen, cy); ctx.lineTo(cx + spikeLen, cy);
            ctx.moveTo(cx, cy - spikeLen); ctx.lineTo(cx, cy + spikeLen);
            ctx.stroke();

            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(cx, cy, s.size, 0, Math.PI * 2);
            ctx.fill();
          } else {
            ctx.fillStyle = s.color;
            ctx.beginPath();
            ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
            ctx.fill();
          }
        });

        rafId = requestAnimationFrame(render);
      }
      function wakeRender() {
        if (!rafId) rafId = requestAnimationFrame(render);
      }

      function setP(v) {
        p = Math.max(0, Math.min(1, Number(v) || 0));
        root.style.setProperty('--p', String(p));
        const previewScale = Math.max(0, (p - 0.25) / 0.75) * 0.75;
        const previewCanvasAlpha = Math.max(0, (p - 0.42) / 0.58) * 0.55;
        // Make morph start much earlier for global drag scenarios.
        const t = Math.max(0, Math.min(1, (p - 0.08) / 0.55));
        const ringW = 150 + t * 300; // up to 450
        const ringH = 50 + t * 400;  // up to 450 (full circle)
        root.style.setProperty('--preview-scale', previewScale.toFixed(3));
        root.style.setProperty('--preview-canvas-alpha', previewCanvasAlpha.toFixed(3));
        root.style.setProperty('--ring-w', ringW.toFixed(1) + 'px');
        root.style.setProperty('--ring-h', ringH.toFixed(1) + 'px');
      }

      window.HoleOverlay = {
        show: () => { if(!isGalaxyOpen) { root.classList.add('show'); setP(0.1); } },
        hide: () => { 
          if (expandTimer) {
            clearTimeout(expandTimer);
            expandTimer = 0;
          }
          root.classList.remove('show', 'drop', 'expanding', 'expanded'); 
          isGalaxyOpen = false; setP(0); 
        },
        moveTo: (o) => {
          if(isGalaxyOpen) return;
          if (!o) return;
          const x = Math.max(225, Math.min(395, Number(o.x) || 310));
          const y = Math.max(225, Math.min(395, Number(o.y) || 310));
          lastX = x;
          lastY = y;
          root.style.setProperty('--hx', x + 'px');
          root.style.setProperty('--hy', y + 'px');
        },
        update: (o) => {
          window.HoleOverlay.setSleepMode(false);
          if(isGalaxyOpen) return;
          root.classList.add('show');
          if (o && typeof o.proximity === 'number') {
            setP(o.proximity);
          } else if (o && typeof o.x === 'number' && typeof o.y === 'number') {
            const dx = o.x - lastX;
            const dy = o.y - lastY;
            const d = Math.sqrt(dx * dx + dy * dy);
            const r = 140;
            setP(1 - d / r);
          } else {
            setP(0.45);
          }
        },
        drop: (o) => {
          if(isGalaxyOpen) return;
          if (o && (o.payload === 'text' || o.payload === 'file')) payloadType = o.payload;
          window.HoleOverlay.setSleepMode(false);
          root.classList.add('show');
          setP(1);
          isGalaxyOpen = true;
          root.classList.add('drop');
          root.classList.add('expanding');
          root.classList.remove('expanded');
          if (expandTimer) clearTimeout(expandTimer);
          expandTimer = setTimeout(() => {
            root.classList.remove('expanding');
            root.classList.add('expanded');
            expandTimer = 0;
          }, 1250);
        },
        setProximity: (v) => {
          setP(v);
          if (!sleepMode && (p >= 0.01 || root.classList.contains('show'))) wakeRender();
        },
        setSleepMode: (v) => {
          sleepMode = !!v;
          root.classList.toggle('sleep', sleepMode);
          if (!sleepMode) wakeRender();
        },
        setStyle: () => {},
        setTheme: () => {},
        setNativeState: () => {}
      };

      holeBody.addEventListener('click', (e) => {
        if (!isGalaxyOpen) { window.HoleOverlay.drop(); e.stopPropagation(); }
      });

      window.addEventListener('click', () => { if(isGalaxyOpen) window.HoleOverlay.hide(); });

      initGalaxy();
      wakeRender();

      if (!(window.chrome && window.chrome.webview)) {
        document.body.style.background = "#050508";
        setTimeout(() => window.HoleOverlay.show(), 500);
      }
    })();
  </script>
</body>
</html>
