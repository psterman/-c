      .replace(/\*([^*]+)\*/g, '<em>$1</em>')

  function md(src) {
    src = String(src || '').replace(/\r\n/g, '\n');
    var out = [],
      rx = /```(\w+)?\n([\s\S]*?)```/g,
      last = 0,
      m;
    while ((m = rx.exec(src))) {
      if (m.index > last) out.push({ t: 'text', c: src.slice(last, m.index) });
      out.push({ t: 'code', l: (m[1] || '').toLowerCase(), c: m[2] });
      last = rx.lastIndex;
    }
    if (last < src.length) out.push({ t: 'text', c: src.slice(last) });
    return out
      .map(function (b) {
        if (b.t === 'code') {
          var hi = b.l === 'ahk' || b.l === 'autohotkey' || b.l === 'autohotkeyv2' ? ahk(b.c) : esc(b.c);
          return '<pre><code>' + hi + '</code></pre>';
        }
        return b.c
          .split(/\n{2,}/)
          .map(function (chunk) {
            var t = chunk.trim();
            if (!t) return '';
            if (/^\s*>\s?/.test(t)) return '<blockquote>' + inline(t.replace(/^\s*>\s?/gm, '').replace(/\n/g, '<br>')) + '</blockquote>';
            if (/^\s*[-*]\s+/m.test(t)) {
              var items = t
                .split('\n')
                .map(function (line) {
                  return line.replace(/^\s*[-*]\s+/, '').trim();
                })
                .filter(Boolean);
              return '<ul>' + items.map(function (i) { return '<li>' + inline(i) + '</li>'; }).join('') + '</ul>';
            }
            if (/^#{1,3}\s+/.test(t)) {
              var lv = t.match(/^#+/)[0].length,
                cl = t.replace(/^#{1,3}\s+/, '');
              return '<h' + lv + '>' + inline(cl) + '</h' + lv + '>';
            }
            return '<p>' + inline(t.replace(/\n/g, '<br>')) + '</p>';
          })
          .join('');
      })
      .join('');
  }

  function collectModelIdsDeep(v, out) {
    if (!v) return;
    if (Array.isArray(v)) {
      v.forEach(function (it) {
        collectModelIdsDeep(it, out);
      });
      return;
    }
    if (typeof v === 'string') {
      var s = v.trim();
      if (s) out.push(s);
      return;
    }
    if (typeof v !== 'object') return;
    var cand = [v.id, v.model, v.name, v.model_id, v.modelId];
    cand.forEach(function (x) {
      if (typeof x === 'string' && x.trim()) out.push(x.trim());
    });
    if (v.data) collectModelIdsDeep(v.data, out);
    if (v.models) collectModelIdsDeep(v.models, out);
    if (v.result) collectModelIdsDeep(v.result, out);
    if (v.items) collectModelIdsDeep(v.items, out);
  }

  async function fetchDynamicModels(pid) {
    pid = normalizeProviderId(pid);
    if (!(pid && P[pid])) return [];
    var prov = P[pid];
    if (prov.transport !== 'openai') return [];
    var url = modelListUrl(baseUrl.value || prov.baseUrl);
    if (!url) return [];
    var headers = { 'Content-Type': 'application/json' };
    var key = getApiKeyForProvider(pid);
    if (key) headers.Authorization = 'Bearer ' + key;
    var resp = await fetch(url, { method: 'GET', headers: headers });
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    var body = await resp.json().catch(function () { return {}; });
    var ids = [];
    collectModelIdsDeep(body, ids);
    return uniqStrings(ids).slice(0, 200);
  }

  async function ensureDynamicModelsForActiveProvider(force) {

    if (!(pid && P[pid])) return;

    var ttlMs = 5 * 60 * 1000;
    if (!force) {
      var at = (state.dynamicModelsFetchedAt && state.dynamicModelsFetchedAt[pid]) || 0;
      if (at && now - at < ttlMs) return;
    }
    try {
      var list = await fetchDynamicModels(pid);
      if (!state.dynamicModels) state.dynamicModels = {};
      if (!state.dynamicModelsFetchedAt) state.dynamicModelsFetchedAt = {};
      if (list && list.length) state.dynamicModels[pid] = list;
      state.dynamicModelsFetchedAt[pid] = now;
      if (normalizeProviderId(provider.value) === pid) {
        fillModels(pid, model.value.trim());
      }
    } catch (e) {
      if (!state.dynamicModelsFetchedAt) state.dynamicModelsFetchedAt = {};
      state.dynamicModelsFetchedAt[pid] = now;
    }
  }

  function openClawEndpointFromCfg(cfg) {
    var raw = (cfg.baseUrl || '').trim();
    var token = (cfg.apiKey || '').trim();
    var host = '127.0.0.1';
    var port = 18789;
    try {
      var u = new URL(raw.indexOf('://') >= 0 ? raw : 'http://' + raw);
      host = u.hostname || host;
      if (u.port) port = parseInt(u.port, 10) || port;
      if (u.hash && u.hash.indexOf('token=') >= 0) {
        var sp = new URLSearchParams(u.hash.replace(/^#/, '?'));
        var ht = (sp.get('token') || '').trim();
        if (ht) token = ht;
      }
    } catch (e) {}
    if (!token || !host) return { ok: false };
    return { ok: true, host: host, port: port, token: token };
  }

  function openClawSessionKeyHintFromBaseUrl(rawBaseUrl) {
    var raw = String(rawBaseUrl || '').trim();
    if (!raw) return '';
    try {
      var u = new URL(raw.indexOf('://') >= 0 ? raw : 'http://' + raw);
      var qs = new URLSearchParams(u.search || '');
      var qk = String(qs.get('sessionKey') || qs.get('session') || qs.get('key') || '').trim();
      if (qk) return qk;
      if (u.hash) {
        var hs = new URLSearchParams(u.hash.replace(/^#/, '?'));
        var hk = String(hs.get('sessionKey') || hs.get('session') || hs.get('key') || '').trim();
        if (hk) return hk;
      }
    } catch (e) {}
    return '';
  }

  function ocSessionRowsFromAny(v) {
    if (!v) return [];

  function hostBridgeAvailable() {
    return !!(window.chrome && window.chrome.webview && window.chrome.webview.postMessage);

  function hostBridgeRequest(type, payload, timeoutMs) {
    return new Promise(function (resolve, reject) {
      if (!hostBridgeAvailable()) {
        reject(new Error('host bridge unavailable'));
        return;
      }
      var reqId = 'req_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 8);
      var done = false;
      var timer = setTimeout(function () {
        if (done) return;
        done = true;
        try { window.chrome.webview.removeEventListener('message', onMsg); } catch (_) {}
        reject(new Error('host bridge timeout'));
      }, Math.max(1000, Number(timeoutMs || 15000)));
      function finishOk(data) {
        if (done) return;
        done = true;
        clearTimeout(timer);
        try { window.chrome.webview.removeEventListener('message', onMsg); } catch (_) {}
        resolve(data);
      }
      function finishErr(err) {
        if (done) return;
        done = true;
        clearTimeout(timer);
        try { window.chrome.webview.removeEventListener('message', onMsg); } catch (_) {}
        reject(err instanceof Error ? err : new Error(String(err || 'host bridge error')));
      }
      function onMsg(ev) {
        var d = ev && ev.data;
        if (typeof d === 'string') {
          try { d = JSON.parse(d); } catch (_) {}
        }
        if (!d || typeof d !== 'object') return;
        if (String(d.reqId || '') !== reqId) return;
        if (String(d.type || '') === 'niuma_upload_result') {
          if (d.ok && d.file) finishOk(d.file);
          else finishErr(new Error(String(d.error || 'upload failed')));
          return;
        }
        if (String(d.type || '') === 'niuma_attach_context_result') {
          if (d.ok) finishOk(Array.isArray(d.files) ? d.files : []);
          else finishErr(new Error(String(d.error || 'context failed')));
        }
      }
      try { window.chrome.webview.addEventListener('message', onMsg); } catch (e) { finishErr(e); return; }
      try {
        window.chrome.webview.postMessage(JSON.stringify({
          type: type,
          reqId: reqId,
          payload: payload || {}
        }));
      } catch (e) {
        finishErr(e);
      }
    });
  }

  function ocExtractText(v) {
    if (v == null) return '';
    if (typeof v === 'object') {
      var cand = v.text || v.content || v.message || v.body || v.value;
      if (typeof cand === 'string') return cand.trim();
      if (typeof cand === 'number' || typeof cand === 'boolean') return String(cand);
      return ''; // 绂佹瀵?object/array 寮哄埗 String()锛岄槻姝㈠嚭鐜?[object Object]
    }
    var s = String(v).trim();
    if (!s) return '';
    try {
      if ((s[0] === '{' && s[s.length - 1] === '}') || (s[0] === '[' && s[s.length - 1] === ']')) {
        var o = JSON.parse(s);
        if (o && typeof o === 'object') {
          var inner = o.text || o.content || o.message;
          if (typeof inner === 'string') return inner.trim();
        }
      }
    } catch (e) {}
    return s;
  }

  function ocCollectTextDeep(v, out) {
    if (v == null) return;
    if (typeof v === 'string') {
      var t = v.trim();
      if (!t) return;
      // If the string looks like JSON, parse and recurse; don't also push the raw string
      // to avoid duplicate content when gateway embeds JSON in string fields.
      if ((t[0] === '{' && t[t.length - 1] === '}') || (t[0] === '[' && t[t.length - 1] === ']')) {
        try {
          var obj = JSON.parse(t);
          ocCollectTextDeep(obj, out);
          return; // parsed successfully 鈥?don't also push raw JSON string
        } catch (_) {}
      }
      out.push(t);
      return;
    }
    if (Array.isArray(v)) {
      for (var i = 0; i < v.length; i++) ocCollectTextDeep(v[i], out);
      return;
    }
    if (typeof v === 'object') {
      if (v.functionCall && v.functionCall.name) out.push('[璋冪敤宸ュ叿: ' + v.functionCall.name + ']');
      if (v.function && v.function.name) out.push('[璋冪敤宸ュ叿: ' + v.function.name + ']');
      if ((v.type === 'tool_call' || v.type === 'function_call') && v.name) out.push('[璋冪敤宸ュ叿: ' + v.name + ']');

      if (typeof v.text === 'string' && v.text.trim()) out.push(v.text.trim());
      if (typeof v.message === 'string' && v.message.trim()) out.push(v.message.trim());
      if (typeof v.content === 'string' && v.content.trim()) out.push(v.content.trim());
      if (typeof v.body === 'string' && v.body.trim()) out.push(v.body.trim());
      if (typeof v.value === 'string' && v.value.trim()) out.push(v.value.trim());
      if (typeof v.result === 'string' && v.result.trim()) out.push(v.result.trim());
      if (typeof v.item === 'string' && v.item.trim()) out.push(v.item.trim());
      if (typeof v.entry === 'string' && v.entry.trim()) out.push(v.entry.trim());
      if (typeof v.payload === 'string' && v.payload.trim()) out.push(v.payload.trim());
      if (v.content && typeof v.content !== 'string') ocCollectTextDeep(v.content, out);
      if (v.delta) ocCollectTextDeep(v.delta, out);
      if (v.output) ocCollectTextDeep(v.output, out);
      if (v.outputText) ocCollectTextDeep(v.outputText, out);
      if (v.response) ocCollectTextDeep(v.response, out);
      if (v.result && typeof v.result !== 'string') ocCollectTextDeep(v.result, out);
      if (v.data) ocCollectTextDeep(v.data, out);
      if (v.payload && typeof v.payload !== 'string') ocCollectTextDeep(v.payload, out);
      if (v.item && typeof v.item !== 'string') ocCollectTextDeep(v.item, out);
      if (v.entry && typeof v.entry !== 'string') ocCollectTextDeep(v.entry, out);
      if (v.message && typeof v.message !== 'string') ocCollectTextDeep(v.message, out);
      if (v.parts) ocCollectTextDeep(v.parts, out);
      if (v.tool_calls) ocCollectTextDeep(v.tool_calls, out);
      if (v.output_text) ocCollectTextDeep(v.output_text, out);
      if (v.answer) ocCollectTextDeep(v.answer, out);
      if (v.assistant) ocCollectTextDeep(v.assistant, out);
      if (v.assistantText) ocCollectTextDeep(v.assistantText, out);
      if (v.assistant_text) ocCollectTextDeep(v.assistant_text, out);
      if (v.assistantMessage) ocCollectTextDeep(v.assistantMessage, out);
      if (v.assistant_message) ocCollectTextDeep(v.assistant_message, out);
      if (v.finalText) ocCollectTextDeep(v.finalText, out);
      if (v.final_text) ocCollectTextDeep(v.final_text, out);
      if (v.final) ocCollectTextDeep(v.final, out);
      if (Array.isArray(v.choices)) {
        for (var c = 0; c < v.choices.length; c++) {
          var ch = v.choices[c];
          if (ch && typeof ch === 'object') {
            ocCollectTextDeep(ch.message || ch.delta || ch, out);
          }
        }
      }
    }
  }

  /** OpenClaw broadcast("chat", payload)锛氭鏂囧湪 message.content[].text锛岃€岄潪鏃х増 response.text */
  function ocExtractChatEventPayload(pl) {
    if (!pl || typeof pl !== 'object') return '';
    if (pl.state === 'error') return '';
    var msg =
      pl.message ||
      pl.assistant ||
      pl.assistantMessage ||
      pl.data ||
      pl.response ||
      pl.result ||
      pl.output ||
      pl.delta ||
      pl.payload;
    if (msg == null) msg = pl;
    if (typeof msg === 'string') return String(msg).trim();
    var acc = [];
    ocCollectTextDeep(msg, acc);
    if (acc.length) return acc.join('\n').trim();
    acc = [];
    ocCollectTextDeep(pl, acc);
    if (acc.length) return acc.join('\n').trim();
    return ocExtractText(msg) || ocExtractText(pl);
  }

  /**
   * 涓?openclaw2 鎺у埗鍙颁竴鑷达細椤跺眰甯镐负 type:event + payload.event===chat锛?
   * 鑰岄潪 msg.event===chat锛堝惁鍒?NiuMa 姘歌繙绛変笉鍒?final锛?5s 瓒呮椂锛夈€?
   */
  function ocGetChatBroadcastPayload(msg) {
    if (!msg || typeof msg !== 'object') return null;
    var e = String(msg.event || msg.type || msg.method || '').toLowerCase();
    var isEventEnvelope =
      e === 'event' ||
      e === 'chat' ||
      e === 'chat.stream' ||
      e === 'chat.delta' ||
      e === 'chat.event' ||
      e === 'broadcast';
    if (!isEventEnvelope) return null;
    var w = msg.payload || msg.params;
    if (!w || typeof w !== 'object') return null;
    var inner = String(w.event || w.type || '').toLowerCase();
    if (inner !== 'chat' && inner !== 'chat.stream' && inner !== 'chat.delta' && inner !== 'chat.event' && inner !== 'chat.result') return null;
    if (w.payload != null && typeof w.payload === 'object') return w.payload;
    return w;
  }

  function ocGetChatSideResultPayload(msg) {
    if (!msg || typeof msg !== 'object') return null;
    if (msg.payload != null && typeof msg.payload === 'object' && msg.event === 'chat.side_result') return msg.payload;
    var t = msg.type,
      e = msg.event;
    var isEventEnvelope =
      t === 'event' ||
      t === 'push' ||
      t === 'notification' ||
      t === 'broadcast' ||
      e === 'event' ||
      e === 'push' ||
      e === 'notification' ||
      e === 'broadcast';
    if (!isEventEnvelope) return null;
    var w = msg.payload || msg.params;
    if (!w || typeof w !== 'object') return null;
    var inner = String(w.event || w.type || '').toLowerCase();
    if (inner !== 'chat.side_result') return null;
    if (w.payload != null && typeof w.payload === 'object') return w.payload;
    return w;
  }

  function ocIsChatFinalState(pl) {
    if (!pl || typeof pl !== 'object') return false;
    var s = pl.state;
    if (s === 'final' || s === 'done' || s === 'completed' || s === 'finished') return true;
    if (pl.done === true || pl.finished === true) return true;
    return false;
  }

  function ocPayloadMatchesRequest(v, expectedRequestId) {
    if (!v || !expectedRequestId) return true;
    if (v.id === expectedRequestId || v.requestId === expectedRequestId || v.runId === expectedRequestId || v.correlationId === expectedRequestId) return true;
    return true; // Keep true for now to avoid false negatives, but prioritization logic may use the checks above.
  }

  function extractGatewayHistoryMessages(res) {
    if (!res) return [];
    if (Array.isArray(res)) return res;
    if (Array.isArray(res.messages)) return res.messages;
    if (Array.isArray(res.history)) return res.history;
    if (Array.isArray(res.data)) return res.data;
    if (Array.isArray(res.items)) return res.items;
    if (res.result && typeof res.result === 'object') return extractGatewayHistoryMessages(res.result);
    if (res.data && typeof res.data === 'object') return extractGatewayHistoryMessages(res.data);
    if (res.payload && typeof res.payload === 'object') return extractGatewayHistoryMessages(res.payload);
    return [];
  }

  function mapGatewayHistoryItem(m) {
    if (!m || typeof m !== 'object') return null;
    var role = ocRoleFromHistoryItem(m);
    if (!role) return null;
    var content = ocExtractMessageContentForHistory(m);
    if (!content) return null;
    return { role: role, content: content, ts: ensureIsoTime(m.ts || m.timestamp || m.createdAt || m.updatedAt) };
  }

  function ocNormForMatch(s) {
    return String(s == null ? '' : s)
      .replace(/\s+/g, ' ')
      .trim()
      .toLowerCase();
  }

  function ocIsIgnorableGatewayText(s) {
    var n = ocNormForMatch(s)
      .replace(/[\-_]+/g, ' ')
      .replace(/\s+/g, ' ')
      .trim();
    if (!n) return true;
    return (
      n === 'heartbeat' ||
      n === 'heartbeat ok' ||
      n === 'ping' ||
      n === 'pong' ||
      n === 'keepalive' ||
      n === 'keep alive' ||
      n === 'healthcheck' ||
      n === 'health check'
    );
  }

  function ocLooksLikeSentTextMatch(a, b) {
    var an = ocNormForMatch(a);
    var bn = ocNormForMatch(b);
    if (!an || !bn) return false;
    return an === bn || an.indexOf(bn) >= 0 || bn.indexOf(an) >= 0;
  }

  function ocPickAssistantFromHistory(rawMessages, sentText, sentAtMs) {
    var arr = Array.isArray(rawMessages) ? rawMessages : [];
    if (!arr.length) return '';
    var rows = [];
    for (var i = 0; i < arr.length; i++) {
      var m = arr[i];
      if (!m || typeof m !== 'object') continue;
      var content = ocExtractMessageContentForHistory(m);
      if (ocIsIgnorableGatewayText(content)) continue;
      var role = ocRoleFromHistoryItem(m);
      if (!role || !content) continue;
      var tsRaw = m.ts || m.timestamp || m.createdAt || m.created_at || m.created || m.time || m.updatedAt;
      var tsMs = 0;
      if (typeof tsRaw === 'number') {
        tsMs = tsRaw < 1e11 ? tsRaw * 1000 : tsRaw;
      } else if (typeof tsRaw === 'string' && tsRaw.trim()) {
        tsRaw = tsRaw.trim();
        if (/^[0-9]+$/.test(tsRaw)) {
          var num = parseInt(tsRaw, 10);
          tsMs = num < 1e11 ? num * 1000 : num;
        } else {
          tsMs = Date.parse(tsRaw);
        }
      }
      rows.push({ role: role, content: content, tsMs: isNaN(tsMs) ? 0 : tsMs, origIdx: i });
    }
    if (!rows.length) return '';

    // 寮鸿鎶婂垪琛ㄦ媺鎴愭椂闂存搴?(鏃?-> 鏂?
    rows.sort(function(a, b) {
      if (a.tsMs !== b.tsMs && a.tsMs > 0 && b.tsMs > 0) return a.tsMs - b.tsMs;
      // 濡傛灉娌℃湁鍙瘮鏃堕棿鎴筹紝鍋囧畾 OpenClaw 杩斿洖鐨勬槸甯歌椤哄簭锛岃繖閲屽仛涓畝鍗曞厹搴曞嵆鍙?
      return a.origIdx - b.origIdx;
    });

    var sentNorm = ocNormForMatch(sentText);
    var sentMs = Number(sentAtMs) || 0;
    if (!sentNorm) return '';
    
    // 鎵句笌 sentText 鍖归厤鐨勬渶鏂扮殑 user 娑堟伅锛屽彇鍏剁揣闅忓叾鍚庣殑 assistant 鍥炲
    for (var u = rows.length - 1; u >= 0; u--) {
      if (rows[u].role !== 'user') continue;
      // Prefer users at/after this send time to avoid matching an old identical prompt.
      if (sentMs > 0 && rows[u].tsMs > 0 && rows[u].tsMs + 1200 < sentMs) continue;
      var un = ocNormForMatch(rows[u].content);
      if (!un) continue;
      if (ocLooksLikeSentTextMatch(un, sentNorm)) {
        // 鎵惧埌浜?user锛屽悜鍚庡鎵剧敱浜庣敓鎴愬欢杩熷彲鑳藉垰鍒氬嚭鐜扮殑绗竴鏉?assistant 鍥炲
        for (var a = u + 1; a < rows.length; a++) {
          if (rows[a].role === 'assistant') {
            if (sentMs > 0 && rows[a].tsMs > 0 && rows[a].tsMs + 1200 < sentMs) continue;
            if (!ocIsIgnorableGatewayText(rows[a].content)) {
              return rows[a].content;
            }
          }
        }
        // user 宸插嚭鐜颁絾 assistant 鏈嚭鐜帮細缁х画绛夊緟杞
        return '';
      }
    }
    
    return '';
  }

  function ocPickReadableTextDeep(v, sentText) {
    if (!v || typeof v !== 'object') return '';
    var acc = [];
    ocCollectTextDeep(v, acc);
    if (!acc.length) return '';
    var sentNorm = ocNormForMatch(sentText);
    for (var i = acc.length - 1; i >= 0; i--) {
      var t = String(acc[i] || '').trim();
      if (!t) continue;
      var n = ocNormForMatch(t);
      if (!n) continue;
      if (sentNorm && (n === sentNorm || n.indexOf(sentNorm) >= 0 || sentNorm.indexOf(n) >= 0)) continue;
      if (n.length <= 1) continue;
      return t;
    }
    return '';
  }

  function openClawRpc(cfg, method, params, timeoutMs) {
    var ep = openClawEndpointFromCfg(cfg);
    if (!ep.ok) return Promise.reject(new Error('Gateway token missing'));
    var wsUrl = 'ws://' + ep.host + ':' + ep.port + '/?token=' + encodeURIComponent(ep.token);
    var to = Math.max(3000, Number(timeoutMs) || 15000);
    return new Promise(function (resolve, reject) {
      var ws;
      try {
        ws = new WebSocket(wsUrl);
      } catch (e) {
        reject(e);
        return;
      }
      var done = false,
        seq = 0,
        connected = false,
        connectSent = false,
        connectAttempts = 0,
        rpcId = '';
      var timer = setTimeout(function () {
        finishErr(new Error('OpenClaw RPC timeout: ' + method + ' (Waited ' + to + 'ms)'));
      }, to);

      function finishOk(val) {
        if (done) return;
        done = true;
        clearTimeout(timer);
        try {
          ws.close();
        } catch (e) {}
        resolve(val);
      }
      function finishErr(err) {
        if (done) return;
        done = true;
        clearTimeout(timer);
        try {
          ws.close();
        } catch (e) {}
        reject(err);
      }
      function sendConnect() {
        if (connectSent || connected || done) return;
        connectSent = true;
        connectAttempts += 1;
        seq += 1;
        var cid = 'connect-' + seq;
        dbg('WS鈫?, 'connect ' + cid, 'ok');
        ws.send(
          JSON.stringify({
            type: 'req',
            id: cid,
            method: 'connect',
            params: {
              minProtocol: 3,
              maxProtocol: 3,
              client: { id: 'openclaw-control-ui', version: 'niuma', platform: 'web', mode: 'webchat', instanceId: 'niuma-rpc-' + Date.now() },
              role: 'operator',
              scopes: ['operator.admin', 'operator.approvals', 'operator.pairing', 'operator.read', 'operator.write'],
              caps: [],
              auth: { token: ep.token }
            }
          })
        );
      }
      function sendRpc() {
        if (!connected || rpcId) return;
        seq += 1;
        rpcId = 'rpc-' + seq;
        dbg('WS鈫?, method + ' ' + rpcId, 'ok');
        ws.send(JSON.stringify({ type: 'req', id: rpcId, method: method, params: params || {} }));
      }
      ws.onopen = function () {
        dbg('WS', 'open rpc=' + method, 'ok');
        sendConnect();
      };
      ws.onerror = function () {
        dbg('WS', 'error rpc=' + method, 'err');
        finishErr(new Error('OpenClaw websocket error'));
      };
      ws.onclose = function () {
        dbg('WS', 'close rpc=' + method, connected ? 'ok' : 'err');
        if (!done) finishErr(new Error('OpenClaw websocket closed'));
      };
      ws.onmessage = function (e) {
        var msg = null;
        try {
          msg = JSON.parse(e.data);
        } catch (ex) {
          return;
        }
        if (msg && msg.type !== 'heartbeat' && msg.event !== 'heartbeat') dbg('WS鈫?, wsFrameBrief(msg), msg.error ? 'err' : 'ok');
        var ev = msg.event || msg.type || msg.method || '';
        if (ev === 'connect.challenge') {
          if (connected || rpcId) {
            dbg('WS', 'ignore late connect.challenge', 'err');
            return;
          }
          connectSent = false;
          dbg('WS', 'challenge -> reconnect', 'ok');
          sendConnect();
          return;
        }
        if (typeof msg.id === 'string' && msg.id.indexOf('connect-') === 0) {
          if (msg.error || msg.ok === false) {
            var em = String((msg.error && msg.error.message) || 'connect failed');
            if (connected && /connect is only valid as the first request/i.test(em)) {
              dbg('WS', 'ignore duplicate connect error', 'err');
              return;
            }
            finishErr(new Error(em));
            return;
          }
          connected = true;
          dbg('WS', 'connect ok attempts=' + connectAttempts, 'ok');
          sendRpc();
          return;
        }
        if (!connected && ev === 'hello-ok') {
          connected = true;
          sendRpc();
          return;
        }
        if (rpcId && msg.id === rpcId) {
          if (msg.error || msg.ok === false) {
            finishErr(new Error((msg.error && msg.error.message) || 'rpc failed'));

          var chatReqOk = ocPayloadMatchesRequest(msg, chatMsgId) || ocPayloadMatchesRequest(plChat, chatMsgId);
          if (!chatSessionOk || !chatReqOk) return;
          var pl = plChat;
          if (pl.state === 'error') {
            fail(new Error(String(pl.errorMessage || 'OpenClaw 瀵硅瘽鍑洪敊')));
            return;
          }
          var chatTxt = ocExtractChatEventPayload(pl);
          if (chatTxt) {
            /* delta锛氬彲鑳芥槸澧為噺鐗囨锛堥渶鎷兼帴锛夋垨姣忓抚鍏ㄩ噺蹇収锛堥渶鏁存鏇挎崲锛?*/
            if (pl.state === 'delta') {
              if (pendingText && chatTxt.length >= pendingText.length && chatTxt.indexOf(pendingText) === 0)
                pendingText = chatTxt;
              else pendingText += chatTxt;
            } else pendingText = chatTxt;
            emitProgress(false);
          }
          if (ocIsChatFinalState(pl)) {
            if (!pendingText.trim()) {
              var fallback = ocExtractText(
                pl.errorMessage || pl.stopReason || pl.reason || pl.status || pl.message || ''
              );
              if (fallback) pendingText = fallback;
            }
            if (!pendingText.trim()) {
              recoverFinalFromHistory(false, pl);
              return;
            }
            okDone();
            return;
          }
          if (pl.state === 'delta' && chatTxt) armFinalize();
          /* 閮ㄥ垎 Gateway 鍙帹 text/content锛屾棤 state */
          if (pl.state == null && chatTxt) armFinalize();
          return;
        }

        var sidePl = ocGetChatSideResultPayload(msg);
        if (sidePl) {
          var sideSessionOk = ocPayloadMatchesSession(msg, sessionKey) || ocPayloadMatchesSession(sidePl, sessionKey);
          var sideReqOk = ocPayloadMatchesRequest(msg, chatMsgId) || ocPayloadMatchesRequest(sidePl, chatMsgId);
          if (!sideSessionOk || !sideReqOk) return;
          var side = sidePl;
          var st = ocExtractText(side.text || side.message || side.content || '');
          if (!st && side.btw && typeof side.btw.question === 'string') st = side.btw.question.trim();
          if (st) {
            pendingText = st;
            emitProgress(false);
            armFinalize();
          }
          return;
        }

        var respPayload = msg.payload || (msg.result !== undefined && typeof msg.result === 'object' ? msg.result : null);
        /* 涓?openclaw2锛氭祦寮忓抚甯稿甫 msg.result 鑰岄潪 ev===response锛屼笖鍙兘鏃?id */
        var isResp =
          ev === 'response' ||
          ev === 'chat.response' ||
          (msg.result !== undefined && typeof msg.result === 'object' && respPayload) ||
          (msg.id === chatMsgId && respPayload);

        if (isResp && respPayload) {
          var respSessionOk = ocPayloadMatchesSession(msg, sessionKey) || ocPayloadMatchesSession(respPayload, sessionKey);
          var respReqOk = ocPayloadMatchesRequest(msg, chatMsgId) || ocPayloadMatchesRequest(respPayload, chatMsgId);
          if (!respSessionOk || !respReqOk) return;
          var piece =
            ocExtractText(respPayload.text || respPayload.content || respPayload.message || '') ||
            ocExtractChatEventPayload(respPayload);
          if (piece) {
            pendingText += piece;
            emitProgress(false);
          }
          if (respPayload.done || respPayload.finish_reason || respPayload.finished) {
            okDone();
            return;
          }
          if (piece) armFinalize();
          return;
        }

        if (ev === 'error' || msg.error) {
          var emsg = ocExtractText((msg.payload && msg.payload.message) || (msg.error && msg.error.message) || msg.error);
          fail(new Error(emsg || '鏈嶅姟绔敊璇?));
          return;
        }

        var rest = msg.payload || msg.params || {};
        var rt =
          ocExtractText(rest.text || rest.content || rest.message || '') || ocExtractChatEventPayload(rest);
        var likelyChatEnvelope =
          evLower === 'chat' ||
          evLower === 'chat.response' ||
          evLower === 'response' ||
          evLower === 'session.message' ||
          (rest && typeof rest === 'object' && (String(rest.event || rest.type || '').toLowerCase().indexOf('chat') === 0));
        if (likelyChatEnvelope && rt && (msg.id === chatMsgId || msg.id == null || msg.id === '')) {
          var restSessionOk = ocPayloadMatchesSession(msg, sessionKey) || ocPayloadMatchesSession(rest, sessionKey);
          var restReqOk = ocPayloadMatchesRequest(msg, chatMsgId) || ocPayloadMatchesRequest(rest, chatMsgId);
          if (!restSessionOk || !restReqOk) return;
          pendingText += rt;
          emitProgress(false);
          armFinalize();
        }

        /* 鍏滃簳锛氫俊灏佹湭鏍?chat 浣?payload 宸叉槸娴佸紡缁撴瀯锛堜粎鍦ㄦ湰杩炴帴宸插彂 chat.send 鍚庯級 */
        if (chatMsgId) {
          var silentEv = { health: 1, tick: 1, ping: 1, pong: 1, heartbeat: 1, typing: 1 };
          if (!silentEv[ev]) {
            var guess = msg.payload || msg.params;
            if (
              guess &&
              typeof guess === 'object' &&
              (guess.state === 'delta' ||
                guess.state === 'final' ||
                guess.state === 'done' ||
                guess.state === 'completed' ||
                guess.state === 'error')
            ) {
              var guessSessionOk = ocPayloadMatchesSession(msg, sessionKey) || ocPayloadMatchesSession(guess, sessionKey);
              var guessReqOk = ocPayloadMatchesRequest(msg, chatMsgId) || ocPayloadMatchesRequest(guess, chatMsgId);
              if (!guessSessionOk || !guessReqOk) return;
              if (guess.state === 'error') {
                fail(new Error(String(guess.errorMessage || 'OpenClaw 瀵硅瘽鍑洪敊')));
                return;
              }
              var gt = ocExtractChatEventPayload(guess);
              if (gt) {
                if (guess.state === 'delta') {
                  if (pendingText && gt.length >= pendingText.length && gt.indexOf(pendingText) === 0) pendingText = gt;
                  else pendingText += gt;
                } else pendingText = gt;
                emitProgress(false);
                if (ocIsChatFinalState(guess)) okDone();
                else armFinalize();
                return;

            }

        }
      }

      ws.onmessage = function (e) {
        var msg;
        try {
          msg = JSON.parse(e.data);
          if (_dbgFrames && _dbgFrames.length < 100 && msg && typeof msg === 'object' && msg.event !== 'heartbeat' && msg.type !== 'heartbeat') {

  }

    var streamDraftId = '';

  async function ingestAttachments(files) {
    if (!files || !files.length) return;
    var pa = state.pendingAttach || { items: [], fileIds: [], files: [] };
    pa.items = Array.isArray(pa.items) ? pa.items : [];
    pa.fileIds = Array.isArray(pa.fileIds) ? pa.fileIds : [];
    pa.files = Array.isArray(pa.files) ? pa.files : [];
    var okCount = 0;
    for (var i = 0; i < files.length; i++) {
      var f = files[i];
      if (!f) continue;
      var displayName = (f.webkitRelativePath && String(f.webkitRelativePath).trim()) || f.name || 'file';
      var pendingId = 'pending_' + Date.now().toString(36) + '_' + i;
      pa.items.push({
        id: pendingId,
        name: f.name || displayName,
        relativePath: displayName,
        size: Number(f.size || 0),
        pending: true
      });
      refreshAttachUi();
      try {
        var uploaded = await uploadOneAttachment(f, displayName);
        for (var j = pa.items.length - 1; j >= 0; j--) {
          if (pa.items[j] && pa.items[j].id === pendingId) {
            pa.items[j] = {
              id: uploaded.id,
              name: uploaded.name || f.name || displayName,
              relativePath: uploaded.relativePath || displayName,
              size: Number(uploaded.size || f.size || 0),
              type: uploaded.type || String(f.type || '')
            };
            break;
          }
        }
        pa.fileIds.push(uploaded.id);
        pa.files.push(uploaded);
        okCount++;
      } catch (e) {
        var em = e && e.message ? String(e.message) : String(e);
        if (/Failed to fetch|NetworkError|connect|Unable to connect|鏃犳硶杩炴帴/i.test(em)) {
          em = 'upload service offline (start serve3000.js)';
        }
        for (var k = pa.items.length - 1; k >= 0; k--) {
          if (pa.items[k] && pa.items[k].id === pendingId) {
            pa.items[k].pending = false;
            pa.items[k].failed = true;
            pa.items[k].error = em;
            break;
          }
        }
        dbg('UPLOAD', displayName + ' -> ' + em, 'err');
        cstat('Upload failed: ' + displayName + ' - ' + em, 'error');
      }
    }
    state.pendingAttach = pa;
    refreshAttachUi();
    if (okCount > 0) cstat('Attachments added: ' + okCount, 'success');
  }

    if (activeDropGroup && activeDropGroup !== group) resetDropScales(activeDropGroup);
    activeDropGroup = group;
    var nodes = Array.prototype.slice.call(group.querySelectorAll('.tb[data-action], .tb[data-cmd-id], .logo-btn[data-logo-toggle]'));
    if (!nodes.length) return;
    var sigma = 34;       // narrower peak like macOS dock
    var maxBoost = 0.40;  // center ~= 1.40
    var minScale = 0.88;  // far icons slightly shrink
    nodes.forEach(function (el) {
      var r = el.getBoundingClientRect();
      var cx = r.left + r.width / 2;
      var dist = Math.abs(clientX - cx);
      var influence = Math.exp(-(dist * dist) / (2 * sigma * sigma));
      var dockScale = minScale + (1 + maxBoost - minScale) * influence;
      el.style.setProperty('--dock-scale', String(dockScale));
    });
  }

  function clearActiveDropBtn() {
    setActiveDropBtn(null);
    if (activeDropGroup) {
      resetDropScales(activeDropGroup);
      activeDropGroup = null;
    }
  }

  async function onDrop(e) {
    e.preventDefault();
    e.stopPropagation();
    var action = findDropActionTarget(e);
    clearActiveDropBtn();
    var droppedFiles = [];
    try {
      droppedFiles = Array.from((e.dataTransfer && e.dataTransfer.files) || [])
        .map(function (f) {
          return String((f && (f.path || f.name)) || '').trim();
        })
        .filter(function (x) { return !!x; });
    } catch (_) {
      droppedFiles = [];
    }
    var t = await readDrop(e.dataTransfer);
    if (!t && droppedFiles.length) t = droppedFiles[0];
    if (!t) {
      holeDragHide();
      forceReleaseInteractionLocks();
      return;
    }
    holeDragDrop(detectPayloadFromDataTransfer(e.dataTransfer) || 'text');
    forceReleaseInteractionLocks();
    setTimeout(function () {
      clearActiveDropBtn();
      holeDragHide();
      forceReleaseInteractionLocks();
    }, 0);
    loading(true);
    post({ type: 'drop_action', action: action, text: t, files: droppedFiles });
  }

  function onDragOver(e) {
    e.preventDefault();
    e.stopPropagation();
    try {
      if (e.dataTransfer) e.dataTransfer.dropEffect = 'copy';
    } catch (e2) {}
    var payload = detectPayloadFromDataTransfer(e.dataTransfer);
    if (payload) {
      holeDragUpdate(payload, e);
    } else {
      holeDragHide();
    }
    var targetBtn = findDropButtonTarget(e);
    setActiveDropBtn(targetBtn);
    if (targetBtn) applyFishEye(targetBtn, e.clientX || 0);
    else if (activeDropGroup) resetDropScales(activeDropGroup);
    var action = findDropActionTarget(e);
    if (String(action || '').toLowerCase() !== 'search') dragOver(false);
  }

  function onDragLeave(e) {
    var rt = e.relatedTarget,
      ok = false;
    if (rt)
      searchEls().forEach(function (s) {
        if (s.contains(rt)) ok = true;
      });
    if (!ok) {
      dragOver(false);
      clearActiveDropBtn();
      holeDragHide();
      forceReleaseInteractionLocks();
    }
  }

  function bindSearchDnD() {
    dockEls().forEach(function (search) {
      search.addEventListener('dragenter', function (e) {
        e.preventDefault();
      });
      search.addEventListener('dragover', onDragOver);
      search.addEventListener('dragleave', onDragLeave);
      search.addEventListener('drop', onDrop);
    });
  }

  rebuildToolbarButtons(state.toolbarActions);
  /* 鍏滃簳锛氫粎褰?set_logo 闀挎椂闂存湭鍥炶皟鏃舵樉绀猴紝閬垮厤姘歌繙绌虹櫧 */
  scheduleToolbarReveal(1200);

  document.body.addEventListener('dragover', function (e) {
    e.preventDefault();
  });
  document.body.addEventListener('dragenter', function () {
    forceReleaseInteractionLocks();
  });

  document.body.addEventListener('drop', function (e) {
    e.preventDefault();
    var onS = false;
    dockEls().forEach(function (s) {
      if (e.target === s || s.contains(e.target)) onS = true;
    });
    if (onS) {
      clearActiveDropBtn();
      holeDragHide();
      forceReleaseInteractionLocks();
      return;
    }
    forceReleaseInteractionLocks();
    onDrop(e);
  });
  document.body.addEventListener('dragleave', function () {
    holeDragHide();
    forceReleaseInteractionLocks();
  });
  document.body.addEventListener('dragend', function () {
    holeDragHide();
    forceReleaseInteractionLocks();
  });
  window.addEventListener('blur', function () {
    holeDragHide();
    clearActiveDropBtn();
    forceReleaseInteractionLocks();
  });
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) {
      holeDragHide();
      clearActiveDropBtn();
      forceReleaseInteractionLocks();
    }
  });

  if (window.chrome && window.chrome.webview) {
    window.chrome.webview.addEventListener('message', function (ev) {
      var d = ev.data;
      if (typeof d === 'string') {
        try {
          d = JSON.parse(d);
        } catch (_) {}
      }
      if (d && d.type) dbg('R', d.type, 'ok');
      if (!d || !d.type) return;
      if (d.type === 'RESET_STATE') {
        try {
          if (typeof window.onWebViewResetState === 'function') window.onWebViewResetState();
        } catch (_) {}
        return;
      }
      if (d.type === 'ftb_debug') {
        dbg('H', d.msg || '', d.level === 'err' ? 'err' : 'ok');
        return;
      }
      if (d.type === 'SELECTION_CHANGE') {
        pulse(true);
        return;
      }
      if (d.type === 'SELECTION_CLEAR') {
        pulse(false);
        return;
      }
      if (d.type === 'drop_done') {
        loading(false);
        pulse(false);
        holeDragHide();
        clearActiveDropBtn();
        forceReleaseInteractionLocks();
        return;
      }
      if (d.type === 'set_scale') {
        scale(d.scale || 1);
        setCompact(!!d.compact);
        return;
      }
      if (d.type === 'set_toolbar_config') {
        rebuildToolbarButtons(d.actions || DEFAULT_TOOLBAR_ACTIONS);
        return;
      }
      if (d.type === 'set_toolbar_cmds') {
        rebuildToolbarCmdButtons(d.items || []);
        return;
      }
      if (d.type === 'set_logo') {
        var u = d.url || '';
        var imgs = Array.prototype.slice.call(document.querySelectorAll('.logo-btn .logo-img'));
        function paintThenReveal() {
          requestAnimationFrame(function () {
            requestAnimationFrame(revealToolbarSync);
          });
        }
        if (!u || !imgs.length) {
          paintThenReveal();
          return;
        }
        var remain = imgs.length;
        imgs.forEach(function (im) {
          var done = false;
          function once() {
            if (done) return;
            done = true;
            if (im.naturalWidth && im.naturalHeight) im.classList.add('logo-ready');
            remain--;
            if (remain <= 0) paintThenReveal();
          }
          im.classList.remove('logo-ready');
          im.onload = once;
          im.onerror = once;
          im.src = u;
          if (im.decode) {
            im.decode().then(once).catch(once);
          } else if (im.complete) {
            once();
          }
        });
        return;
      }
      if (d.type === 'set_theme') {
        applyTheme(d.themeMode || d.theme);
        return;
      }
      if (d.type === 'set_selected') sel(d.action || '');
      if (d.type === 'ttyd_status') {
        var ts0 = activeSession();
        if (!ts0 || !isCliSession(ts0)) return;
        var rid0 = String(d.reqId || '');
        if (_niumaCliPendingReqId && rid0 && rid0 !== _niumaCliPendingReqId) return;
        if (String(d.state || '') === 'starting') cstatForSession(ts0.id, '正在启动 ttyd...', 'progress');
        if (String(d.state || '') === 'probing') cstatForSession(ts0.id, '正在探测 ttyd 状态...', 'progress');
        return;
      }
      if (d.type === 'ttyd_ready') {
        var rid = String(d.reqId || '');
        if (_niumaCliPendingReqId && rid && rid !== _niumaCliPendingReqId) return;
        if (rid && _niumaCliPendingReqId === rid) _niumaCliPendingReqId = '';
        var turl = String(d.baseUrl || '').trim();
        var ts = activeSession();
        if (!ts || !isCliSession(ts)) return;
        if (_niumaPendingPop && turl) {
          _niumaPendingPop = false;
          try {
            window.open(turl, '_blank');
          } catch (e) {}
          cstatForSession(ts.id, '宸插湪澶栭儴娴忚鍣ㄦ墦寮€缁堢銆?, 'success');
          return;
        }
        if (turl) {
          ts.baseUrl = String(turl).replace(/\/+$/, '');
          persistSessions();
        }
        turl = turl || cliUrlForSession(ts);
        if (turl) applyCliFrameUrl(turl);
        cstatForSession(ts.id, '鏈満缁堢宸插氨缁€?, 'success');
        return;
      }
      if (d.type === 'ttyd_error') {
        var rid2 = String(d.reqId || '');
        if (_niumaCliPendingReqId && rid2 && rid2 !== _niumaCliPendingReqId) return;
        if (rid2 && _niumaCliPendingReqId === rid2) _niumaCliPendingReqId = '';
        var ts2 = activeSession();
        cstatForSession(
          ts2 && ts2.id,
          'ttyd锛? + (d.message || '鍚姩澶辫触锛岃妫€鏌ュ悓鐩綍涓嬫槸鍚︽湁 ttyd.exe 鎴栫偣銆岄噸璇?閲嶅惎銆?),
          'error'
        );
        return;
      }
      if (d.type === 'niuma_compose_send') {
        var inText = String(d.text || '');
        if (!inText.trim()) return;
        var appendMode = d.append !== false;
        var shouldOpenDrawer = d.openDrawer !== false;
        var shouldSendNow = d.send !== false;
        if (shouldOpenDrawer) setDrawer(true);
        var base = String(input.value || '');
        if (appendMode && base.trim()) input.value = base.replace(/\s+$/, '') + '\n\n' + inText;
        else input.value = inText;
        try {
          input.dispatchEvent(new Event('input', { bubbles: true }));
        } catch (_) {}
        requestAnimationFrame(function () {
          try {
            input.focus();
            var end = input.value.length;
            input.setSelectionRange(end, end);
          } catch (_) {}
          if (shouldSendNow) sendChat();
        });
        return;
      }
      if (d.type === 'niuma_stage_attachments') {
        var arr = Array.isArray(d.files) ? d.files : [];
        if (!arr.length) return;
        var pa = state.pendingAttach || { items: [], fileIds: [], files: [] };
        pa.items = Array.isArray(pa.items) ? pa.items : [];
        pa.fileIds = Array.isArray(pa.fileIds) ? pa.fileIds : [];
        pa.files = Array.isArray(pa.files) ? pa.files : [];
        arr.forEach(function (f) {
          if (!f || !f.id) return;
          var fid = String(f.id || '');
          if (!fid) return;
          if (pa.fileIds.indexOf(fid) < 0) pa.fileIds.push(fid);
          var item = {
            id: fid,
            name: String(f.name || f.relativePath || 'file'),
            relativePath: String(f.relativePath || f.name || 'file'),
            size: Number(f.size || 0),
            type: String(f.type || '')
          };
          var idx = -1;
          for (var i = 0; i < pa.items.length; i++) {
            if (String((pa.items[i] && pa.items[i].id) || '') === fid) { idx = i; break; }
          }
          if (idx >= 0) pa.items[idx] = item;
          else pa.items.push(item);
          var jdx = -1;
          for (var j = 0; j < pa.files.length; j++) {
            if (String((pa.files[j] && pa.files[j].id) || '') === fid) { jdx = j; break; }
          }
          if (jdx >= 0) pa.files[jdx] = f;
          else pa.files.push(f);
        });
        state.pendingAttach = pa;
        refreshAttachUi();
        cstat('Attachments added: ' + arr.length, 'success');
        return;
      }
      if (d.type === 'host_force_toolbar_home') {
        setSettings(false);
        setNspick(false);
        if (state.drawer) setDrawer(false);
        else {
          state.drawer = false;
          document.body.classList.remove('drawer-open');
          if (stage) stage.setAttribute('aria-hidden', 'true');
          if (panel) panel.setAttribute('aria-hidden', 'true');
        }
        return;
      }
    });
  }

  var rz = false,
    rzX = 0,
    rzW = 0;
  if (resizeGrip) {
    resizeGrip.addEventListener('pointerdown', function (e) {
      if (e.button !== 0) return;
      rz = true;
      rzX = e.clientX;
      rzW = document.documentElement.clientWidth;
      try {
        resizeGrip.setPointerCapture(e.pointerId);
      } catch (x) {}
    });
    resizeGrip.addEventListener('pointermove', function (e) {
      if (!rz) return;
      var b = drawerResizeBoundsPx();
      var nw = Math.max(b.min, Math.min(b.max, rzW + (rzX - e.clientX)));
      post({ type: 'drawer_resize', width: nw });
    });
    resizeGrip.addEventListener('pointerup', function (e) {
      if (rz) {
        rz = false;
        post({ type: 'drawer_resize_done' });
        try {
          resizeGrip.releasePointerCapture(e.pointerId);
        } catch (x) {}
      }
    });
    resizeGrip.addEventListener('pointercancel', function () {
      if (rz) {
        rz = false;
        post({ type: 'drawer_resize_done' });
      }
    });
  }

  fillProviders();
  fillPromptBuiltinSelect();
  loadCfg();
  applyTheme(state.themeMode);
  scale(1);
  setCompact(false);
  post({ type: 'toolbar_ready' });
  setTimeout(function () {
    post({ type: 'UI_FINISHED' });
  }, 180);
  requestAnimationFrame(function () {
    requestAnimationFrame(function () {
      setTimeout(function () {
        post({ type: 'UI_FINISHED' });
      }, 16);
    });
  });
})();
</script>
