<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hole Launcher Layer</title>
  <style>
    @property --ring-angle {
      syntax: '<angle>';
      initial-value: 0deg;
      inherits: false;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      user-select: none;
      pointer-events: auto;
    }
    #launcherRoot {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: auto;
      clip-path: circle(225.5px at 50% 50%);
      -webkit-clip-path: circle(225.5px at 50% 50%);
      mask-image: radial-gradient(circle 225.5px at 50% 50%, #000 0 100%, transparent 100%);
      -webkit-mask-image: radial-gradient(circle 225.5px at 50% 50%, #000 0 100%, transparent 100%);
    }
    /* 内嵌星空 + 彩环（单窗合成，不依赖下层 WebView 穿透） */
    .launcher-hole-backdrop {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 450px;
      height: 450px;
      margin-left: -225px;
      margin-top: -225px;
      pointer-events: none;
      z-index: 0;
    }
    /* 彩环改由 hole-launcher-backdrop.js 在 canvas 上抗锯齿绘制 */
    .launcher-hole-backdrop .ring {
      display: none;
    }
    .launcher-hole-backdrop .well {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      overflow: visible;
      background: transparent;
      z-index: 2;
    }
    #launcherGalaxyCanvas {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 450px;
      height: 450px;
      background: transparent;
    }
    #holeSceneLauncher {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 380px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: auto;
      opacity: 0;
      transform: scale(0.88);
      transform-origin: center center;
      background: transparent;
      transition: opacity 380ms ease, transform 520ms cubic-bezier(0.16, 1, 0.3, 1);
    }
    #holeSceneLauncher.visible {
      opacity: 1;
      transform: scale(1);
    }
    .launcher-scene-front {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 360px;
      padding: 0 12px;
      pointer-events: none;
    }
    .launcher-scene-front .hole-scene-grid,
    .launcher-scene-front .hole-scene-tile {
      pointer-events: auto;
    }
    .hole-scene-badge {
      position: absolute;
      top: 8px;
      right: 10px;
      z-index: 3;
      font: 600 10px/1 "Segoe UI", "Microsoft YaHei", sans-serif;
      color: rgba(120, 255, 200, 0.8);
      letter-spacing: 0.06em;
      pointer-events: none;
    }
    .hole-scene-sub {
      text-align: center;
      font: 500 11px/1.3 "Segoe UI", "Microsoft YaHei", sans-serif;
      color: rgba(220, 245, 255, 0.72);
      margin: 0 0 8px;
      min-height: 14px;
      pointer-events: none;
    }
    .hole-scene-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px 8px;
      width: 100%;
      justify-items: center;
    }
    .hole-scene-tile {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      border: none;
      background: transparent;
      cursor: pointer;
      padding: 0;
      animation: sceneTilePop 0.14s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes sceneTilePop {
      from { opacity: 0.35; transform: scale(0.88); }
      to { opacity: 1; transform: scale(1); }
    }
    .hole-scene-icon {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.18);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }
    .hole-scene-icon img { width: 26px; height: 26px; object-fit: contain; }
    .hole-scene-label {
      font: 500 10px/1.2 "Segoe UI", "Microsoft YaHei", sans-serif;
      color: rgba(245, 255, 252, 0.9);
      text-align: center;
      max-width: 72px;
      pointer-events: none;
    }
    .hole-scene-empty {
      grid-column: 1 / -1;
      text-align: center;
      color: rgba(200, 230, 220, 0.65);
      font-size: 12px;
      padding: 12px;
    }
  </style>
</head>
<body>
  <div id="launcherRoot">
    <div class="launcher-hole-backdrop" aria-hidden="true">
      <div class="ring"></div>
      <div class="well">
        <canvas id="launcherGalaxyCanvas" width="450" height="450"></canvas>
      </div>
    </div>
    <div id="holeSceneLauncher" aria-label="场景启动器">
      <div class="launcher-scene-front">
        <div class="hole-scene-sub">选择场景</div>
      </div>
    </div>
  </div>
  <script src="https://app.local/assets/hole-launcher-backdrop.js"></script>
  <script src="https://app.local/assets/hole-scene-launcher.js"></script>
  <script>
    (function () {
      var sceneLauncherApi = null;
      function postHost(payload) {
        try {
          var wv = window.chrome && window.chrome.webview;
          if (!wv || !wv.postMessage) return;
          var body = typeof payload === 'string' ? payload : JSON.stringify(Object.assign({ windowRole: 'launcher' }, payload));
          wv.postMessage(body);
        } catch (_) {}
      }
      function ensureApi() {
        if (sceneLauncherApi) return sceneLauncherApi;
        var host = document.getElementById('holeSceneLauncher');
        if (!host || !window.HoleSceneLauncher) return null;
        sceneLauncherApi = window.HoleSceneLauncher.mount({
          host: host,
          mountTarget: host.querySelector('.launcher-scene-front') || host,
          post: postHost,
          badge: 'A·启动层'
        });
        return sceneLauncherApi;
      }
      function startBackdrop() {
        try {
          if (window.HoleLauncherBackdrop && window.HoleLauncherBackdrop.start) {
            window.HoleLauncherBackdrop.start();
          }
        } catch (_) {}
      }
      function stopBackdrop() {
        try {
          if (window.HoleLauncherBackdrop && window.HoleLauncherBackdrop.stop) {
            window.HoleLauncherBackdrop.stop();
          }
        } catch (_) {}
      }
      window.HoleLauncherLayer = {
        startBackdrop: startBackdrop,
        stopBackdrop: stopBackdrop,
        applyConfig: function (cfg) {
          var api = ensureApi();
          if (!api) return;
          var layout = cfg && cfg.sceneToolbarLayout ? cfg.sceneToolbarLayout : cfg;
          api.buildGrid(layout);
        },
        show: function (preview) {
          startBackdrop();
          var api = ensureApi();
          if (!api) return;
          var front = document.querySelector('.launcher-scene-front');
          if (!front || !front.querySelector('.hole-scene-grid') ||
              !front.querySelector('.hole-scene-grid').children.length) {
            api.buildGrid([]);
          }
          if (preview != null) api.setPreview(preview);
          api.show();
        },
        hide: function () {
          if (sceneLauncherApi) sceneLauncherApi.hide();
          var host = document.getElementById('holeSceneLauncher');
          if (host) host.classList.remove('visible');
          stopBackdrop();
        }
      };
      try {
        var wv = window.chrome && window.chrome.webview;
        if (wv && wv.addEventListener) {
          wv.addEventListener('message', function (ev) {
            try {
              var raw = ev && (ev.data != null ? ev.data : ev);
              var msg = typeof raw === 'string' ? JSON.parse(raw) : raw;
              if (msg && msg.type === 'launcher_show') {
                window.HoleLauncherLayer.show();
              } else if (msg && msg.type === 'launcher_hide') {
                window.HoleLauncherLayer.hide();
              }
            } catch (_) {}
          });
        }
      } catch (_) {}
    })();
  </script>
</body>
</html>
