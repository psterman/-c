<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hybrid 运行终验看板</title>
  <style>
    :root {
      --bg1: #0d1117; --bg2: #161b22; --ink: #e6edf3; --muted: #8b949e;
      --ok: #3fb950; --fail: #f85149; --warn: #d29922; --accent: #58a6ff;
      --card: rgba(255,255,255,0.04); --border: rgba(255,255,255,0.12);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; color: var(--ink);
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: linear-gradient(160deg, var(--bg1), var(--bg2));
      min-height: 100vh;
    }
    .wrap { max-width: 1180px; margin: 0 auto; padding: 20px; }
    h1 { margin: 0 0 4px; font-size: 22px; }
    .sub { color: var(--muted); font-size: 13px; margin-bottom: 16px; }
    .hero {
      border-radius: 14px; padding: 16px 18px; margin-bottom: 14px;
      border: 1px solid var(--border); background: var(--card);
    }
    .hero.ready { border-color: rgba(63,185,80,0.5); }
    .hero.notready { border-color: rgba(248,81,73,0.5); }
    .hero h2 { margin: 0 0 8px; font-size: 18px; }
    .pipeline {
      display: flex; flex-wrap: wrap; align-items: center; gap: 6px;
      margin: 12px 0 4px; font-size: 12px;
    }
    .pipe-node {
      background: rgba(88,166,255,0.12); border: 1px solid rgba(88,166,255,0.35);
      border-radius: 8px; padding: 8px 10px; min-width: 110px;
    }
    .pipe-node strong { display: block; font-size: 13px; color: var(--accent); }
    .pipe-node span { color: var(--muted); font-size: 11px; }
    .pipe-arrow { color: var(--muted); font-size: 18px; padding: 0 2px; }
    .gates {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 10px; margin-bottom: 12px;
    }
    .gate { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px; }
    .gate.pass { border-color: rgba(63,185,80,0.45); }
    .gate.fail { border-color: rgba(248,81,73,0.45); }
    .gate.pending { border-color: rgba(210,153,34,0.45); }
    .gate h3 { margin: 0 0 8px; font-size: 14px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .pill { font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 999px; }
    .pill.pass { background: rgba(63,185,80,0.2); color: var(--ok); }
    .pill.fail { background: rgba(248,81,73,0.2); color: var(--fail); }
    .pill.pending { background: rgba(210,153,34,0.2); color: var(--warn); }
    .pill.improvement { background: rgba(63,185,80,0.25); color: var(--ok); }
    .pill.aux-warn { background: rgba(210,153,34,0.22); color: var(--warn); }
    .pill.deferred { background: rgba(139,148,158,0.22); color: var(--muted); }
    .banner-warn {
      border: 1px solid rgba(210,153,34,0.45); background: rgba(210,153,34,0.08);
      border-radius: 10px; padding: 10px 12px; margin-bottom: 10px; font-size: 12px; color: var(--warn);
    }
    .banner-mode {
      border: 1px solid rgba(88,166,255,0.35); background: rgba(88,166,255,0.08);
      border-radius: 10px; padding: 8px 12px; margin-bottom: 10px; font-size: 12px; color: var(--accent);
    }
    .metrics { font-size: 12px; color: var(--muted); line-height: 1.65; }
    .panel { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 12px; margin-bottom: 10px; }
    .panel h3 { margin: 0 0 8px; font-size: 14px; }
    .step { display: flex; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
    .step:last-child { border-bottom: none; }
    .step .n {
      width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center;
      justify-content: center; font-size: 11px; font-weight: 700; flex-shrink: 0;
    }
    .step.pass .n { background: rgba(63,185,80,0.25); color: var(--ok); }
    .step.fail .n { background: rgba(248,81,73,0.25); color: var(--fail); }
    .step.manual .n { background: rgba(210,153,34,0.25); color: var(--warn); }
    code, .cmd {
      font-family: Consolas, monospace; font-size: 11px; color: #79c0ff;
      background: rgba(0,0,0,0.3); padding: 2px 6px; border-radius: 4px;
    }
    .cmd { display: block; margin: 6px 0; padding: 8px 10px; word-break: break-all; }
    ul.subgates { margin: 6px 0 0; padding-left: 18px; font-size: 11px; color: var(--muted); }
    .hint { color: var(--warn); font-size: 12px; line-height: 1.6; }
    .err { color: var(--fail); font-size: 11px; margin-top: 4px; }
    .signoff-table { width: 100%; border-collapse: collapse; font-size: 12px; }
    .signoff-table th, .signoff-table td {
      text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); vertical-align: top;
    }
    .signoff-table th { color: var(--muted); font-weight: 600; font-size: 11px; }
    .signoff-table tr.signed td:first-child { border-left: 3px solid var(--ok); }
    .signoff-table tr.failed td:first-child { border-left: 3px solid var(--fail); }
    .signoff-table tr.unsigned td:first-child { border-left: 3px solid var(--warn); }
    .signoff-table tr.skipped td:first-child { border-left: 3px solid var(--muted); }
    .status-pill {
      font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 999px; display: inline-block;
    }
    .status-pill.signed { background: rgba(63,185,80,0.2); color: var(--ok); }
    .status-pill.failed { background: rgba(248,81,73,0.2); color: var(--fail); }
    .status-pill.unsigned { background: rgba(210,153,34,0.2); color: var(--warn); }
    .status-pill.skipped { background: rgba(139,148,158,0.2); color: var(--muted); }
    .case-detail { margin-top: 6px; font-size: 11px; color: var(--muted); line-height: 1.55; }
    .case-detail summary { cursor: pointer; color: var(--accent); user-select: none; }
    .case-detail ul { margin: 4px 0; padding-left: 18px; }
    .artifact-list { margin: 4px 0 0; padding: 0; list-style: none; }
    .artifact-list li { margin: 2px 0; }
    .hero-grid { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 8px; }
    .hero-stat {
      background: rgba(0,0,0,0.25); border: 1px solid var(--border); border-radius: 8px;
      padding: 6px 10px; font-size: 12px;
    }
    .hero-stat strong { display: block; font-size: 11px; color: var(--muted); margin-bottom: 2px; }
    .dual-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; margin-bottom: 10px; }
    .dual-cell { background: rgba(0,0,0,0.22); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-size: 12px; }
    .dual-cell strong { display: block; font-size: 10px; color: var(--muted); margin-bottom: 3px; }
  </style>
</head>
<body>
  <!-- HYBRID_SIGNOFF_INJECT -->
  <div class="wrap">
    <h1>Hybrid 运行终验看板</h1>
    <div class="sub" id="meta">加载中…</div>
    <div id="modeBanner"></div>
    <div id="warnBanner"></div>
    <div class="hero" id="hero"></div>
    <div class="panel">
      <h3>验证链路（AHK 呈现 + Hub 传输）</h3>
      <div class="pipeline" id="pipeline"></div>
    </div>
    <div class="gates" id="gates"></div>
    <div class="panel">
      <h3>内存参考状态</h3>
      <div id="refState" class="metrics"></div>
    </div>
    <div class="panel">
      <h3>手动终验步骤</h3>
      <div id="steps"></div>
    </div>
    <div class="panel">
      <h3>UI-01 双指标（session / ref）</h3>
      <div id="ui01Dual"></div>
    </div>
    <div class="panel">
      <h3>产品签收表格（FTB-01 / CP-01 / UI-01）</h3>
      <div id="signoffTable"></div>
    </div>
    <div class="panel">
      <h3>命令</h3>
      <div id="commands"></div>
    </div>
    <div class="panel">
      <h3>说明</h3>
      <div id="notes" class="hint"></div>
    </div>
  </div>
  <script>
    const JSON_URL = "../../Cache/debug/hybrid_signoff_dashboard.json";

    function pill(pass) {
      if (pass === null || pass === undefined) return `<span class="pill pending">待测</span>`;
      return `<span class="pill ${pass ? "pass" : "fail"}">${pass ? "通过" : "未通过"}</span>`;
    }

    function gateClass(pass) {
      if (pass === null || pass === undefined) return "pending";
      return pass ? "pass" : "fail";
    }

    const gateHints = {
      flags: "local/nmer-flags.json: floatingToolbarHost=hybrid, sidecarHost=hub",
      sidecar: "nmer-hub 运行；nmer-wails 不运行；/agent/health ok",
      s11_static: "Diagnose-S11HybridFTBGate.ps1 静态接线",
      hub_chain: "health → register_external → inject → drain → egress",
      ftb_external: "presentationMode=external（牛马已注册 hybrid 呈现）",
      memory_delta: "仅用 hybrid_signoff_reference_ahk.json；delta<=0 improvement；0<delta<=80 within_limit；>80 regression；组件不全或 SearchCore active 则 deferred",
      hub_cycle: "10 轮 inject/drain，hub 私有内存波动 ≤ 10%",
      openclaw_adapter: "需 OPENCLAW_GATEWAY_TOKEN；可选"
    };

    function gatePill(g) {
      if (g.deferred) return `<span class="pill deferred">deferred</span>`;
      if (g.id === "memory_delta" && g.metrics && g.metrics.deltaVerdict === "improvement") {
        return `<span class="pill improvement">改善 ${g.metrics.deltaMiB} MiB</span>`;
      }
      return pill(g.pass);
    }

    function refDriftPill(ui) {
      if (ui.refDriftPct == null) return "—";
      const mode = ui.signoffMode || "";
      const pct = `${ui.refDriftPct}%`;
      if (mode === "formal-cold") return `${pct} ${pill(ui.referenceBaselinePass)}`;
      const over = Math.abs(Number(ui.refDriftPct)) > 10;
      if (over) return `${pct} <span class="pill aux-warn">辅判 warning</span>`;
      return `${pct} ${pill(ui.referenceBaselinePass)}`;
    }

    function statusPill(status) {
      const s = status || "unsigned";
      const labels = { signed: "已签收", failed: "失败", unsigned: "未签收", skipped: "跳过" };
      return `<span class="status-pill ${s}">${labels[s] || s}</span>`;
    }

    function fmtJson(obj) {
      if (obj === null || obj === undefined) return "—";
      try { return JSON.stringify(obj, null, 2); } catch { return String(obj); }
    }

    function renderUi01Dual(ui) {
      if (!ui) {
        return `<div class="hint">尚无 UI-01 数据 — 运行 <code>Run-HybridManualSignoff.ps1</code></div>`;
      }
      const warns = (ui.warnings || []).map(w => `<li>${w}</li>`).join("");
      const cells = [
        ["UI 功能", pill(ui.functionalPass)],
        ["sessionDrift", ui.sessionDriftPct != null ? `${ui.sessionDriftPct}% ${pill(ui.sessionRecoveryPass)}` : "—"],
        ["refDrift", refDriftPill(ui)],
        ["refKind", ui.referenceKind ? `<code>${ui.referenceKind}</code>` : "—"],
        ["signoffMode", `<code>${ui.signoffMode || "—"}</code>`],
        ["UI-01 pass", pill(ui.pass)],
        ["memBefore", ui.memBeforeMiB != null ? `${ui.memBeforeMiB} MiB` : "—"],
        ["memAfter", ui.memAfterMiB != null ? `${ui.memAfterMiB} MiB` : "—"],
        ["hybridRef", ui.hybridReferenceMiB != null ? `${ui.hybridReferenceMiB} MiB` : "—"],
        ["SearchCore", ui.searchCorePhase ? `<code>${ui.searchCorePhase}</code>` : "—"]
      ];
      const grid = `<div class="dual-grid">${cells.map(([k, v]) =>
        `<div class="dual-cell"><strong>${k}</strong>${v}</div>`
      ).join("")}</div>`;
      const cold = ui.coldStartConfirmed != null
        ? `<div class="metrics">coldStartConfirmed=${ui.coldStartConfirmed}</div>` : "";
      const warnBlock = warns
        ? `<div class="banner-warn" style="margin-top:8px"><strong>warnings</strong><ul style="margin:6px 0 0 18px">${warns}</ul></div>` : "";
      return grid + cold + warnBlock;
    }

    function renderSignoffTable(cases, productPass) {
      const rows = cases || [];
      if (!rows.length) {
        return `<div class="hint">尚无签收数据 — 运行 <code>Run-HybridManualSignoff.ps1 -RefreshDashboard</code></div>`;
      }
      const head = `<div class="metrics" style="margin-bottom:8px">productPass=${!!productPass} · ${rows.length} cases</div>`;
      const body = `<table class="signoff-table"><thead><tr>
        <th>Case</th><th>标题</th><th>状态</th><th>结果</th><th>详情</th>
      </tr></thead><tbody>` + rows.map(c => {
        const st = c.status || (c.pass === null || c.pass === undefined ? "unsigned" : (c.pass ? "signed" : "failed"));
        const steps = (c.steps || []).map(s => `<li>${s}</li>`).join("");
        const trace = (c.trace || []).map(t => `<li>${t}</li>`).join("");
        const arts = (c.artifacts || []).map(a => `<li><code>${a}</code></li>`).join("");
        const detail = `<details class="case-detail"><summary>展开 steps / expected / actual / trace / artifacts</summary>
          ${steps ? `<div><strong>Steps</strong><ul>${steps}</ul></div>` : ""}
          ${c.expected ? `<div><strong>Expected</strong><pre style="white-space:pre-wrap;margin:4px 0">${c.expected}</pre></div>` : ""}
          ${c.actual ? `<div><strong>Actual</strong><pre style="white-space:pre-wrap;margin:4px 0">${fmtJson(c.actual)}</pre></div>` : ""}
          ${trace ? `<div><strong>Trace</strong><ul>${trace}</ul></div>` : ""}
          ${arts ? `<div><strong>Artifacts</strong><ul class="artifact-list">${arts}</ul></div>` : ""}
        </details>`;
        const warnLine = (c.warnings && c.warnings.length)
          ? `<div class="metrics" style="margin-top:4px">⚠ ${c.warnings.join(" · ")}</div>` : "";
        return `<tr class="${st}">
          <td><code>${c.caseId || "—"}</code></td>
          <td>${c.title || "—"}</td>
          <td>${statusPill(st)}</td>
          <td>${pill(c.pass)}</td>
          <td>${detail}${warnLine}</td>
        </tr>`;
      }).join("") + `</tbody></table>`;
      return head + body;
    }

    function heroStat(label, val, ok) {
      const cls = ok === null || ok === undefined ? "pending" : (ok ? "pass" : "fail");
      const text = ok === null || ok === undefined ? "—" : (ok ? "true" : "false");
      return `<div class="hero-stat"><strong>${label}</strong><span class="pill ${cls}">${text}</span></div>`;
    }

    function render(data) {
      const autoReady = !!data.readyForHybridSignoff;
      const mode = data.manualSignoffMode || data.signoffMode || "live";
      document.getElementById("meta").textContent =
        `采集 ${data.capturedAt || "-"} | 自动门禁 ${data.signoffMode || "live"} | UI-01 ${mode} | 仓库 ${data.repoRoot || "-"}`;

      const modeEl = document.getElementById("modeBanner");
      if (mode !== "formal") {
        modeEl.innerHTML = `<div class="banner-mode">signoffMode=<strong>${mode}</strong> — 非正式签收（formal 才可用于生产默认）</div>`;
      } else {
        modeEl.innerHTML = `<div class="banner-mode">signoffMode=<strong>formal</strong> — 正式签收模式</div>`;
      }

      const warns = data.warnings || [];
      document.getElementById("warnBanner").innerHTML = warns.length
        ? `<div class="banner-warn">${warns.map(w => `⚠ ${w}`).join("<br>")}</div>`
        : "";

      document.getElementById("hero").className = "hero " + (autoReady ? "ready" : "notready");
      const overall = !!data.overallPass;
      document.getElementById("hero").innerHTML = autoReady
        ? `<h2>自动门禁已通过</h2>
           <div class="hero-grid">
             ${heroStat("autoPass", data.autoPass, !!data.autoPass)}
             ${heroStat("productPass", data.productPass, data.productPass)}
             ${heroStat("manualPass", data.manualPass, data.manualPass)}
             ${heroStat("overallPass", data.overallPass, overall)}
           </div>
           <div class="metrics" style="margin-top:8px">内存参考：${data.references?.ahk ? "已采 ahk" : "未采 ahk 参考"}。</div>`
        : `<h2>自动门禁未齐</h2>
           <div class="hero-grid">
             ${heroStat("autoPass", data.autoPass, false)}
             ${heroStat("productPass", data.productPass, data.productPass)}
             ${heroStat("overallPass", data.overallPass, false)}
           </div>
           <div class="metrics">修复红色自动项后重新运行 <code>Open-HybridSignoffDashboard.ps1</code>（浏览器 F5 无效）。</div>`;

      const refs = data.references || {};
      const refLines = [];
      if (refs.ahk) refLines.push(`ahk: scanPhase=${refs.ahk.scanPhase || "—"} total=${refs.ahk.totalPrivateMiB} MiB`);
      if (refs.hybrid) refLines.push(`hybrid ref: scanPhase=${refs.hybrid.scanPhase || "—"} total=${refs.hybrid.totalPrivateMiB} MiB`);
      if (refs.live) refLines.push(`live: scanPhase=${refs.live.scanPhase || "—"} fulltextReady=${refs.live.fulltextReady}`);
      document.getElementById("refState").innerHTML = refLines.length
        ? refLines.join("<br>")
        : "未采集 reference — 运行 Capture-HybridMemoryReference.ps1";

      const pipe = data.pipeline || [];
      document.getElementById("pipeline").innerHTML = pipe.map((n, i) => {
        const arrow = i < pipe.length - 1 ? '<span class="pipe-arrow">→</span>' : "";
        return `<div class="pipe-node"><strong>${n.step}</strong><span>${n.role}</span><span>${n.endpoint || ""}</span></div>${arrow}`;
      }).join("");

      document.getElementById("gates").innerHTML = (data.gates || []).map(g => {
        const m = g.metrics || {};
        const lines = Object.entries(m).map(([k, v]) => {
          if (Array.isArray(v)) return `${k}=${v.join(",")}`;
          if (v === null || v === undefined) return `${k}=—`;
          return `${k}=${v}`;
        }).join(" · ");
        let extra = "";
        if (g.gates && g.gates.length) {
          extra = "<ul class='subgates'>" + g.gates.map(x =>
            `<li>${x.pass ? "✓" : "✗"} ${x.id}: ${x.detail || ""}</li>`
          ).join("") + "</ul>";
        }
        if (g.errors && g.errors.length) {
          extra += g.errors.map(e => `<div class="err">${e}</div>`).join("");
        }
        if (!g.pass && g.pass !== null && gateHints[g.id]) {
          extra += `<div class="hint" style="margin-top:6px">${gateHints[g.id]}</div>`;
        }
        return `<div class="gate ${g.deferred ? "pending" : gateClass(g.pass)}">
          <h3>${g.title} ${gatePill(g)}</h3>
          <div class="metrics">${lines || "无数据"}</div>${extra}
        </div>`;
      }).join("");

      document.getElementById("steps").innerHTML = (data.manualSteps || []).map(s => {
        const cls = s.pass ? "pass" : (s.autoCheck ? "fail" : "manual");
        const mark = s.pass ? "✓" : (s.autoCheck ? "!" : "…");
        const st = s.signoffStatus ? ` · ${statusPill(s.signoffStatus)}` : "";
        const caseTag = s.caseId ? ` <code>${s.caseId}</code>` : "";
        return `<div class="step ${cls}">
          <div class="n">${mark}</div>
          <div><strong>${s.title}</strong>${caseTag}${st}<br><span class="metrics">${s.hint || ""}</span></div>
        </div>`;
      }).join("");

      const signoffCases = (data.manualSignoff && data.manualSignoff.signoffCases) || data.signoffCases || [];
      document.getElementById("ui01Dual").innerHTML = renderUi01Dual(
        data.ui01Recovery || (data.manualSignoff && data.manualSignoff.ui01Recovery)
      );
      document.getElementById("signoffTable").innerHTML = renderSignoffTable(signoffCases, data.productPass);

      const cmds = data.commands || {};
      document.getElementById("commands").innerHTML = Object.entries(cmds).map(([k, v]) =>
        `<div><span class="metrics">${k}</span><code class="cmd">${v}</code></div>`
      ).join("");

      document.getElementById("notes").innerHTML = (data.notes || []).map(n => `• ${n}`).join("<br>");
    }

    async function load() {
      let data = null;
      if (window.__HYBRID_SIGNOFF_DATA__) {
        data = window.__HYBRID_SIGNOFF_DATA__;
      } else {
        try {
          const r = await fetch(JSON_URL + "?t=" + Date.now());
          data = await r.json();
        } catch (e) {
          document.getElementById("meta").textContent =
            "无法加载 JSON: " + e.message + " — 请运行 Open-HybridSignoffDashboard.ps1 打开 -live.html";
          return;
        }
      }
      render(data);
    }
    load();
  </script>
</body>
</html>
