<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Deep Space - Precision Starfield</title>
  <style>
    @property --ring-angle {
      syntax: '<angle>';
      initial-value: 0deg;
      inherits: false;
    }
    :root {
      --p: 0;
      --hole-alpha: 0.22;
      --ai-red: #ea4335;
      --ai-yellow: #fbbc05;
      --ai-green: #34a853;
      --ai-blue: #4285f4;
      --hx: 310px;
      --hy: 310px;
    }
    
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; user-select: none; }
    
    #root {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 9999;
    }
  /* 仅黑洞本体区域接收拖放 */
    #root.show .hole-wrap,
    #root.drop .hole-wrap {
      pointer-events: auto;
    }
    #root.show.ole-passthrough .hole-wrap,
    #root.drop.ole-passthrough .hole-wrap {
      pointer-events: none !important;
    }

    .hole-wrap {
      position: absolute;
      left: var(--hx);
      top: var(--hy);
      /* 瀹瑰櫒璁句负 0 灏哄锛屽唴閮ㄥ厓绱犵粷瀵瑰眳涓墿寮?*/
      width: 0;
      height: 0;
      opacity: 0;
      transition: opacity 400ms ease;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .show .hole-wrap { opacity: var(--hole-alpha); }

    /* 鐜粫鍏夊奖灞?*/
    .aura {
      position: absolute;
      width: 160px;
      height: 60px;
      filter: blur(25px);
      background: conic-gradient(from var(--ring-angle), var(--ai-blue), var(--ai-green), var(--ai-yellow), var(--ai-red), var(--ai-blue));
      opacity: calc(0.1 + var(--p) * 0.4);
      animation: spin 6s linear infinite;
      border-radius: 50%;
      z-index: 0;
      transition: all 1.2s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.5s;
    }

    /* 鏍稿績褰╃幆 */
    .ring {
      position: absolute;
      /* 鍒濆鐘舵€侊細闈炲父鎵佺殑妞渾 */
      width: 150px; 
      height: 50px; 
      border-radius: 50%;
      opacity: calc(0.4 + var(--p) * 0.6);
      z-index: 4;
      transition: all 1.2s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .ring::before {
      content: '';
      position: absolute; inset: -2px; border-radius: 50%;
      padding: 2.5px;
      background: conic-gradient(from var(--ring-angle), var(--ai-blue), var(--ai-green), var(--ai-yellow), var(--ai-red), var(--ai-blue));
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      animation: spin 4s linear infinite;
    }

    /* 鏄熺┖瀹瑰櫒 */
    .well {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      overflow: hidden;
      background: #000;
      z-index: 2;
    }

    #galaxyCanvas {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      background: #000;
      width: 800px;
      height: 800px;
      opacity: 0;
      transition: opacity 800ms ease;
    }

    /* 鏀惧ぇ閫昏緫锛氱‘淇濆彉涓轰弗鏍兼鍦?*/
    .drop .aura { 
      opacity: 0; 
      width: 450px;
      height: 450px;
    }
    
    .drop .ring { 
      width: 450px;  /* 3鍊嶅搴?*/
      height: 450px; /* 寮哄埗楂樺害绛変簬瀹藉害锛岀‘淇濇鍦?*/
      opacity: 1;
    }
    .drop #galaxyCanvas { opacity: 1; }
    .drop.expanding .ring { transform: scale(0.88); }
    .drop.expanding .aura { transform: scale(0.92); }
    .drop.expanded .ring { transform: scale(1); }
    .drop.expanded .aura { transform: scale(1); }

    /* 外链启动层模式：彻底禁用星空内嵌宫格，避免与 hole_launcher_layer 叠出双层图标 */
    #root.use-external-launcher #holeSceneLauncher {
      display: none !important;
      visibility: hidden !important;
      opacity: 0 !important;
      pointer-events: none !important;
    }
    /* 方案 A：星空铺底（450 圆环 + 星系），启动层透明叠在正上方 */
    #root.use-external-launcher.show.drop.expanded .hole-wrap {
      opacity: 1 !important;
    }
    #root.use-external-launcher.show.drop.expanded #galaxyCanvas {
      opacity: 1 !important;
    }
    #root.use-external-launcher.show.drop.expanded .ring {
      opacity: 1 !important;
    }

    /* 方案 A：透明场景启动器，叠在黑洞正圆上（挂 #root 避免被星环层遮挡） */
    #holeSceneLauncher {
      position: fixed;
      left: var(--hx);
      top: var(--hy);
      width: 420px;
      height: 420px;
      margin-left: -210px;
      margin-top: -210px;
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      justify-content: center;
      pointer-events: none;
      opacity: 0;
      transform: scale(0.72);
      transition: opacity 380ms ease, transform 520ms cubic-bezier(0.16, 1, 0.3, 1);
      background: transparent;
    }
    #holeSceneLauncher.visible {
      opacity: 1;
      transform: scale(1);
      pointer-events: auto;
    }
    .hole-scene-badge,
    .hole-scene-sub {
      display: none !important;
    }
    .hole-scene-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px 8px;
      padding: 4px 8px;
      max-width: 360px;
      margin: 0 auto;
      pointer-events: none;
    }
    #holeSceneLauncher.visible .hole-scene-tile { pointer-events: auto; }
    #holeSceneLauncher.visible .hole-scene-tile {
      opacity: 1;
      transform: scale(1);
    }
    .hole-scene-tile {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      border: none;
      background: transparent;
      cursor: pointer;
      padding: 0;
      opacity: 0;
      transform: scale(0.5);
      animation: sceneTilePop 0.42s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes sceneTilePop {
      to { opacity: 1; transform: scale(1); }
    }
    /* 图标容器样式由 hole-scene-launcher.js 注入 */
    .hole-scene-label {
      font: 500 10px/1.2 "Segoe UI", "Microsoft YaHei", sans-serif;
      color: rgba(245, 255, 252, 0.9);
      text-align: center;
      max-width: 72px;
    }
    .hole-scene-empty {
      grid-column: 1 / -1;
      text-align: center;
      color: rgba(200, 230, 220, 0.65);
      font-size: 12px;
      padding: 12px;
    }

    #root.swallow-flash::after {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at var(--hx) var(--hy), rgba(0,255,120,0.35), transparent 55%);
      pointer-events: none;
      animation: swallowFlash 420ms ease-out forwards;
      z-index: 9998;
    }
    @keyframes swallowFlash {
      0% { opacity: 0.9; }
      100% { opacity: 0; }
    }

    @keyframes spin { to { --ring-angle: 360deg; } }

    #gestureTrailCanvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 85;
      opacity: 0;
      transition: opacity 220ms ease;
    }
    #gestureTrailCanvas.active { opacity: 1; }
    #gestureTrailCanvas.trail-pending {
      filter: drop-shadow(0 0 6px rgba(140, 190, 255, 0.35));
    }
    #gestureTrailCanvas.trail-matched {
      filter: drop-shadow(0 0 10px rgba(80, 255, 180, 0.75));
    }
  </style>
</head>
<body>
  <div id="root">
    <canvas id="gestureTrailCanvas" aria-hidden="true"></canvas>
    <div class="hole-wrap" id="holeBody">
      <div class="aura"></div>
      <div class="ring">
        <div class="well">
          <canvas id="galaxyCanvas"></canvas>
        </div>
      </div>
    </div>
    <div id="holeSceneLauncher" aria-label="场景启动器"></div>
  </div>

  <script src="https://app.local/assets/hole-scene-launcher.js"></script>
  <script>
    if (!window.HoleSceneLauncher) {
      var _hl = document.createElement('script');
      _hl.src = 'https://app.local/assets/hole-scene-launcher.js';
      document.head.appendChild(_hl);
    }
  </script>
  <script>
    (function () {
      const root = document.getElementById('root');
      const gestureTrailCanvas = document.getElementById('gestureTrailCanvas');
      const gestureTrailCtx = gestureTrailCanvas ? gestureTrailCanvas.getContext('2d') : null;
      let gestureTrailActive = false;
      let gestureTrailMatched = false;
      let gestureTrailStroke = 'rgba(140, 190, 255, 0.48)';
      let gestureTrailLastX = 0;
      let gestureTrailLastY = 0;
      const canvas = document.getElementById('galaxyCanvas');
      const ctx = canvas.getContext('2d', { alpha: false });
      const holeBody = document.getElementById('holeBody');
      function nmerHoleWsUrl() {
        const base = 'ws://127.0.0.1:18790/hole';
        const tok = String(window.__NMER_WS_TOKEN__ || '');
        return tok ? (base + '?token=' + encodeURIComponent(tok)) : base;
      }
      const HOLE_WS_URL = nmerHoleWsUrl();
      const HOLE_WS_TOKEN = String(window.__NMER_WS_TOKEN__ || '');
      if (!HOLE_WS_TOKEN && (window.chrome?.webview || location.hostname === 'app.local')) {
        console.warn('[hole_starry] __NMER_WS_TOKEN__ 为空：WebSocket 将不带 token（与未配置 NMER_WS_HUB_TOKEN 时兼容）');
      }
      window.HOLE_WS = { url: HOLE_WS_URL, token: HOLE_WS_TOKEN };
      let holeSocket = null;
      let gravityBoostUntil = 0;
      let interactionState = 'idle';
      let lastInteractionVersion = 0;

      let p = 0;
      let isGalaxyOpen = false;
      let stars = [];
      let payloadType = 'text';
      let lastX = 310;
      let lastY = 310;
      let sleepMode = true;
      let rafId = 0;
      let expandTimer = 0;
      let autoDemoStarted = false;
      let sceneLauncherApi = null;
      let capturedPreview = '';

      function postHost(payload) {
        try {
          var wv = window.chrome && window.chrome.webview;
          if (!wv || !wv.postMessage) return;
          var body = typeof payload === 'string' ? payload : JSON.stringify(Object.assign({ windowRole: 'starry' }, payload));
          wv.postMessage(body);
        } catch (_) {}
      }

      function ensureSceneLauncher() {
        if (sceneLauncherApi) return sceneLauncherApi;
        var host = document.getElementById('holeSceneLauncher');
        if (!host || !window.HoleSceneLauncher) return null;
        sceneLauncherApi = window.HoleSceneLauncher.mount({
          host: host,
          post: postHost,
          badge: ''
        });
        return sceneLauncherApi;
      }

      function initGalaxy() {
        const dpr = window.devicePixelRatio || 1;
        canvas.width = 800 * dpr;
        canvas.height = 800 * dpr;
        ctx.scale(dpr, dpr);

        const w = 800;
        const h = 800;

        stars = [];
        for (let i = 0; i < 400; i++) {
          const rand = Math.random();
          let type = 'fine'; 
          let size = 0.2 + Math.random() * 0.4;
          let color = '#ffffff';

          if (rand > 0.95) {
            type = 'bright'; 
            size = 0.8 + Math.random() * 0.5;
            const c = Math.random();
            color = c > 0.8 ? '#dbebff' : (c > 0.6 ? '#fff5e6' : '#ffffff');
          } else if (rand > 0.8) {
            type = 'medium';
            size = 0.4 + Math.random() * 0.3;
          }

          stars.push({
            x: Math.random() * w,
            y: Math.random() * h,
            size: size,
            type: type,
            twinkleSpeed: 0.12 + Math.random() * 0.2,
            phase: Math.random() * Math.PI * 2,
            baseAlpha: type === 'fine' ? 0.2 : 0.5,
            color: color
          });
        }
      }

      function render(time) {
        if (sleepMode) {
          rafId = 0;
          return;
        }
        if (!isGalaxyOpen && p < 0.01 && !root.classList.contains('show')) {
          rafId = 0;
          return;
        }

        ctx.fillStyle = '#000000';
        ctx.fillRect(0, 0, 800, 800);

        stars.forEach(s => {
          const t = time * s.twinkleSpeed + s.phase;
          const noise = Math.sin(t) * Math.cos(t * 0.7);
          let alpha = s.baseAlpha + noise * 0.35;
          
          ctx.globalAlpha = Math.max(0.1, Math.min(1, alpha));
          
          if (s.type === 'bright') {
            const cx = s.x, cy = s.y;
            ctx.strokeStyle = s.color;
            ctx.lineWidth = 0.5;
            const spikeLen = s.size * 5 * alpha;
            ctx.beginPath();
            ctx.moveTo(cx - spikeLen, cy); ctx.lineTo(cx + spikeLen, cy);
            ctx.moveTo(cx, cy - spikeLen); ctx.lineTo(cx, cy + spikeLen);
            ctx.stroke();

            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(cx, cy, s.size, 0, Math.PI * 2);
            ctx.fill();
          } else {
            ctx.fillStyle = s.color;
            ctx.beginPath();
            ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
            ctx.fill();
          }
        });

        rafId = requestAnimationFrame(render);
      }

      function wakeRender() {
        if (!rafId) rafId = requestAnimationFrame(render);
      }


      function setP(v) {
        p = Math.max(0, Math.min(1, Number(v) || 0));
        root.style.setProperty('--p', String(p));
        const alpha = 0.20 + p * 0.70;
        root.style.setProperty('--hole-alpha', String(Math.max(0.08, Math.min(1, alpha))));
      }

      function acceptStarryWs(typ) {
        const t = String(typ || '');
        if (t === 'interaction_state' || t === 'bridge_ready') return true;
        if (interactionState === 'weak_preview')
          return t === 'dragenter' || t === 'dragleave';
        if (interactionState === 'analyzing')
          return t === 'dragenter' || t === 'dragleave' || t === 'drop';
        return false;
      }

      function useExternalLauncherLayer() {
        return !!window.__gdhoUseLauncherLayer;
      }

      function applyInteractionStateStarry(msg) {
        if (msg && msg.version != null) {
          const v = Number(msg.version);
          if (!Number.isNaN(v) && v <= lastInteractionVersion) return;
          if (!Number.isNaN(v)) lastInteractionVersion = v;
        }
        const st = String((msg && msg.state) || 'idle');
        interactionState = st;
        if (st === 'idle') {
          window.__gdhoOlePassthrough = false;
          root.classList.remove('ole-passthrough');
          window.HoleOverlay.setSleepMode(true);
          window.HoleOverlay.hideSilent();
          return;
        }
        if (st === 'weak_preview') {
          window.HoleOverlay.setSleepMode(false);
          root.classList.add('show');
          setP(0.55);
          wakeRender();
          return;
        }
        if (st === 'analyzing') {
          window.HoleOverlay.setSleepMode(false);
          if (!root.classList.contains('show')) {
            root.classList.add('show');
            setP(0.55);
            wakeRender();
          }
          return;
        }
        if (st === 'resulting' || st === 'dragging') {
          window.HoleOverlay.setSleepMode(false);
          window.__gdhoUseLauncherLayer = true;
          root.classList.add('use-external-launcher');
          if (!useExternalLauncherLayer()) {
            try { window.HoleOverlay.applySceneLauncherConfig?.({ sceneToolbarLayout: [] }); } catch (_) {}
            window.HoleOverlay.showSceneLauncher(capturedPreview);
          } else {
            window.HoleOverlay.hideSceneLauncher();
            window.__gdhoOlePassthrough = false;
            root.classList.remove('ole-passthrough');
          }
        }
      }

      function resizeGestureTrailCanvas() {
        if (!gestureTrailCanvas || !gestureTrailCtx) return;
        const dpr = window.devicePixelRatio || 1;
        const w = window.innerWidth || 800;
        const h = window.innerHeight || 800;
        gestureTrailCanvas.width = Math.floor(w * dpr);
        gestureTrailCanvas.height = Math.floor(h * dpr);
        gestureTrailCanvas.style.width = w + 'px';
        gestureTrailCanvas.style.height = h + 'px';
        gestureTrailCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }
      resizeGestureTrailCanvas();
      window.addEventListener('resize', resizeGestureTrailCanvas);

      window.HoleOverlay = {
        clearGestureTrail: () => {
          if (!gestureTrailCtx || !gestureTrailCanvas) return;
          gestureTrailActive = false;
          gestureTrailMatched = false;
          gestureTrailStroke = 'rgba(140, 190, 255, 0.48)';
          gestureTrailCanvas.classList.remove('active', 'trail-pending', 'trail-matched');
          gestureTrailCtx.clearRect(0, 0, gestureTrailCanvas.width, gestureTrailCanvas.height);
        },
        gestureTrailSetMatch: (matched, dir) => {
          if (!gestureTrailCanvas) return;
          const ok = !!matched;
          gestureTrailMatched = ok;
          gestureTrailStroke = ok ? 'rgba(80, 255, 180, 0.92)' : 'rgba(140, 190, 255, 0.48)';
          gestureTrailCanvas.classList.toggle('trail-matched', ok);
          gestureTrailCanvas.classList.toggle('trail-pending', !ok && gestureTrailActive);
          if (gestureTrailCtx && gestureTrailActive) {
            gestureTrailCtx.strokeStyle = gestureTrailStroke;
            gestureTrailCtx.lineWidth = ok ? 2.8 : 2.2;
          }
        },
        gestureTrailPoint: (cx, cy) => {
          if (!gestureTrailCtx || !gestureTrailCanvas) return;
          const x = Number(cx) || 0;
          const y = Number(cy) || 0;
          if (!gestureTrailActive) {
            gestureTrailActive = true;
            gestureTrailMatched = false;
            gestureTrailStroke = 'rgba(140, 190, 255, 0.48)';
            gestureTrailLastX = x;
            gestureTrailLastY = y;
            gestureTrailCanvas.classList.add('active', 'trail-pending');
            gestureTrailCanvas.classList.remove('trail-matched');
            gestureTrailCtx.clearRect(0, 0, gestureTrailCanvas.width, gestureTrailCanvas.height);
            gestureTrailCtx.strokeStyle = gestureTrailStroke;
            gestureTrailCtx.lineWidth = 2.2;
            gestureTrailCtx.lineJoin = 'round';
            gestureTrailCtx.lineCap = 'round';
            gestureTrailCtx.beginPath();
            gestureTrailCtx.moveTo(x, y);
          } else {
            gestureTrailCtx.strokeStyle = gestureTrailStroke;
            gestureTrailCtx.lineTo(x, y);
            gestureTrailCtx.stroke();
            gestureTrailLastX = x;
            gestureTrailLastY = y;
          }
        },
        show: (_payload, opts) => {
          if(!(opts && opts.prewarm)) window.__gdhoUserInteracting = true;
          if (_payload === 'text' || _payload === 'file') payloadType = _payload;
          window.HoleOverlay.setSleepMode(false);
          if(!isGalaxyOpen) {
            root.classList.add('show');
            setP(opts && opts.prewarm ? 0.32 : 0.55);
          }
        },
        hideSilent: () => {
          window.__gdhoUserInteracting = false;
          if (expandTimer) {
            clearTimeout(expandTimer);
            expandTimer = 0;
          }
          root.classList.remove('show', 'drop', 'expanding', 'expanded');
          isGalaxyOpen = false;
          setP(0);
          window.HoleOverlay.hideSceneLauncher();
          window.HoleOverlay.clearGestureTrail();
        },
        showSceneLauncher: (preview) => {
          if (useExternalLauncherLayer()) return;
          if (preview != null) capturedPreview = String(preview || '');
          window.__gdhoOlePassthrough = false;
          root.classList.remove('ole-passthrough');
          var api = ensureSceneLauncher();
          if (!api) return;
          var grid = document.querySelector('#holeSceneLauncher .hole-scene-grid');
          if (!grid || !grid.children.length) {
            api.buildGrid([]);
          }
          api.setPreview(capturedPreview);
          api.show();
          var host = document.getElementById('holeSceneLauncher');
          if (host) host.style.pointerEvents = 'auto';
        },
        hideSceneLauncher: () => {
          if (sceneLauncherApi) sceneLauncherApi.hide();
          var host = document.getElementById('holeSceneLauncher');
          if (host) {
            host.classList.remove('visible');
            host.style.display = 'none';
            host.style.visibility = 'hidden';
            host.style.opacity = '0';
            host.style.pointerEvents = 'none';
          }
        },
        applySceneLauncherConfig: (cfg) => {
          var api = ensureSceneLauncher();
          if (!api) return;
          var layout = cfg && cfg.sceneToolbarLayout ? cfg.sceneToolbarLayout : cfg;
          api.buildGrid(layout);
        },
        hide: () => {
          window.HoleOverlay.hideSilent();
          try { window.chrome?.webview?.postMessage(JSON.stringify({ type: 'hole_close', windowRole: 'starry' })); } catch (_) {}
        },
        moveTo: (o) => {
          if(isGalaxyOpen) return;
          if (!o) return;
          const x = Math.max(225, Math.min(395, Number(o.x) || 310));
          const y = Math.max(225, Math.min(395, Number(o.y) || 310));
          lastX = x;
          lastY = y;
          root.style.setProperty('--hx', x + 'px');
          root.style.setProperty('--hy', y + 'px');
        },
        update: (o) => {
          if (!(o && o.prewarm)) window.__gdhoUserInteracting = true;
          window.HoleOverlay.setSleepMode(false);
          if(isGalaxyOpen) return;
          root.classList.add('show');
          if (o && typeof o.proximity === 'number') {
            setP(o.proximity);
          } else if (o && typeof o.x === 'number' && typeof o.y === 'number') {
            const dx = o.x - lastX;
            const dy = o.y - lastY;
            const d = Math.sqrt(dx * dx + dy * dy);
            const r = 140;
            setP(1 - d / r);
          } else {
            setP(0.45);
          }
        },
        setProximity: (v) => {
          setP(v);
          if (!isGalaxyOpen && p >= 0.05) root.classList.add('show');
          if (!sleepMode && (p >= 0.01 || root.classList.contains('show'))) wakeRender();
        },
        setSleepMode: (v) => {
          sleepMode = !!v;
          root.classList.toggle('sleep', sleepMode);
          if (!sleepMode) wakeRender();
        },
        drop: (o) => {
          const force = !!(o && o.force);
          if (isGalaxyOpen && !force) return;
          if (o && (o.payload === 'text' || o.payload === 'file')) payloadType = o.payload;
          window.__gdhoUseLauncherLayer = true;
          root.classList.add('use-external-launcher');
          if (useExternalLauncherLayer()) {
            try { window.HoleOverlay.hideSceneLauncher(); } catch (_) {}
            try {
              postHost({
                type: 'launcher_expand_start',
                payload: payloadType || 'text',
                previewText: capturedPreview
              });
            } catch (_) {}
          }
          window.HoleOverlay.setSleepMode(false);
          root.classList.add('show');
          setP(1);
          isGalaxyOpen = true;
          root.classList.add('drop');
          root.classList.add('expanding');
          root.classList.remove('expanded');
          if (expandTimer) clearTimeout(expandTimer);
          expandTimer = setTimeout(() => {
            root.classList.remove('expanding');
            root.classList.add('expanded');
            expandTimer = 0;
            try {
              if (!useExternalLauncherLayer()) {
                window.HoleOverlay.applySceneLauncherConfig?.({ sceneToolbarLayout: [] });
                window.HoleOverlay.showSceneLauncher(capturedPreview);
              }
            } catch (_) {}
            try {
              postHost({
                type: 'hole_expand_complete',
                payload: payloadType || 'text'
              });
            } catch (_) {}
          }, 1250);
        },
        setStyle: () => {},
        setTheme: () => {},
        setNativeState: () => {},
        setTranscript: () => {},
        setOlePassthrough: (on) => {
          const enable = !!on;
          window.__gdhoOlePassthrough = enable;
          if (enable) root.classList.add('ole-passthrough');
          else root.classList.remove('ole-passthrough');
          try {
            if (window.chrome && window.chrome.webview && window.chrome.webview.postMessage) {
              window.chrome.webview.postMessage(JSON.stringify({ type: 'gdho_dbg_ole_passthrough', on: enable }));
            }
          } catch (_) {}
        }
      };

      holeBody.addEventListener('click', (e) => {
        e.stopPropagation();
        try {
          if (window.chrome && window.chrome.webview && window.chrome.webview.postMessage) {
            window.chrome.webview.postMessage(JSON.stringify({ type: 'hole_click', windowRole: 'starry' }));
          }
        } catch (_) {}
      });

      const dragAccept = (e) => {
        if (window.__gdhoOlePassthrough || root.classList.contains('ole-passthrough')) {
          return;
        }
        e.preventDefault();
        e.stopPropagation();
        if (e.dataTransfer) {
          try { e.dataTransfer.effectAllowed = 'all'; } catch (_) {}
          try { e.dataTransfer.dropEffect = 'copy'; } catch (_) {}
        }
        if (!isGalaxyOpen) {
          window.HoleOverlay.setSleepMode(false);
          root.classList.add('show');
          setP(1);
          wakeRender();
        }
      };
      window.addEventListener('dragenter', dragAccept, true);
      window.addEventListener('dragover', dragAccept, true);
      window.addEventListener('drop', (e) => {
        if (window.__gdhoOlePassthrough || root.classList.contains('ole-passthrough')) {
          return;
        }
        e.preventDefault();
        e.stopPropagation();
        if (e.dataTransfer) {
          try { e.dataTransfer.effectAllowed = 'all'; } catch (_) {}
          try { e.dataTransfer.dropEffect = 'copy'; } catch (_) {}
        }
        const hasFiles = !!(e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length > 0);
        const paths = [];
        if (hasFiles) {
          for (let i = 0; i < e.dataTransfer.files.length; i++) {
            try {
              const f = e.dataTransfer.files[i];
              if (f && f.path) paths.push(String(f.path));
            } catch (_) {}
          }
        }
        let plain = '';
        try { plain = (e.dataTransfer && e.dataTransfer.getData) ? String(e.dataTransfer.getData('text/plain') || '').trim() : ''; } catch (_) {}
        try {
          if (window.chrome && window.chrome.webview && window.chrome.webview.postMessage) {
            const msg = hasFiles && paths.length
              ? { type: 'hole_web_drop', windowRole: 'starry', kind: 'file', files: paths }
              : { type: 'hole_web_drop', windowRole: 'starry', kind: 'text', text: plain || '' };
            window.chrome.webview.postMessage(JSON.stringify(msg));
          }
        } catch (_) {}
        window.HoleOverlay.drop({ payload: hasFiles ? 'file' : 'text' });
      }, true);

      // 常驻模式：不再使用全局点击自动隐藏，避免输入面板获取焦点时黑洞消失。
      // 关闭路径仅保留：右上角关闭按钮 / AHK 热键 / 显式调用 HoleOverlay.hide()。

      function connectHoleWs() {
        if (holeSocket && (holeSocket.readyState === WebSocket.OPEN || holeSocket.readyState === WebSocket.CONNECTING))
          return;
        try {
          holeSocket = new WebSocket(HOLE_WS_URL);
          holeSocket.onmessage = (e) => {
            let msg;
            try { msg = JSON.parse(e.data); } catch (_) { return; }
            const t = String(msg.type || '');
            if (t === 'window_policy') {
              window.__gdhoUseLauncherLayer = true;
              try {
                postHost(Object.assign({ type: 'window_policy', windowRole: 'starry' }, msg));
              } catch (_) {}
              if (String(msg.state || '') === 'resulting') {
                try { window.HoleOverlay.hideSceneLauncher(); } catch (_) {}
              }
              return;
            }
            if (t === 'interaction_state') {
              applyInteractionStateStarry(msg);
              return;
            }
            if (!acceptStarryWs(t)) return;
            if (t === 'bridge_ready') return;
            if (t === 'dragenter') {
              gravityBoostUntil = performance.now() + 1200;
              if (typeof msg.x === 'number' && typeof msg.y === 'number') {
                root.style.setProperty('--hx', Math.max(80, msg.x) + 'px');
                root.style.setProperty('--hy', Math.max(80, msg.y) + 'px');
              }
              window.HoleOverlay.update({ proximity: 1 });
              wakeRender();
              return;
            }
            if (t === 'drop') {
              root.classList.add('swallow-flash');
              setTimeout(() => root.classList.remove('swallow-flash'), 450);
              window.HoleOverlay.drop({ payload: msg.payloadKind === 'file' ? 'file' : 'text' });
              return;
            }
          };
          holeSocket.onclose = () => { setTimeout(connectHoleWs, 1500); };
        } catch (_) {}
      }

      initGalaxy();
      window.HoleOverlay.setSleepMode(true);
      window.__gdhoUseLauncherLayer = true;
      root.classList.add('use-external-launcher');
      window.__gdhoOlePassthrough = false;
      root.classList.remove('ole-passthrough');
      try { window.HoleOverlay.hideSceneLauncher(); } catch (_) {}
      connectHoleWs();

      if (!(window.chrome && window.chrome.webview)) {
        document.body.style.background = "#050508";
        setTimeout(() => {
          if (autoDemoStarted) return;
          autoDemoStarted = true;
          window.HoleOverlay.show();
          setTimeout(() => window.HoleOverlay.drop({ payload: 'text' }), 900);
        }, 500);
      }
    })();
  </script>
</body>
</html>
