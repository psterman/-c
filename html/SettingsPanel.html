<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings Panel</title>
  <link rel="stylesheet" href="settings/settings-shared.css">
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
    #app.settings-shell { display: flex; width: 100%; height: 100%; }
    #frame-wrap {
      flex: 1; position: relative; min-width: 0; min-height: 0;
      contain: strict;
    }
    .settings-frame-pane {
      position: absolute; inset: 0; border: 0; width: 100%; height: 100%;
      visibility: hidden; pointer-events: none;
    }
    .settings-frame-pane.is-active {
      visibility: visible; pointer-events: auto;
    }
  </style>
  <script src="settings/settings-bridge.js?v=llm-bridge-v11"></script>
</head>
<body>
  <div id="app" class="settings-shell">
    <aside id="sidebar">
      <button type="button" class="tab-btn active" data-tab="general">通用设置</button>
      <button type="button" class="tab-btn" data-tab="appearance">外观设置</button>
      <button type="button" class="tab-btn" data-tab="prompts">提示词设置</button>
      <button type="button" class="tab-btn" data-tab="hotkeys">快捷键设置</button>
      <button type="button" class="tab-btn" data-tab="advanced">高级设置</button>
      <button type="button" class="tab-btn" data-tab="storage">存储与缓存</button>
      <button type="button" class="tab-btn" data-tab="screenshot">截图设置</button>
      <button type="button" class="tab-btn" data-tab="search">搜索设置</button>
      <button type="button" class="tab-btn" data-tab="customize">智能定制</button>
    </aside>
    <div id="frame-wrap"></div>
  </div>
  <script>document.addEventListener("DOMContentLoaded", () => window.NmerSettingsBridge.init());</script>
</body>
</html>
