<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hole Interactive Panel</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      user-select: text;
    }
    #panelRoot {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: flex-end;
      justify-content: flex-start;
      padding: 12px;
      pointer-events: none;
      transition: opacity 0.18s ease;
    }
    #panelRoot[data-interaction-state="idle"] {
      opacity: 0 !important;
      pointer-events: none !important;
    }
    #manualPanel.dragging {
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
      background: rgb(5, 10, 16);
      opacity: 1 !important;
    }
    #manualPanel {
      position: relative;
      width: min(460px, 100%);
      max-height: calc(100vh - 24px);
      overflow: auto;
      background: rgba(5, 10, 16, 0.72);
      border: 1px solid rgba(0, 255, 170, 0.28);
      border-radius: 12px;
      padding: 12px;
      color: #d6fff1;
      font: 12px/1.4 "Segoe UI", "Microsoft YaHei", sans-serif;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      pointer-events: auto !important;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
    }
    #manualPanelHeader {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      margin-bottom: 6px;
      cursor: move;
      flex-wrap: nowrap;
    }
    #manualPanelTitle { flex: 1; min-width: 0; text-align: center; }
    #manualPanelTitle { font-weight: 700; letter-spacing: 0.02em; }
    #manualCloseBtn {
      width: 28px;
      height: 28px;
      min-width: 28px;
      padding: 0;
      border-radius: 8px;
      border: 1px solid rgba(255, 120, 120, 0.65);
      background: rgba(255, 70, 70, 0.2);
      color: #ffd7d7;
      font-weight: 700;
      cursor: pointer;
    }
    #manualPanel .row { display: flex; gap: 8px; margin-top: 8px; }
    #apiConfigDetails {
      margin-top: 8px;
      border: 1px solid rgba(160, 255, 220, 0.2);
      border-radius: 10px;
      background: rgba(10, 18, 26, 0.5);
      overflow: hidden;
    }
    #apiConfigDetails > summary {
      list-style: none;
      cursor: pointer;
      padding: 8px 10px;
      color: #9df7cc;
      font-weight: 600;
      user-select: none;
    }
    #apiConfigDetails > summary::-webkit-details-marker { display: none; }
    #apiConfigDetails > summary::after {
      content: '展开';
      float: right;
      opacity: 0.8;
      font-weight: 400;
      font-size: 11px;
    }
    #apiConfigDetails[open] > summary::after { content: '收起'; }
    #apiConfigBody { padding: 0 10px 10px; }
    #manualPanel input, #manualPanel textarea, #manualPanel button {
      width: 100%;
      border-radius: 8px;
      border: 1px solid rgba(160, 255, 220, 0.25);
      background: rgb(12, 18, 24);
      color: #d9fff4;
      padding: 8px;
      font: inherit;
      outline: none;
    }
    #manualPanel textarea { min-height: 72px; resize: vertical; }
    #manualPanel button {
      width: auto;
      cursor: pointer;
      background: rgba(0, 255, 140, 0.18);
      border-color: rgba(0, 255, 140, 0.45);
    }
    #manualPanel .send-btn {
      min-width: 132px;
      font-weight: 700;
      font-size: 14px;
      padding: 10px 16px;
      background: linear-gradient(135deg, rgba(0,255,140,0.32), rgba(0,180,255,0.28));
    }
    #manualPanel .hint { opacity: 0.8; font-size: 11px; margin-top: 6px; }
    #holeStreamHud {
      margin-top: 10px;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid rgba(0, 255, 120, 0.35);
      background: rgba(0, 12, 8, 0.55);
      color: #00ff7a;
      font: 400 12px/1.5 "Cascadia Mono", "Consolas", monospace;
      white-space: pre-wrap;
      word-break: break-word;
      max-height: min(200px, 28vh);
      overflow: auto;
      opacity: 0;
      transition: opacity 220ms ease;
    }
    #holeStreamHud.show { opacity: 1; }
    #resultPanel {
      margin-top: 10px;
      border: 1px solid rgba(0, 255, 120, 0.3);
      border-radius: 10px;
      padding: 8px;
      background: rgba(0, 14, 10, 0.46);
    }
    #resultHead { font-size: 11px; color: #9df7cc; margin-bottom: 6px; }
    #resultBody {
      min-height: 90px;
      max-height: 240px;
      overflow: auto;
      white-space: pre-wrap;
      word-break: break-word;
      font: 13px/1.5 "Segoe UI", "Microsoft YaHei", sans-serif;
      color: #e9fff5;
    }
    #manualPanelMiniBtn {
      position: fixed;
      left: 20px;
      bottom: 20px;
      z-index: 2;
      display: none;
      border-radius: 10px;
      border: 1px solid rgba(0, 255, 180, 0.6);
      background: rgba(0, 40, 30, 0.8);
      color: #bfffea;
      padding: 8px 12px;
      cursor: pointer;
      pointer-events: auto;
    }
    #panelPassthroughWrap { display: none !important; }
    #panelRoot[data-view="manual"] #holeLauncher { display: none !important; }
    #panelRoot[data-view="launcher"] #manualPanel { display: none !important; }
    #holeLauncher {
      position: relative;
      width: min(520px, 100%);
      max-height: calc(100vh - 24px);
      overflow: hidden;
      display: none;
      flex-direction: column;
      pointer-events: auto !important;
      background: rgba(8, 12, 18, 0.42);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 18px;
      padding: 14px 14px 12px;
      backdrop-filter: blur(28px) saturate(1.35);
      -webkit-backdrop-filter: blur(28px) saturate(1.35);
      box-shadow: 0 18px 48px rgba(0, 0, 0, 0.38), inset 0 1px 0 rgba(255, 255, 255, 0.08);
    }
    #panelRoot[data-view="launcher"] #holeLauncher { display: flex; }
    #launcherHeader {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
      cursor: move;
      user-select: none;
    }
    #launcherTitle {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: rgba(255, 255, 255, 0.92);
    }
    #launcherSubtitle {
      font-size: 11px;
      color: rgba(200, 230, 220, 0.62);
      margin-top: 2px;
      max-width: 280px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #launcherCloseBtn {
      width: 28px;
      height: 28px;
      min-width: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      border: 1px solid rgba(255, 102, 0, 0.28);
      background: rgba(6, 10, 16, 0.45);
      color: #ff8533;
      cursor: pointer;
      padding: 0;
      transition: border-color 0.18s ease, background 0.18s ease, color 0.18s ease;
    }
    #launcherCloseBtn svg {
      width: 13px;
      height: 13px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2.2;
      stroke-linecap: round;
      pointer-events: none;
    }
    #launcherCloseBtn:hover {
      border-color: rgba(255, 140, 60, 0.5);
      background: rgba(12, 16, 22, 0.62);
      color: #ffaa66;
    }
    #launcherGrid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px 12px;
      padding: 6px 4px 8px;
      overflow-y: auto;
      max-height: calc(100vh - 120px);
    }
    .launcher-tile {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 7px;
      padding: 0;
      border: none;
      background: transparent;
      cursor: pointer;
      color: inherit;
      outline: none;
      transition: transform 0.16s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .launcher-tile:hover { transform: scale(1.06); }
    .launcher-tile:active { transform: scale(0.94); }
    /* 启动器图标：hole-scene-launcher.js 注入玻璃拟态样式 */
    .launcher-label {
      font-size: 11px;
      line-height: 1.25;
      text-align: center;
      color: rgba(240, 255, 250, 0.88);
      max-width: 72px;
      word-break: break-all;
    }
    #manualBackBtn {
      margin-right: 6px;
      padding: 4px 8px;
      border-radius: 7px;
      border: 1px solid rgba(160, 255, 220, 0.35);
      background: rgba(0, 60, 45, 0.35);
      color: #9df7cc;
      font-size: 11px;
      cursor: pointer;
    }
    /* 方案 B：透明窗居中叠在黑洞圆心 */
    body.overlay-hole-mode,
    body.overlay-hole-mode #panelRoot {
      background: transparent !important;
    }
    body.overlay-hole-mode #panelRoot {
      align-items: center;
      justify-content: center;
      padding: 0;
      pointer-events: none;
    }
    body.overlay-hole-mode #panelBootPlaceholder { display: none !important; }
    body.overlay-hole-mode #holeLauncher {
      width: 420px;
      max-height: 420px;
      background: transparent;
      border: none;
      box-shadow: none;
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
      padding: 6px 8px 4px;
      pointer-events: auto !important;
    }
    body.overlay-hole-mode #launcherHeader {
      display: none !important;
    }
  </style>
  <script src="https://app.local/assets/hole-scene-launcher.js"></script>
</head>
<body>
  <div id="panelBootPlaceholder" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#9df7cc;font:14px/1.5 'Segoe UI','Microsoft YaHei',sans-serif;background:rgba(5,10,16,0.94);z-index:0;">
    正在加载 AI 面板…
  </div>
  <div id="panelRoot" data-view="launcher">
    <section id="holeLauncher" aria-label="黑洞启动器">
      <div id="launcherHeader">
        <div>
          <div id="launcherTitle">启动器</div>
          <div id="launcherSubtitle">选择场景 · 与快捷键绑定器悬浮栏同步</div>
        </div>
        <button id="launcherCloseBtn" type="button" title="关闭" aria-label="关闭">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <div id="launcherGrid" role="grid"></div>
    </section>
    <div id="manualPanel">
      <div id="manualPanelHeader">
        <button id="manualBackBtn" type="button" title="返回启动器">‹ 启动器</button>
        <div id="manualPanelTitle">AI 黑洞手动激活</div>
        <button id="manualCloseBtn" type="button" title="关闭面板">×</button>
      </div>
      <details id="apiConfigDetails">
        <summary>API 设置</summary>
        <div id="apiConfigBody">
          <div class="row">
            <select id="apiProvider">
              <option value="deepseek">DeepSeek</option>
              <option value="openai">OpenAI</option>
              <option value="ollama">Ollama (本地)</option>
              <option value="custom">自定义</option>
            </select>
          </div>
          <div class="row">
            <input id="apiBaseUrl" placeholder="Base URL" />
            <input id="apiModel" placeholder="Model" />
          </div>
          <div class="row">
            <input id="apiKey" placeholder="API Key" />
          </div>
        </div>
      </details>
      <div class="row">
        <textarea id="manualPrompt" placeholder="输入文本后点击发送"></textarea>
      </div>
      <div class="row">
        <button id="sendManualBtn" type="button">发送到黑洞</button>
        <button id="testApiBtn" type="button">测试连接</button>
      </div>
      <div class="hint">提示：支持 Ctrl+Enter 发送；MiniMax Anthropic 地址请用 https://api.minimaxi.com/anthropic 或 https://api.minimax.io/anthropic（勿写成 api.minimax.com）</div>
      <div id="holeStreamHud" aria-live="polite"></div>
      <div id="resultPanel">
        <div id="resultHead">结果输出</div>
        <div id="resultBody">等待输入后发送...</div>
      </div>
    </div>
  </div>
  <button id="manualPanelMiniBtn" type="button">显示输入面板</button>

  <script>
    (function () {
      const manualPanel = document.getElementById('manualPanel');
      const manualPanelHeader = document.getElementById('manualPanelHeader');
      const manualPanelMiniBtn = document.getElementById('manualPanelMiniBtn');
      const manualCloseBtn = document.getElementById('manualCloseBtn');
      const streamHud = document.getElementById('holeStreamHud');
      const apiBaseUrlInput = document.getElementById('apiBaseUrl');
      const apiModelInput = document.getElementById('apiModel');
      const apiKeyInput = document.getElementById('apiKey');
      const manualPromptInput = document.getElementById('manualPrompt');
      const sendManualBtn = document.getElementById('sendManualBtn');
      const testApiBtn = document.getElementById('testApiBtn');
      const apiProviderSelect = document.getElementById('apiProvider');
      const resultHead = document.getElementById('resultHead');
      const resultBody = document.getElementById('resultBody');
      const STORAGE_KEY = 'nmer_hole_manual_cfg_v1';
      const NIUMA_CFG_V2 = 'niuma_chat_drawer_config_v2';
      const NIUMA_CFG_V1 = 'niuma_chat_drawer_config_v1';
      const NIUMA_PROVIDER_PRESETS = [
        { id: 'deepseek', label: 'DeepSeek', baseUrl: 'https://api.deepseek.com/v1', model: 'deepseek-chat' },
        { id: 'openai', label: 'OpenAI', baseUrl: 'https://api.openai.com/v1', model: 'gpt-4.1-mini' },
        { id: 'ollama', label: 'Ollama (云端)', baseUrl: 'http://127.0.0.1:11434/v1', model: 'nemotron-3-super:cloud' },
        { id: 'kimi', label: 'Kimi', baseUrl: 'https://api.moonshot.cn/v1', model: 'kimi-k2.6' },
        { id: 'qwen', label: 'Qwen', baseUrl: 'https://dashscope.aliyuncs.com/compatible-mode/v1', model: 'qwen-plus' },
        { id: 'claude', label: 'Claude', baseUrl: 'https://api.anthropic.com', model: 'claude-3-5-sonnet-latest' },
        { id: 'gemini', label: 'Gemini', baseUrl: 'https://generativelanguage.googleapis.com/v1beta', model: 'gemini-2.5-flash' },
        { id: 'glm', label: 'GLM', baseUrl: 'https://open.bigmodel.cn/api/paas/v4', model: 'glm-4-plus' },
        { id: 'zhipu', label: '智谱', baseUrl: 'https://open.bigmodel.cn/api/paas/v4', model: 'glm-4-plus' },
        { id: 'siliconflow', label: '硅基流动', baseUrl: 'https://api.siliconflow.cn/v1', model: 'Qwen/Qwen2.5-7B-Instruct' },
        { id: 'minimax', label: 'MiniMax', baseUrl: 'https://api.minimax.io/v1', model: 'MiniMax-M2.7' },
        { id: 'openclaw', label: 'OpenClaw', baseUrl: 'http://127.0.0.1:18789', model: 'gateway' },
        { id: 'custom', label: '自定义', baseUrl: '', model: '' }
      ];
      let niumaCfgCache = null;
      const HOLE_WS_URL = 'ws://127.0.0.1:18790/hole';
      let holeSocket = null;
      let activeRequestId = null;
      let streamBuffer = '';
      let manualPanelVisible = true;
      let manualPanelDragging = false;
      let manualPanelDragMoved = false;
      let manualDragOffsetX = 0;
      let manualDragOffsetY = 0;
      let dragHostOriginX = 0;
      let dragHostOriginY = 0;
      let dragPointerScreenX = 0;
      let dragPointerScreenY = 0;
      let dragMoveRaf = 0;
      let dragPendingX = 0;
      let dragPendingY = 0;
      let interactionState = 'idle';
      let hostPresented = false;
      let panelLoaded = false;
      let lastInteractionVersion = 0;
      let panelView = 'launcher';
      let capturedPreview = '';

      const LAUNCHER_ITEMS = (window.HoleSceneLauncher && window.HoleSceneLauncher.ITEMS) || [];
      if (window.HoleSceneLauncher && window.HoleSceneLauncher.ensureStyle) {
        window.HoleSceneLauncher.ensureStyle();
      }

      const launcherGrid = document.getElementById('launcherGrid');
      const launcherHeader = document.getElementById('launcherHeader');
      const launcherCloseBtn = document.getElementById('launcherCloseBtn');
      const launcherSubtitle = document.getElementById('launcherSubtitle');
      const manualBackBtn = document.getElementById('manualBackBtn');
      const panelRootEl = document.getElementById('panelRoot');

      const PANEL_WS_ALLOW = {
        idle: new Set(['interaction_state', 'bridge_ready']),
        weak_preview: new Set(['interaction_state', 'bridge_ready']),
        analyzing: new Set(['interaction_state', 'bridge_ready', 'drop']),
        resulting: null,
        dragging: null
      };

      function acceptPanelWs(typ) {
        const t = String(typ || '');
        const allow = PANEL_WS_ALLOW[interactionState];
        if (allow === null) return true;
        return allow ? allow.has(t) : false;
      }

      function ensurePanelLoaded() {
        if (panelLoaded) return;
        panelLoaded = true;
        loadManualConfig();
        applyProviderPreset(apiProviderSelect?.value || 'deepseek');
        connectHoleWs();
      }

      function postHost(payload) {
        try {
          const wv = window.chrome && window.chrome.webview;
          if (!wv || !wv.postMessage) return;
          const body = typeof payload === 'string' ? payload : JSON.stringify(Object.assign({ windowRole: 'panel' }, payload));
          wv.postMessage(body);
        } catch (_) {}
      }

      function normalizeSceneId(v) {
        const s = String(v || '').trim().toLowerCase();
        return s === 'notepad' ? 'scratchpad' : s;
      }

      function setPanelView(view) {
        panelView = view === 'manual' ? 'manual' : 'launcher';
        if (panelRootEl) panelRootEl.dataset.view = panelView;
        if (panelView === 'launcher') {
          if (manualPanel) manualPanel.style.display = 'none';
          if (holeLauncher) holeLauncher.style.display = 'flex';
          manualPanelVisible = false;
        } else {
          if (holeLauncher) holeLauncher.style.display = 'none';
          if (manualPanel) manualPanel.style.display = 'block';
          manualPanelVisible = true;
        }
        if (manualPanelMiniBtn) {
          manualPanelMiniBtn.style.display = (hostPresented && panelView === 'manual' && manualPanelVisible) ? 'none' : (hostPresented ? 'block' : 'none');
        }
      }

      const holeLauncher = document.getElementById('holeLauncher');

      function updateLauncherSubtitle() {
        if (!launcherSubtitle) return;
        const t = String(capturedPreview || '').trim();
        launcherSubtitle.textContent = t
          ? ('已捕获 ' + (t.length > 36 ? t.slice(0, 36) + '…' : t))
          : '选择场景 · 与快捷键绑定器悬浮栏同步';
      }

      function buildLauncherGrid(sceneToolbarLayout) {
        if (!launcherGrid) return;
        launcherGrid.innerHTML = '';
        const layout = Array.isArray(sceneToolbarLayout) ? sceneToolbarLayout : [];
        const byScene = {};
        layout.forEach((row) => {
          const sid = normalizeSceneId(row && row.sceneId);
          if (!sid) return;
          byScene[sid] = row;
        });
        const tiles = [];
        LAUNCHER_ITEMS.forEach((it, idx) => {
          const sid = normalizeSceneId(it.sceneId);
          const row = byScene[sid];
          const visible = it.internal || it.always || !row || row.visible_in_bar !== false;
          if (!visible) return;
          const ord = row && Number.isFinite(Number(row.order_bar)) ? Number(row.order_bar) : (it.internal ? -2 : 100 + idx);
          tiles.push({ it, ord, idx });
        });
        tiles.sort((a, b) => (a.ord !== b.ord ? a.ord - b.ord : a.idx - b.idx));
        if (!tiles.length) {
          const empty = document.createElement('div');
          empty.style.cssText = 'grid-column:1/-1;padding:16px;text-align:center;color:rgba(200,230,220,.65);font-size:12px;';
          empty.textContent = '请在快捷键绑定器勾选「进悬浮栏」的场景';
          launcherGrid.appendChild(empty);
          return;
        }
        tiles.forEach(({ it }) => {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'launcher-tile';
          btn.setAttribute('role', 'gridcell');
          btn.title = it.title;
          const icon = document.createElement('div');
          icon.className = 'launcher-icon hole-scene-icon';
          if (window.HoleSceneLauncher && window.HoleSceneLauncher.renderIcon) {
            window.HoleSceneLauncher.renderIcon(icon, it);
          }
          const lab = document.createElement('span');
          lab.className = 'launcher-label';
          lab.textContent = it.title;
          btn.appendChild(icon);
          btn.appendChild(lab);
          btn.addEventListener('click', () => {
            if (it.internal || it.sceneId === 'hole_manual') {
              openManualWithText(capturedPreview);
              return;
            }
            postHost({
              type: 'panel_scene_pick',
              sceneId: it.sceneId,
              cmdId: it.cmdId || '',
              internal: false
            });
          });
          launcherGrid.appendChild(btn);
        });
      }

      function applyDockConfig(cfg) {
        const layout = cfg && Array.isArray(cfg.sceneToolbarLayout) ? cfg.sceneToolbarLayout : (Array.isArray(cfg) ? cfg : []);
        buildLauncherGrid(layout);
      }

      function showLauncher(previewText) {
        if (previewText != null) capturedPreview = String(previewText || '');
        ensurePanelLoaded();
        hostPresented = true;
        setPanelView('launcher');
        updateLauncherSubtitle();
        const boot = document.getElementById('panelBootPlaceholder');
        if (boot) boot.style.display = 'none';
        if (panelRootEl) {
          panelRootEl.style.opacity = '';
          panelRootEl.style.pointerEvents = '';
        }
        resetPanelLayout();
      }

      function openManualWithText(text) {
        const t = String(text != null ? text : capturedPreview || '').trim();
        ensurePanelLoaded();
        hostPresented = true;
        interactionState = interactionState === 'idle' ? 'resulting' : interactionState;
        if (panelRootEl) {
          panelRootEl.dataset.interactionState = interactionState;
          panelRootEl.style.opacity = '';
          panelRootEl.style.pointerEvents = '';
        }
        setPanelView('manual');
        if (resultHead) resultHead.textContent = t ? '已捕获文本' : '手动激活';
        if (resultBody) resultBody.textContent = t || '等待输入后发送...';
        if (manualPromptInput) manualPromptInput.value = t;
        setTimeout(() => focusPromptInput(false), 0);
      }

      function setManualPanelVisible(visible) {
        if (visible) {
          setPanelView('manual');
          return;
        }
        if (panelView === 'manual') setPanelView('launcher');
        else manualPanelVisible = false;
      }

      function applyInteractionState(msg) {
        if (msg && msg.version != null) {
          const v = Number(msg.version);
          if (!Number.isNaN(v) && v <= lastInteractionVersion) return;
          if (!Number.isNaN(v)) lastInteractionVersion = v;
        }
        const st = String((msg && msg.state) || 'idle');
        interactionState = st;
        const root = document.getElementById('panelRoot');
        if (root) {
          root.dataset.interactionState = st;
          if (st === 'idle') {
            hostPresented = false;
            root.style.opacity = '0';
            root.style.pointerEvents = 'none';
          } else {
            root.style.opacity = '';
            root.style.pointerEvents = '';
          }
        }
        if (st === 'idle') {
          setManualPanelVisible(false);
          return;
        }
        if (st === 'weak_preview') {
          hostPresented = false;
          setManualPanelVisible(false);
          return;
        }
        if (st === 'analyzing') {
          ensurePanelLoaded();
          if (hostPresented) return;
          hostPresented = false;
          setManualPanelVisible(false);
          return;
        }
        if (st === 'resulting' || st === 'dragging') {
          ensurePanelLoaded();
          hostPresented = true;
          try { window.HolePanel?.onHostShowLauncher?.(capturedPreview); } catch (_) {
            setPanelView('launcher');
          }
        }
      }

      function sendPointerMoveWs(x, y) {
        if (!holeSocket || holeSocket.readyState !== WebSocket.OPEN) return;

          holeSocket.send(JSON.stringify({ type: 'pointer_move', screenX: x, screenY: y }));
        } catch (_) {}

      function focusPromptInput(selectAll = false) {
        if (!manualPromptInput) return;
        try {
          manualPromptInput.focus({ preventScroll: true });
          if (selectAll && manualPromptInput.value) {
            manualPromptInput.setSelectionRange(0, manualPromptInput.value.length);
          } else {

            manualPromptInput.setSelectionRange(end, end);

      function findProviderPreset(provider) {
        const p = String(provider || '').toLowerCase();
        return NIUMA_PROVIDER_PRESETS.find(x => x.id === p) || null;
      }

      function applyProviderPreset(provider) {
        const p = String(provider || '').toLowerCase();
        const preset = findProviderPreset(p);
        if (!preset) return;
        apiBaseUrlInput.value = apiBaseUrlInput.value || String(preset.baseUrl || '');
        apiModelInput.value = apiModelInput.value || String(preset.model || '');
      }

      function buildProviderOptions(extraProviders = []) {
        if (!apiProviderSelect) return;
        const options = [];
        const seen = new Set();
        NIUMA_PROVIDER_PRESETS.forEach((it) => {
          if (!it || !it.id || seen.has(it.id)) return;
          seen.add(it.id);
          options.push({ id: it.id, label: it.label || it.id });
        });
        (extraProviders || []).forEach((id) => {
          const pid = String(id || '').trim().toLowerCase();
          if (!pid || seen.has(pid)) return;
          seen.add(pid);
          options.push({ id: pid, label: pid });
        });
        const prev = String(apiProviderSelect.value || '').trim().toLowerCase();
        apiProviderSelect.innerHTML = options
          .map(o => `<option value="${o.id}">${o.label}</option>`)
          .join('');
        if (prev && seen.has(prev)) apiProviderSelect.value = prev;
      }

      function syncProviderScopedApiKey(provider) {
        const pid = String(provider || '').trim().toLowerCase();
        if (!apiKeyInput || !pid) return;
        const cfg = niumaCfgCache;
        if (cfg && cfg.apiKeys && typeof cfg.apiKeys === 'object') {
          const keys = cfg.apiKeys || {};
          const norm = (x) => {
            const v = String(x || '').trim().toLowerCase();
            if (v === 'chatgpt' || v === 'codex') return 'openai';
            return v;
          };
          const npid = norm(pid);
          let k = '';
          if (npid && keys[npid] != null) k = String(keys[npid] || '').trim();
          if (!k && npid === 'openai' && keys.codex != null) k = String(keys.codex || '').trim();
          if (!k && npid === 'openai' && keys.chatgpt != null) k = String(keys.chatgpt || '').trim();
          if (!k && cfg.provider) {
            const p2 = norm(cfg.provider);
            if (p2 && keys[p2] != null) k = String(keys[p2] || '').trim();
          }
          if (!k && typeof cfg.apiKey === 'string') k = String(cfg.apiKey || '').trim();
          if (!k && pid !== 'minimax') {
            const firstKey = Object.keys(keys || {}).find(name => String(keys[name] || '').trim() !== '');
            if (firstKey) k = String(keys[firstKey] || '').trim();
          }
          if (k) {
            apiKeyInput.value = k;
            return;
          }
        }
      }

      function normalizeMiniMaxBaseURL(base) {
        let u = String(base || '').trim();
        if (!u) return u;
        try {
          const parsed = new URL(u);
          if (parsed.hostname.toLowerCase() === 'api.minimax.com') parsed.hostname = 'api.minimaxi.com';
          if (parsed.pathname.endsWith('/anthrop')) parsed.pathname = parsed.pathname.slice(0, -'/anthrop'.length) + '/anthropic';
          return parsed.toString();
        } catch (_) {
          if (u.endsWith('/anthrop')) u = u.slice(0, -'/anthrop'.length) + '/anthropic';
          return u;
        }
      }

      function shouldUseAnthropic(provider, baseUrl) {
        const p = String(provider || '').trim().toLowerCase();
        const u = String(baseUrl || '').trim().toLowerCase();
        if (p === 'claude') return true;
        return p === 'minimax' && u.includes('/anthropic');
      }

      function anthropicCompatUrl(base) {
        let u = normalizeMiniMaxBaseURL(String(base || '').trim()).replace(/\/+$/g, '');
        if (!u) return 'https://api.anthropic.com/v1/messages';
        const lu = u.toLowerCase();
        if (lu.endsWith('/v1/messages') || lu.endsWith('/messages')) return u;
        if (lu.endsWith('/v1')) return u + '/messages';
        return u + '/v1/messages';
      }

      function openAICompatUrl(base) {
        const u0 = normalizeMiniMaxBaseURL(String(base || '').trim()).replace(/\/+$/g, '');
        if (!u0) return '';
        const u = u0.toLowerCase();
        if (u.endsWith('/chat/completions')) return u0;
        if (u.endsWith('/v1') || u.endsWith('/v1beta') || u.endsWith('/v4')) return u0 + '/chat/completions';
        return u0 + '/v1/chat/completions';
      }

      async function testApiConnection() {
        const provider = String(apiProviderSelect?.value || '').trim().toLowerCase();
        const baseUrl = String(apiBaseUrlInput?.value || '').trim();
        const model = String(apiModelInput?.value || '').trim();
        const apiKey = String(apiKeyInput?.value || '').trim();
        if (resultHead) resultHead.textContent = '结果输出（连接测试中）';
        if (resultBody) resultBody.textContent = '正在测试...';
        if (!baseUrl || !model || !apiKey) {
          if (resultHead) resultHead.textContent = '结果输出（错误）';
          if (resultBody) resultBody.textContent = '请先填写完整的 Base URL / Model / API Key。';
          return;
        }
        const useAnthropic = shouldUseAnthropic(provider, baseUrl);
        const url = useAnthropic ? anthropicCompatUrl(baseUrl) : openAICompatUrl(baseUrl);
        if (!url) {
          if (resultHead) resultHead.textContent = '结果输出（错误）';
          if (resultBody) resultBody.textContent = 'Base URL 无效。';
          return;
        }
        try {
          const payload = useAnthropic
            ? { model, max_tokens: 8, messages: [{ role: 'user', content: 'ping' }] }
            : { model, stream: false, messages: [{ role: 'user', content: 'ping' }], max_tokens: 8 };
          const headers = { 'Content-Type': 'application/json' };
          if (useAnthropic) {
            headers['anthropic-version'] = '2023-06-01';
            if (provider === 'minimax' || /minimax/i.test(baseUrl)) headers['Authorization'] = 'Bearer ' + apiKey;
            else headers['x-api-key'] = apiKey;
          } else {
            headers['Authorization'] = 'Bearer ' + apiKey;
          }
          const resp = await fetch(url, {
            method: 'POST',
            headers,
            body: JSON.stringify(payload)
          });
          const raw = await resp.text();
          if (resp.ok) {
            if (resultHead) resultHead.textContent = '结果输出（连接成功）';
            if (resultBody) resultBody.textContent = `Provider: ${provider}\nHTTP ${resp.status}\nEndpoint: ${url}`;
          } else {
            if (resultHead) resultHead.textContent = '结果输出（连接失败）';
            if (resultBody) resultBody.textContent = `Provider: ${provider}\nHTTP ${resp.status}\nEndpoint: ${url}\n${raw}`;
          }
        } catch (e) {
          if (resultHead) resultHead.textContent = '结果输出（连接失败）';
          if (resultBody) resultBody.textContent = `请求失败：${String(e && e.message ? e.message : e)}`;
        }
      }

      function connectHoleWs() {
        if (holeSocket && (holeSocket.readyState === WebSocket.OPEN || holeSocket.readyState === WebSocket.CONNECTING))
          return;
        try {
          holeSocket = new WebSocket(HOLE_WS_URL);
          holeSocket.onmessage = (e) => {
            let msg;
            try { msg = JSON.parse(e.data); } catch (_) { return; }
            const t = String(msg.type || '');
            if (t === 'interaction_state') {
              applyInteractionState(msg);
              return;
            }
            if (!acceptPanelWs(t)) return;
            if (t === 'bridge_ready') return;
            if (t === 'drop') {
              if (interactionState !== 'resulting' && interactionState !== 'dragging') return;
              activeRequestId = msg.requestId != null ? msg.requestId : null;
              streamBuffer = '';
              if (resultHead) resultHead.textContent = '结果输出（流式中）';
              if (resultBody) resultBody.textContent = '';
              if (streamHud) {
                streamHud.textContent = '';
                streamHud.classList.remove('show');
              }
              postHost({ type: 'panel_stream_start' });
              return;
            }
            if (t === 'stream_chunk' || t === 'stream_done' || t === 'stream_abort' || t === 'stream_error') {
              if (interactionState !== 'resulting' && interactionState !== 'dragging') return;
            }
            if (t === 'stream_chunk') {
              if (msg.requestId != null && activeRequestId != null && msg.requestId !== activeRequestId) return;
              if (msg.requestId != null) activeRequestId = msg.requestId;
              streamBuffer += String(msg.delta || '');
              if (resultBody) resultBody.textContent = streamBuffer;
              if (streamHud) {
                streamHud.textContent = streamBuffer;
                streamHud.classList.add('show');
              }
              return;
            }
            if (t === 'stream_done') {
              if (resultHead) resultHead.textContent = '结果输出（完成）';
              return;
            }
            if (t === 'stream_abort') {
              streamBuffer = '';
              if (streamHud) {
                streamHud.textContent = '';
                streamHud.classList.remove('show');
              }
              if (resultHead) resultHead.textContent = '结果输出（已取消）';
              activeRequestId = null;
            }
            if (t === 'stream_error') {
              if (resultHead) resultHead.textContent = '结果输出（错误）';
              if (resultBody) resultBody.textContent = String(msg.error || '未知错误');
            }
          };
          holeSocket.onclose = () => { setTimeout(connectHoleWs, 1500); };
        } catch (_) {}
      }

      function sendManualPrompt() {
        const prompt = String(manualPromptInput?.value || '').trim();
        if (!prompt || !holeSocket || holeSocket.readyState !== WebSocket.OPEN) return;
        if (resultHead) resultHead.textContent = '结果输出（请求中）';
        if (resultBody) resultBody.textContent = '';
        postHost({ type: 'panel_stream_start' });
        holeSocket.send(JSON.stringify({
          type: 'manual_prompt',
          provider: String(apiProviderSelect?.value || '').trim().toLowerCase(),
          prompt,
          baseUrl: String(apiBaseUrlInput?.value || '').trim(),
          model: String(apiModelInput?.value || '').trim(),
          apiKey: String(apiKeyInput?.value || '').trim()
        }));
      }

      function loadManualConfig() {
        try {
          const niumaRaw = localStorage.getItem(NIUMA_CFG_V2) || localStorage.getItem(NIUMA_CFG_V1);
          if (niumaRaw) {
            const cfg = JSON.parse(niumaRaw) || {};
            niumaCfgCache = cfg;
            try { console.debug('[HolePanel] niuma cfg loaded', { provider: cfg.provider, apiKeyKeys: Object.keys(cfg.apiKeys || {}) }); } catch (_) {}
            buildProviderOptions(cfg.apiKeys && typeof cfg.apiKeys === 'object' ? Object.keys(cfg.apiKeys) : []);
            const provider = String(cfg.provider || '').trim().toLowerCase();
            if (apiProviderSelect && provider) apiProviderSelect.value = provider;
            if (apiBaseUrlInput && typeof cfg.baseUrl === 'string') apiBaseUrlInput.value = cfg.baseUrl;
            if (apiModelInput && typeof cfg.model === 'string') apiModelInput.value = cfg.model;
            let k = '';
            if (cfg.apiKeys && provider && typeof cfg.apiKeys === 'object') {
              k = String(cfg.apiKeys[provider] || '').trim();
              if (!k && provider === 'openai') k = String(cfg.apiKeys.codex || cfg.apiKeys.chatgpt || '').trim();
            }
            if (!k && typeof cfg.apiKey === 'string') k = String(cfg.apiKey || '').trim();
            // IMPORTANT: do not fallback to arbitrary provider key for minimax.
            if (!k && provider !== 'minimax' && cfg.apiKeys && typeof cfg.apiKeys === 'object') {
              const anyPid = Object.keys(cfg.apiKeys).find(name => String(cfg.apiKeys[name] || '').trim() !== '');
              if (anyPid) k = String(cfg.apiKeys[anyPid] || '').trim();
            }
            if (apiKeyInput && k) apiKeyInput.value = k;
            syncProviderScopedApiKey(provider || apiProviderSelect?.value || '');
            return;
          }
          buildProviderOptions();
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return;
          const cfg = JSON.parse(raw) || {};
          if (apiProviderSelect && typeof cfg.provider === 'string') apiProviderSelect.value = cfg.provider;
          if (apiBaseUrlInput && typeof cfg.baseUrl === 'string') apiBaseUrlInput.value = cfg.baseUrl;
          if (apiModelInput && typeof cfg.model === 'string') apiModelInput.value = cfg.model;
          if (apiKeyInput && typeof cfg.apiKey === 'string') apiKeyInput.value = cfg.apiKey;
        } catch (_) {}
      }

      function saveManualConfig() {
        const provider = String(apiProviderSelect?.value || 'deepseek').toLowerCase();
        const cfg = {
          provider,
          baseUrl: String(apiBaseUrlInput?.value || '').trim(),
          model: String(apiModelInput?.value || '').trim(),
          apiKey: String(apiKeyInput?.value || '').trim()
        };
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(cfg)); } catch (_) {}
        try {
          const raw = localStorage.getItem(NIUMA_CFG_V2) || localStorage.getItem(NIUMA_CFG_V1) || '{}';
          const ncfg = JSON.parse(raw) || {};
          if (!ncfg.apiKeys || typeof ncfg.apiKeys !== 'object') ncfg.apiKeys = {};
          ncfg.provider = provider;
          ncfg.baseUrl = cfg.baseUrl;
          ncfg.model = cfg.model;
          ncfg.apiKeys[provider] = cfg.apiKey;
          localStorage.setItem(NIUMA_CFG_V2, JSON.stringify(ncfg));
          niumaCfgCache = ncfg;
        } catch (_) {}
      }

      function syncDragHostAnchorFromHost(ox, oy) {
        if (Number.isFinite(ox)) dragHostOriginX = ox;
        if (Number.isFinite(oy)) dragHostOriginY = oy;
      }

      if (launcherHeader && holeLauncher) {
        launcherHeader.addEventListener('mousedown', (e) => {
          if (e.button !== 0) return;
          const t = e.target;
          if (t && t.closest && t.closest('button, input, select, textarea, label, a')) return;
          const rect = holeLauncher.getBoundingClientRect();
          manualPanelDragging = true;
          manualPanelDragMoved = false;
          manualDragOffsetX = e.clientX - rect.left;
          manualDragOffsetY = e.clientY - rect.top;
          dragPointerScreenX = e.screenX;
          dragPointerScreenY = e.screenY;
          const winX = (window.screenLeft != null) ? window.screenLeft : (window.screenX || 0);
          const winY = (window.screenTop != null) ? window.screenTop : (window.screenY || 0);
          dragHostOriginX = winX;
          dragHostOriginY = winY;
          try { postHost({ type: 'panel_drag_start', screenX: dragHostOriginX, screenY: dragHostOriginY }); } catch (_) {}
          e.preventDefault();
        });
      }

      if (manualPanelHeader && manualPanel) {
        manualPanelHeader.addEventListener('mousedown', (e) => {
          if (e.button !== 0) return;
          const t = e.target;
          if (t && t.closest && t.closest('button, input, select, textarea, label, a')) return;
          const rect = manualPanel.getBoundingClientRect();
          manualPanelDragging = true;
          manualPanelDragMoved = false;
          manualDragOffsetX = e.clientX - rect.left;
          manualDragOffsetY = e.clientY - rect.top;
          dragPointerScreenX = e.screenX;
          dragPointerScreenY = e.screenY;
          const winX = (window.screenLeft != null) ? window.screenLeft : (window.screenX || 0);
          const winY = (window.screenTop != null) ? window.screenTop : (window.screenY || 0);
          dragHostOriginX = winX;
          dragHostOriginY = winY;
          manualPanel.classList.add('dragging');
          try {
            document.documentElement.style.background = 'rgb(5, 10, 16)';
            document.body.style.background = 'rgb(5, 10, 16)';
            manualPanel.style.opacity = '1';
          } catch (_) {}
          try { postHost({ type: 'panel_drag_start', screenX: dragHostOriginX, screenY: dragHostOriginY }); } catch (_) {}
          e.preventDefault();
          e.stopPropagation();
        });
        window.addEventListener('mousemove', (e) => {
          if (!manualPanelDragging) return;
          manualPanelDragMoved = true;
          dragPendingX = Math.round(dragHostOriginX + (e.screenX - dragPointerScreenX));
          dragPendingY = Math.round(dragHostOriginY + (e.screenY - dragPointerScreenY));
          if (dragMoveRaf) return;
          dragMoveRaf = requestAnimationFrame(() => {
            dragMoveRaf = 0;
            try {
              postHost({ type: 'panel_moved', screenX: dragPendingX, screenY: dragPendingY });
            } catch (_) {}
            sendPointerMoveWs(dragPendingX, dragPendingY);
          });
        });
        window.addEventListener('mouseup', () => {
          if (manualPanelDragging) {
            if (dragMoveRaf) {
              cancelAnimationFrame(dragMoveRaf);
              dragMoveRaf = 0;
            }
            try {
              postHost({ type: 'panel_moved', screenX: dragPendingX, screenY: dragPendingY });
            } catch (_) {}
            sendPointerMoveWs(dragPendingX, dragPendingY);
            try { postHost({ type: 'panel_drag_end' }); } catch (_) {}
          }
          manualPanelDragging = false;
          if (manualPanel) manualPanel.classList.remove('dragging');
          setTimeout(() => { manualPanelDragMoved = false; }, 320);
        });

      setPanelView('launcher');

        panelRootEl.dataset.interactionState = 'idle';

        panelRootEl.style.pointerEvents = 'none';
      }
      buildLauncherGrid([]);
      try {
        window.chrome?.webview?.addEventListener?.('message', (ev) => {
          const raw = ev?.data;
          if (!raw) return;
          let msg;
          try { msg = typeof raw === 'string' ? JSON.parse(raw) : raw; } catch (_) { return; }
          const typ = String(msg?.type || '');
          if (typ === 'host_present') {
            const preview = msg.text != null ? String(msg.text) : '';
            window.HolePanel?.ensurePanelLoaded?.();
            window.HolePanel?.onHostShowLauncher?.(preview);
            return;
          }
          if (typ === 'nmDockConfig' && Array.isArray(msg.sceneToolbarLayout)) {
            window.HolePanel?.applyDockConfig?.(msg);
          }
        });
      } catch (_) {}
    })();
  </script>
</body>
