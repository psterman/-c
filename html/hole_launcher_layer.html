<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hole Launcher Layer</title>
  <style>
    @property --ring-angle {
      syntax: '<angle>';
      initial-value: 0deg;
      inherits: false;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      user-select: none;
      pointer-events: auto;
    }
    #launcherRoot {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: auto;
    }
    /* 内嵌星空 + 彩环（单窗合成，不依赖下层 WebView 穿透） */
    .launcher-hole-backdrop {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 450px;
      height: 450px;
      margin-left: -225px;
      margin-top: -225px;
      pointer-events: none;
      z-index: 0;
      clip-path: circle(225.5px at 50% 50%);
      -webkit-clip-path: circle(225.5px at 50% 50%);
    }
    /* 彩环改由 hole-launcher-backdrop.js 在 canvas 上抗锯齿绘制 */
    .launcher-hole-backdrop .ring {
      display: none;
    }
    .launcher-hole-backdrop .well {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      overflow: visible;
      background: transparent;
      z-index: 2;
    }
    #launcherGalaxyCanvas {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 450px;
      height: 450px;
      background: transparent;
    }
    #holeSceneLauncher {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 380px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: auto;
      opacity: 0;
      transform: scale(0.88);
      transform-origin: center center;
      background: transparent;
      transition: opacity 380ms ease, transform 520ms cubic-bezier(0.16, 1, 0.3, 1);
    }
    #holeSceneLauncher.visible {
      opacity: 1;
      transform: scale(1);
    }
    .launcher-scene-front {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 360px;
      padding: 0 12px;
      pointer-events: none;
    }
    .launcher-scene-front .hole-scene-grid,
    .launcher-scene-front .hole-scene-tile {
      pointer-events: auto;
    }
    .hole-scene-badge,
    .hole-scene-sub {
      display: none !important;
    }
    .hole-scene-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px 8px;
      width: 100%;
      justify-items: center;
    }
    .hole-scene-tile {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      border: none;
      background: transparent;
      cursor: pointer;
      padding: 0;
      animation: sceneTilePop 0.14s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes sceneTilePop {
      from { opacity: 0.35; transform: scale(0.88); }
      to { opacity: 1; transform: scale(1); }
    }
    /* 图标容器样式由 hole-scene-launcher.js 注入（玻璃拟态 · 与悬浮栏同源 SVG） */
    .hole-scene-label {
      font: 500 10px/1.2 "Segoe UI", "Microsoft YaHei", sans-serif;
      color: rgba(245, 255, 252, 0.9);
      text-align: center;
      max-width: 72px;
      pointer-events: none;
    }
    .hole-scene-empty {
      grid-column: 1 / -1;
      text-align: center;
      color: rgba(200, 230, 220, 0.65);
      font-size: 12px;
      padding: 12px;
    }
    #launcherCloseBtn {
      position: absolute;
      left: 50%;
      top: calc(50% - 192px);
      transform: translate(-50%, -50%);
      width: 30px;
      height: 30px;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      border: 1px solid rgba(255, 102, 0, 0.28);
      border-radius: 9px;
      background: rgba(6, 10, 16, 0.52);
      backdrop-filter: blur(10px) saturate(1.2);
      -webkit-backdrop-filter: blur(10px) saturate(1.2);
      color: #ff8533;
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      transition: opacity 220ms ease, transform 180ms cubic-bezier(0.22, 1, 0.36, 1),
        border-color 180ms ease, background 180ms ease, box-shadow 180ms ease;
      box-shadow: 0 1px 0 rgba(255, 255, 255, 0.08) inset,
        0 6px 18px rgba(0, 0, 0, 0.42),
        0 0 14px rgba(255, 102, 0, 0.12);
    }
    #launcherCloseBtn svg {
      width: 14px;
      height: 14px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2.2;
      stroke-linecap: round;
      pointer-events: none;
    }
    #launcherCloseBtn:hover {
      border-color: rgba(255, 140, 60, 0.55);
      background: rgba(12, 16, 22, 0.68);
      color: #ffaa66;
      transform: translate(-50%, -50%) scale(1.06);
      box-shadow: 0 1px 0 rgba(255, 255, 255, 0.12) inset,
        0 8px 22px rgba(0, 0, 0, 0.48),
        0 0 20px rgba(255, 102, 0, 0.22);
    }
    #launcherCloseBtn:active {
      transform: translate(-50%, -50%) scale(0.94);
    }
    #launcherRoot:has(#holeSceneLauncher.visible) #launcherCloseBtn {
      opacity: 1;
      pointer-events: auto;
    }
  </style>
</head>
<body>
  <div id="launcherRoot">
    <button id="launcherCloseBtn" type="button" title="关闭 (Esc)" aria-label="关闭">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <div class="launcher-hole-backdrop" aria-hidden="true">
      <div class="ring"></div>
      <div class="well">
        <canvas id="launcherGalaxyCanvas" width="450" height="450"></canvas>
      </div>
    </div>
    <div id="holeSceneLauncher" aria-label="场景启动器">
      <div class="launcher-scene-front"></div>
    </div>
  </div>
  <script src="https://app.local/assets/hole-launcher-backdrop.js"></script>
  <script src="https://app.local/assets/hole-scene-launcher.js"></script>
  <script>
    (function () {
      var sceneLauncherApi = null;
      function postHost(payload) {
        try {
          var wv = window.chrome && window.chrome.webview;
          if (!wv || !wv.postMessage) return;
          var body = typeof payload === 'string' ? payload : JSON.stringify(Object.assign({ windowRole: 'launcher' }, payload));
          wv.postMessage(body);
        } catch (_) {}
      }
      function ensureApi() {
        if (sceneLauncherApi) return sceneLauncherApi;
        var host = document.getElementById('holeSceneLauncher');
        if (!host || !window.HoleSceneLauncher) return null;
        sceneLauncherApi = window.HoleSceneLauncher.mount({
          host: host,
          mountTarget: host.querySelector('.launcher-scene-front') || host,
          post: postHost,
          badge: ''
        });
        return sceneLauncherApi;
      }
      function startBackdrop() {
        try {
          if (window.HoleLauncherBackdrop && window.HoleLauncherBackdrop.start) {
            window.HoleLauncherBackdrop.start();
          }
        } catch (_) {}
      }
      function stopBackdrop() {
        try {
          if (window.HoleLauncherBackdrop && window.HoleLauncherBackdrop.stop) {
            window.HoleLauncherBackdrop.stop();
          }
        } catch (_) {}
      }
      function dismissLauncher(reason) {
        var host = document.getElementById('holeSceneLauncher');
        if (!host || !host.classList.contains('visible')) return;
        postHost({ type: 'hole_close', reason: reason || 'launcher_close_btn' });
      }
      window.HoleLauncherLayer = {
        startBackdrop: startBackdrop,
        stopBackdrop: stopBackdrop,
        applyConfig: function (cfg) {
          var api = ensureApi();
          if (!api) return;
          var layout = cfg && cfg.sceneToolbarLayout ? cfg.sceneToolbarLayout : cfg;
          api.buildGrid(layout);
        },
        show: function (preview) {
          startBackdrop();
          var api = ensureApi();
          if (!api) return;
          var front = document.querySelector('.launcher-scene-front');
          if (!front || !front.querySelector('.hole-scene-grid') ||
              !front.querySelector('.hole-scene-grid').children.length) {
            api.buildGrid([]);
          }
          if (preview != null) api.setPreview(preview);
          api.show();
        },
        hide: function () {
          if (sceneLauncherApi) sceneLauncherApi.hide();
          var host = document.getElementById('holeSceneLauncher');
          if (host) host.classList.remove('visible');
          stopBackdrop();
        },
        dismiss: dismissLauncher
      };
      var closeBtn = document.getElementById('launcherCloseBtn');
      if (closeBtn) {
        closeBtn.addEventListener('click', function (ev) {
          try {
            ev.preventDefault();
            ev.stopPropagation();
          } catch (_) {}
          dismissLauncher('launcher_close_btn');
        });
      }
      document.addEventListener('keydown', function (ev) {
        if (ev.key !== 'Escape' && ev.keyCode !== 27) return;
        var host = document.getElementById('holeSceneLauncher');
        if (!host || !host.classList.contains('visible')) return;
        try {
          ev.preventDefault();
          ev.stopPropagation();
        } catch (_) {}
        dismissLauncher('launcher_escape');
      }, true);
      try {
        var wv = window.chrome && window.chrome.webview;
        if (wv && wv.addEventListener) {
          wv.addEventListener('message', function (ev) {
            try {
              var raw = ev && (ev.data != null ? ev.data : ev);
              var msg = typeof raw === 'string' ? JSON.parse(raw) : raw;
              if (msg && msg.type === 'launcher_show') {
                window.HoleLauncherLayer.show();
              } else if (msg && msg.type === 'launcher_hide') {
                window.HoleLauncherLayer.hide();
              }
            } catch (_) {}
          });
        }
      } catch (_) {}
    })();
  </script>
</body>
</html>
