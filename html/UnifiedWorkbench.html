<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>统一工作台</title>
<link rel="stylesheet" href="https://app.local/assets/css/sc-workbench-shell.css">
<link rel="stylesheet" href="https://app.local/assets/css/sc-cli.css">
<link rel="stylesheet" href="https://app.local/assets/css/sc-web-embed.css">
<style>
@font-face { font-family: "AppUi"; src: local("Segoe UI"); }
@font-face { font-family: "AppUi"; src: local("DengXian"), local("Microsoft YaHei UI"), local("Microsoft YaHei"); }
:root {
  --bg: #0d1016;
  --bg-surface: #121a26;
  --border-subtle: rgba(255,255,255,.08);
  --border: #2a3f5a;
  --text: #e7ebef;
  --muted: #93a0ad;
  --accent: #ff8d2a;
  --focus: #55b7ff;
  --shadow: 0 18px 42px rgba(4, 10, 20, 0.4);
  --font-ui: "AppUi", "Segoe UI", "DengXian", "Microsoft YaHei UI", system-ui, sans-serif;
}
html[data-theme="light"] {
  --bg: #f4f6f8;
  --bg-surface: #ffffff;
  --border: #d7e0ea;
  --text: #1f2a34;
  --muted: #5f6d7c;
  --border-subtle: rgba(20,32,48,.1);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  color: var(--text);
  font-family: var(--font-ui);
  background: linear-gradient(180deg, #0c1119 0%, #132238 100%);
}
html[data-theme="light"], html[data-theme="light"] body {
  background: linear-gradient(180deg, #f4f6f8 0%, #eef2f7 100%);
}
.uwb-app {
  width: 100%;
  height: 100%;
  display: grid;
  grid-template-columns: 276px minmax(0, 1fr);
  gap: 12px;
  padding: 12px 14px 14px 12px;
}
.uwb-sidebar {
  position: relative;
  z-index: 20;
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  width: 276px;
  min-width: 276px;
  max-width: 276px;
  min-height: 0;
  height: 100%;
  border-radius: 16px;
  border: 1px solid rgba(255, 141, 42, 0.28);
  background: rgba(8,12,22,.62);
  overflow: hidden;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.1), 0 10px 28px rgba(0,0,0,.2);
}
.uwb-side-head {
  flex: 0 0 auto;
  padding: 12px;
  border-bottom: 1px solid var(--border-subtle);
}
.uwb-side-title { font-size: 14px; font-weight: 800; }
.uwb-side-sub { margin-top: 4px; color: var(--muted); font-size: 11px; line-height: 1.35; }
.uwb-side-body {
  flex: 1 1 auto;
  min-height: 0;
  padding: 10px;
  overflow-x: hidden;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  align-items: stretch;
  justify-content: flex-start;
}
.uwb-group { margin-bottom: 14px; }
.uwb-group-title {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 7px;
  color: var(--muted);
  font-size: 11px;
  font-weight: 800;
  text-transform: uppercase;
}
.uwb-list { display: flex; flex-direction: column; gap: 6px; }
.uwb-add {
  width: 100%;
  border: 1px solid var(--border-subtle);
  background: rgba(255,255,255,.04);
  color: var(--text);
  min-height: 38px;
  border-radius: 10px;
  padding: 7px 9px;
  text-align: left;
  cursor: pointer;
}
.uwb-add:hover { border-color: rgba(255,141,42,.45); background: rgba(255,141,42,.08); }
.uwb-add:disabled { opacity: 0.42; cursor: not-allowed; }
.uwb-add:disabled:hover { border-color: var(--border-subtle); background: rgba(255,255,255,.04); }
.uwb-add-main { display: block; font-size: 12px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.uwb-add-sub { display: block; margin-top: 2px; font-size: 10px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.uwb-nav-group {
  display: flex;
  flex-direction: column;
  flex: 0 0 auto;
  align-self: stretch;
  margin-bottom: 12px;
  border: 1px solid var(--border-subtle);
  border-radius: 12px;
  background: rgba(255,255,255,.03);
  overflow: hidden;
}
.uwb-nav-group-head {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  border: 0;
  background: transparent;
  color: var(--text);
  padding: 10px 11px;
  cursor: pointer;
  text-align: left;
}
.uwb-nav-group-head:hover { background: rgba(255,255,255,.04); }
.uwb-nav-group-label { font-size: 12px; font-weight: 800; }
.uwb-nav-group-meta { font-size: 10px; color: var(--muted); white-space: nowrap; }
.uwb-nav-group-chevron { color: var(--muted); font-size: 11px; transition: transform .18s ease; }
.uwb-nav-group.is-collapsed .uwb-nav-group-chevron { transform: rotate(-90deg); }
.uwb-nav-group.is-collapsed .uwb-nav-list,
.uwb-nav-group.is-collapsed .uwb-nav-foot { display: none; }
.uwb-nav-list {
  display: flex;
  flex-direction: column;
  flex: 0 0 auto;
  justify-content: flex-start;
  align-items: stretch;
  gap: 4px;
  padding: 0 8px 8px;
}
.uwb-nav-item {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  gap: 8px;
  align-items: center;
  flex: none;
  width: 100%;
  height: auto;
  min-height: 44px;
  max-height: 52px;
  border: 1px solid transparent;
  border-radius: 10px;
  background: rgba(255,255,255,.02);
  color: var(--text);
  padding: 8px 8px 8px 9px;
  cursor: pointer;
  text-align: left;
}
.uwb-nav-item:hover { border-color: rgba(255,141,42,.28); background: rgba(255,141,42,.06); }
.uwb-nav-item.is-active { border-color: rgba(85,183,255,.45); background: rgba(85,183,255,.1); box-shadow: inset 0 0 0 1px rgba(85,183,255,.12); }
.uwb-nav-item.is-slot-off { opacity: .78; }
.uwb-nav-icon {
  width: 28px;
  height: 28px;
  border-radius: 8px;
  display: grid;
  place-items: center;
  font-size: 13px;
  font-weight: 800;
  background: rgba(255,255,255,.06);
  color: var(--accent);
}
.uwb-nav-item.is-active .uwb-nav-icon { background: rgba(85,183,255,.18); color: #9ed4ff; }
.uwb-nav-main { min-width: 0; }
.uwb-nav-title { font-size: 12px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.uwb-nav-sub { margin-top: 2px; font-size: 10px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.uwb-nav-status { display: inline-flex; align-items: center; gap: 5px; }
.uwb-nav-dot { width: 6px; height: 6px; border-radius: 50%; background: #6b7785; flex: none; }
.uwb-nav-dot.ok { background: #3ecf8e; }
.uwb-nav-dot.busy { background: #ffb347; }
.uwb-nav-dot.focus { background: #55b7ff; }
.uwb-nav-actions { display: flex; align-items: center; gap: 2px; opacity: .72; }
.uwb-nav-item:hover .uwb-nav-actions,
.uwb-nav-item.is-active .uwb-nav-actions { opacity: 1; }
.uwb-nav-act {
  width: 24px;
  height: 24px;
  border: 0;
  border-radius: 7px;
  background: transparent;
  color: var(--muted);
  cursor: pointer;
  font-size: 12px;
  line-height: 1;
}
.uwb-nav-act:hover { background: rgba(255,255,255,.08); color: var(--text); }
.uwb-nav-act.danger:hover { color: #ff8a80; }
.uwb-nav-foot { flex: 0 0 auto; padding: 0 8px 8px; }
.uwb-nav-add {
  width: 100%;
  min-height: 34px;
  border: 1px dashed rgba(255,141,42,.35);
  border-radius: 9px;
  background: rgba(255,141,42,.05);
  color: var(--text);
  font-size: 11px;
  font-weight: 700;
  cursor: pointer;
}
.uwb-nav-add:hover { border-color: rgba(255,141,42,.55); background: rgba(255,141,42,.1); color: var(--accent); }
.uwb-nav-add:disabled { opacity: .42; cursor: not-allowed; }
.uwb-nav-empty { padding: 8px 10px 10px; color: var(--muted); font-size: 11px; line-height: 1.45; }
.uwb-nav-picker { display: flex; flex-direction: column; gap: 4px; margin-top: 6px; }
.uwb-nav-picker.hidden { display: none; }
.uwb-main {
  min-width: 0;
  min-height: 0;
  display: grid;
  grid-template-rows: auto minmax(0, 1fr) auto;
  gap: 10px;
}
.uwb-topbar {
  min-height: 42px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border: 1px solid var(--border-subtle);
  border-radius: 14px;
  background: rgba(8,12,22,.46);
  padding: 8px 10px 8px 12px;
}
.uwb-title { font-size: 14px; font-weight: 800; }
.uwb-status { color: var(--muted); font-size: 11px; margin-left: 10px; }
.uwb-top-actions { display: flex; align-items: center; gap: 6px; }
.uwb-btn {
  min-height: 28px;
  border: 1px solid var(--border-subtle);
  border-radius: 9px;
  background: rgba(255,255,255,.04);
  color: var(--text);
  padding: 0 9px;
  cursor: pointer;
  font-size: 11px;
}
.uwb-btn:hover { border-color: rgba(255,141,42,.45); color: var(--accent); }
.uwb-close { width: 30px; padding: 0; font-size: 18px; line-height: 1; }
.uwb-stage {
  position: relative;
  isolation: isolate;
  min-width: 0;
  min-height: 0;
  border: 1px solid rgba(255, 141, 42, 0.32);
  border-radius: 16px;
  background: rgba(5,9,17,.42);
  overflow: hidden;
  box-shadow: var(--shadow), inset 0 0 0 1px rgba(255,255,255,.04);
}
.uwb-stage-split {
  display: flex;
  flex-direction: column;
  min-height: 0;
}
.uwb-ai-embed-pane {
  flex: 1 1 auto;
  min-height: 0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.uwb-ai-embed-pane.hidden { display: none !important; }
.uwb-ai-embed-pane .web-embed-workspace {
  flex: 1 1 auto;
  min-height: 0;
  display: flex;
  flex-direction: column;
}
.uwb-ai-embed-pane .web-embed-scroll-viewport {
  flex: 1 1 auto;
  min-height: 0;
}
.uwb-cli-strip {
  flex: 0 0 auto;
  min-height: 0;
  max-height: 42%;
  border-top: 1px solid rgba(255, 141, 42, 0.22);
  background: rgba(4, 8, 16, 0.35);
}
.uwb-cli-strip.hidden { display: none !important; }
.uwb-cli-strip .uwb-columns {
  height: 100%;
  min-height: 140px;
  max-height: 320px;
}
.uwb-stage::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 15px;
  border: 2px solid rgba(255, 141, 42, 0.38);
  box-shadow: inset 0 0 24px rgba(0,0,0,.18);
  pointer-events: none;
  z-index: 1;
}
body.uwb-layout.sc-web-embed-layout .uwb-main.sc-web-embed-active {
  display: flex;
  flex-direction: column;
  min-height: 0;
  grid-template-rows: none;
}
body.uwb-layout.sc-web-embed-layout .uwb-main.sc-web-embed-active .uwb-stage-split {
  flex: 1 1 auto;
  min-height: 0;
}
body.uwb-layout.sc-web-embed-layout .web-embed-workspace {
  gap: 0;
}
body.uwb-layout.sc-web-embed-layout .web-embed-scroll-viewport {
  border-color: rgba(255,255,255,.12);
  flex: 1 1 auto;
  min-height: 0;
  height: auto;
  max-height: 100%;
}
body.uwb-layout.sc-web-embed-layout .web-embed-workspace > form.uwb-compose {
  flex-shrink: 0;
  margin: 0;
  border-top: 1px solid rgba(255, 255, 255, 0.1);
  background: rgba(8, 12, 22, 0.42);
  padding: 8px 10px 10px;
  border-radius: 0 0 12px 12px;
}
body.uwb-layout.sc-web-embed-layout .web-embed-column-label {
  opacity: 0.92;
}
body.uwb-layout.sc-web-embed-layout #web-embed-toolbar {
  gap: 8px;
  padding-bottom: 8px;
  flex-shrink: 0;
}
body.uwb-layout .uwb-stage-split {
  display: flex;
  flex-direction: column;
  flex: 1 1 auto;
  min-height: 0;
}
body.uwb-layout .uwb-ai-embed-pane {
  flex: 1 1 auto;
  min-height: 0;
}
body.uwb-layout .uwb-cli-strip {
  flex-shrink: 0;
}
body.uwb-layout form.uwb-compose {
  flex-shrink: 0;
}
.uwb-columns {
  height: 100%;
  min-height: 0;
  display: flex;
  gap: 0;
  padding: 10px;
  overflow-x: auto;
  overflow-y: hidden;
  scroll-snap-type: x proximity;
}
.uwb-columns.virtualized {
  display: block;
  scroll-snap-type: none;
}
.uwb-columns-track {
  position: relative;
  height: calc(100% - 0px);
  min-height: 0;
}
.uwb-columns.virtualized .uwb-column {
  position: absolute;
  top: 0;
  height: 100%;
  flex: none;
  scroll-snap-align: none;
}
.uwb-column.virtual-offscreen {
  pointer-events: none;
  visibility: hidden;
}
.uwb-column {
  position: relative;
  flex: 0 0 auto;
  flex-shrink: 0;
  width: var(--col-w, 600px);
  min-width: var(--col-min, 240px);
  max-width: none;
  height: 100%;
  min-height: 0;
  display: flex;
  flex-direction: column;
  border: 1px solid var(--border-subtle);
  border-radius: 14px;
  background: var(--bg-surface);
  overflow: hidden;
  scroll-snap-align: start;
}
.uwb-column.focused {
  border-color: rgba(255, 141, 42, 0.55);
  box-shadow: inset 0 0 0 1px rgba(255, 141, 42, 0.12);
}
.uwb-col-head {
  position: relative;
  z-index: 60;
  flex-shrink: 0;
  min-height: 38px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 8px 9px;
  border-bottom: 1px solid var(--border-subtle);
  background: rgba(0,0,0,.14);
}
.uwb-col-head-split {
  position: absolute;
  top: 0;
  right: -9px;
  width: 18px;
  height: 100%;
  border: 0;
  padding: 0;
  margin: 0;
  background: transparent;
  cursor: ew-resize;
  touch-action: none;
  z-index: 70;
}
.uwb-col-head-split:hover,
.uwb-col-head-split.dragging {
  background: rgba(255, 141, 42, 0.24);
}
.uwb-col-head-split::after {
  content: "";
  position: absolute;
  top: 12%;
  bottom: 12%;
  left: 50%;
  width: 3px;
  transform: translateX(-50%);
  border-radius: 2px;
  background: rgba(255, 141, 42, 0.55);
  opacity: 0.45;
}
.uwb-col-head-split:hover::after,
.uwb-col-head-split.dragging::after { opacity: 1; }
.uwb-col-boundary-split-left {
  right: auto;
  left: -7px;
}
.uwb-col-foot-split.uwb-col-boundary-split-left::after,
.uwb-col-head-split.uwb-col-boundary-split-left::after {
  opacity: 0.55;
}
.uwb-col-resize {
  position: absolute;
  top: 0;
  bottom: 0;
  width: 14px;
  z-index: 80;
  cursor: ew-resize;
  touch-action: none;
  pointer-events: none;
}
.uwb-col-resize-head,
.uwb-col-resize-foot {
  pointer-events: auto;
  z-index: 90;
}
.uwb-col-resize-foot {
  top: auto;
  height: 100%;
}
.uwb-col-resize-left { left: -7px; }
.uwb-col-resize-right { right: -7px; }
.uwb-col-divider {
  flex: 0 0 28px;
  width: 28px;
  align-self: stretch;
  position: relative;
  z-index: 120;
  cursor: ew-resize;
  touch-action: none;
  flex-shrink: 0;
  background: rgba(255, 141, 42, 0.06);
}
.uwb-columns.virtualized .uwb-col-divider {
  position: absolute;
  top: 0;
  height: 100%;
  flex: none;
}
.uwb-col-divider:hover,
.uwb-col-divider.dragging {
  background: rgba(255, 141, 42, 0.22);
}
.uwb-col-divider::after {
  content: "";
  position: absolute;
  top: 8%;
  bottom: 8%;
  left: 50%;
  width: 3px;
  transform: translateX(-50%);
  border-radius: 2px;
  background: rgba(255, 141, 42, 0.5);
  opacity: 0.35;
  transition: opacity 0.15s;
}
.uwb-col-divider:hover::after,
.uwb-col-divider.dragging::after { opacity: 1; }
.uwb-col-resize:hover,
.uwb-col-resize.dragging {
  background: rgba(255, 141, 42, 0.28);
}
.uwb-col-resize::after {
  content: "";
  position: absolute;
  top: 8%;
  bottom: 8%;
  left: 50%;
  width: 3px;
  transform: translateX(-50%);
  border-radius: 2px;
  background: rgba(255, 141, 42, 0.45);
  opacity: 0;
  transition: opacity 0.15s;
}
.uwb-col-resize:hover::after,
.uwb-col-resize.dragging::after { opacity: 1; }
.uwb-columns.uwb-resizing {
  position: relative;
  cursor: ew-resize;
  user-select: none;
}
.uwb-columns.uwb-resizing .uwb-col-divider,
.uwb-columns.uwb-resizing .uwb-col-head-split,
.uwb-columns.uwb-resizing .uwb-col-foot-split,
.uwb-columns.uwb-resizing .uwb-col-resize-head,
.uwb-columns.uwb-resizing .uwb-col-resize-foot {
  z-index: 200;
}
.uwb-columns.uwb-resizing .uwb-column {
  pointer-events: auto;
}
.uwb-col-title { font-size: 12px; font-weight: 800; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.uwb-col-meta { color: var(--muted); font-size: 10px; margin-left: 5px; }
.uwb-col-actions { display: flex; gap: 5px; flex-shrink: 0; }
.uwb-col-btn {
  width: 28px;
  height: 24px;
  border: 1px solid var(--border-subtle);
  border-radius: 7px;
  background: rgba(255,255,255,.035);
  color: var(--text);
  cursor: pointer;
}
.uwb-col-body {
  position: relative;
  flex: 1 1 auto;
  min-height: 0;
  overflow: hidden;
  background: #101928;
}
.uwb-col-foot {
  position: relative;
  z-index: 150;
  flex-shrink: 0;
  height: 24px;
  pointer-events: auto;
  border-top: 1px solid var(--border-subtle);
  background: rgba(0, 0, 0, 0.28);
}
.uwb-col-foot-split {
  position: absolute;
  top: 0;
  right: -9px;
  width: 18px;
  height: 100%;
  border: 0;
  padding: 0;
  margin: 0;
  background: transparent;
  cursor: ew-resize;
  touch-action: none;
  z-index: 160;
}
.uwb-col-foot-split:hover,
.uwb-col-foot-split.dragging {
  background: rgba(255, 141, 42, 0.28);
}
.uwb-col-foot-split::after {
  content: "";
  position: absolute;
  top: 15%;
  bottom: 15%;
  left: 50%;
  width: 3px;
  transform: translateX(-50%);
  border-radius: 2px;
  background: rgba(255, 141, 42, 0.65);
  opacity: 0.55;
}
.uwb-col-foot-split:hover::after,
.uwb-col-foot-split.dragging::after { opacity: 1; }
.uwb-col-foot-hint {

.uwb-ai-column .uwb-col-body:has(.uwb-ai-embed-slot) {

}
.uwb-ai-embed-slot {

}

  align-items: center;

  color: var(--muted);
  text-align: center;
}

.uwb-ai-placeholder span { max-width: 340px; font-size: 12px; line-height: 1.5; }

  position: absolute;
  inset: 0;
  background: #132033;
}
.uwb-cli-stack iframe {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  border: 0;
  background: #132033;
}

  inset: 0;
  z-index: 2;
  display: flex;
  align-items: center;
  justify-content: center;

  background: rgba(12,18,28,.84);
  font-size: 12px;
}
.uwb-loading.hidden { display: none; }
.uwb-compose {
  min-height: 54px;
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 8px;
  align-items: end;
  position: relative;
  z-index: 12;
  flex-shrink: 0;
}
.uwb-compose-inner {
  min-height: 46px;
  display: flex;
  align-items: center;
  gap: 8px;
  border: 1px solid rgba(255,141,42,.24);
  border-radius: 14px;
  background: rgba(8,12,22,.62);
