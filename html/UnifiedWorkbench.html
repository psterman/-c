<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>统一工作台</title>
<link rel="stylesheet" href="https://app.local/assets/css/sc-workbench-shell.css">
<link rel="stylesheet" href="https://app.local/assets/css/sc-cli.css">
<style>
@font-face { font-family: "AppUi"; src: local("Segoe UI"); }
@font-face { font-family: "AppUi"; src: local("DengXian"), local("Microsoft YaHei UI"), local("Microsoft YaHei"); }
:root {
  --bg: #0d1016;
  --bg-surface: #121a26;
  --border-subtle: rgba(255,255,255,.08);
  --border: #2a3f5a;
  --text: #e7ebef;
  --muted: #93a0ad;
  --accent: #ff8d2a;
  --focus: #55b7ff;
  --shadow: 0 18px 42px rgba(4, 10, 20, 0.4);
  --font-ui: "AppUi", "Segoe UI", "DengXian", "Microsoft YaHei UI", system-ui, sans-serif;
}
html[data-theme="light"] {
  --bg: #f4f6f8;
  --bg-surface: #ffffff;
  --border: #d7e0ea;
  --text: #1f2a34;
  --muted: #5f6d7c;
  --border-subtle: rgba(20,32,48,.1);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  color: var(--text);
  font-family: var(--font-ui);
  background: linear-gradient(180deg, #0c1119 0%, #132238 100%);
}
html[data-theme="light"], html[data-theme="light"] body {
  background: linear-gradient(180deg, #f4f6f8 0%, #eef2f7 100%);
}
.uwb-app {
  width: 100%;
  height: 100%;
  display: grid;
  grid-template-columns: 276px minmax(0, 1fr);
  gap: 12px;
  padding: 12px 14px 14px 12px;
}
.uwb-sidebar {
  position: relative;
  z-index: 20;
  min-height: 0;
  border-radius: 16px;
  border: 1px solid rgba(255, 141, 42, 0.28);
  background: rgba(8,12,22,.62);
  overflow: hidden;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.1), 0 10px 28px rgba(0,0,0,.2);
}
.uwb-side-head {
  padding: 12px;
  border-bottom: 1px solid var(--border-subtle);
}
.uwb-side-title { font-size: 14px; font-weight: 800; }
.uwb-side-sub { margin-top: 4px; color: var(--muted); font-size: 11px; line-height: 1.35; }
.uwb-side-body {
  height: calc(100% - 62px);
  padding: 10px;
  overflow: auto;
}
.uwb-group { margin-bottom: 14px; }
.uwb-group-title {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 7px;
  color: var(--muted);
  font-size: 11px;
  font-weight: 800;
  text-transform: uppercase;
}
.uwb-list { display: flex; flex-direction: column; gap: 6px; }
.uwb-add {
  width: 100%;
  border: 1px solid var(--border-subtle);
  background: rgba(255,255,255,.04);
  color: var(--text);
  min-height: 38px;
  border-radius: 10px;
  padding: 7px 9px;
  text-align: left;
  cursor: pointer;
}
.uwb-add:hover { border-color: rgba(255,141,42,.45); background: rgba(255,141,42,.08); }
.uwb-add:disabled { opacity: 0.42; cursor: not-allowed; }
.uwb-add:disabled:hover { border-color: var(--border-subtle); background: rgba(255,255,255,.04); }
.uwb-add-main { display: block; font-size: 12px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.uwb-add-sub { display: block; margin-top: 2px; font-size: 10px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.uwb-main {
  min-width: 0;
  min-height: 0;
  display: grid;
  grid-template-rows: auto minmax(0, 1fr) auto;
  gap: 10px;
}
.uwb-topbar {
  min-height: 42px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border: 1px solid var(--border-subtle);
  border-radius: 14px;
  background: rgba(8,12,22,.46);
  padding: 8px 10px 8px 12px;
}
.uwb-title { font-size: 14px; font-weight: 800; }
.uwb-status { color: var(--muted); font-size: 11px; margin-left: 10px; }
.uwb-top-actions { display: flex; align-items: center; gap: 6px; }
.uwb-btn {
  min-height: 28px;
  border: 1px solid var(--border-subtle);
  border-radius: 9px;
  background: rgba(255,255,255,.04);
  color: var(--text);
  padding: 0 9px;
  cursor: pointer;
  font-size: 11px;
}
.uwb-btn:hover { border-color: rgba(255,141,42,.45); color: var(--accent); }
.uwb-close { width: 30px; padding: 0; font-size: 18px; line-height: 1; }
.uwb-stage {
  position: relative;
  isolation: isolate;
  min-width: 0;
  min-height: 0;
  border: 1px solid rgba(255, 141, 42, 0.32);
  border-radius: 16px;
  background: rgba(5,9,17,.42);
  overflow: hidden;
  box-shadow: var(--shadow), inset 0 0 0 1px rgba(255,255,255,.04);
}
.uwb-stage::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 15px;
  border: 2px solid rgba(255, 141, 42, 0.38);
  box-shadow: inset 0 0 24px rgba(0,0,0,.18);
  pointer-events: none;
  z-index: 6;
}
.uwb-columns {
  height: 100%;
  min-height: 0;
  display: flex;
  gap: 10px;
  padding: 10px;
  overflow-x: auto;
  overflow-y: hidden;
  scroll-snap-type: x proximity;
}
.uwb-columns.virtualized {
  display: block;
  scroll-snap-type: none;
}
.uwb-columns-track {
  position: relative;
  height: calc(100% - 0px);
  min-height: 0;
}
.uwb-columns.virtualized .uwb-column {
  position: absolute;
  top: 0;
  height: 100%;
  flex: none;
  scroll-snap-align: none;
}
.uwb-column.virtual-offscreen {
  pointer-events: none;
  visibility: hidden;
}
.uwb-column {
  position: relative;
  flex: 0 0 var(--col-w, 600px);
  width: var(--col-w, 600px);
  min-width: var(--col-min, 480px);
  max-width: 820px;
  height: 100%;
  min-height: 0;
  display: flex;
  flex-direction: column;
  border: 1px solid var(--border-subtle);
  border-radius: 14px;
  background: var(--bg-surface);
  overflow: hidden;
  scroll-snap-align: start;
}
.uwb-column.focused {
  border-color: rgba(255, 141, 42, 0.55);
  box-shadow: inset 0 0 0 1px rgba(255, 141, 42, 0.12);
}
.uwb-col-resize {
  position: absolute;
  top: 0;
  bottom: 0;
  width: 10px;
  z-index: 12;
  cursor: ew-resize;
  touch-action: none;
}
.uwb-col-resize-left { left: -5px; }
.uwb-col-resize-right { right: -5px; }
.uwb-col-resize:hover,
.uwb-col-resize.dragging {
  background: rgba(255, 141, 42, 0.28);
}
.uwb-col-resize::after {
  content: "";
  position: absolute;
  top: 18%;
  bottom: 18%;
  left: 50%;
  width: 2px;
  transform: translateX(-50%);
  border-radius: 2px;
  background: rgba(255, 141, 42, 0.45);
  opacity: 0;
  transition: opacity 0.15s;
}
.uwb-col-resize:hover::after,
.uwb-col-resize.dragging::after { opacity: 1; }
.uwb-columns.uwb-resizing {
  position: relative;
  cursor: ew-resize;
  user-select: none;
}
.uwb-col-head {
  flex-shrink: 0;
  min-height: 38px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 8px 9px;
  border-bottom: 1px solid var(--border-subtle);
  background: rgba(0,0,0,.14);
}
.uwb-col-title { font-size: 12px; font-weight: 800; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.uwb-col-meta { color: var(--muted); font-size: 10px; margin-left: 5px; }
.uwb-col-actions { display: flex; gap: 5px; flex-shrink: 0; }
.uwb-col-btn {
  width: 28px;
  height: 24px;
  border: 1px solid var(--border-subtle);
  border-radius: 7px;
  background: rgba(255,255,255,.035);
  color: var(--text);
  cursor: pointer;
}
.uwb-col-body {
  position: relative;
  flex: 1 1 auto;
  min-height: 0;
  overflow: hidden;
  background: #101928;
}
.uwb-ai-column .uwb-col-body:has(.uwb-ai-embed-slot) {
  background: transparent;
}
.uwb-ai-embed-slot {
  position: absolute;
  inset: 0;
  min-height: 280px;
}
.uwb-ai-placeholder {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 24px;
  color: var(--muted);
  text-align: center;
}
.uwb-ai-placeholder strong { color: var(--text); font-size: 15px; }
.uwb-ai-placeholder span { max-width: 340px; font-size: 12px; line-height: 1.5; }
.uwb-ai-column.focused .uwb-ai-placeholder { opacity: .22; }
.uwb-cli-stack {
  position: absolute;
  inset: 0;
  background: #132033;
}
.uwb-cli-stack iframe {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  border: 0;
  background: #132033;
}
.uwb-loading {
  position: absolute;
  inset: 0;
  z-index: 2;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--muted);
  background: rgba(12,18,28,.84);
  font-size: 12px;
}
.uwb-loading.hidden { display: none; }
.uwb-compose {
  min-height: 54px;
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 8px;
  align-items: end;
}
.uwb-compose-inner {
  min-height: 46px;
  display: flex;
  align-items: center;
  gap: 8px;
  border: 1px solid rgba(255,141,42,.24);
  border-radius: 14px;
  background: rgba(8,12,22,.62);
  padding: 6px 9px;
}
.uwb-compose-target { flex-shrink: 0; color: var(--accent); font-size: 12px; font-weight: 800; min-width: 58px; }
#compose {
  flex: 1 1 auto;
  min-width: 0;
  max-height: 96px;
  border: 0;
  outline: 0;
  resize: none;
  background: transparent;
  color: var(--text);
  font: 13px/1.35 var(--font-ui);
}
.uwb-send {
  height: 46px;
  min-width: 82px;
  border: 1px solid rgba(255,141,42,.38);
  border-radius: 14px;
  background: rgba(255,141,42,.16);
  color: #fff;
  cursor: pointer;
  font-weight: 800;
}
.uwb-toast {
  position: fixed;
  left: 50%;
  bottom: 72px;
  transform: translateX(-50%);
  max-width: 520px;
  padding: 8px 12px;
  border: 1px solid var(--border-subtle);
  border-radius: 10px;
  background: rgba(8,12,22,.92);
  color: var(--text);
  font-size: 12px;
  box-shadow: var(--shadow);
}
.uwb-toast.hidden { display: none; }
.uwb-btn-debug.is-active {
  border-color: rgba(255, 141, 42, 0.55);
  color: #ffe6cc;
  background: rgba(255, 141, 42, 0.12);
}
.uwb-main.uwb-debug-open { grid-template-rows: auto minmax(0, 1fr) auto auto; }
.web-embed-debug-panel {
  flex: 0 0 auto;
  max-height: 38vh;
  display: flex;
  flex-direction: column;
  border: 1px solid rgba(255, 141, 42, 0.28);
  border-radius: 12px;
  background: rgba(8, 12, 20, 0.92);
  font-size: 11px;
  color: #c8d4e8;
  overflow: hidden;
}
.web-embed-debug-panel.hidden { display: none !important; }
.web-embed-debug-head {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 10px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.06);
}
.web-embed-debug-head h4 { margin: 0; font-size: 11px; font-weight: 700; color: #ffe6cc; flex: 1 1 auto; }
.web-embed-debug-actions { display: flex; gap: 6px; flex-wrap: wrap; }
.web-embed-debug-btn {
  border: 1px solid rgba(255, 255, 255, 0.12);
  background: rgba(255, 255, 255, 0.04);
  color: #dbe7ff;
  border-radius: 6px;
  padding: 2px 8px;
  font-size: 10px;
  cursor: pointer;
}
.web-embed-debug-btn:hover { border-color: rgba(255, 141, 42, 0.45); color: #fff; }
.web-embed-debug-body {
  display: grid;
  grid-template-columns: minmax(220px, 1fr) minmax(280px, 1.2fr);
  gap: 8px;
  padding: 8px 10px 10px;
  min-height: 0;
  overflow: hidden;
}
.web-embed-debug-col { min-height: 0; display: flex; flex-direction: column; gap: 6px; }
.web-embed-debug-issues { display: flex; flex-direction: column; gap: 4px; max-height: 88px; overflow: auto; }
.web-embed-debug-issue { padding: 4px 8px; border-radius: 6px; line-height: 1.35; }
.web-embed-debug-issue.level-error { background: rgba(255, 72, 72, 0.14); border: 1px solid rgba(255, 96, 96, 0.35); color: #ffb4b4; }
.web-embed-debug-issue.level-warn { background: rgba(255, 180, 64, 0.12); border: 1px solid rgba(255, 193, 100, 0.28); color: #ffd9a0; }
.web-embed-debug-issue.level-ok { background: rgba(72, 200, 120, 0.1); border: 1px solid rgba(96, 220, 140, 0.25); color: #b8f0cc; }
.web-embed-debug-kv {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 2px 8px;
  font-family: ui-monospace, Consolas, monospace;
  font-size: 10px;
  line-height: 1.45;
}
.web-embed-debug-kv dt { opacity: 0.72; }
.web-embed-debug-kv dd { margin: 0; word-break: break-all; }
.web-embed-debug-sites { max-height: 72px; overflow: auto; font-family: ui-monospace, Consolas, monospace; font-size: 10px; line-height: 1.4; }
.web-embed-debug-log-tabs { display: flex; gap: 4px; flex-wrap: wrap; }
.web-embed-debug-log-tab {
  border: 1px solid rgba(255, 255, 255, 0.1);
  background: transparent;
  color: #aab8d0;
  border-radius: 999px;
  padding: 1px 8px;
  font-size: 10px;
  cursor: pointer;
}
.web-embed-debug-log-tab.is-active { border-color: rgba(255, 141, 42, 0.55); color: #ffe6cc; background: rgba(255, 141, 42, 0.12); }
.web-embed-debug-log {
  flex: 1 1 auto;
  min-height: 100px;
  max-height: 160px;
  overflow: auto;
  margin: 0;
  padding: 8px;
  border-radius: 8px;
  background: rgba(0, 0, 0, 0.35);
  border: 1px solid rgba(255, 255, 255, 0.06);
  font-family: ui-monospace, Consolas, monospace;
  font-size: 10px;
  line-height: 1.4;
  white-space: pre-wrap;
  word-break: break-word;
}
</style>
</head>
<body>
<div class="uwb-app">
  <aside class="uwb-sidebar">
    <div class="uwb-side-head">
      <div class="uwb-side-title">Column Workbench</div>
      <div class="uwb-side-sub">Phase4：最多 21 列虚拟滚动；AI 并行嵌入默认可至 8 路（低内存自动降档）。</div>
    </div>
    <div class="uwb-side-body">
      <section class="uwb-group">
        <div class="uwb-group-title"><span>AI</span><span id="ai-count">0</span></div>
        <div class="uwb-list" id="ai-list"></div>
      </section>
      <section class="uwb-group">
        <div class="uwb-group-title"><span>CLI</span><span id="cli-count">0</span></div>
        <div class="uwb-list" id="cli-list"></div>
      </section>
    </div>
  </aside>
  <main class="uwb-main" id="uwb-main">
    <header class="uwb-topbar">
      <div>
        <span class="uwb-title">统一工作台</span>
        <span class="uwb-status" id="status">初始化中...</span>
      </div>
      <div class="uwb-top-actions">
        <button type="button" class="uwb-btn uwb-btn-debug" id="btn-uwb-debug" title="诊断面板">诊断</button>
        <button type="button" class="uwb-btn" id="add-ai">新增 AI 列</button>
        <button type="button" class="uwb-btn" id="add-cli">新增 CLI 列</button>
        <button type="button" class="uwb-btn uwb-close" id="close" title="关闭" aria-label="关闭">×</button>
      </div>
    </header>
    <section class="uwb-stage">
      <div class="uwb-columns" id="columns" aria-label="横向列式工作区"></div>
    </section>
    <div id="web-embed-debug-panel" class="web-embed-debug-panel hidden" aria-label="统一工作台诊断">
      <div class="web-embed-debug-head">
        <h4>统一工作台 · 诊断</h4>
        <div class="web-embed-debug-actions">
          <button type="button" class="web-embed-debug-btn" id="web-embed-debug-refresh">刷新</button>
          <button type="button" class="web-embed-debug-btn" id="web-embed-debug-rebootstrap">重试 Bootstrap</button>
          <button type="button" class="web-embed-debug-btn" id="web-embed-debug-copy">复制诊断</button>
          <button type="button" class="web-embed-debug-btn" id="web-embed-debug-open-log">打开日志目录</button>
          <button type="button" class="web-embed-debug-btn" id="web-embed-debug-close">关闭</button>
        </div>
      </div>
      <div class="web-embed-debug-body">
        <div class="web-embed-debug-col">
          <div id="web-embed-debug-issues" class="web-embed-debug-issues"></div>
          <dl id="web-embed-debug-kv" class="web-embed-debug-kv"></dl>
          <div id="web-embed-debug-sites" class="web-embed-debug-sites"></div>
        </div>
        <div class="web-embed-debug-col">
          <div class="web-embed-debug-log-tabs" id="web-embed-debug-log-tabs">
            <button type="button" class="web-embed-debug-log-tab is-active" data-log-tab="js">页面事件</button>
            <button type="button" class="web-embed-debug-log-tab" data-log-tab="uwb">uwb</button>
            <button type="button" class="web-embed-debug-log-tab" data-log-tab="webLlm">webLlm</button>
            <button type="button" class="web-embed-debug-log-tab" data-log-tab="wv2">wv2</button>
          </div>
          <pre id="web-embed-debug-log" class="web-embed-debug-log"></pre>
        </div>
      </div>
    </div>
    <form class="uwb-compose" id="compose-form">
      <div class="uwb-compose-inner">
        <span class="uwb-compose-target" id="compose-target">AI</span>
        <textarea id="compose" rows="1" placeholder="Enter 发送到焦点列；Ctrl+Enter 或 /all 广播全部 AI；Shift+Enter 换行；$ 前缀发 CLI"></textarea>
      </div>
      <button type="submit" class="uwb-send">发送</button>
    </form>
  </main>
</div>
<div class="uwb-toast hidden" id="toast"></div>
<script>
window.BasePanel = {
  postToAhk(obj) {
    if (!window.chrome || !window.chrome.webview) return;
    const src = (obj && typeof obj === "object" && !Array.isArray(obj)) ? obj : {};
    window.chrome.webview.postMessage(Object.assign({ v: 1, timestamp: Date.now() }, src));
  }
};
function postToAhk(obj) {
  return window.BasePanel.postToAhk(obj);
}
const UWB_COL_GAP = 10;
const UWB_COL_PAD = 10;
const UWB_VIRTUAL_BUFFER = 1;
const CLI_PORTS = {
  codex_cli: 7681, gemini_cli: 7682, openclaw_cli: 7683, qwen_cli: 7684, ollama_cli: 7685,
  claude_cli: 7686, deepseek_cli: 7687, kimi_cli: 7688, zhipu_cli: 7689, copilot_cli: 7690
};
const state = {
  themeMode: "dark",
  aiEngines: [],
  cliEngines: [],
  columns: [],
  focusedColumnId: "",
  lastAiColumnId: "",
  lastCliColumnId: "",
  initialIntent: "ai",
  cliReady: {},
  cliUrls: {},
  defaultAiColumns: 2,
  defaultCliColumns: 1,
  maxColumns: 8,
  maxVirtualColumns: 21,
  virtualColumnThreshold: 9,
  maxActiveAiEmbeds: 8,
  columnResizeActive: false,
  memoryTierCap: 4,
  ignoreMemoryTierCap: false,
  aiFocusLru: {},
  hostLive: false,
  hostArmed: false,
  initGen: 0
};
let seq = 0;
function armHostBootstrap() {
  state.hostArmed = true;
}
function needsColumnRebuild() {
  const aiN = state.columns.filter((c) => c.type === "ai").length;
  const cliN = state.columns.filter((c) => c.type === "cli").length;
  return aiN < state.defaultAiColumns || cliN < state.defaultCliColumns;
}
function canAutoBootstrap() {
  return state.columns.length > 0 && (state.hostLive || state.hostArmed);
}
function defaultAiEngineRows() {
  return [
    { value: "deepseek", name: "DeepSeek", homeUrl: "https://chat.deepseek.com/" },
    { value: "doubao", name: "豆包", homeUrl: "https://www.doubao.com/chat/" },
    { value: "kimi", name: "Kimi", homeUrl: "https://kimi.moonshot.cn/" }
  ];
}
function aiEnginePool() {
  const seen = new Set();
  const out = [];
  const add = (e) => {
    if (!e) return;
    const sid = String(e.value || e.id || "").trim();
    if (!sid || seen.has(sid)) return;
    seen.add(sid);
    out.push(e);
  };
  (state.aiEngines.length ? state.aiEngines : []).forEach(add);
  defaultAiEngineRows().forEach(add);
  if (!out.length) add(firstAi());
  return out;
}
function esc(s) {
  return String(s || "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;" }[c]));
}
function normalizeCliEngine(v) {
  const s = String(v || "").trim().toLowerCase();
  return CLI_PORTS[s] ? s : "codex_cli";

function renderUwbDebugKv(client, snap) {

function requestUwbDebugSnapshot() {

function buildUwbDebugRebootstrapPayload() {
  const targets = listAiEmbedColumns();
  const aiColumns = [];
  const seen = new Set();
  for (let i = 0; i < targets.length; i++) {
    const col = targets[i];
    const rect = measureAiColumnRect(col);
    if (!rect) continue;
    const siteId = String(col.siteId || "deepseek");
    if (seen.has(siteId)) continue;
    seen.add(siteId);
    aiColumns.push({ siteId: siteId, columnId: col.id, width: rect.width, rect: rect });
  }
  const focusCol = getActiveAiColumn();
  return {
    type: "webEmbedDebugAction",
    action: "rebootstrap",
    aiColumns: aiColumns,
    maxActiveAiEmbeds: state.maxActiveAiEmbeds,
    focusSiteId: focusCol && focusCol.siteId ? String(focusCol.siteId) : (aiColumns[0] ? aiColumns[0].siteId : ""),
    client: buildUwbClientDebugSnapshot()

function toggleUwbDebugPanel(forceOpen) {

function handleUwbDebugResult(payload) {

function measureEmbedViewport() {
  const stage = document.querySelector(".uwb-stage");
  if (!stage) return null;
  const r = stage.getBoundingClientRect();
  if (r.width < 80 || r.height < 80) return null;
  return {
    left: Math.round(r.left),
    top: Math.round(r.top),
    width: Math.round(r.width),
    height: Math.round(r.height)
  };
}
function measureAiColumnRect(col) {
  const root = document.querySelector("[data-column-id='" + col.id + "'] .uwb-ai-embed-slot")
    || document.querySelector("[data-column-id='" + col.id + "'] .uwb-col-body");
  if (root) {
    const r = root.getBoundingClientRect();
    if (r.width >= 80 && r.height >= 80) {
      return {
        left: Math.round(r.left),
        top: Math.round(r.top),
        width: Math.round(r.width),
        height: Math.round(r.height)
      };
    }
  }
  const stage = document.getElementById("columns");
  const { items } = columnMetrics();
  const m = items.find(function (x) { return x.col.id === col.id; });
  if (!stage || !m) return null;
  const stageR = stage.getBoundingClientRect();
  const head = document.querySelector("[data-column-id='" + col.id + "'] .uwb-col-head");
  const headH = head ? head.getBoundingClientRect().height : 38;
  const pad = 10;
  const left = Math.round(stageR.left + m.left - stage.scrollLeft + pad);
  const top = Math.round(stageR.top + headH + pad);
  const width = Math.max(160, Math.round(m.width - pad * 2));
  const height = Math.max(120, Math.round(stageR.height - headH - pad * 2));
  if (width < 80 || height < 80) return null;
  return { left: left, top: top, width: width, height: height };
}
function syncAllAiEmbeds(force) {
  if (isColumnResizing()) return;
  if (!state.columns.length) return;
  if (!canAutoBootstrap()) {
    uwbDebugLog("warn", "sync skip: canAutoBootstrap=false hostLive=" + !!state.hostLive + " armed=" + !!state.hostArmed);
    return;
  }
  const targets = listAiEmbedColumns();
  if (!targets.length) {
    uwbDebugLog("warn", "sync skip: no ai embed columns");
    return;
  }
  updateAiPlaceholderHints();
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      const aiColumns = [];
      const seenSites = new Set();
      for (let i = 0; i < targets.length; i++) {
        const col = targets[i];
        const rect = measureAiColumnRect(col);
        if (!rect) {
          uwbDebugLog("warn", "measure fail col=" + col.id + " site=" + (col.siteId || "?"));
          scheduleSyncAllAiRetry();
          return;
        }
        const siteId = String(col.siteId || "deepseek");
        if (seenSites.has(siteId)) {
          uwbDebugLog("warn", "sync skip duplicate site=" + siteId + " col=" + col.id);
          continue;
        }
        seenSites.add(siteId);
        aiColumns.push({
          siteId: siteId,
          columnId: col.id,
          width: rect.width,
          rect: rect
        });
      }
      if (!aiColumns.length) {
        uwbDebugLog("warn", "sync skip: aiColumns empty after measure");
        scheduleSyncAllAiRetry();
        return;
      }
      const embedViewport = measureEmbedViewport();
      const vpSig = embedViewport
        ? embedViewport.left + "," + embedViewport.top + "," + embedViewport.width + "," + embedViewport.height
        : "";
      const sig = vpSig + "|" + aiColumns.map(function (c) {
        return c.siteId + "@" + c.rect.left + "," + c.rect.top + "," + c.rect.width + "," + c.rect.height;
      }).join("|");
      if (!force && syncAllAiEmbeds._lastSig === sig) return;
      syncAllAiEmbeds._lastSig = sig;
      syncAllAiEmbeds._n = 0;
      const focusCol = getActiveAiColumn();
      const focusSiteId = focusCol && focusCol.siteId ? String(focusCol.siteId) : (aiColumns[0] ? aiColumns[0].siteId : "");
      uwbDebugLog("info", "webLlmBootstrap sites=" + aiColumns.map(function (c) { return c.siteId; }).join(",") + " sig=" + sig.slice(0, 80));
      postToAhk({
        type: "webLlmBootstrap",
        aiColumns: aiColumns,
        embedViewport: embedViewport,
        maxActiveAiEmbeds: state.maxActiveAiEmbeds,
        selectedEngines: aiColumns.map((c) => c.siteId),
        focusSiteId: focusSiteId
      });
      if (focusSiteId && force) {
        postToAhk({ type: "webLlmFocusSite", siteId: focusSiteId, preserveLayout: true });
      }
    });
  });
}
function scheduleSyncAllAiRetry() {
  clearTimeout(syncAllAiEmbeds._retry);
  syncAllAiEmbeds._n = (syncAllAiEmbeds._n || 0) + 1;
  if (syncAllAiEmbeds._n > 20) {
    uwbDebugLog("error", "sync retry exhausted (>20)");
    return;
  }
  uwbDebugLog("warn", "schedule retry #" + syncAllAiEmbeds._n);
  syncAllAiEmbeds._retry = setTimeout(function () { syncAllAiEmbeds(true); }, syncAllAiEmbeds._n < 8 ? 120 : 280);
}
function syncAiEmbed() {
  scheduleLayoutSync(false);
}
function scheduleCliBootstrapRetries() {
  const cliCols = state.columns.filter((c) => c.type === "cli");
  if (!cliCols.length) return;
  const pending = cliCols.some((c) => !state.cliReady[normalizeCliEngine(c.engine)]);
  if (!pending) return;
  cliCols.forEach((c) => {
    const eng = normalizeCliEngine(c.engine);
    if (state.cliReady[eng] && state.cliUrls[eng]) {
      mountCliUrl(c.id, eng, state.cliUrls[eng], false);
      return;
    }
    const lastSent = ensureCli._sent && ensureCli._sent[eng] ? ensureCli._sent[eng] : 0;
    if (!lastSent || Date.now() - lastSent > 20000) ensureCli(c);
  });
  clearTimeout(scheduleCliBootstrapRetries._t);
  scheduleCliBootstrapRetries._n = (scheduleCliBootstrapRetries._n || 0) + 1;
  if (scheduleCliBootstrapRetries._n < 16)
    scheduleCliBootstrapRetries._t = setTimeout(scheduleCliBootstrapRetries, 600);
}
function nudgeUnifiedBootstrap() {
  clearTimeout(nudgeUnifiedBootstrap._t);
  nudgeUnifiedBootstrap._t = setTimeout(function () {
    scheduleLayoutSync(false, 80);
  }, 80);
}
function applyInit(payload, opts) {
  try {
    payload = payload || {};
    opts = opts || {};
    const fromHost = opts.fromHost !== false;
    const forceReset = !!payload.forceReset;
    const savedSession = (!forceReset && payload.savedSession && Array.isArray(payload.savedSession.columns) && payload.savedSession.columns.length)
      ? payload.savedSession
      : null;
    const softOnly = fromHost && state.hostLive && !forceReset && !needsColumnRebuild();
    state.themeMode = String(payload.themeMode || "dark").toLowerCase() === "light" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", state.themeMode);
    state.aiEngines = Array.isArray(payload.aiEngines) ? payload.aiEngines.slice() : state.aiEngines;
    state.cliEngines = Array.isArray(payload.cliEngines) ? payload.cliEngines.slice() : state.cliEngines;
    if (payload.initialIntent)
      state.initialIntent = String(payload.initialIntent) === "cli" ? "cli" : "ai";
    applyLayoutPrefs(payload);
    if (softOnly) {
      state.initGen = (state.initGen || 0) + 1;
      renderSidebar();
      if (payload.keyword) {
        document.getElementById("compose").value = String(payload.keyword);
        autoSizeCompose();
      }
      document.getElementById("status").textContent = layoutStatusText();
      runAutoBootstrap();
      return;
    }
    if (fromHost) {
      state.hostLive = true;
      armHostBootstrap();
    }
    else if (state.columns.length) state.hostArmed = true;
    state.initGen = (state.initGen || 0) + 1;
    resetBootstrapState();
    state.cliReady = {};
    state.cliUrls = {};
    seq = 0;
    const restored = savedSession ? restoreColumnsFromSession(savedSession) : false;
    if (!restored) {
      state.columns = buildDefaultColumns();
      const firstAiCol = state.columns.find((c) => c.type === "ai");
      const firstCliCol = state.columns.find((c) => c.type === "cli");
      state.lastAiColumnId = firstAiCol ? firstAiCol.id : "";
      state.lastCliColumnId = firstCliCol ? firstCliCol.id : "";
      state.focusedColumnId = state.initialIntent === "cli" && firstCliCol
        ? firstCliCol.id
        : (firstAiCol ? firstAiCol.id : (state.columns[0] ? state.columns[0].id : ""));
      state.aiFocusLru = {};
      state.columns.filter(function (c) { return c.type === "ai"; }).forEach(function (c, idx) {
        touchAiFocusLru(c.id);
        state.aiFocusLru[c.id] = Date.now() - (state.columns.length - idx) * 1000;
      });
      if (state.focusedColumnId) touchAiFocusLru(state.focusedColumnId);
    }
    render();
    applySavedScrollLeft();
    observeColumnStage();
    document.getElementById("status").textContent = layoutStatusText();
    if (payload.keyword) {
      document.getElementById("compose").value = String(payload.keyword);
      autoSizeCompose();
    }
    runAutoBootstrap();
    schedulePersistSession(1200);
  } catch (err) {
    document.getElementById("status").textContent = "初始化失败：" + String(err && err.message ? err.message : err);
    console.error("[UnifiedWorkbench] applyInit failed", err);
  }
}
function bootLocalDefaultLayout(reason) {
  if (state.columns.length && !needsColumnRebuild()) return true;

    themeMode: state.themeMode,
    aiEngines: defaultAiEngineRows(),
    cliEngines: state.cliEngines.length ? state.cliEngines.slice() : [firstCli()],
    initialIntent: state.initialIntent || "ai",
    defaultAiColumns: state.defaultAiColumns,
    defaultCliColumns: state.defaultCliColumns,
    maxColumns: state.maxColumns,
    maxVirtualColumns: state.maxVirtualColumns,
    virtualColumnThreshold: state.virtualColumnThreshold,
    maxActiveAiEmbeds: state.maxActiveAiEmbeds,
    forceReset: true
  }, { fromHost: false });
  if (state.columns.length) {
    const note = reason ? "（" + reason + "）" : "";

function handleHostPayload(payload) {
  if (typeof payload === "string") {
    try { payload = JSON.parse(payload); } catch (_) { return; }
  }
  if (!payload || typeof payload !== "object") return;
  if (payload.hostMsgId) {
    handleHostPayload._seen = handleHostPayload._seen || new Set();
    const key = String(payload.hostMsgId);
    if (handleHostPayload._seen.has(key)) return;
    handleHostPayload._seen.add(key);
  }

  else if (payload.type === "hostCliBootstrap") scheduleLayoutSync(true, 120);

  else if (payload.type === "ttyd_error") handleTtydError(payload);
