          '<div class="b-status-title">' +
          esc(it.time ? "[" + it.time + "] " : "[执行中]") +
          '</div><div class="b-status-log md-body">' +
          renderAgentPlainMarkdown(it.text || "") +
          "</div>";
        logBox.appendChild(tail);
      });
      logBox.scrollTop = logBox.scrollHeight;
    } else if (block.type === "question") {
      var qEl = dom.querySelector(".card-question");
      if (qEl) {
        qEl.hidden = false;
        qEl.setAttribute("data-block-id", block.id || "");
        qEl.innerHTML =
          '<div class="card-question-title">' +
          esc(block.title || "需要您的确认") +
          '</div><div class="card-question-body md-body">' +
          renderAgentPlainMarkdown(block.markdown || "") +
          "</div>";
      }
    } else if (block.type === "reply") {
      var host = ensureCardRepliesHost(dom);
      if (!host) return;
      var turnId = block.turnId != null ? Number(block.turnId) : 1;
      if (turnId > 1 && !host.querySelector('[data-segment-turn="' + turnId + '"]')) {
        var divider = document.createElement("div");
        divider.className = "card-segment-divider";
        divider.setAttribute("data-segment-turn", String(turnId));
        var cardRef = getActionCard(cardId);
        var qHint = cardRef && (cardRef._lastFollowUpQuery || cardRef.activeQuery);
        divider.textContent = qHint
          ? "补充 · " + String(qHint).slice(0, 56)
          : "补充 · 第 " + turnId + " 轮";
        host.appendChild(divider);
      }
      var seg = document.createElement("div");
      seg.className = "card-reply-segment";
      seg.setAttribute("data-block-id", block.id || "");
      seg.setAttribute("data-turn-id", String(turnId));
      seg.innerHTML =
        '<div class="card-reply-title">' +
        esc(block.title || (turnId > 1 ? "补充回复" : "任务回复")) +
        '</div><div class="card-reply-body md-body">' +
        renderAgentPlainMarkdown(block.markdown || "") +
        "</div>" +
        buildCardReplyActionsHtml(cardId, block);
      host.appendChild(seg);
    } else if (block.type === "a2ui") {
      var cardA2 = getActionCard(cardId);
      var a2 = dom.querySelector(".card-a2ui");
      if (a2) {
        a2.hidden = false;
        var slot = document.createElement("div");
        slot.className = "a2ui-slot";
        slot.setAttribute("data-block-id", block.id || "");
        slot.setAttribute("data-component", block.component || "");
        a2.appendChild(slot);
        if (typeof PaletteMiniA2UI !== "undefined" && PaletteMiniA2UI.render) {
          if (!PaletteMiniA2UI.render(slot, block)) {
            agentDebugLog(
              "a2ui_render_failed",
              JSON.stringify({
                blockId: block.id || "",
                component: block.component || "",
                routeId: cardA2 && cardA2.routeId ? cardA2.routeId : "",
                reason: "render_returned_false"
              }),
              "warn"
            );
            slot.remove();
          }
        }
      }
    } else if (block.type === "error") {
      var errLog = dom.querySelector(".card-status-log");
      if (errLog) {
        var errEl = document.createElement("div");
        errEl.className = "b-status is-error";
        errEl.setAttribute("data-block-id", block.id || "");
        errEl.innerHTML =
          '<div class="b-status-title">[错误]</div><div class="b-status-log">' +
          esc(block.message || "任务失败") +
          "</div>";
        errLog.appendChild(errEl);
      }
    }
  }

  function renderBlocks(cardId, blocks) {
    var card = getActionCard(cardId);
    var dom = ensureActionCardDom(card);
    if (!dom) return { ok: false, blocks: [] };
    var validated =
      typeof PaletteBlockSchema !== "undefined"
        ? PaletteBlockSchema.validateBlocks(blocks || [])
        : { blocks: blocks || [] };
    var list = validated.blocks || [];
    var tl = dom.querySelector(".card-timeline");
    if (tl) tl.innerHTML = "";
    var logBox = dom.querySelector(".card-status-log");
    if (logBox) logBox.innerHTML = "";
    var qEl = dom.querySelector(".card-question");
    if (qEl) {
      qEl.hidden = true;
      qEl.innerHTML = "";
    }
    var repliesHost = ensureCardRepliesHost(dom);
    if (repliesHost) repliesHost.innerHTML = "";
    var legacyReply = dom.querySelector(".card-reply");
    if (legacyReply) {
      legacyReply.hidden = true;
      legacyReply.innerHTML = "";
    }
    var a2 = dom.querySelector(".card-a2ui");
    if (a2) {
      a2.hidden = true;
      a2.innerHTML = "";
    }
    ensureCardA2uiDomOrder(dom);
    for (var i = 0; i < list.length; i++) renderPipelineBlock(cardId, dom, list[i]);
    if (a2 && !a2.hidden && a2.querySelector(".a2ui-slot") && !a2.querySelector(".card-a2ui-head")) {
      var a2Head = document.createElement("div");
      a2Head.className = "card-a2ui-head";
      a2Head.textContent = "结构化视图";
      a2.insertBefore(a2Head, a2.firstChild);
    }
    syncActionCardStatusLogVisibility(dom);
    refreshActionCardPreview(cardId);
    var a2uiBlockCount = 0;
    for (var ai = 0; ai < list.length; ai++) {
      if (list[ai] && list[ai].type === "a2ui") a2uiBlockCount++;
    }
    var a2uiRendered = dom.querySelectorAll(".card-a2ui .a2ui-slot").length;
    agentDebugLog(
      "render_blocks",
      JSON.stringify({
        n: list.length,
        types: list
          .map(function (b) {
            return b.type;
          })
          .join(","),
        a2uiBlocks: a2uiBlockCount,
        a2uiRendered: a2uiRendered
      })
    );
    if (cardId === actionState.detailCardId) syncActionDetailNav();
    return { ok: true, blocks: list };
  }

  function getCardPipelineBlocks(card) {
    if (!card) return [];
    return (card.blockStore && card.blockStore.blocks) || card.pipelineBlocks || [];
  }

  function mergeCardPipelineBlocks(card, segmentBlocks) {
    var prior = card && card._segmentPriorBlocks ? card._segmentPriorBlocks : [];
    if (typeof PaletteBlockPipeline !== "undefined" && PaletteBlockPipeline.mergeSegmentBlocks) {
      return (PaletteBlockPipeline.mergeSegmentBlocks(prior, segmentBlocks).blocks) || [];
    }
    return prior.concat(segmentBlocks || []);
  }

  function beginCardFollowUpSegment(card, reason) {
    if (!card || typeof PaletteBlockPipeline === "undefined" || !PaletteBlockPipeline.createIngestState) return null;
    var prior = getCardPipelineBlocks(card);
    card._segmentPriorBlocks =
      typeof PaletteBlockPipeline.freezeBlocks === "function"
        ? PaletteBlockPipeline.freezeBlocks(prior)
        : prior.slice();
    var nextTurn =
      typeof PaletteBlockPipeline.maxTurnId === "function"
        ? PaletteBlockPipeline.maxTurnId(prior) + 1
        : (card._activeTurnId || 1) + 1;
    card._activeTurnId = nextTurn;
    card.pipelineIngest = PaletteBlockPipeline.createIngestState({
      turnId: nextTurn,
      traceId: card.id + "_t" + nextTurn + "_" + (card.reqId || Date.now())
    });
    card._protoStarted = false;
    if (card.parser) card.parser.reset();
    syncCardPipelineStore(card, card._segmentPriorBlocks, { segmentBegin: true, turnId: nextTurn });
    renderBlocks(card.id, card._segmentPriorBlocks);
    agentDebugLog(
      "pipeline_segment_begin",
      "turn=" + nextTurn + " prior=" + prior.length + " reason=" + String(reason || "")
    );
    return card.pipelineIngest;
  }

  function beginCardCorrectionTurn(card) {
    if (!card || typeof PaletteBlockPipeline === "undefined" || !PaletteBlockPipeline.createIngestState) return null;
    card._segmentPriorBlocks = null;
    var turnId =
      typeof PaletteBlockPipeline.maxTurnId === "function"
        ? Math.max(1, PaletteBlockPipeline.maxTurnId(getCardPipelineBlocks(card)))
        : card._activeTurnId || 1;
    card._activeTurnId = turnId;
    card.pipelineIngest = PaletteBlockPipeline.createIngestState({
      turnId: turnId,
      traceId: card.id + "_t" + turnId + "_corr_" + Date.now()
    });
    card._protoStarted = false;
    if (card.parser) card.parser.reset();
    return card.pipelineIngest;
  }

  function getLatestPipelineReplyBlock(blocks) {
    var list = blocks || [];
    var best = null;
    var bestTurn = -1;
    for (var i = 0; i < list.length; i++) {
      var b = list[i];
      if (!b || b.type !== "reply" || !String(b.markdown || "").trim()) continue;
      var tid = b.turnId != null ? Number(b.turnId) : 1;
      if (tid >= bestTurn) {
        bestTurn = tid;
        best = b;
      }
    }
    return best;
  }

  function ensurePipelineIngest(card) {
    if (!card || typeof PaletteBlockPipeline === "undefined" || !PaletteBlockPipeline.createIngestState) return null;
    if (!card.pipelineIngest) {
      var turnId =
        card._activeTurnId ||
        (typeof PaletteBlockPipeline.maxTurnId === "function"
          ? Math.max(1, PaletteBlockPipeline.maxTurnId(getCardPipelineBlocks(card)))
          : 1);
      card._activeTurnId = turnId;
      card.pipelineIngest = PaletteBlockPipeline.createIngestState({
        turnId: turnId,
        traceId: card.id + "_t" + turnId + "_" + (card.reqId || Date.now())
      });
    }
    return card.pipelineIngest;
  }

  function syncCardPipelineStore(card, blocks, meta) {
    if (!card) return;
    var list = dedupeCardPipelineBlocks(blocks || []);
    var bv = typeof PaletteBlockSchema !== "undefined" ? PaletteBlockSchema.BLOCK_VERSION : 1;
    var nv =
      typeof PaletteBlockSchema !== "undefined"
        ? PaletteBlockSchema.NORMALIZER_VERSION
        : "2026-06-06";
    card.blockStore = { blocks: list, blockVersion: bv, normalizerVersion: nv };
    card.pipelineBlocks = list;
    if (meta && meta.protoStarted) card._protoStarted = true;
    syncLegacyBlocksFromPipeline(card, list);
  }

  function pipelineTurnCount(card) {
    var blocks = getCardPipelineBlocks(card);
    if (!blocks.length) return 0;
    if (typeof PaletteBlockPipeline !== "undefined" && PaletteBlockPipeline.maxTurnId)
      return PaletteBlockPipeline.maxTurnId(blocks);
    return 1;
  }

  function shouldSkipDtoRawReplay(card, dto) {
    if (!card || !dto || dto.rawAnswer == null) return false;
    if (dto.blockStore) return false;
    if (card._segmentPriorBlocks && card._segmentPriorBlocks.length) return true;
    if (pipelineTurnCount(card) > 1) return true;
    if (card._followUpMergedTick && Date.now() - card._followUpMergedTick < 8000) return true;
    return false;
  }

  function applyDtoBlockStore(card, dto) {
    if (!card || !dto) return false;
    if (isActionCardRunning(card) && !dto.ended && cardHasPipelineReply(card) && !dto.blockStore) return false;
    var store = dto.blockStore;
    if (!store) return false;
    if (typeof PaletteBlockStore !== "undefined" && PaletteBlockStore.unpack) store = PaletteBlockStore.unpack(store);
    var blocks = store && store.blocks ? store.blocks : [];
    if (!blocks.length) return false;
    card.blockStore = store;
    card.pipelineBlocks = blocks;
    syncLegacyBlocksFromPipeline(card, blocks);
    card._protoStarted = blocks.some(function (b) {
      return b && b.source === "protocol";
    });
    if (typeof PaletteBlockPipeline !== "undefined" && PaletteBlockPipeline.maxTurnId) {
      card._activeTurnId = PaletteBlockPipeline.maxTurnId(blocks);
    }
    return true;
  }

  function persistCardBlockStore(cardId) {
    var card = getActionCard(cardId);
    if (!card || !card.blockStore || !Array.isArray(card.blockStore.blocks) || !card.blockStore.blocks.length)
      return false;
    var packed =
      typeof PaletteBlockStore !== "undefined" && PaletteBlockStore.pack
        ? PaletteBlockStore.pack(card.blockStore.blocks, card.blockStore)
        : card.blockStore;
    try {
      post({
        type: "palette_agent_block_store",
        cardId: cardId,
        reqId: card.reqId || "",
        blockStore: packed
      });
      agentDebugLog("block_store_persist", "n=" + (packed.blocks || []).length);
      return true;
    } catch (_) {
      return false;
    }
  }

  function cardHasRenderablePipelineBlocks(blocks) {
    var list = blocks || [];
    for (var i = 0; i < list.length; i++) {
      var b = list[i];
      if (!b) continue;
      if (b.type === "reply" && String(b.markdown || "").trim()) return true;
      if (b.type === "plan" && b.items && b.items.length) return true;
      if (b.type === "question" && String(b.markdown || "").trim()) return true;
      if (b.type === "status" && b.items && b.items.length) return true;
    }
    return false;
  }

  function hideCardLiveThoughtIfReply(cardId) {
    var card = getActionCard(cardId);
    if (!card || !cardHasPipelineReply(card)) return;
    var dom = document.getElementById("card-" + cardId);
    if (!dom) return;
    var ltEl = dom.querySelector(".card-live-thought");
    if (ltEl) ltEl.style.display = "none";
  }

  function applyPipelineToolEvent(cardId, payload) {
    var card = getActionCard(cardId);
    if (!card || typeof PaletteBlockPipeline === "undefined" || !PaletteBlockPipeline.ingestToolEvent)
      return null;
    var state = ensurePipelineIngest(card);
    if (!state) return null;
    var result = PaletteBlockPipeline.ingestToolEvent(state, payload || {});
    var merged = mergeCardPipelineBlocks(card, result.blocks);
    syncCardPipelineStore(card, merged, result.meta);
    renderBlocks(cardId, merged);
    agentDebugLog(
      "pipeline_tool_event",
      JSON.stringify({
        tool: payload && payload.tool ? payload.tool : "",
        phase: payload && payload.phase ? payload.phase : "",
        level: payload && payload.level ? payload.level : "info",
        text: String((payload && payload.text) || "").slice(0, 120)
      })
    );
    return result;
  }

  function applyPipelineIngestDelta(cardId, delta) {
    var card = getActionCard(cardId);
    if (!card || typeof PaletteBlockPipeline === "undefined" || !PaletteBlockPipeline.ingestDelta) return null;
    var state = ensurePipelineIngest(card);
    if (!state) return null;
    if (!state.rawBuffer && card.rawAnswer && !isAgentStatusPreview(card.rawAnswer))
      state.rawBuffer = String(card.rawAnswer);
    var result = PaletteBlockPipeline.ingestDelta(state, delta);
    var merged = mergeCardPipelineBlocks(card, result.blocks);
    syncCardPipelineStore(card, merged, result.meta);
    if (cardHasRenderablePipelineBlocks(merged)) {
      renderBlocks(cardId, merged);
      if (cardLatestTurnHasReply(card)) hideCardLiveThoughtIfReply(cardId);
    }
    agentDebugLog(
      "pipeline_ingest",
      "n=" +
        result.blocks.length +
        " statusOnly=" +
        (result.meta && result.meta.statusOnly ? 1 : 0) +
        " proto=" +
        (result.meta && result.meta.protoStarted ? 1 : 0)
    );
    return result;
  }

  function applyPipelineFinalize(cardId, answerText) {
    var card = getActionCard(cardId);
    if (!card || typeof PaletteBlockPipeline === "undefined") return null;
    var ans = dedupeRepeatedAgentText(String(answerText || "").trim());
    if (!ans) return null;
    card.rawAnswer = ans;
    var ingest = card.pipelineIngest;
    var prior = card._segmentPriorBlocks || [];
    var routeOpt = card.routeProfile || {
      routeId: card.routeId,
      a2uiCandidates: card.a2uiCandidates || []
    };
    var result;
    if (ingest && PaletteBlockPipeline.finalizeFromState) {
      if (!ingest.rawBuffer || ingest.rawBuffer.length < ans.length) ingest.rawBuffer = ans;
      result = PaletteBlockPipeline.finalizeFromState(ingest, { route: routeOpt });
    } else {
      var turnId =
        typeof PaletteBlockPipeline.maxTurnId === "function"
          ? Math.max(1, PaletteBlockPipeline.maxTurnId(getCardPipelineBlocks(card)))
          : card._activeTurnId || 1;
      result = PaletteBlockPipeline.finalize(ans, {
        turnId: turnId,
        traceId: card.id + "_t" + turnId + "_" + Date.now(),
        route: routeOpt
      });
    }
    card.pipelineIngest = null;
    card._segmentPriorBlocks = null;
    var mergedOut =
      typeof PaletteBlockPipeline.mergeSegmentBlocks === "function"
        ? PaletteBlockPipeline.mergeSegmentBlocks(prior, result.blocks)
        : { blocks: prior.concat(result.blocks || []) };
    result.blocks = dedupeCardPipelineBlocks(mergedOut.blocks || result.blocks || []);
    card._activeTurnId =
      typeof PaletteBlockPipeline.maxTurnId === "function"
        ? PaletteBlockPipeline.maxTurnId(result.blocks)
        : card._activeTurnId;
    var bv = typeof PaletteBlockSchema !== "undefined" ? PaletteBlockSchema.BLOCK_VERSION : 1;
    var nv =
      typeof PaletteBlockSchema !== "undefined"
        ? PaletteBlockSchema.NORMALIZER_VERSION
        : "2026-06-06";
    card.blockStore = {
      blocks: result.blocks,
      blockVersion: bv,
      normalizerVersion: nv
    };
    card.pipelineBlocks = result.blocks;
    card._protoStarted = !!(result.meta && result.meta.protoStarted);
    syncLegacyBlocksFromPipeline(card, result.blocks);
    renderBlocks(cardId, result.blocks);
    var replyBlock = null;
    var questionBlock = null;
    for (var ri = result.blocks.length - 1; ri >= 0; ri--) {
      if (!questionBlock && result.blocks[ri].type === "question") questionBlock = result.blocks[ri];
    }
    replyBlock = getLatestPipelineReplyBlock(result.blocks);
    if (questionBlock && questionBlock.status === "waiting") {
      card.waitingForUser = true;
      setCardLiveThought(
        cardId,
        String(questionBlock.markdown || questionBlock.title || "").slice(0, 200),
        false
      );
    } else if (replyBlock) {
      card.waitingForUser = false;
      card.liveThought = "";
      hideCardLiveThoughtIfReply(cardId);
    } else {
      var finSum =
        typeof PaletteBlockPipeline.blockPreviewSummary === "function"
          ? PaletteBlockPipeline.blockPreviewSummary(result.blocks)
          : "";
      if (finSum) setCardLiveThought(cardId, finSum, false);
      else if (!cardHasRenderablePipelineBlocks(result.blocks)) setCardLiveThought(cardId, ans, false);
      else {
        card.liveThought = "";
        hideCardLiveThoughtIfReply(cardId);
      }
    }
    refreshActionCardDom(card);
    agentDebugLog(
      "pipeline_finalize",
      "blocks=" +
        result.blocks
          .map(function (b) {
            return b.type;
          })
          .join(",") +
        " proto=" +
        (result.meta && result.meta.protoStarted ? 1 : 0) +
        " a2ui=" +
        ((result.meta && result.meta.a2ui && result.meta.a2ui.length) || 0)
    );
    if (result.meta && (result.meta.uiMatches || result.meta.matcher || result.meta.a2ui)) {
      agentDebugLog(
        "pipeline_matcher",
        JSON.stringify({
          uiMatches: result.meta.uiMatches || [],
          displayPolicy: result.meta.displayPolicy || null,
          matcher: result.meta.matcher || null,
          a2ui: result.meta.a2ui || []
        })
      );
    }
    if (result.meta && result.meta.a2ui && result.meta.a2ui.length) {
      agentDebugLog("pipeline_a2ui", JSON.stringify(result.meta.a2ui));
    }
    var domFin = document.getElementById("card-" + cardId);
    if (domFin) {
      var hasReplyDom =
        !!domFin.querySelector(".card-replies .card-reply-body") ||
        !!domFin.querySelector(".card-reply:not([hidden]) .card-reply-body");
      var ltEl = domFin.querySelector(".card-live-thought");
      if (ltEl && hasReplyDom) ltEl.style.display = "none";
    }
    persistCardBlockStore(cardId);
    return result;
  }

  function finalizeAgentCardAnswer(cardId, answerText) {
    applyPipelineFinalize(cardId, answerText);
  }

  /** 列表重排会销毁 card DOM；内存 blocks 需在 mount/展开时重放 */
  function ensureCardPipelineRendered(card, opts) {
    opts = opts || {};
    if (!card) return false;
    var id = card.id;
    maybeHealDoneCardPipelineBlocks(card, id);
    var blocks = (card.blockStore && card.blockStore.blocks) || card.pipelineBlocks || [];
    if (!blocks.length) return false;
    var dom = document.getElementById("card-" + id);
    if (!dom) return false;
    var needsRender = pipelineDomNeedsRerender(card, dom, blocks);
    if (needsRender) renderBlocks(id, blocks);
    if (!opts.skipLayout && card.expanded) {
      scheduleExpandedCardLayout(card);
    }
    return true;
  }

  function scheduleExpandedCardLayout(card, opts) {
    opts = opts || {};
    function runLayoutPass(forcePublish) {
      withUnclippedPaletteMeasure(function () {
        syncActionResultsScrollMode();
      });
      if (forcePublish) _lastPublishedPaletteH = 0;
      publishPaletteHeight();
      if (card && card.expanded) scrollExpandedCardContent(card);
    }
    requestAnimationFrame(function () {
      if (opts.pipeline && card && card.expanded) {
        ensureCardPipelineRendered(card, { skipLayout: true });
      }
      requestAnimationFrame(function () {
        runLayoutPass(true);
        if (opts.recover && card && card.expanded && card.uiState === "Done") {
          maybeRecoverIncompleteDoneCard(card);
        }
        if (card && card.expanded) {
          [80, 220, 520].forEach(function (ms) {
            setTimeout(function () {
              if (!getActionCard(card.id) || !card.expanded) return;
              runLayoutPass(false);
            }, ms);
          });
        }
      });
    });
  }

  function replayExpandedCardPipelineBlocks() {
    Object.keys(actionState.cards).forEach(function (cid) {
      var c = actionState.cards[cid];
      if (c && c.expanded) ensureCardPipelineRendered(c);
    });
  }

  function runMockRenderBlocks(cardId, blocks) {
    cardId = String(cardId || "mock-pipeline-card");
    if (!getActionCard(cardId)) {
      actionState.cards[cardId] = {
        id: cardId,
        uiState: "Done",
        blocks: { plan: [], status: [], question: null, reply: null },
        blockStore: { blocks: [], blockVersion: 1, normalizerVersion: "2026-06-06" },
        pipelineBlocks: [],
        parser: createAgentParser(cardId),
        waitingForUser: false,
        title: "[Mock] Pipeline 验收",
        query: "mock",
        reqId: "",
        _protoStarted: false,
        expanded: true,
        liveThought: "",
        rawAnswer: "",
        updatedAt: new Date().toISOString()
      };
      actionState.activeCardId = cardId;
    }
    var card = getActionCard(cardId);
    var list = blocks || [];
    if (typeof PaletteBlockSchema !== "undefined") list = PaletteBlockSchema.validateBlocks(list).blocks;
    card.pipelineBlocks = list;
    card.blockStore = {
      blocks: list,
      blockVersion: typeof PaletteBlockSchema !== "undefined" ? PaletteBlockSchema.BLOCK_VERSION : 1,
      normalizerVersion:
        typeof PaletteBlockSchema !== "undefined" ? PaletteBlockSchema.NORMALIZER_VERSION : "2026-06-06"
    };
    syncLegacyBlocksFromPipeline(card, list);
    var out = renderBlocks(cardId, list);
    syncActionResultsLayout();
    focusActionCard(cardId, { expand: true });
    return out;
  }

  function kindIcon(kind) {
    if (kind === "file" || kind === "folder") return "📄";
    if (kind === "history") return "🕘";
    if (kind === "exec") return "↩";
    return "⌘";
  }

  function applyAiProviders(items, activeProvider) {
    state.aiProviders = Array.isArray(items) ? items.slice() : [];
    var active = String(activeProvider || "").trim();
    if (!active) {
      for (var i = 0; i < state.aiProviders.length; i++) {
        var row = state.aiProviders[i];
        if (!row) continue;
        if (row.active === true || row.active === 1 || row.active === "1") {
          active = String(row.id || "");
          break;
        }
      }
    }
    if (!active && state.aiProviders[0]) active = String(state.aiProviders[0].id || "");
    state.selectedAiProvider = active;
    if (state.intent === "ai") {
      state.actions = state.aiProviders.slice();
      state.resultMode = "command";
      if (state.selected >= state.actions.length) state.selected = 0;
      for (var j = 0; j < state.actions.length; j++) {
        if (String(state.actions[j].id || "") === state.selectedAiProvider) {
          state.selected = j;
          break;
        }
      }
      if (aiPhase === "compact") refreshAiProvidersUnderCard();
      else updateResults();
      syncWindowSize();
      requestAnimationFrame(function () {
        syncWindowSize();
        requestAnimationFrame(syncWindowSize);
      });
    }
  }

  function prepareAiIntentForNewQuestion(keepProviderId) {
    state.intent = "ai";
    state.input = "";
    ensureHeaderInputVisible();
    var inp = getInputEl();
    if (inp) {
      inp.value = "";

    if (_actionEnterLock) return false;
    if (e) e.preventDefault();

    _actionEnterLock = true;

      card.expanded && (card.uiState === "Planning" || card.uiState === "Running") ? "block" : "none";
    if (card.expanded || (card.id === actionState.activeCardId && isActionCardRunning(card))) {
      ensureCardPipelineRendered(card);
      var ltEl = dom.querySelector(".card-live-thought");
      if (cardLatestTurnHasReply(card)) {
        if (ltEl) ltEl.style.display = "none";
      } else if (card.uiState === "Done" && isAgentStatusPreview(card.liveThought) && !cardLatestTurnHasReply(card)) {
        maybeRecoverIncompleteDoneCard(card);
        scheduleAgentCardsRecover();
        if (ltEl) {
          ltEl.style.display = "";
          ltEl.classList.remove("card-live-thought-rich");
          ltEl.textContent = "回复未同步 · 可展开 Niuma Chat 查看完整回答";
          ltEl.classList.remove("thinking");

        if (ltEl) ltEl.style.display = "";
        var ltText = card.liveThought || "";
        var pipeBlocksLt = getCardPipelineBlocks(card);

          pipeBlocksLt.length &&
          typeof PaletteBlockPipeline !== "undefined" &&
          PaletteBlockPipeline.blockPreviewSummary
        ) {
          var blockLt = PaletteBlockPipeline.blockPreviewSummary(pipeBlocksLt);
          if (blockLt) ltText = blockLt;
        }
        setCardLiveThought(
          card.id,
          ltText,
          card.uiState === "Planning" || card.uiState === "Running"
        );
      }
    }
    refreshActionCardPreview(card.id);
    if (card.id === actionState.activeCardId) updateActionLiveDock(card.id);
    var cancelBtn = dom.querySelector(".card-cancel-btn");
    if (cancelBtn) cancelBtn.hidden = !isActionCardRunning(card);
    var follow = dom.querySelector(".card-followup");
    if (follow) follow.hidden = !card.expanded;
    var fin = dom.querySelector(".card-followup-input");
    if (fin) {
      fin.placeholder =
        card.uiState === "Waiting"
          ? "回答大脑提问后点发送…"
          : card.uiState === "Done"
            ? "追加新指令…"
            : "补充要求（不中断当前任务）…";
    }
    if (typeof PaletteActionBinder !== "undefined" && PaletteActionBinder.renderFollowUpChips) {
      PaletteActionBinder.renderFollowUpChips(card.id, card, { debugLog: agentDebugLog });

  function bindActionCardHoverPreview(card, dom) {
    if (!card || !dom || dom.dataset.hoverPreviewBound) return;
    dom.dataset.hoverPreviewBound = "1";
    var cid = card.id;
    function onCardEnter() {
      var cur = getActionCard(cid);
      if (!cur || cur.expanded || actionState.detailCardId === cid) return;
      if (cardHoverPreviewHideTimer) {
        clearTimeout(cardHoverPreviewHideTimer);
        cardHoverPreviewHideTimer = null;
      }
      scheduleShowCardHoverPreview(cid, dom);
    }
    function onCardLeave(e) {
      if (!cardHoverLeaveShouldHide(dom, e.relatedTarget)) return;
      cancelCardHoverPreviewShow();
      scheduleHideCardHoverPreview();
    }
    dom.addEventListener("mouseenter", onCardEnter);
    dom.addEventListener("mouseleave", onCardLeave);
  }

  function bindActionCardEvents(card, dom) {
    if (!card || !dom || dom.dataset.eventsBound) return;
    dom.dataset.eventsBound = "1";
    var head = dom.querySelector(".cmd-action-card-head");
    if (head) {
      head.addEventListener("click", function (e) {
        if (e.target.closest(".card-mini-btn")) return;
        if (e.target.closest(".card-expand-btn")) {
          toggleActionCardExpand(card.id);
          return;
        }
        if (card.uiState === "Done" && !isActionCardRunning(card)) {
          toggleActionCardExpand(card.id);
          return;
        }
        focusActionCard(card.id);
      });
    }
    var expandBtn = dom.querySelector(".card-expand-btn");
    if (expandBtn) {
      expandBtn.addEventListener("click", function (e) {
        e.stopPropagation();
        toggleActionCardExpand(card.id);
      });
    }
    var cancelBtn = dom.querySelector(".card-cancel-btn");
    if (cancelBtn) {
      cancelBtn.addEventListener("click", function (e) {
        e.stopPropagation();
        post({ type: "palette_agent_cancel", cardId: card.id });
      });
    }
    var deleteBtn = dom.querySelector(".card-delete-btn");
    if (deleteBtn) {
      deleteBtn.addEventListener("click", function (e) {
        e.stopPropagation();
        removeActionCard(card.id, true);
        renderActionHistoryList();
        syncActionResultsLayout();
      });
    }
    var sendBtn = dom.querySelector(".card-followup-btn");
    var fin = dom.querySelector(".card-followup-input");
    function sendFollowup() {
      var t = fin ? String(fin.value || "").trim() : "";
      if (!t) return;
      focusActionCard(card.id);
      submitAgentTask(t, {
        cardId: card.id,
        forceKind: card.uiState === "Waiting" ? "correction" : "append",
        fromCardFollowup: true,
        explicitCardFollowup: true,
        provider: card.provider || state.agentProvider
      });
      if (fin) fin.value = "";
    }
    if (sendBtn) sendBtn.addEventListener("click", function (e) { e.stopPropagation(); sendFollowup(); });
    if (fin) {
      fin.addEventListener("click", function (e) { e.stopPropagation(); });
      fin.addEventListener("keydown", function (e) {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          e.stopPropagation();
          sendFollowup();
        }
      });
    }
    if (typeof PaletteActionBinder !== "undefined" && PaletteActionBinder.bindFollowUpChips) {
      PaletteActionBinder.bindFollowUpChips(card.id, card, {
        debugLog: agentDebugLog,
        onActionResult: onPaletteActionResult
      });
    }
    if (!dom._replyActBound) {
      dom._replyActBound = true;
      dom.addEventListener("click", function (e) {
        var btn = e.target.closest(".card-reply-act-btn[data-reply-act]");
        if (!btn || !dom.contains(btn)) return;
        e.stopPropagation();
        handleCardReplyAction(
          btn.getAttribute("data-reply-act"),
          btn.getAttribute("data-card-id"),
          btn.getAttribute("data-block-id"),
          btn.getAttribute("data-turn-id")
        );
      });
    }
  }

    if (!stack) return null;

  function sortCardIds(ids) {
    var active = actionState.activeCardId;
    return ids.sort(function (a, b) {
      if (a === active) return -1;
      if (b === active) return 1;
      return String(actionState.cards[b].updatedAt || "").localeCompare(String(actionState.cards[a].updatedAt || ""));
    });
  }

  function mountActionCardIntoList(card, listHost) {
    if (!card || !listHost) return;
    var dom = ensureActionCardDom(card);
    if (!dom) return;
    dom.style.display = "";

  var _renderActionHistoryLock = false;

  function renderActionHistoryList() {
    if (_renderActionHistoryLock) return;
    _renderActionHistoryLock = true;
    try {
    hideCardHoverPreview();
    var box = document.getElementById("results");
    if (!box) return;
    syncExpandedCardsToHistoryFilter();
    if (Object.keys(actionState.cards).length > 0) purgeActionEmptyHint();
    var stack = box.querySelector(".action-card-stack");
    if (!stack) {
      stack = document.createElement("div");
      stack.className = "action-card-stack";
      var cmdKeep = box.querySelector(".action-cmd-list");
      if (cmdKeep) box.insertBefore(stack, cmdKeep);
      else box.insertBefore(stack, box.firstChild);
    }
    refreshActionHistoryHead();
    removeActionLiveDock(stack);

    var oldFlat = stack.querySelector(":scope > .action-card-list");
    if (oldFlat) oldFlat.remove();
    stack.querySelectorAll(".action-done-more-btn").forEach(function (b) {
      b.remove();
    });

    var runningIds = [];
    var doneIds = [];
    Object.keys(actionState.cards).forEach(function (cid) {
      var c = actionState.cards[cid];
      if (!c) return;
      if (!cardMatchesHistoryFilter(c)) {
        var hideEl = document.getElementById("card-" + cid);
        if (hideEl) hideEl.style.display = "none";
        return;
      }
      if (isActionCardRunning(c)) runningIds.push(cid);
      else doneIds.push(cid);
    });

    sortCardIds(runningIds);
    sortCardIds(doneIds);

    var showRunning = actionState.historyFilter === "all" || actionState.historyFilter === "running";
    var showDone = actionState.historyFilter === "all" || actionState.historyFilter === "done";

    stack.querySelectorAll(".action-card-section").forEach(function (sec) {
      sec.style.display = "none";
    });

    if (showRunning && runningIds.length) {
      var runSec = ensureActionCardSection(stack, "running");
      runSec.style.display = "";
      var runHead = runSec.querySelector(".action-card-section-head");
      if (runHead) {
        runHead.innerHTML =
          '<span>进行中</span><span class="section-count">' + runningIds.length + "</span>" +
          '<span class="section-hint">实时进度与操作见下方任务卡</span>';
      }
      var runList = runSec.querySelector(".action-card-list");
      if (runList) {
        runList.innerHTML = "";
        runningIds.forEach(function (cid) {
          var card = actionState.cards[cid];
          if (!card) return;
          card.expanded = actionState.detailCardId === cid;
          mountActionCardIntoList(card, runList);
        });
      }
    }

    if (showDone && doneIds.length) {
      var doneSec = ensureActionCardSection(stack, "done");
      doneSec.style.display = "";
      var doneHead = doneSec.querySelector(".action-card-section-head");
      var doneLimit = actionState.showAllDone ? doneIds.length : 4;
      var doneVisible = doneIds.slice(0, doneLimit);
      if (
        actionState.detailCardId &&
        doneIds.indexOf(actionState.detailCardId) >= 0 &&
        doneVisible.indexOf(actionState.detailCardId) < 0
      ) {
        doneVisible.push(actionState.detailCardId);
      }
      if (doneHead) {
        doneHead.innerHTML =
          '<span>已归档</span><span class="section-count">' + doneIds.length + "</span>" +
          '<span class="section-hint">默认紧凑 · 悬浮看各轮摘要 · 点击展开</span>';
      }
      var doneList = doneSec.querySelector(".action-card-list");
      if (doneList) {
        doneList.innerHTML = "";
        doneVisible.forEach(function (cid) {
          var card = actionState.cards[cid];
          if (!card) return;
          card.expanded = actionState.detailCardId === cid;
          mountActionCardIntoList(card, doneList);
        });
      }
      if (!actionState.showAllDone && doneIds.length > doneLimit) {
        var moreBtn = document.createElement("button");
        moreBtn.type = "button";
        moreBtn.className = "action-done-more-btn";
        moreBtn.textContent = "展开更多已归档（+" + (doneIds.length - doneLimit) + "）";
        moreBtn.addEventListener("click", function () {
          actionState.showAllDone = true;
          renderActionHistoryList();
        });
        doneSec.appendChild(moreBtn);
      }
    }

    stack.querySelectorAll(".action-filter-empty").forEach(function (n) {
      n.remove();
    });

    if (runningIds.length + doneIds.length > 0) {
      var panel = document.getElementById("palette-panel");
      if (panel) panel.classList.add("has-results", "intent-action");
      box.classList.add("palette-results", "has-action-cards");
    } else {
      removeActionLiveDock(stack);
      if (Object.keys(actionState.cards).length > 0) {
        var filtEmpty = document.createElement("div");
        filtEmpty.className = "action-intent-empty action-filter-empty";
        filtEmpty.textContent = historyFilterEmptyMessage();
        stack.appendChild(filtEmpty);
      } else if (
        state.intent === "action" &&
        !state.input.trim() &&
        !state.actionCmdBrowse
      ) {
        purgeActionEmptyHint();
        var empty = document.createElement("div");
        empty.className = "action-intent-empty";
        empty.textContent =
          "暂无历史任务。输入描述后 Enter 提交至 " +
          agentProviderLabel(state.agentProvider) +
          "；提交后会在此按「进行中 / 已归档」分区显示。";
        stack.appendChild(empty);
      }
    }
    replayExpandedCardPipelineBlocks();
    syncActionDetailNav();
    requestAnimationFrame(syncActionListLayout);
    } finally {
      _renderActionHistoryLock = false;
    }
  }

  var actionCardManager = {
    transitionCardState: function (cardId, newState) {
      var card = getActionCard(cardId);
      if (!card) return;
      card.uiState = newState;
      var dom = ensureActionCardDom(card);
      if (!dom) return;
      dom.className =
        "cmd-action-card state-" +
        newState +
        (card.expanded ? " is-expanded" : " is-collapsed") +
        (card.id === actionState.activeCardId ? " is-active" : "") +
        (card.id === actionState.detailCardId ? " is-detail-card" : "") +
        (dom.classList.contains("has-status-log") ? " has-status-log" : "");
      var loader = dom.querySelector(".card-pulse-loader");
      var badge = dom.querySelector(".cmd-action-card-badge");
      var inputEl = getInputEl();
      if (badge) badge.textContent = actionCardUiLabel(newState);
      if (loader)
        loader.style.display =
          card.expanded && (newState === "Planning" || newState === "Running") ? "block" : "none";
      refreshActionCardPreview(cardId);
      if (cardId === actionState.activeCardId) updateActionLiveDock(cardId);
      if (inputEl) {
        if (newState === "Planning") inputEl.placeholder = "引擎正在重新规划任务流…";
        else if (newState === "Running") inputEl.placeholder = "正在执行云端代理具身流，请稍候…";
        else if (newState === "Waiting") {
          inputEl.placeholder = "大脑向您提问！请就地输入修正回复…";
          dom.classList.add("waiting-user-reply");
          inputEl.focus();
        } else if (newState === "Done") {
          inputEl.placeholder = IntentRouter.PLACEHOLDERS.action || "描述任务 Enter 提交至上方所选引擎（龙虾/Hermes）…";
          dom.classList.remove("waiting-user-reply");
        } else {
          inputEl.placeholder = IntentRouter.PLACEHOLDERS[state.intent] || IntentRouter.PLACEHOLDERS.local;
        }
      }
      if (newState === "Running") {
        var logEl = dom.querySelector(".card-status-log");
        if (logEl) logEl.scrollTop = logEl.scrollHeight;
      }
      if (card.id === actionState.detailCardId) syncActionDetailNav();
      syncActionResultsLayout();
    },
    onBlockUpdate: function (cardId, block) {
      var card = getActionCard(cardId);
      if (!card || !block) return;
      agentDebugLog(
        "block_" + String(block.type || "unknown"),
        "seq=" +
          block.seq +
          " closed=" +
          (block.closed ? 1 : 0) +
          (block.parseWarn ? " warn=" + block.parseWarn : "") +
          (block.replan ? " replan=1" : "")
      );
      var dom = ensureActionCardDom(card);
      if (!dom) return;
      if (block.type === "plan") {
        if (block.closed) {
          card._protoStarted = true;
          card.blocks.plan = block.steps || [];
          if (block.replan) actionCardManager.transitionCardState(cardId, "Planning");
          var tl = dom.querySelector(".card-timeline");
          if (tl) {
            tl.innerHTML = (block.steps || [])
              .map(function (s, i) {
                return '<div class="card-timeline-step">' + esc("步骤" + (i + 1) + "：" + s) + "</div>";
              })
              .join("");
          }
          refreshActionCardPreview(cardId);
          if (card.uiState === "Planning") actionCardManager.transitionCardState(cardId, "Running");
        }
      } else if (block.type === "status") {
        card._protoStarted = true;
        if (!card.blocks.status) card.blocks.status = [];
        var idx = card.blocks.status.length - 1;
        if (!block.closed && idx >= 0 && card.blocks.status[idx] && card.blocks.status[idx].seq === block.seq) {
          card.blocks.status[idx] = block;
        } else if (block.closed) {
          card.blocks.status.push(block);
        } else {
          card.blocks.status.push(block);
        }
        var open = card.blocks.status[card.blocks.status.length - 1];
        var logBox = dom.querySelector(".card-status-log");
        if (logBox) {
          var tail = logBox.querySelector('.b-status[data-seq="' + block.seq + '"]');
          if (!tail) {
            tail = document.createElement("div");
            tail.className = "b-status";
            tail.setAttribute("data-seq", String(block.seq));
            tail.innerHTML = '<div class="b-status-title"></div><div class="b-status-log"></div>';
            logBox.appendChild(tail);
          }
          if (tail) {
            tail.querySelector(".b-status-title").textContent = open.title || "[执行中]";
            writeAgentRichText(tail.querySelector(".b-status-log"), open.log || open.body || "");
          }
          logBox.scrollTop = logBox.scrollHeight;
          syncActionCardStatusLogVisibility(dom);
        }
        refreshActionCardPreview(cardId);
        if (cardId === actionState.activeCardId) updateActionLiveDock(cardId);
        if (card.uiState !== "Waiting" && card.uiState !== "Done") actionCardManager.transitionCardState(cardId, "Running");
      } else if (block.type === "orphan" && block.closed) {
        var orphanBody = String(block.content || block.body || "").trim();
        if (orphanBody) {
          var orphanLog = dom.querySelector(".card-status-log");
          if (orphanLog) {
            var orphanHit = orphanLog.querySelector('.b-status[data-seq="' + block.seq + '"]');
            if (!orphanHit) {
              orphanHit = document.createElement("div");
              orphanHit.className = "b-status";
              orphanHit.setAttribute("data-seq", String(block.seq));
              orphanHit.innerHTML =
                '<div class="b-status-title">[回复]</div><div class="b-status-log md-body"></div>';
              orphanLog.appendChild(orphanHit);
            }
            var orphanLogEl = orphanHit.querySelector(".b-status-log");
            if (orphanLogEl && orphanLogEl.getAttribute("data-raw-md") !== orphanBody) {
              writeAgentRichText(orphanLogEl, orphanBody);
            }
            orphanLog.scrollTop = orphanLog.scrollHeight;
            syncActionCardStatusLogVisibility(dom);
          }
        }
        refreshActionCardPreview(cardId);
        if (cardId === actionState.activeCardId) updateActionLiveDock(cardId);
        if (card.uiState !== "Waiting" && card.uiState !== "Done") actionCardManager.transitionCardState(cardId, "Running");
      } else if (block.type === "question" && block.closed) {
        card.blocks.question = block;
        card.waitingForUser = true;
        var qEl = dom.querySelector(".card-question");
        if (qEl) {
          qEl.hidden = false;
          var qBody = String(block.content || block.body || "").trim();
          qEl.innerHTML =
            '<div class="card-question-title">' +
            esc(block.title || "需要您的确认") +
            '</div><div class="card-question-body md-body">' +
            renderAgentPlainMarkdown(qBody) +
            "</div>";
        }
        actionCardManager.transitionCardState(cardId, "Waiting");
      } else if (block.type === "reply" && block.closed) {
        var rBodyCheck = String(block.content || block.body || "").trim();
        if (!rBodyCheck || isAgentStatusPreview(rBodyCheck)) return;
        card.blocks.reply = block;
        card.waitingForUser = false;
        var rEl = dom.querySelector(".card-reply");
        if (rEl) {
          rEl.hidden = false;
          var rBody = String(block.content || block.body || "").trim();
          var rTitle = String(block.title || "任务完结").trim();
          rEl.innerHTML =
            '<div class="card-reply-title">' +
            esc(rTitle) +
            '</div><div class="card-reply-body md-body">' +
            renderAgentPlainMarkdown(rBody || block.body || "") +
            "</div>";
        }
        actionCardManager.transitionCardState(cardId, "Done");
      }
    }
  };

  function syncActionResultsLayout() {
    var panel = document.getElementById("palette-panel");
    var box = document.getElementById("results");
    if (!panel || !box) return;
    var hasCards = !!box.querySelector(".cmd-action-card") || Object.keys(actionState.cards).length > 0;

  function upsertActionCardFromDto(dto, opts) {

    if (card.running && !card.ended) {
      if (card.uiState === "Done") card.uiState = "Running";
      else if (dto.uiState === "Planning" || dto.uiState === "Running" || dto.uiState === "Waiting") card.uiState = dto.uiState;
      else if (!card.uiState || card.uiState === "Done") card.uiState = "Running";
    } else if (dto.uiState) {
      card.uiState = dto.uiState;
    }
    card.title = dto.title || dto.query || card.title;
    if (wasNew || !card.query) card.query = dto.query || dto.title || card.query;
    else if (dto.reqId && String(dto.reqId) === String(card.reqId || "")) card.query = dto.query || card.query;
    if (dto.activeQuery) card.activeQuery = String(dto.activeQuery);
    if (dto.reqId) card.reqId = dto.reqId;
    card.sessionRef = dto.sessionRef || card.sessionRef;
    if (dto.provider) card.provider = normalizeAgentProvider(dto.provider);
    if (dto.routeId) card.routeId = String(dto.routeId);
    if (dto.routeLabel) card.routeLabel = String(dto.routeLabel);
    if (dto.promptAddon) card.promptAddon = String(dto.promptAddon);
    if (dto.a2uiCandidates) card.a2uiCandidates = dto.a2uiCandidates;
    if (card.routeId && typeof PaletteProfileComposer !== "undefined" && PaletteProfileComposer.compose) {
      card.routeProfile = PaletteProfileComposer.compose(card.routeId, { reason: "dto_hydrate" });
      card.a2uiCandidates = card.routeProfile.a2uiCandidates || card.a2uiCandidates || [];
      if (!card.promptAddon && card.routeProfile.promptAddon) card.promptAddon = card.routeProfile.promptAddon;
    } else if (card.routeId && typeof PaletteRouterSkill !== "undefined" && PaletteRouterSkill.PROFILES) {
      var prof = PaletteRouterSkill.PROFILES[card.routeId];
      if (prof) {
        var uiCand =
          PaletteRouterSkill.buildUiCandidates
            ? PaletteRouterSkill.buildUiCandidates(prof)
            : { a2ui: (prof.a2uiCandidates || []).slice(), display: { hideOriginalTable: false }, slots: {} };
        card.routeProfile = {
          routeId: prof.id,
          label: prof.label,
          promptAddon: prof.promptAddon || "",
          a2uiCandidates: uiCand.a2ui.slice(),
          uiCandidates: uiCand,

          followUpChips: prof.followUpChips || []

      } else {

      }
    }
    if (dto.updatedAt) card.updatedAt = dto.updatedAt;
    if (dto.createdAt) card.createdAt = dto.createdAt;
    else if (!card.createdAt && dto.updatedAt) card.createdAt = dto.updatedAt;
    if (dto.messages && Array.isArray(dto.messages)) card.messages = dto.messages.slice();
    if (dto.rawAnswer != null) {
      var incomingRaw = String(dto.rawAnswer || "");
      var followUp = cardFollowUpInFlight(card) || (card.running && !card.ended && card._segmentPriorBlocks && card._segmentPriorBlocks.length);
      if (!followUp || incomingRaw) {
        card.rawAnswer = incomingRaw;

          card.liveThought = card.rawAnswer;
      }
    }
    if (dto.liveThought != null && String(dto.liveThought) !== "") {
      if (!card.rawAnswer || isAgentStatusPreview(card.rawAnswer) || !isAgentStatusPreview(dto.liveThought))

    if (card.expanded === undefined) card.expanded = id === actionState.activeCardId;
    if (wasNew || isActionCardRunning(card)) actionState.activeCardId = id;
    if (!batch && actionState.focusMode && (wasNew || id === actionState.activeCardId)) collapseNonActiveCards();
    var restoredBlocks = applyDtoBlockStore(card, dto);
    if (restoredBlocks) {
      card._rawReplaySig = String(dto.rawAnswer || card.rawAnswer || "");
      if (cardHasPipelineReply(card)) {
        card.liveThought = "";
        hideCardLiveThoughtIfReply(id);
      }
    } else if (dto.rawAnswer && !shouldSkipDtoRawReplay(card, dto)) {
      var rawSig = String(dto.rawAnswer);
      var isDone = card.uiState === "Done" || dto.uiState === "Done";
      if (isDone && cardHasSubstantialRawAnswer(card) && !cardHasPipelineReply(card)) {
        card._rawReplaySig = rawSig;
        if (!batch && shouldEagerPipelineFinalize(card)) applyPipelineFinalize(id, rawSig);
      } else if (isDone && card._rawReplaySig !== rawSig) {
        card._rawReplaySig = rawSig;
        if (!batch && shouldEagerPipelineFinalize(card) && cardHasSubstantialRawAnswer(card))
          applyPipelineFinalize(id, rawSig);
      } else if (card._rawReplaySig !== rawSig) {
        card._rawReplaySig = rawSig;
        if (!batch) {
          if (typeof PaletteBlockPipeline !== "undefined" && PaletteBlockPipeline.ingestDelta) {

    if (batch) return;

  function cardFollowUpInFlight(card) {
    return !!(
      card &&
      card.running &&
      !card.ended &&
      card._segmentPriorBlocks &&
      card._segmentPriorBlocks.length
    );
  }

  function ensureFollowUpPriorBlocks(card) {
    if (!card || (card._segmentPriorBlocks && card._segmentPriorBlocks.length)) return;
    var prior = getCardPipelineBlocks(card);
    if (!prior.length) return;
    card._segmentPriorBlocks =
      typeof PaletteBlockPipeline !== "undefined" && PaletteBlockPipeline.freezeBlocks
        ? PaletteBlockPipeline.freezeBlocks(prior)
        : prior.slice();
  }

  function cardActiveQuery(card) {
    if (!card) return "";
    return String(card.activeQuery || card.query || "").trim();
  }

  function agentEndAnswerReady(text, card) {
    var t = dedupeRepeatedAgentText(String(text || "").trim());
    if (!t) return false;
    var prevLen = card ? String(card.rawAnswer || "").length : 0;
    if (t.length >= 800 && t.length > prevLen * 1.15 && !agentLooksLikeThinkingPreambleOnly(t)) return true;
    var probe = card ? Object.assign({}, card, { rawAnswer: t }) : { rawAnswer: t };
    if (!cardHasSubstantialRawAnswer(probe)) return false;
    if (cardAnswerLooksIncomplete(probe)) return false;
    return true;
  }

  function maybeRecoverIncompleteDoneCard(card) {
    if (!card || !card.reqId) return;
    if (!cardAnswerLooksIncomplete(card)) return;
    post({
      type: "palette_agent_recover",
      cardId: card.id,
      reqId: card.reqId,
      query: cardActiveQuery(card),
      sessionRef: String(card.sessionRef || "")
    });
  }

  function scheduleAgentCardsRecover() {
    if (actionState._recoverTimer) clearTimeout(actionState._recoverTimer);
    var delay = 1500;
    var ids0 = Object.keys(actionState.cards);
    for (var di = 0; di < ids0.length; di++) {
      var cr = actionState.cards[ids0[di]];
      if (!isActionCardRunning(cr)) continue;
      var runMs = cr._runningSince ? Date.now() - Number(cr._runningSince) : 0;
      delay = runMs > 60000 ? 8000 : runMs > 20000 ? 4000 : 3000;
      break;
    }
    actionState._recoverTimer = setTimeout(function () {
      actionState._recoverTimer = 0;
      var now = Date.now();
      var ids = Object.keys(actionState.cards);
      for (var ri = 0; ri < ids.length; ri++) {
        var c = actionState.cards[ids[ri]];
        if (!c || !c.reqId) continue;
        if (!cardFollowUpInFlight(c)) {
          if (cardHasPipelineReply(c) && !cardAnswerLooksIncomplete(c)) continue;
          if (cardHasSubstantialRawAnswer(c) && !cardAnswerLooksIncomplete(c)) continue;
        }
        if (!(isActionCardRunning(c) || c.uiState === "Done" || cardFollowUpInFlight(c))) continue;
        if (c._lastRecoverPost && now - c._lastRecoverPost < 5000) continue;
        c._lastRecoverPost = now;
        post({
          type: "palette_agent_recover",
          cardId: c.id,
          reqId: c.reqId,
          query: cardActiveQuery(c),
          sessionRef: String(c.sessionRef || "")
        });
      }
    }, delay);
  }

  function submitAgentTask(text, opts) {
    opts = opts || {};
    var q = readInputValue().trim() || resolveAgentSubmitText(text);
    if (!q) return;
    agentDebugLog("submit_text", "q=" + q.slice(0, 80));
    var prov = normalizeAgentProvider(opts.provider || state.agentProvider || "openclaw");
    var kind = "new";
    var cardId = "";
    var active = null;
    if (opts.forceNewFromMainInput || (!opts.fromCardFollowup && !opts.explicitCardFollowup)) {
      kind = "new";
      cardId = "";
      var mainInput = getInputEl();
      if (mainInput && state.intent === "action") {
        mainInput.placeholder =
          IntentRouter.PLACEHOLDERS[state.intent] || IntentRouter.PLACEHOLDERS.local;
      }
    } else if (opts.fromCardFollowup && opts.explicitCardFollowup && opts.cardId) {
      active = getActionCard(opts.cardId);
      if (active) {
        cardId = active.id;
        kind = opts.forceKind || (active.uiState === "Waiting" ? "correction" : "append");
      }
    } else {
      kind = "new";
      cardId = "";
    }
    if (kind === "new" && isAgentProviderKeyword(q)) {
      window.nmerPalette.setStatus("请输入具体任务内容，不要只输入引擎名称（龙虾 / Hermes / openclaw）", "error");
      getInputEl()?.focus();
      return;
    }
    if (active && kind !== "new") {
      active.activeQuery = q;
      active._lastFollowUpQuery = q;
      if (!Array.isArray(active.messages)) active.messages = [];
      active.messages.push({ role: "user", text: q, at: new Date().toISOString() });
      if (kind === "append") {
        ensureFollowUpPriorBlocks(active);
        beginCardFollowUpSegment(active, "append");
      } else beginCardCorrectionTurn(active);
      active.running = true;
      active.ended = false;
      active._runningSince = Date.now();
      active.uiState = kind === "append" ? "Planning" : "Running";
      active.liveThought = "已收到补充，继续执行…";
      actionCardManager.transitionCardState(active.id, active.uiState);
      refreshActionCardDom(active);
    }
    var submitMsg = {
      type: "palette_agent_submit",
      text: q,
      query: q,
      kind: kind,
      cardId: cardId,
      provider: prov
    };
    var preserveRoute = !!(opts.fromCardFollowup && opts.explicitCardFollowup && active && active.routeProfile);
    var routeResult = null;
    if (preserveRoute && typeof PalettePromptComposer !== "undefined" && PalettePromptComposer.composeSubmitPayload) {
      var preserved = PalettePromptComposer.composeSubmitPayload(active.routeProfile, active, {
        preserveRoute: true
      });
      routeResult = preserved.routeProfile || active.routeProfile;
      submitMsg.routeId = routeResult.routeId || active.routeId;
      submitMsg.routeLabel = routeResult.label || active.routeLabel;
      submitMsg.promptAddon = preserved.promptAddon;
      submitMsg.routeConfidence = routeResult.confidence != null ? routeResult.confidence : 1;
      submitMsg.a2uiCandidates = routeResult.a2uiCandidates || active.a2uiCandidates || [];
      agentDebugLog("prompt_compose", JSON.stringify(preserved.promptMeta || {}));
      agentDebugLog(
        "pipeline_route",
        JSON.stringify({
          routeId: submitMsg.routeId,
          label: submitMsg.routeLabel,
          preserveRoute: true,
          a2uiCandidates: submitMsg.a2uiCandidates || []
        })
      );
      active.promptAddon = preserved.promptAddon;
    } else if (typeof PaletteRouterSkill !== "undefined" && PaletteRouterSkill.route) {
      routeResult = PaletteRouterSkill.route(q);
      var composePayload =
        typeof PalettePromptComposer !== "undefined" && PalettePromptComposer.composeSubmitPayload
          ? PalettePromptComposer.composeSubmitPayload(routeResult, active, { preserveRoute: false })
          : { promptAddon: routeResult.promptAddon, promptMeta: {} };
      submitMsg.routeId = routeResult.routeId;
      submitMsg.routeLabel = routeResult.label;
      submitMsg.promptAddon = composePayload.promptAddon;
      submitMsg.routeConfidence = routeResult.confidence;
      submitMsg.a2uiCandidates = routeResult.a2uiCandidates;
      agentDebugLog("prompt_compose", JSON.stringify(composePayload.promptMeta || {}));
      agentDebugLog(
        "pipeline_route",
        JSON.stringify({
          routeId: routeResult.routeId,
          label: routeResult.label,
          confidence: routeResult.confidence,
          a2uiCandidates: routeResult.a2uiCandidates || [],
          followUpChips: (routeResult.followUpChips || []).length
        })
      );
      if (active) {
        active.routeId = routeResult.routeId;
        active.routeLabel = routeResult.label;
        active.routeProfile = routeResult;
        active.a2uiCandidates = routeResult.a2uiCandidates;
        active.promptAddon = composePayload.promptAddon;
      }
    }
    agentDebugLog("submit_start", "kind=" + kind + " text=" + String(q).slice(0, 60));
    var provGuess = prov;
    var hostOk = false;
    var posted = postAgentSubmitMsg(submitMsg);
    if (posted) {
      agentDebugLog("submit_post", "via=postMessage primary");
      hostOk = true;
    }
    if (!hostOk) {
      var ahkRet = "";
      try {
        ahkRet = submitAgentToHostSync(submitMsg);
        agentDebugLog("bridge_ret", (ahkRet || "(empty)").slice(0, 120));
        hostOk = applyAgentSubmitBridgeRet(ahkRet, submitMsg, provGuess);
        if (!hostOk) {
          window.nmerPalette.setStatus(
            "⚠ 提交失败：" + (ahkRet && ahkRet.indexOf("err:") === 0 ? ahkRet.slice(4) : "请完全退出托盘后重启牛马.ahk"),
            "error"
          );
          agentDebugLog("submit_failed", ahkRet || "empty", "err");
          return;
        }
      } catch (eSub) {
        agentDebugLog("bridge_exc", String(eSub && eSub.message || eSub).slice(0, 120), "warn");
        window.nmerPalette.setStatus("⚠ 提交失败：宿主桥接异常", "error");
        return;
      }
    }
    agentDebugLog("submit_ui", "card=" + actionState.activeCardId);
    state._userPickedCommand = false;
    if (kind === "new") purgeActionEmptyHint();
    if (kind === "new" || kind === "append") {
      var inputEl = getInputEl();
      if (inputEl && !opts.fromCardFollowup) {
        inputEl.value = "";
        state.input = "";
      }
    }
    window.nmerPalette.setStatus(
      "已提交至 " +
        agentProviderLabel(prov) +
        (kind === "new" ? " · 新建任务" : " · 续聊") +
        "：「" +
        (q.length > 80 ? q.slice(0, 80) + "…" : q) +
        "」",
      "loading"
    );
    state.actionCmdBrowse = false;
    var rbox = document.getElementById("results");
    if (rbox) rbox.classList.remove("show-cmd-browse");
    ensureActionResultsVisible();
    renderActionHistoryList();
    requestAnimationFrame(function () {
      ensureActionResultsVisible();
      syncActionListLayout();
    });
  }

  function ensureActionResultsVisible() {

  function renderActionCardSync(cards) {
    cards = normalizeAgentCardsArray(cards);
    var hostIds = {};
    for (var hi = 0; hi < cards.length; hi++) {
      var hid = String(cards[hi].cardId || cards[hi].id || "");
      if (hid) hostIds[hid] = true;
    }
    Object.keys(actionState.cards).forEach(function (id) {
      if (!hostIds[id] && id !== actionState._pendingCardId) removeActionCard(id, false);
    });
    beginActionCardBatchUpsert();
    try {
      for (var i = 0; i < cards.length; i++) upsertActionCardFromDto(cards[i], { batch: true });
    } finally {
      endActionCardBatchUpsert();
    }
    if (!cards.length && !actionHasStoredCards()) return;
    purgeActionEmptyHint();
    if (!actionState.activeCardId || !getActionCard(actionState.activeCardId)) {
      var pick = "";
      Object.keys(actionState.cards).forEach(function (cid) {
        if (!pick && isActionCardRunning(actionState.cards[cid])) pick = cid;
      });
      if (!pick) {
        var all = Object.keys(actionState.cards);
        sortCardIds(all);
        if (all.length) pick = all[0];
      }
      if (pick) {
        actionState.activeCardId = pick;
        if (isActionCardRunning(actionState.cards[pick])) actionState.cards[pick].expanded = true;
      }
    }
    if (Object.keys(actionState.cards).length === 1) {
      var sole = Object.keys(actionState.cards)[0];
      actionState.activeCardId = sole;
      actionState.cards[sole].expanded = isActionCardRunning(actionState.cards[sole]);
    }
    if (actionState.focusMode) collapseNonActiveCards();
    renderActionHistoryList();
    syncActionResultsLayout();
    if (actionHasStoredCards()) {
      window.nmerPalette.setStatus(
        "已加载 " + Object.keys(actionState.cards).length + " 个历史任务",
        "success"
      );
    }
    scheduleAgentCardsRecover();
    requestAnimationFrame(replayExpandedCardPipelineBlocks);
  }

  function applyAgentCardNew(d) {
    if (!d) return;
    var nid = String(d.cardId || d.id || "");
    var existing = nid ? getActionCard(nid) : null;
    upsertActionCardFromDto({
      cardId: d.cardId || d.id,
      reqId: d.reqId,
      uiState: d.uiState || "Planning",
      title: d.title,
      query: d.query,
      activeQuery: d.activeQuery,
      provider: d.provider,
      sessionRef: d.sessionRef,
      rawAnswer: d.rawAnswer,
      updatedAt: d.updatedAt,
      liveThought: d.liveThought,
      running: d.running !== false,
      ended: !!d.ended
    });
    if (nid) {
      actionState.activeCardId = nid;
      collapseNonActiveCards();
      if (existing && existing.running) {
        refreshActionCardDom(existing);
        ensureActionResultsVisible();
        syncActionResultsLayout();
        syncWindowSize();
        return;
      }
      focusActionCard(nid, { expand: true });
    }
    purgeActionEmptyHint();
    ensureActionResultsVisible();
    renderActionHistoryList();
    syncActionResultsLayout();
    syncWindowSize();
  }
