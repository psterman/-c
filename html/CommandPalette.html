      desc.className = "result-desc";
      desc.textContent = item.desc || item.subtitle || item.path || "";
      body.appendChild(title);
      body.appendChild(desc);
      btn.appendChild(icon);
      btn.appendChild(body);
      frag.appendChild(btn);
    }
    box.replaceChildren(frag);
  }

  function renderActionCmdList(rows) {
    var box = document.getElementById("results");
    if (!box) return;
    var cmdHost = box.querySelector(".action-cmd-list");
    if (!rows || !rows.length) {
      if (cmdHost) cmdHost.remove();
      return;
    }
    if (!cmdHost) {
      cmdHost = document.createElement("div");
      cmdHost.className = "action-cmd-list";
      var stack = box.querySelector(".action-card-stack");
      if (stack) box.appendChild(cmdHost);
      else box.appendChild(cmdHost);
    }
    if (state.resultMode === "turbo") renderTurboResults(cmdHost, rows);
    else renderCommandResults(cmdHost, rows);
    bindResultClicks(cmdHost);
  }

  function renderCommandResults(box, rows) {
    if (!box) return;
    if (state.intent === "action" && box.id === "results") {
      renderActionCmdList(rows);
      return;
    }
    box.innerHTML = rows
      .map(function (item, idx) {
        var active = idx === state.selected ? " active" : "";
        var matched = item.matched ? " matched" : "";
        var kind = item.kind ? " kind-" + esc(item.kind) : "";
        var binding = item.binding ? '<span class="result-binding">' + esc(item.binding) + "</span>" : "";
        if (!binding && item.kind === "ai_provider") {
          if (String(item.id || "") === state.selectedAiProvider) binding = '<span class="result-binding">已选</span>';
          else if (isAiConfigured(item)) binding = '<span class="result-binding">已配置</span>';
        }
        var icon = item.kind === "ai_provider" ? renderProviderIconHtml(item) : kindIcon(item.kind || "command");
        return (
          '<button class="result-item' + active + matched + kind + '" type="button" data-idx="' + idx + '">' +
          '<span class="result-icon" aria-hidden="true">' + icon + "</span>" +
          '<span class="result-body">' +
          '<div class="result-row"><span class="result-title">' + esc(item.label || item.name || "") + "</span>" + binding + "</div>" +
          '<span class="result-desc">' + esc(item.desc || "") + "</span></span></button>"
        );
      })
      .join("");
    hydrateResultIcons(box);
  }

  function bindResultClicks(box) {
    box.querySelectorAll("[data-idx]").forEach(function (node) {
      node.addEventListener("click", function (e) {
        var idx = Number(e.currentTarget.getAttribute("data-idx"));
        if (idx < 0) return;
          state.selected = idx;
        var rows = currentRows();
        var item = rows[idx];
        if (item && item.kind === "ai_provider") {
          pickAiProvider(item.id);
          return;
        }
          updateResults();
          executeSelected();
      });
    });
  }

  function updateResults() {
    if (aiPhase === "compact" && state.intent === "ai") {
      refreshAiProvidersUnderCard();
      return;
    }
    if (state.intent === "action") purgeAiResultsDom();
    var box = document.getElementById("results");
    var panel = document.getElementById("palette-panel");
    if (!box || !panel) return;
    var rows = currentRows();
    var hasActionCards = actionHasStoredCards() || !!box.querySelector(".cmd-action-card");
    state.showResults = rows.length > 0 || hasActionCards || state.intent === "action";
    panel.classList.toggle("has-results", state.showResults);
    panel.classList.toggle("has-ai-providers", state.intent === "ai" && rows.length > 0);
    box.classList.toggle("has-action-cards", hasActionCards);
    box.classList.toggle("show-cmd-browse", !!state.actionCmdBrowse);
    if (state.intent === "action" && !hasActionCards && !state.actionCmdBrowse && !state.input.trim()) {
      requestAgentCardSync();
      renderActionHistoryList();
      purgeActionEmptyHint();
      syncWindowSize();
      return;
    }
    if (state.intent === "action" && hasActionCards) {
      renderActionHistoryList();
      var cmdHost = box.querySelector(".action-cmd-list");
      if (!rows.length || !state.actionCmdBrowse) {
        if (cmdHost) cmdHost.remove();
      } else {
        if (!cmdHost) {
          cmdHost = document.createElement("div");
          cmdHost.className = "action-cmd-list";
          box.appendChild(cmdHost);
        }
        if (state.resultMode === "turbo") renderTurboResults(cmdHost, rows);
        else renderCommandResults(cmdHost, rows);
        bindResultClicks(cmdHost);
        var activeNode = cmdHost.querySelector(".result-item.active");
        if (activeNode) scrollResultItemIntoView(box, activeNode);
      }
      bindResultsScrollHide(box);
      syncWindowSize();
      return;
    }
    if (state.intent === "action") {
      if (hasActionCards) {
        renderActionHistoryList();
        if (state.actionCmdBrowse && rows.length) renderActionCmdList(rows);
        else {
          var ch = box.querySelector(".action-cmd-list");
          if (ch) ch.remove();
        }
      } else if (state.actionCmdBrowse && rows.length) {
        renderActionCmdList(rows);
      } else if (!state.input.trim()) {
        pullAgentCardsFromHostSync();
        if (!actionHasStoredCards()) showActionEmptyIfNeeded();
        return;
      }
      bindResultsScrollHide(box);
      syncWindowSize();
      return;
    }
    box.className = "palette-results" + (hasActionCards ? " has-action-cards" : "");
    if (state.resultMode === "turbo") renderTurboResults(box, rows);
    else renderCommandResults(box, rows);
    bindResultsScrollHide(box);
    bindResultClicks(box);
    var activeNode2 = box.querySelector(".result-item.active");
    if (activeNode2) scrollResultItemIntoView(box, activeNode2);
    syncWindowSize();
  }

  function runQuery(immediate) {
    if (composing) return;
    state.input = readInputValue();
    if (state.intent === "ai") {
      state.actions = state.aiProviders.slice();
      state.resultMode = "command";
      state.turboItems = [];
      if (state.selected >= state.actions.length) state.selected = 0;
      ensureHeaderInputVisible();
      updateResults();
      syncInputHeight();
      syncWindowSize();
      return;
    }
    if (fetchTimer) clearTimeout(fetchTimer);
    var q = state.input.trim();
    var delay = state.intent === "local" ? 50 : 100;
    var run = function () {
      state.querySeq += 1;
      var seq = state.querySeq;
      if (state.intent === "local" && q) {
        state.turboQuery = q;
        state.resultMode = "turbo";
        post({ type: "palette_turbo_search", query: q, intent: "local", limit: 20, seq: seq });
        return;
      }
      if (state.intent === "action" && Object.keys(actionState.cards).length > 0 && !state.actionCmdBrowse) {
        renderActionHistoryList();
        syncActionResultsLayout();
        return;
      }
      if (state.intent === "action" && !q && !state.actionCmdBrowse) {
        if (actionHasStoredCards()) {
          renderActionHistoryList();
          syncActionResultsLayout();
        } else {
          requestAgentCardSync();
          purgeActionEmptyHint();
          syncWindowSize();
        }
        return;
      }
      state.resultMode = "command";
      state.turboItems = [];
      post({ type: "palette_query", input: state.input, seq: seq });
    };
    if (immediate) run();
    else fetchTimer = setTimeout(run, delay);
  }

  function sendAiQuery() {
    if (aiPhase === "streaming") return;
    if (aiPhase === "compact" || aiPhase === "done" || aiPhase === "error") {
      if (aiPhase === "compact") post({ type: "palette_ai_dismiss" });
      resetAiStreamState();
    }
    state.input = readInputValue();
    startAiMorphing(state.input.trim(), state.selectedAiProvider || "");
  }

  function executeSelected() {
    if (state.intent === "ai") {
      var rows = currentRows();
      var item = rows[state.selected];
      if (item && item.kind === "ai_provider") {
        pickAiProvider(item.id);
        return;
      }
      sendAiQuery();
      return;
    }
    var rows = currentRows();
    var item = rows[state.selected];
    if (!item) return;
    if (state.resultMode === "turbo") {
      post({
        type: "palette_turbo_execute",
        path: String(item.path || ""),
        title: String(item.label || item.title || ""),
        kind: String(item.kind || "file"),
        query: state.input
      });
      hidePalette();
      return;
    }
    post({
      type: "palette_execute",
      cmdId: String(item.id || item.cmdId || ""),
      query: state.input,
      kind: String(item.kind || "command"),
      label: String(item.label || item.name || "")
    });
  }

  function actionResultsReservedHeight() {
    var panel = document.getElementById("palette-panel");
    if (panel && panel.classList.contains("action-detail-open")) return 16;
    var header = panel && panel.querySelector(".palette-header");
    var agentBar = document.getElementById("action-agent-bar");
    var status = document.getElementById("voice-hint");
    var reserved =
      (header ? header.offsetHeight : 48) +
      (agentBar && !agentBar.hidden ? agentBar.offsetHeight || ACTION_AGENT_BAR_H : 0) +
      (status && status.classList.contains("show") ? status.offsetHeight || 24 : 0) +
      readHeightConfigNumber("actionReservedBottomGap", 52);
    return reserved;
  }

  function syncActionResultsScrollMode() {
    var results = document.getElementById("results");
    var stack = results && results.querySelector(".action-card-stack");
    if (!results || !stack) return null;
    var expanded = hasExpandedActionCard();
    var cardN = Object.keys(actionState.cards).length;
    results.classList.toggle("has-expanded-card", expanded);
    results.classList.toggle("has-action-cards", cardN > 0);
    var detailDom = actionState.detailCardId
      ? document.getElementById("card-" + actionState.detailCardId)
      : null;
    var detailNav = stack.querySelector(":scope > .action-detail-nav");
    var contentH = detailDom
      ? measureExpandedCardIntrinsicHeight(getActionCard(actionState.detailCardId), detailDom) +
        (detailNav ? detailNav.offsetHeight || 48 : 48) +
        24
      : Math.max(measureExpandedStackContentHeight(stack), estimateActionStackHeight());
    var paletteMax = expanded ? actionPaletteExpandedMaxHeight() : actionPaletteMaxHeight();
    var minList = actionResultsMinViewportHeight(expanded);
    var availableList = Math.max(minList, paletteMax - actionResultsReservedHeight());
    var maxList = expanded
      ? availableList
      : Math.min(ACTION_RESULTS_SCROLL_CAP, availableList);
    var needScroll = contentH > maxList + 4;
    results.classList.toggle("is-scrollable", needScroll);
    results.classList.toggle("is-scrolling", needScroll);
    if (needScroll) {
      results.style.maxHeight = maxList + "px";
    } else {
      results.style.maxHeight = "";
    }
    return (needScroll ? maxList : Math.max(contentH, minList)) + 12;
  }

  function measureActionPanelExtra(results) {
    var extra = 0;
    var agentBar = document.getElementById("action-agent-bar");
    if (agentBar && !agentBar.hidden) {
      extra += Math.max(ACTION_AGENT_BAR_H, agentBar.offsetHeight || ACTION_AGENT_BAR_H) + 4;
    }
    if (!results) return extra + 48;
    var stack = results.querySelector(".action-card-stack");
    var toolbarH = 0;
    var tb = results.querySelector(".action-history-toolbar");
    var hd = results.querySelector(".action-history-head");
    if (tb) toolbarH += tb.offsetHeight || 28;
    if (hd) toolbarH += hd.offsetHeight || 22;
    if (stack) {
      var viewportH = syncActionResultsScrollMode();
      if (viewportH != null && viewportH > 0) {
        extra += viewportH + 10;
        return extra;
      }
      extra += measureActionStackHeight(stack) + 10;
      return extra;
    }
    var cardCount = Object.keys(actionState.cards).length;
    if (cardCount > 0) {
      var collapsedRowGuess = Math.max(
        readHeightConfigNumber("actionRunningRowHeight", 52),
        readHeightConfigNumber("actionDoneRowHeight", 42)
      );
      extra += toolbarH + Math.max(ACTION_CARD_MIN_H, cardCount * collapsedRowGuess);
      return extra;
    }
    var actEmpty = results.querySelector(".action-intent-empty");
    var actHead = results.querySelector(".action-history-head");
    if (actEmpty || actHead) {
      extra += Math.max(
        68,
        (actEmpty ? actEmpty.offsetHeight : 0) + (actHead ? actHead.offsetHeight : 0) + 24
      );
      return extra;
    }
    if (state.actionCmdBrowse || results.querySelector(".result-item")) {
      var rowH2 = 54;
      var rowsN = Math.max(1, currentRows().length);
      var listH2 = Math.min(RESULTS_MAX_HEIGHT, rowsN * rowH2 + 14);
      if (results.scrollHeight > 0) listH2 = Math.min(RESULTS_MAX_HEIGHT, results.scrollHeight + 14);
      extra += Math.max(80, listH2);
      return extra;
    }
    return extra + 64;
  }

  function measureContentHeight() {
    var panel = document.getElementById("palette-panel");
    var header = panel?.querySelector(".palette-header");
    var status = document.getElementById("voice-hint");
    var results = document.getElementById("results");
    if (!panel || !header) return state.intent === "action" ? ACTION_IDLE_MIN_H : 120;
    var detailOpen = panel.classList.contains("action-detail-open");
    var headerH = detailOpen ? 0 : header.offsetHeight || 0;
    if (!detailOpen && headerH < 48) headerH = 48;
    var h = headerH;
    if (!detailOpen && status && status.classList.contains("show")) {
      h += status.offsetHeight || 24;
    }
    if (state.intent === "action") {
      h += withUnclippedPaletteMeasure(function () {
        return measureActionPanelExtra(results);
      });
      var expanded = hasExpandedActionCard();
      var cap = expanded ? actionPaletteExpandedMaxHeight() : actionPaletteMaxHeight();
      var workspaceMin = expanded
        ? readHeightConfigNumber("actionDetailMinHeight", 640)
        : readHeightConfigNumber("actionHomeMinHeight", 560);
      return Math.min(cap, Math.max(workspaceMin, Math.ceil(h)));
    }
    var cap = state.intent === "ai" ? AI_LIST_MAX_HEIGHT : RESULTS_MAX_HEIGHT + 140;
    var remain = cap - h - 8;
    if (remain < 120) remain = 120;
    if (state.showResults && results) {
      var actionCards = results.querySelectorAll(".cmd-action-card");
      if (actionCards && actionCards.length) {
        var acH = 24;
        for (var aci = 0; aci < actionCards.length; aci++) acH += actionCards[aci].offsetHeight + 8;
        h += Math.min(readHeightConfigNumber("actionExpandedCardHeightCap", 680), Math.max(ACTION_CARD_MIN_H, acH + 16));
      } else if (state.intent === "ai") {
        var card = document.querySelector(".ai-bg-card");
        var hint = document.querySelector(".palette-ai-provider-hint");
        var rowCount = Math.max(0, currentRows().length);
        var need =
          (card ? card.offsetHeight + 8 : 0) +
          (hint ? hint.offsetHeight + 4 : 0) +
          rowCount * AI_PROVIDER_ROW_H +
          12;
        h += Math.min(remain, need);
      } else {
        var rowH = state.resultMode === "turbo" ? 40 : 54;
        var rows = Math.max(1, currentRows().length);
        var listH = Math.min(RESULTS_MAX_HEIGHT, rows * rowH + 14);
        if (results.scrollHeight > 0) listH = Math.min(RESULTS_MAX_HEIGHT, results.scrollHeight + 14);
        h += listH;
      }
    }
    return Math.min(cap, Math.max(120, Math.ceil(h)));
  }

  function resetAiStreamState() {
    aiPhase = "idle";
    aiStreamText = "";
    aiStreamReqId = "";
    aiBgCardPayload = null;
    isBackgroundStreaming = false;
    pendingChunkBuf = "";
    if (scrollRaf) {
      cancelAnimationFrame(scrollRaf);
      scrollRaf = 0;
    }
    var panel = document.getElementById("palette-panel");
    if (panel) {
      panel.classList.remove("ai-streaming", "has-ai-bg-card");
    }
  }

  function aiAnswerPreview(text, maxLen) {
    var t = String(text || "").replace(/\s+/g, " ").trim();
    if (!t) return "";
    var n = maxLen || 56;
    if (t.length <= n) return t;
    return t.slice(0, n) + "…";
  }

  function aiBgCardBadge(phase, handoff) {
    if (phase === "done") return { text: "已完成", cls: "done" };
    if (phase === "error") return { text: "失败", cls: "error" };
    if (handoff) return { text: "后台中", cls: "handoff" };
    return { text: "回答中", cls: "streaming" };
  }

  function updateAiBackgroundCard() {
    var card = document.querySelector(".ai-bg-card");
    if (!card || !aiBgCardPayload) return;
    var d = aiBgCardPayload;
    var phase = String(d.phase || "streaming");
    var q = String(d.query || "").trim();
    var ans = String(aiStreamText || d.answer || "").trim();
    var badge = aiBgCardBadge(phase, d.handoff);
    var errMsg = String(d.message || d.error || "").trim();
    var preview = phase === "error" ? (errMsg || "请求失败，请检查 API Key 与网络") : aiAnswerPreview(ans, 64);
    var title = document.querySelector(".ai-bg-card-title");
    var prev = document.querySelector(".ai-bg-card-preview");
    var badgeEl = document.querySelector(".ai-bg-card-badge");
    if (title) title.textContent = "问：" + (q || "AI 对话");
    if (prev) prev.textContent = preview ? "答：" + preview : "点击展开查看";
    if (badgeEl) {
      badgeEl.className = "ai-bg-card-badge " + badge.cls;
      badgeEl.textContent = badge.text;
    }
  }

  function showAiBackgroundCard(d) {
    aiBgCardPayload = d || {};
    var phase = String(d.phase || "streaming");
    var q = String(d.query || "").trim();
    prepareAiIntentForNewQuestion(d.provider ? String(d.provider) : "");
    aiStreamReqId = String(d.reqId || "");
    aiStreamText = String(d.answer || "");
    isBackgroundStreaming = false;
    pendingChunkBuf = "";
    aiPhase = "compact";

    var box = document.getElementById("results");
    var panel = document.getElementById("palette-panel");
    if (!box || !panel) return;
    box.innerHTML = "";
    box.className = "palette-results has-ai-bg-card";
    panel.classList.remove("ai-streaming");
    panel.classList.add("has-ai-bg-card", "has-ai-providers");
    state.showResults = true;

    var stack = document.createElement("div");
    stack.className = "ai-results-stack";

    var badge = aiBgCardBadge(phase, d.handoff);
    var errMsg0 = String(d.message || d.error || "").trim();
    var preview = phase === "error" ? (errMsg0 || "请求失败，请检查 API Key 与网络") : aiAnswerPreview(aiStreamText, 64);
    if (phase === "error" && errMsg0) aiBgCardPayload.message = errMsg0;
    var card = document.createElement("div");
    card.className = "ai-bg-card";
    card.setAttribute("role", "button");
    card.setAttribute("tabindex", "0");
    card.innerHTML =
      '<div class="ai-bg-card-icon">💬</div>' +
      '<div class="ai-bg-card-body">' +
      '<div class="ai-bg-card-title">问：' + esc(q || "AI 对话") + "</div>" +
      '<div class="ai-bg-card-preview">' + esc(preview ? "答：" + preview : "点击展开查看") + "</div>" +
      "</div>" +
      '<span class="ai-bg-card-badge ' + badge.cls + '">' + badge.text + "</span>" +
      '<div class="ai-bg-card-actions">' +
      '<button type="button" class="ai-bg-card-btn expand" title="展开">↗</button>' +
      '<button type="button" class="ai-bg-card-btn close" title="关闭">×</button>' +
      "</div>";

    card.addEventListener("click", function (e) {
      if (e.target.closest(".ai-bg-card-btn.close")) return;
      if (e.target.closest(".ai-bg-card-btn.expand") || !e.target.closest(".ai-bg-card-btn")) {
        expandAiBackgroundCard();
      }
    });
    card.querySelector(".ai-bg-card-btn.expand")?.addEventListener("click", function (e) {
      e.stopPropagation();
      expandAiBackgroundCard();
    });
    card.querySelector(".ai-bg-card-btn.close")?.addEventListener("click", function (e) {
      e.stopPropagation();
      dismissAiBackgroundCard();
    });
    card.addEventListener("keydown", function (e) {
      if (e.key === "Enter") {
        e.preventDefault();
        expandAiBackgroundCard();
      }
    });
    stack.appendChild(card);

    var hint = document.createElement("div");
    hint.className = "palette-ai-provider-hint";
    hint.textContent = "选择模型，在上方输入新问题";
    stack.appendChild(hint);

    var listWrap = document.createElement("div");
    listWrap.className = "palette-ai-provider-list";
    stack.appendChild(listWrap);

    box.appendChild(stack);
    updateAiBackgroundCard();
    refreshAiProvidersUnderCard();

    if (phase === "done") {
      window.nmerPalette.setStatus("输入新问题 · 选模型后 Enter 发送", "idle");
    } else if (phase === "error") {
      window.nmerPalette.setStatus("上次请求失败 · 可换模型后重试", "error");
    } else if (d.handoff) {
      window.nmerPalette.setStatus("后台生成中 · 点击卡片查看", "loading");
    } else {
      window.nmerPalette.setStatus("正在回答 · 点击卡片查看进度", "loading");
    }
    ensureHeaderInputVisible();
    syncWindowSize();
    requestAnimationFrame(function () {
      ensureHeaderInputVisible();
      syncWindowSize();
    });
  }

  function expandAiBackgroundCard() {
    if (!aiBgCardPayload) return;
    var d = Object.assign({}, aiBgCardPayload, { compact: false });
    var panel = document.getElementById("palette-panel");
    if (panel) panel.classList.remove("has-ai-bg-card");
    restoreAiSession(d);
  }

  function dismissAiBackgroundCard() {
    post({ type: "palette_ai_dismiss" });
    resetAiStreamState();
    prepareAiIntentForNewQuestion(state.selectedAiProvider || "");
    if (state.intent === "ai") {
      state.actions = state.aiProviders.slice();
      state.resultMode = "command";
      updateResults();
    } else updateResults();
    window.nmerPalette.setStatus(state.selectedAiProvider ? "已选模型 · Enter 发送" : "请选择模型", "idle");
    syncWindowSize();
  }

  function flushPendingChunks() {
    scrollRaf = 0;
    if (!pendingChunkBuf || isBackgroundStreaming) return;
    var body = document.querySelector(".ai-stream-body");
    if (!body) return;
    aiStreamText += pendingChunkBuf;
    pendingChunkBuf = "";
    body.textContent = aiStreamText;
    body.scrollTop = body.scrollHeight;
  }

  function appendAiChunk(delta) {
    if (isBackgroundStreaming || !delta) return;
    if (aiPhase === "compact") {
      aiStreamText += String(delta);
      if (aiBgCardPayload) aiBgCardPayload.answer = aiStreamText;
      updateAiBackgroundCard();
      return;
    }
    pendingChunkBuf += String(delta);
    if (aiPhase === "streaming") {
      updateAiStreamHeader({ query: state.input, phase: "streaming" });
    }
    if (!scrollRaf) {
      scrollRaf = requestAnimationFrame(flushPendingChunks);
    }
  }

  function aiProviderLabel(id) {
    var pid = String(id || "");
    for (var i = 0; i < state.aiProviders.length; i++) {
      if (String(state.aiProviders[i].id || "") === pid) return state.aiProviders[i].label || pid;
    }
    return pid || "AI";
  }

  function updateAiStreamHeader(meta) {
    var header = document.querySelector(".ai-stream-header");
    if (!header) return;
    var q = String((meta && meta.query) || state.input || "").trim();
    var phase = String((meta && meta.phase) || aiPhase || "streaming");
    var handoff = !!(meta && meta.handoff);
    var badgeText = "正在回答";
    var badgeClass = "streaming";
    if (phase === "done") {
      badgeText = "已完成";
      badgeClass = "done";
    } else if (phase === "error") {
      badgeText = "失败";
      badgeClass = "error";
    } else if (handoff) {
      badgeText = "后台生成中";
      badgeClass = "handoff";
    }
    header.innerHTML =
      '<div class="ai-stream-header-main">' +
      '<div class="ai-stream-header-title">AI 回答</div>' +
      (q ? '<div class="ai-stream-header-query">' + esc(q) + "</div>" : "") +
      "</div>" +
      '<span class="ai-stream-badge ' + badgeClass + '">' + badgeText + "</span>";
  }

  function restoreAiSession(d) {
    if (!d) return;
    var phase = String(d.phase || "idle");
    if (phase === "idle") {
      resetAiStreamState();
      return;
    }
    if (d.compact !== false) {
      showAiBackgroundCard(d);
      return;
    }
    var q = String(d.query || "").trim();
    if (q) {
      state.input = q;
      state.intent = "ai";
      var inp = getInputEl();
      if (inp) inp.value = q;
      if (d.provider) state.selectedAiProvider = String(d.provider);
      ensureInputForIntent();
      syncInputHeight();
    }
    ensureAiStreamDom();
    updateAiStreamHeader({ query: q, phase: phase, handoff: d.handoff });
    aiStreamReqId = String(d.reqId || "");
    aiStreamText = String(d.answer || "");
    isBackgroundStreaming = false;
    pendingChunkBuf = "";
    flushPendingChunks();
    var body = document.querySelector(".ai-stream-body");
    if (body) {
      body.textContent = aiStreamText;
      if (phase === "streaming") body.classList.add("streaming");
      else body.classList.remove("streaming");
    }
    aiPhase = phase === "done" ? "done" : phase === "error" ? "error" : "streaming";
    post({ type: "palette_morph_resize", height: MORPH_HEIGHT });
    if (phase === "done") {
      window.nmerPalette.setStatus("回答完成 · Tab 打开完整对话", "idle");
    } else if (phase === "error") {
      showAiStreamError(d.message || d.error || "请求失败");
    } else if (d.handoff) {
      window.nmerPalette.setStatus("后台继续生成中 · 可在此查看进度", "loading");
    } else {
      window.nmerPalette.setStatus("正在连接模型…", "loading");
    }
  }

  function ensureAiStreamDom() {
    var box = document.getElementById("results");
    var panel = document.getElementById("palette-panel");
    if (!box || !panel) return null;
    box.innerHTML = "";
    box.className = "palette-results";
    var wrap = document.createElement("div");
    wrap.className = "ai-stream-container";
    wrap.innerHTML =
      '<div class="ai-stream-header">AI 回答</div>' +
      '<div class="ai-stream-body streaming"></div>' +
      '<div class="ai-stream-footer">Esc 后台继续 · <kbd>Tab</kbd> 打开完整对话</div>';
    box.appendChild(wrap);
    panel.classList.add("ai-streaming", "has-results");
    state.showResults = true;
    updateAiStreamHeader({ query: state.input, phase: "streaming" });
    return wrap.querySelector(".ai-stream-body");
  }

  function startAiMorphing(query, provider) {
    state.input = readInputValue();
    var q = String(query || state.input || "").trim();
    if (!q) {
      window.nmerPalette.setStatus("请输入要问 AI 的内容", "error");
      return;
    }
    if (!provider && !state.selectedAiProvider && state.aiProviders[0]) {
      state.selectedAiProvider = String(state.aiProviders[0].id || "");
    }
    var prov = String(provider || state.selectedAiProvider || "");
    aiPhase = "morphing";
    isBackgroundStreaming = false;
    aiStreamText = "";
    pendingChunkBuf = "";
    ensureAiStreamDom();
    window.nmerPalette.setStatus("正在连接模型…", "loading");
    aiPhase = "streaming";
    post({ type: "palette_morph_resize", height: MORPH_HEIGHT });
    post({ type: "palette_ai_send", query: q, provider: prov, morph: 1 });
  }

  function clearAiStreamErrorUi() {
    document.querySelectorAll(".ai-stream-error").forEach(function (el) {
      el.remove();
    });
    if (aiBgCardPayload) {
      aiBgCardPayload.message = "";
      aiBgCardPayload.error = "";
    }
  }

  function finishAiStream(endPayload) {
    clearAiStreamErrorUi();
    if (aiPhase === "compact") {
      if (endPayload && endPayload.answer) aiStreamText = String(endPayload.answer);
      if (aiBgCardPayload) {
        aiBgCardPayload.phase = "done";
        aiBgCardPayload.answer = aiStreamText;
        aiBgCardPayload.message = "";
      }
      updateAiBackgroundCard();
      window.nmerPalette.setStatus("回答完成 · 点击卡片展开", "idle");
      return;
    }
    flushPendingChunks();
    var body = document.querySelector(".ai-stream-body");
    if (body) {
      body.classList.remove("streaming");
      if (endPayload && endPayload.answer) {
        aiStreamText = String(endPayload.answer);
        body.textContent = aiStreamText;
      } else if (aiStreamText) {
        body.textContent = aiStreamText;
      }
    }
    aiPhase = "done";
    if (aiBgCardPayload) {
      aiBgCardPayload.phase = "done";
      aiBgCardPayload.answer = aiStreamText;
    }
    updateAiStreamHeader({ query: state.input, phase: "done" });
    window.nmerPalette.setStatus("回答完成 · Tab 打开完整对话", "idle");
  }

  function showAiStreamError(message) {
    if (aiPhase === "compact") {
      if (aiBgCardPayload) {
        aiBgCardPayload.phase = "error";
        aiBgCardPayload.message = String(message || "请求失败");
      }
      updateAiBackgroundCard();
      window.nmerPalette.setStatus(String(message || "请求失败"), "error");
      return;
    }
    flushPendingChunks();
    aiPhase = "error";
    var body = document.querySelector(".ai-stream-body");
    if (body) body.classList.remove("streaming");
    updateAiStreamHeader({ query: state.input, phase: "error" });
    var wrap = document.querySelector(".ai-stream-container");
    if (wrap && !wrap.querySelector(".ai-stream-error")) {
      var err = document.createElement("div");
      err.className = "ai-stream-error";
      err.textContent = String(message || "请求失败");
      wrap.appendChild(err);
    }
    window.nmerPalette.setStatus(String(message || "请求失败"), "error");
  }

  function canPromoteAi() {
    if (aiPhase === "streaming" || aiPhase === "done") return true;
    if (aiPhase === "compact" && aiBgCardPayload) {
      var p = String(aiBgCardPayload.phase || "");
      return p === "done" || p === "streaming";
    }
    return false;
  }

  function promoteAiToNiuma() {
    post({
      type: "palette_ai_promote",
      query: state.input.trim() || aiStreamText,
      provider: state.selectedAiProvider || "",
      answer: aiStreamText
    });
    hidePalette();
  }

  function handoffAiStream() {
    if (aiPhase !== "streaming") return false;
    isBackgroundStreaming = true;
    flushPendingChunks();
    post({ type: "palette_ai_handoff", reqId: aiStreamReqId });
    return true;
  }

  function collapseAiMorph() {
    post({ type: "palette_morph_resize", height: 120 });
    var panel = document.getElementById("palette-panel");
    if (panel) panel.classList.remove("ai-streaming");
    setTimeout(function () {
      resetAiStreamState();
      if (state.intent === "ai") runQuery(true);
      else updateResults();
      syncWindowSize();
    }, 280);
  }

  function agentHasRunningCard() {
    var ids = Object.keys(actionState.cards);
    for (var i = 0; i < ids.length; i++) {
      var c = actionState.cards[ids[i]];
      if (c && (c.uiState === "Planning" || c.uiState === "Running" || c.uiState === "Waiting")) return true;
    }
    return false;
  }

  function handlePaletteEsc() {
    if (state.intent === "action" && actionState.detailCardId) {
      closeActionCardDetail();
      return true;
    }
    if (state.intent === "action" && agentHasRunningCard()) {
      post({ type: "palette_agent_cancel", cardId: actionState.activeCardId || "" });
      window.nmerPalette.setStatus("正在取消托管任务…", "idle");
      return true;
    }
    if (aiPhase === "streaming") {
      handoffAiStream();
      hidePalette();
      return true;
    }
    if (aiPhase === "compact" || aiPhase === "done" || aiPhase === "error") {
      hidePalette();
      return true;
    }
    hidePalette();
    return true;
  }

  function publishPaletteHeight() {
    ensureHeaderInputVisible();
    if (state.intent === "action") {
      withUnclippedPaletteMeasure(function () {
        syncActionResultsScrollMode();
      });
    }
    var h = measureContentHeight();
    var expanded = state.intent === "action" && hasExpandedActionCard();
    if (Math.abs(h - _lastPublishedPaletteH) >= 2) {
      _lastPublishedPaletteH = h;
      post({
        type: "palette_resize",
        height: h,
        expanded: expanded,
        intent: state.intent,
        workspace: state.intent === "action"
      });
    }
    return h;
  }

  function syncWindowSize() {
    if (composing) return;
    if (state.intent === "ai" && aiPhase !== "idle" && aiPhase !== "compact") return;
    if (sizeTimer) clearTimeout(sizeTimer);
    sizeTimer = setTimeout(function () {
      requestAnimationFrame(publishPaletteHeight);
    }, 80);
  }

  function bindLayoutObservers() {
    var panel = document.getElementById("palette-panel");
    var results = document.getElementById("results");
    var status = document.getElementById("voice-hint");
    var agentBar = document.getElementById("action-agent-bar");
    if (typeof ResizeObserver === "function") {
      if (!layoutResizeObserver) {
        layoutResizeObserver = new ResizeObserver(function () {
          syncWindowSize();
        });
      }
      [panel, results, status, agentBar].forEach(function (el) {
        if (!el || el.__paletteLayoutObserved) return;
        el.__paletteLayoutObserved = true;
        layoutResizeObserver.observe(el);
      });
    }
    if (results && typeof MutationObserver === "function" && !layoutMutationObserver) {
      layoutMutationObserver = new MutationObserver(function () {
        syncWindowSize();
      });
      layoutMutationObserver.observe(results, {
        childList: true,
        subtree: true,
        characterData: true
      });
    }
  }

  function bindInputEvents(input) {
    if (!input || input.dataset.bound) return;
    input.dataset.bound = "1";
    input.addEventListener("compositionstart", function () { composing = true; });
    input.addEventListener("compositionend", function (e) {
      composing = false;
      state.input = e.target.value;
      syncAiListSelectionIndex();
      runQuery(false);
    });
    input.addEventListener("input", function (e) {
      state.input = e.target.value;
      state._userPickedCommand = false;
      if (state.intent === "action" && state.voiceStatus === "error") {
        state.voiceStatus = "idle";
        state.voiceHint = "";
        updateVoiceHint();
      }
      syncAiListSelectionIndex();
      if (state.voiceStatus === "loading" && state.intent !== "ai") {
        state.voiceStatus = "idle";
        state.voiceHint = "";
        updateVoiceHint();
      }
      runQuery(false);
    });
    input.addEventListener(
      "keydown",
      function (e) {
      var isEnter = e.key === "Enter" || e.keyCode === 13;
      if (isEnter && !e.shiftKey && state.intent === "action") {
        handleActionEnterKey(e);
        return;
      }
      if (composing || e.isComposing) return;
      if (e.key === "Tab" && !e.shiftKey) {
        if (canPromoteAi()) {
          e.preventDefault();
          promoteAiToNiuma();
          return;
        }
        e.preventDefault();
        cycleIntent();
        return;
      }
      if (e.ctrlKey && e.shiftKey && String(e.key || "").toLowerCase() === "a") {
        e.preventDefault();
        post({ type: "palette_search_debug", tab: "agent" });
        return;
      }
      if (e.ctrlKey && e.shiftKey && String(e.key || "").toLowerCase() === "d") {
        e.preventDefault();
        post({ type: "palette_search_debug", tab: "search" });
        return;
      }
      if (state.intent === "ai" && e.key === "Enter" && (e.ctrlKey || e.metaKey)) {
        e.preventDefault();
        if (canPromoteAi()) {
          promoteAiToNiuma();
          return;
        }
        sendAiQuery();
        return;
      }
      if (state.intent === "ai" && e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        var aiRows = currentRows();
        var aiItem = aiRows[state.selected];
        if (aiItem && aiItem.kind === "ai_provider" && !readInputValue().trim()) {
          pickAiProvider(aiItem.id);
          return;
        }
        sendAiQuery();
        return;
      }
      var rowCount = currentRows().length;
      function moveAiProviderSelection(delta) {
        if (!rowCount) return;
        var rows = currentRows();
        var next = (state.selected + delta + rowCount) % rowCount;
        var item = rows[next];
        if (item && item.kind === "ai_provider") {
          pickAiProvider(item.id);
          return;
        }
        state.selected = next;
        if (aiPhase === "compact") refreshAiProvidersUnderCard();
        else updateResults();
      }
      if (e.key === "ArrowDown") {
        e.preventDefault();
        if (rowCount) {
          if (state.intent === "ai") moveAiProviderSelection(1);
          else {
            state.selected = (state.selected + 1) % rowCount;
            if (state.intent === "action") state._userPickedCommand = true;
          updateResults();
          }
        }
      } else if (e.key === "ArrowUp") {
        e.preventDefault();
        if (rowCount) {
          if (state.intent === "ai") moveAiProviderSelection(-1);
          else {
            state.selected = (state.selected - 1 + rowCount) % rowCount;
            if (state.intent === "action") state._userPickedCommand = true;
          updateResults();
          }
        }
      } else if ((e.key === "Enter" || e.keyCode === 13) && !e.shiftKey) {
        if (state.intent === "action") {
          handleActionEnterKey(e);
          return;
        }
        e.preventDefault();
        executeSelected();
      } else if (e.key === "Escape") {
        e.preventDefault();
        handlePaletteEsc();
      }
    },
      true
    );
  }

  function bindUI() {
    var input = getInputEl();
    var debugBtn = document.getElementById("debug-btn");
    var results = document.getElementById("results");
    if (!input) return;
    bindResultsScrollHide(results);
    bindInputEvents(input);
    document.getElementById("intent-tag")?.addEventListener("click", function (e) {
      e.preventDefault();
      cycleIntent();
    });
    debugBtn?.addEventListener("click", function (e) {
      e.preventDefault();
      e.stopPropagation();
      var tab = state.intent === "action" ? "agent" : "search";
      post({ type: "palette_search_debug", tab: tab });
    });
    input.focus();
  }

  window.__nmerPaletteHostInject = function (jsonStr) {
    try {
      var d = typeof jsonStr === "string" ? JSON.parse(jsonStr) : jsonStr;
      if (d && d.type) onHostMessage({ data: d });
    } catch (_) {}
  };

  function onHostMessage(ev) {
    var d = ev.data;
    if (typeof d === "string") {
      try { d = JSON.parse(d); } catch (_) { return; }
    }
    if (!d || !d.type) return;
    if (d.type === "palette_results") {
      if (state.intent === "local" && state.input.trim()) return;
      if (d.seq && Number(d.seq) !== state.querySeq) return;
      var items = Array.isArray(d.items) ? d.items : [];
      if (state.intent === "action") {
        items = items.filter(function (it) {
          return it && String(it.kind || "") !== "ai_provider";
        });
      }
      state.actions = items;
      state.resultMode = "command";
      state.turboItems = [];
      if (state.selected >= state.actions.length) state.selected = 0;
      state.voiceStatus = "idle";
      state.voiceHint = "";
      updateVoiceHint();
      if (state.intent === "action") {
        if (Object.keys(actionState.cards).length > 0 && !state.actionCmdBrowse) {
          purgeActionEmptyHint();
          renderActionHistoryList();
          syncActionResultsLayout();
          syncWindowSize();
          return;
        }
        if (!state.input.trim() && !state.actionCmdBrowse) {
          var syncN = pullAgentCardsFromHostSync();
          if (syncN < 0) requestAgentCardSync();
          if (actionHasStoredCards()) {
            renderActionHistoryList();
            syncActionResultsLayout();
            syncWindowSize();
          } else if (syncN >= 0) {
            showActionEmptyIfNeeded();
          } else {
            purgeActionEmptyHint();
            window.nmerPalette.setStatus("正在加载历史任务…", "idle");
          }
          return;
        }
        if (!state.actionCmdBrowse) {
          state._actionQueryCache = items;
          if (Object.keys(actionState.cards).length > 0) {
            renderActionHistoryList();
            syncActionResultsLayout();
          }
          return;
        }
        purgeActionEmptyHint();
        updateResults();
        return;
      }
      updateResults();
    } else if (d.type === "palette_turbo_results") {
      if (state.intent !== "local") return;
      if (d.seq && Number(d.seq) !== state.querySeq) return;
      if (d.query && String(d.query) !== state.turboQuery && String(d.query) !== state.input.trim()) return;
      state.turboItems = Array.isArray(d.items) ? d.items.slice(0, 20) : [];
      state.resultMode = "turbo";
      state.actions = [];
      if (state.selected >= state.turboItems.length) state.selected = 0;
      state.voiceStatus = "idle";
      state.voiceHint = "";
      if (!state.turboItems.length) {
        state.voiceHint = "无本地匹配结果";
        state.voiceStatus = "idle";
      }
      updateVoiceHint();
      updateResults();
    } else if (d.type === "palette_turbo_error") {
      if (state.intent !== "local") return;
      state.turboItems = [];
      state.resultMode = "command";
      window.nmerPalette.setStatus(d.message || "本地搜索不可用", "error");
      updateResults();
    } else if (d.type === "palette_ai_status") {
      window.nmerPalette.setStatus(d.message || "", d.status || "idle");
    } else if (d.type === "palette_ai_chunk") {
      if (d.reqId) aiStreamReqId = String(d.reqId);
      appendAiChunk(d.delta || d.text || "");
    } else if (d.type === "palette_ai_end") {
      if (d.reqId) aiStreamReqId = String(d.reqId);
      if (d.answer && String(d.answer).trim()) aiStreamText = String(d.answer);
      finishAiStream(d);
    } else if (d.type === "palette_ai_error") {
      if (d.reqId) aiStreamReqId = String(d.reqId);
      showAiStreamError(d.message || d.error || "请求失败");
    } else if (d.type === "palette_ai_reset") {
      resetAiStreamState();
      if (state.intent === "ai") {
        runQuery(true);
        syncWindowSize();
      } else updateResults();
    } else if (d.type === "palette_ai_restore") {
      restoreAiSession(d);
      ensureHeaderInputVisible();
    } else if (d.type === "palette_ai_providers") {
      applyAiProviders(d.items, d.activeProvider || "");
      if (state.intent === "ai") {
        var hint = state.selectedAiProvider ? "已选模型 · Enter 发送" : "请选择模型";
        window.nmerPalette.setStatus(hint, "idle");
      }
    } else if (d.type === "palette_status") {
      window.nmerPalette.setStatus(d.message || "", d.status || "idle");
    } else if (d.type === "palette_agent_card_sync") {
      agentDebugLog("host_card_sync", "n=" + (Array.isArray(d.cards) ? d.cards.length : 0));
      var syncCards = d.cards || [];
      renderActionCardSync(syncCards);
      if (!syncCards.length && state.intent === "action" && !state.input.trim() && !state.actionCmdBrowse) {
        showActionEmptyIfNeeded();
      }
    } else if (d.type === "palette_agent_card_new") {
      agentDebugLog("host_card_new", "card=" + (d.cardId || "") + " req=" + (d.reqId || ""));
      applyAgentCardNew(d);
    } else if (d.type === "palette_agent_tool_event") {
      agentDebugLog(
        "host_tool_event",
        "card=" +
          (d.cardId || "") +
          " tool=" +
          (d.tool || "") +
          " phase=" +
          (d.phase || "")
      );
      var toolResolved = resolveActionCard(d.cardId, d.reqId);
      if (toolResolved.card && toolResolved.id) {
        applyPipelineToolEvent(toolResolved.id, {
          tool: d.tool,
          phase: d.phase,
          text: d.text || d.message || "",
          level: d.level || "info",
          ts: d.ts
        });
        refreshActionCardPreview(toolResolved.id);
      }
    } else if (d.type === "palette_agent_chunk") {
      agentDebugLog("host_chunk", "card=" + (d.cardId || "") + " req=" + (d.reqId || "") + " Δ=" + String(d.delta || d.text || "").slice(0, 48));
      var resolved = resolveActionCard(d.cardId, d.reqId);
      var card = resolved.card;
      var cid = resolved.id;
      if (!card && cid) {
        upsertActionCardFromDto({
          cardId: cid,
          reqId: d.reqId || "",
          uiState: "Running",
          title: "代理任务",
          query: "",
          running: true,
          ended: false
        });
        card = getActionCard(cid);
      }
      if (!card && (d.cardId || d.reqId)) {
        upsertActionCardFromDto({
          cardId: String(d.cardId || ""),
          reqId: d.reqId || "",
          uiState: "Running",
          title: "代理任务",
          query: "",
          running: true,
          ended: false
        });
        resolved = resolveActionCard(d.cardId, d.reqId);
        card = resolved.card;
        cid = resolved.id;
      }
      if (card) {
        card.running = true;
        card.ended = false;
        if (isActionCardRunning(card) || card.uiState === "Planning" || card.uiState === "Running") {
          actionState.activeCardId = cid;
        }
        if (d.sessionRef) card.sessionRef = String(d.sessionRef);
        var domC = document.getElementById("card-" + cid);
        if (domC && isActionCardRunning(card)) {
          domC.classList.add("is-active");
          domC.classList.remove("is-collapsed");
        }
        var delta = String(d.delta || d.text || "");
        var preview = delta.replace(/\s+/g, " ").trim().slice(0, 160);
        var statusPreview = preview && isAgentStatusPreview(preview);
        var statusLive = d.liveThought && isAgentStatusPreview(d.liveThought);
        var hasBody = card.rawAnswer && !isAgentStatusPreview(card.rawAnswer);
        if (cardHasPipelineReply(card)) hasBody = true;
        if (card.parser && card.parser._buf && !isAgentStatusPreview(card.parser._buf)) hasBody = true;
        if (delta && !statusPreview) {
          if (!card.rawAnswer || isAgentStatusPreview(card.rawAnswer)) card.rawAnswer = delta;
          else card.rawAnswer = String(card.rawAnswer || "") + delta;
        }
        var pipelineActive =
          typeof PaletteBlockPipeline !== "undefined" && typeof PaletteBlockPipeline.ingestDelta === "function";
        if (pipelineActive && delta) {
          var ingestOut = applyPipelineIngestDelta(cid, delta);
          var ingestStatusOnly = ingestOut && ingestOut.meta && ingestOut.meta.statusOnly;
          var ingestHasReply = cardHasPipelineReply(card);
          if (ingestHasReply) {
            hideCardLiveThoughtIfReply(cid);
            window.nmerPalette.setStatus("流式输出中…", "loading");
          } else if (ingestStatusOnly) {
            if (d.liveThought && (!hasBody || !statusLive))
              setCardLiveThought(cid, String(d.liveThought), true);
            else if (preview && statusPreview && !hasBody) setCardLiveThought(cid, preview, true);
            if (statusLive || statusPreview)
              window.nmerPalette.setStatus(
                (d.liveThought || preview || "").slice(0, 80),
                "loading"
              );
          } else if (preview && !statusPreview) {
            var mergedBlocks =
              (ingestOut && ingestOut.blocks) ||
              getCardPipelineBlocks(card);
            var sum =
              (mergedBlocks.length &&
                PaletteBlockPipeline.blockPreviewSummary &&
                PaletteBlockPipeline.blockPreviewSummary(mergedBlocks)) ||
              "";
            if (!sum && preview) sum = preview;
            if (card._protoStarted || (domC && domC.classList.contains("has-status-log"))) {
              window.nmerPalette.setStatus("流式输出中…", "loading");
            } else if (sum) {
              setCardLiveThought(cid, sum, true);
              window.nmerPalette.setStatus("流式输出中…", "loading");
            }
          }
        } else if (preview && !statusPreview) {
          if (card.parser && delta) {
            if (agentTextHasProtocolTags(delta)) card._protoStarted = true;
            card.parser.onChunk(delta);
          }
          if (card._protoStarted || (domC && domC.classList.contains("has-status-log"))) {
            window.nmerPalette.setStatus("流式输出中…", "loading");
          } else {
            var bodyPreview = card.parser && card.parser._buf ? String(card.parser._buf).trim() : preview;
            setCardLiveThought(cid, bodyPreview, true);
            window.nmerPalette.setStatus("流式输出中…", "loading");
          }
        } else if (d.liveThought && (!hasBody || !statusLive)) {
          setCardLiveThought(cid, String(d.liveThought), true);
          if (statusLive) window.nmerPalette.setStatus(String(d.liveThought).slice(0, 80), "loading");
        } else if (preview && statusPreview && !hasBody) {
          setCardLiveThought(cid, preview, true);
          window.nmerPalette.setStatus(preview.slice(0, 80), "loading");
        }
        if (card.uiState === "Planning") actionCardManager.transitionCardState(cid, "Running");
        if (card.uiState === "Done" && !cardHasPipelineReply(card) && (statusPreview || statusLive || /同步 Niuma|OpenClaw 处理|chat\.send/i.test(preview)))
          actionCardManager.transitionCardState(cid, "Running");
        refreshActionCardDom(card);
        syncActionResultsLayout();
      }
    } else if (d.type === "palette_agent_end") {
      agentDebugLog("host_end", "card=" + (d.cardId || "") + " req=" + (d.reqId || "") + " len=" + String(d.answer || "").length);
      var endR = resolveActionCard(d.cardId, d.reqId);
      var cid2 = endR.id;
      var card2 = endR.card;
      var endAns = dedupeRepeatedAgentText(String(d.answer || "").trim());
      var prevRawLen = card2 ? String(card2.rawAnswer || "").length : 0;
      var endReady = endAns && agentEndAnswerReady(endAns, card2);
      var forceFinalize =
        endAns &&
        (endReady ||
          (endAns.length >= 800 && endAns.length > prevRawLen) ||
          (endAns.length > prevRawLen + 120 && !agentLooksLikeThinkingPreambleOnly(endAns)));
      var followUpQuery = card2 ? String(card2._lastFollowUpQuery || card2.activeQuery || "").trim() : "";
      var wasCollapsed = card2 && !card2.expanded;
      if (card2 && forceFinalize && cardEndFinalizeNeeded(card2, d.reqId, endAns)) {
        ensureFollowUpPriorBlocks(card2);
        card2.rawAnswer = endAns;
        card2._rawReplaySig = endAns;
        card2.activeQuery = "";
        card2._lastAgentEndKey =
          String(d.reqId || card2.reqId || "") + ":" + endAns.length + ":" + endAns.slice(0, 160);
        card2._lastAgentEndTick = Date.now();
        finalizeAgentCardAnswer(cid2, endAns);
        card2._followUpMergedTick = Date.now();
        refreshActionCardDom(card2);
        ensureCardPipelineRendered(card2);
        scheduleExpandedCardLayout(card2);
      } else if (card2 && forceFinalize) {
        card2.rawAnswer = endAns;
        card2._rawReplaySig = endAns;
        card2.activeQuery = "";
        card2._lastAgentEndTick = Date.now();
        if (cardMissingExpectedA2ui(card2, getCardPipelineBlocks(card2)) || !cardHasPipelineReply(card2)) {
          finalizeAgentCardAnswer(cid2, endAns);
        }
        refreshActionCardDom(card2);
      }
      if (card2 && card2.parser && card2.parser.flush) card2.parser.flush();
      if (card2 && d.sessionRef) card2.sessionRef = String(d.sessionRef);
      if (card2) {
        if (!forceFinalize && (cardFollowUpInFlight(card2) || !cardHasPipelineReply(card2))) {
          card2.running = true;
          card2.ended = false;
          if (card2.uiState === "Done") actionCardManager.transitionCardState(cid2, "Running");
          card2.liveThought = card2.liveThought || "⏳ 等待 OpenClaw 回复同步…";
          refreshActionCardDom(card2);
          scheduleAgentCardsRecover();
          syncActionResultsLayout();
          return;
        }
        card2.running = false;
        card2.ended = true;
        var pipeBlocks =
          (card2.blockStore && card2.blockStore.blocks) || card2.pipelineBlocks || [];
        var waitingQ = false;
        for (var wi = 0; wi < pipeBlocks.length; wi++) {
          if (pipeBlocks[wi].type === "question" && pipeBlocks[wi].status === "waiting") {
            waitingQ = true;
            break;
          }
        }
        var endState =
          waitingQ || card2.waitingForUser || card2.uiState === "Waiting" ? "Waiting" : "Done";
        actionCardManager.transitionCardState(cid2, endState);
        if (endState === "Done") {
          maybeHealDoneCardPipelineBlocks(card2, cid2);
          ensureCardPipelineRendered(card2);
        }
        if (endState === "Done" && (pipelineTurnCount(card2) > 1 || followUpQuery)) {
          showFollowUpCompleteToast(cid2, followUpQuery);
          if (!wasCollapsed && card2.expanded) {
            setTimeout(function () {
              scrollToLatestReply(cid2);
            }, 80);
          }
        }
      }
      updateActionLiveDock(cid2);
      document.querySelectorAll(".cmd-action-card").forEach(function (el) {
        el.classList.toggle("is-active", el.id === "card-" + cid2);
        el.classList.toggle("is-collapsed", el.id !== "card-" + cid2);
      });
      window.nmerPalette.setStatus("托管任务已完结", "idle");
      syncActionResultsLayout();
    } else if (d.type === "palette_agent_error" || (d.type === "palette_agent_status" && d.status === "error")) {
      var errMsg = d.message || "代理任务失败";
      agentDebugLog("host_error", errMsg, "err");
      window.nmerPalette.setStatus(errMsg, "error");
      var er = resolveActionCard(d.cardId, d.reqId);
      if (er.card && er.id) {
        er.card.running = false;
        er.card.ended = true;
        er.card.uiState = "Done";
        er.card.liveThought = errMsg;
        er.card.error = errMsg;
        actionCardManager.transitionCardState(er.id, "Done");
        setCardLiveThought(er.id, errMsg, false);
        refreshActionCardDom(er.card);
        syncActionResultsLayout();
      }
    } else if (d.type === "palette_agent_status") {
      agentDebugLog("host_status", String(d.message || "").slice(0, 80));
      window.nmerPalette.setStatus(d.message || "", d.status || "idle");
      var stR = resolveActionCard(d.cardId, d.reqId);
      if (stR.id) setCardLiveThought(stR.id, d.message || "", d.status === "loading");
    } else if (d.type === "palette_agent_heartbeat") {
      agentDebugLog("host_heartbeat", String(d.message || "").slice(0, 60), "warn");
      var hb = resolveActionCard(d.cardId, d.reqId);
      var hbMsg = String(d.liveThought || d.message || "等待响应…");
      if (hb.id) {
        setCardLiveThought(hb.id, hbMsg, true);
        window.nmerPalette.setStatus(hbMsg.slice(0, 80), "loading");
      }
    } else if (d.type === "palette_agent_session") {
      var cid3 = String(d.cardId || "");
      var card3 = getActionCard(cid3);
      if (card3) card3.sessionRef = String(d.sessionRef || "");
    } else if (d.type === "PALETTE_PHYSICAL_FEEDBACK") {
      var cid4 = String(d.cardId || "");
      var card4 = getActionCard(cid4);
      if (card4) {
        actionCardManager.onBlockUpdate(cid4, {
          type: "status",
          closed: true,
          seq: Date.now(),
          title: "[本地触达] " + String(d.actionType || ""),
          log: String(d.status || "") + (d.detail ? " · " + d.detail : ""),
          body: ""
        });
      }
    } else if (d.type === "palette_set_input") {
      window.nmerPalette.setInputText(d.text || "");
    } else if (d.type === "palette_focus" || d.type === "palette_show") {
      ensureHeaderInputVisible();
      if (state.intent === "action") refreshIntentResults(true);
      syncWindowSize();
      getInputEl()?.focus();
    } else if (d.type === "set_theme") {
      applyTheme(d.themeMode || d.theme || "dark");
    }
  }

  document.addEventListener(
    "keydown",
    function (e) {
      if (e.key === "Enter" && !e.shiftKey && state.intent === "action" && !e.defaultPrevented) {
        if (e.isComposing || composing) return;
        var inp = getInputEl();
        var t = e.target;
        if (inp && (t === inp || inp.contains(t))) return;
        if (t && t.closest && t.closest(".card-followup-input")) return;
        handleActionEnterKey(e);
        return;
      }
      if (e.key !== "Escape" || composing) return;
      e.preventDefault();
      handlePaletteEsc();
    },
    true
  );

  applyTheme("dark");

  if (window.chrome && window.chrome.webview) {
    window.chrome.webview.addEventListener("message", onHostMessage);
  }

  function onPaletteActionResult(result) {
    if (!result || !result.ok) return;
    var cid = result.cardId || actionState.activeCardId || "";
    if (cid && result.prefill) showChipPrefillToast(cid, result.prefill);
    if (result.renderer === "lit") {
      try {
        document.dispatchEvent(new CustomEvent("palette-action-result", { detail: result }));
      } catch (_) {}
    } else if (typeof PaletteActionBinder !== "undefined" && PaletteActionBinder.applyLegacyChipActive) {
      PaletteActionBinder.applyLegacyChipActive(cid, result.chipId);
    }
  }

  if (typeof PaletteUIEventBridge !== "undefined" && PaletteUIEventBridge.install) {
    PaletteUIEventBridge.install({
      getCard: getActionCard,
      debugLog: agentDebugLog,
      onActionResult: onPaletteActionResult
    });
  }

  ensureShell();
  refreshIntentResults(true);
  syncWindowSize();
})();
</script>
</body>
</html>
