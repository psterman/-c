<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NMER Command Palette</title>
<style>
@font-face {
  font-family: "AppUi";
  src: local("Segoe UI");
  unicode-range: U+0000-024F, U+1E00-1EFF, U+2000-206F, U+20A0-20CF, U+2100-214F;
}
@font-face {
  font-family: "AppUi";
  src: local("DengXian"), local("Microsoft YaHei UI"), local("Microsoft YaHei");
  unicode-range: U+2E80-2EFF, U+2F00-2FDF, U+3000-303F, U+3040-30FF, U+3100-312F,
    U+31A0-31BF, U+3400-4DBF, U+4E00-9FFF, U+F900-FAFF;
}
:root {
  --panel-top: #1a2738;
  --panel-bottom: #121a28;
  --glass-edge: rgba(255, 255, 255, 0.22);
  --glass-edge-soft: rgba(255, 255, 255, 0.07);
  --glass-warm: rgba(255, 141, 42, 0.34);
  --border-subtle: rgba(255, 255, 255, 0.1);
  --text: #e8edf2;
  --text-soft: #9db0c6;
  --text-main: #fff9f2;
  --accent: #ff6600;
  --accent-2: #ff8d2a;
  --radius-lg: 12px;
  --ease: 0.22s cubic-bezier(0.22, 1, 0.36, 1);
  --font-ui: "AppUi", "Segoe UI", "DengXian", "Microsoft YaHei UI", "Microsoft YaHei", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body, #root, .palette-root {
  width: 100%;
  height: 100%;
  margin: 0;
  padding: 0;
  overflow: hidden;
  background: transparent !important;
}
body {
  font-family: var(--font-ui);
  color: var(--text-main);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
.palette-root {
  display: block;
  width: 100%;
  min-height: 100%;
}
.palette-panel {
  position: relative;
  display: flex;
  flex-direction: column;
  width: 100%;
  min-height: 100%;
  height: 100%;
  overflow: hidden;
  background: linear-gradient(180deg, var(--panel-top) 0%, var(--panel-bottom) 100%);
  animation: palette-in 0.22s var(--ease) both;
}
.palette-panel::before {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.09) 0%, rgba(255, 255, 255, 0) 26%);
  z-index: 0;
}
.palette-panel::after {
  content: "";
  position: absolute;
  inset: 0;
  padding: 1px;
  background: linear-gradient(135deg, var(--glass-edge), var(--glass-edge-soft) 44%, var(--glass-warm));
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor;
  mask-composite: exclude;
  pointer-events: none;
  opacity: 0.72;
  z-index: 2;
}
.palette-header {
  position: relative;
  z-index: 3;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 12px 8px 10px;
  min-height: 48px;
  background: linear-gradient(180deg, var(--panel-top) 0%, var(--panel-top) 88%, rgba(26, 39, 56, 0.98) 100%);
}
#intent-tag {
  flex: 0 0 auto;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 52px;
  height: 28px;
  padding: 0 10px;
  border-radius: 8px;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.02em;
  border: 1px solid transparent;
  cursor: default;
  user-select: none;
  transition: color 0.18s ease, background 0.18s ease, border-color 0.18s ease;
}
#intent-tag[data-intent="local"] {
  color: #8ec5ff;
  background: rgba(37, 99, 235, 0.14);
  border-color: rgba(100, 160, 255, 0.28);
}
#intent-tag[data-intent="ai"] {
  color: #d4b8ff;
  background: rgba(139, 92, 246, 0.16);
  border-color: rgba(167, 139, 250, 0.32);
}
#intent-tag[data-intent="action"] {
  color: #ffc896;
  background: rgba(255, 102, 0, 0.14);
  border-color: rgba(255, 141, 42, 0.32);
}
body[data-theme="light"] #intent-tag[data-intent="local"] {
  color: #1d4ed8;
  background: #eff6ff;
  border-color: rgba(37, 99, 235, 0.22);
}
body[data-theme="light"] #intent-tag[data-intent="ai"] {
  color: #6d28d9;
  background: #f5f3ff;
  border-color: rgba(109, 40, 217, 0.22);
}
body[data-theme="light"] #intent-tag[data-intent="action"] {
  color: #c85d00;
  background: #fff3e8;
  border-color: rgba(230, 126, 34, 0.28);
}
.palette-panel.has-results .palette-header {
  border-bottom: 1px solid rgba(255, 255, 255, 0.06);
}
.palette-search-icon {
  flex: 0 0 auto;
  width: 22px;
  height: 22px;
  color: var(--accent-2);
  display: flex;
  align-items: center;
  justify-content: center;
}
.palette-search-icon svg {
  width: 20px;
  height: 20px;
  display: block;
}
.palette-search {
  flex: 1;
  min-width: 0;
  height: 48px;
  min-height: 48px;
  border: none;
  border-radius: var(--radius-lg);
  background: transparent !important;
  color: var(--text-main) !important;
  -webkit-text-fill-color: var(--text-main);
  caret-color: var(--accent-2);
  font: 500 18px/48px var(--font-ui);
  letter-spacing: 0.01em;
  padding: 0 4px 0 0;
  outline: none;
  ime-mode: active;
}
.palette-search::placeholder {
  color: #7f92a8;
  font-weight: 400;
}
.palette-search-multiline {
  height: auto;
  min-height: 48px;
  max-height: 168px;
  line-height: 1.45;
  padding: 10px 4px 10px 0;
  resize: none;
  overflow-y: auto;
}
.palette-panel.intent-ai-multiline .palette-header {
  align-items: flex-start;
}
.palette-panel.intent-ai-multiline #intent-tag {
  margin-top: 10px;
}
.palette-panel.intent-ai-multiline .palette-debug-btn {
  margin-top: 6px;
}
.palette-panel.intent-ai-multiline .palette-agent-debug-btn {
  margin-top: 6px;
}
.palette-debug-btn {
  flex: 0 0 auto;
  width: 36px;
  height: 36px;
  margin-right: 2px;
  border: 1px solid rgba(96, 165, 250, 0.28);
  border-radius: 11px;
  background: #1a2438;
  color: #7dd3fc;
  font-size: 13px;
  font-weight: 600;
  letter-spacing: -0.02em;
  cursor: pointer;
  line-height: 1;
  padding: 0;
  transition: background var(--ease), border-color var(--ease), box-shadow var(--ease), color var(--ease);
}
.palette-debug-btn:hover {
  background: #22304a;
  border-color: rgba(125, 211, 252, 0.55);
  color: #bae6fd;
  box-shadow: 0 0 16px rgba(56, 189, 248, 0.16);
}
.palette-debug-btn:active {
  transform: scale(0.96);
}
.palette-agent-debug-btn {
  flex: 0 0 auto;
  width: 36px;
  height: 36px;
  margin-right: 2px;
  border: 1px solid rgba(245, 158, 66, 0.32);
  border-radius: 11px;
  background: #241a12;
  color: #fdba74;
  font-size: 13px;
  font-weight: 600;
  letter-spacing: -0.02em;
  cursor: pointer;
  line-height: 1;
  padding: 0;
  transition: background var(--ease), border-color var(--ease), box-shadow var(--ease), color var(--ease);
}
.palette-agent-debug-btn:hover {
  background: #2e2218;
  border-color: rgba(253, 186, 116, 0.55);
  color: #fed7aa;
  box-shadow: 0 0 16px rgba(245, 158, 66, 0.16);
}
.palette-agent-debug-btn:active {
  transform: scale(0.96);
}
.palette-agent-debug-btn[hidden] {
  display: none;
}
.palette-status {
  display: none;
  position: relative;
  z-index: 1;
  flex-shrink: 0;
  margin: 0;
  padding: 0 16px 8px 46px;
  font-size: 12px;
  line-height: 1.45;
  color: #ffc896;
}
.palette-status.show { display: block; }
.palette-status.listening,
.palette-status.loading { color: #ffb347; }
.palette-status.error { color: #ff7a59; }
.palette-results {
  position: relative;
  z-index: 1;
  flex: 1 1 auto;
  min-height: 0;
  max-height: 0;
  overflow: hidden;
  padding: 0 8px;
  scrollbar-width: none;
  -ms-overflow-style: none;
}
.palette-panel.has-results .palette-results {
  max-height: var(--palette-results-max-height, 360px);
  overflow-y: auto;
  padding: 6px 8px 8px;
}
.palette-panel.intent-action.has-results .palette-results {
  max-height: none;
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
  overflow-x: hidden;
  padding-bottom: 8px;
  scrollbar-width: thin;
  scrollbar-color: rgba(255, 141, 42, 0.48) transparent;
}
.palette-panel.intent-action.has-results .palette-results.is-scrollable {
  max-height: var(--palette-action-results-scroll-cap, min(720px, 72vh));
  overflow-y: auto;
  overflow-x: hidden;
}
.palette-panel.intent-action.has-results .palette-results.has-expanded-card:not(.is-scrollable),
.palette-results.has-action-cards.has-expanded-card:not(.is-scrollable) {
  max-height: none !important;
  overflow-y: auto !important;
  overflow-x: hidden;
}
.palette-panel.intent-action.has-results .palette-results.has-expanded-card.is-scrollable {
  flex: 1 1 auto;
  min-height: 80px;
  overflow-y: auto !important;
  overflow-x: hidden;
}
.palette-panel.has-results .palette-results.is-scrolling {
  scrollbar-width: thin;
  scrollbar-color: rgba(255, 102, 0, 0.35) transparent;
}
.palette-results::-webkit-scrollbar { width: 0; height: 0; }
.palette-panel.intent-action.has-results .palette-results::-webkit-scrollbar {
  width: 7px;
}
.palette-panel.intent-action.has-results .palette-results::-webkit-scrollbar-thumb {
  border-radius: 999px;
  background: rgba(255, 141, 42, 0.45);
}
.palette-panel.intent-action.has-results .palette-results::-webkit-scrollbar-track {
  background: rgba(255, 255, 255, 0.025);
}
.palette-panel.has-results .palette-results.is-scrolling::-webkit-scrollbar { width: 5px; }
.palette-panel.has-results .palette-results.is-scrolling::-webkit-scrollbar-thumb {
  background: rgba(255, 102, 0, 0.32);
  border-radius: 999px;
}
.result-item {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  width: 100%;
  margin: 2px 0;
  padding: 9px 10px;
  border: 1px solid transparent;
  border-radius: var(--radius-lg);
  background: transparent;
  color: var(--text);
  text-align: left;
  cursor: pointer;
  transition: background var(--ease), border-color var(--ease);
}
.result-item:hover {
  background: #1f2d40;
  border-color: rgba(255, 255, 255, 0.05);
}
.result-item.active {
  background: linear-gradient(90deg, #3a2818 0%, #252018 100%);
  border-color: rgba(255, 141, 42, 0.38);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06);
}
.result-icon {
  flex: 0 0 auto;
  width: 32px;
  height: 32px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  line-height: 1;
  background: #1a2535;
  border: 1px solid rgba(255, 255, 255, 0.07);
  color: var(--accent-2);
}
.result-item.kind-history .result-icon {
  color: #8ec5ff;
  background: #172638;
  border-color: rgba(100, 160, 255, 0.18);
}
.result-item.kind-exec .result-icon {
  color: #8ee4a8;
  background: #152a22;
  border-color: rgba(80, 200, 120, 0.18);
}
.result-body {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.result-row {
  display: flex;
  width: 100%;
  align-items: baseline;
  gap: 8px;
}
.result-title {
  font-size: 15px;
  font-weight: 600;
  line-height: 1.25;
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.result-binding {
  flex: 0 0 auto;
  font-size: 10px;
  color: #8ea0b4;
  font-family: Consolas, "Cascadia Mono", monospace;
  white-space: nowrap;
  padding: 2px 7px;
  border-radius: 6px;
  border: 1px solid rgba(255, 255, 255, 0.08);
  background: #0f1622;
}
.result-desc {
  font-size: 12px;
  line-height: 1.35;
  color: var(--text-soft);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.result-item.matched .result-title { color: #ffb347; }
.result-item.kind-history .result-title { color: #b8daff; }
.result-item.kind-exec .result-title { color: #b8f0c8; }
.result-item.active .result-title { color: var(--text-main); }
.result-item.kind-ai_provider .result-icon {
  color: #c4b5fd;
  background: rgba(0, 0, 0, 0.28);
  border-color: rgba(255, 255, 255, 0.07);
  padding: 3px;
}
.result-item.kind-ai_provider .result-icon-img {
  width: 22px;
  height: 22px;
  object-fit: contain;
  display: block;
}
.result-item.kind-ai_provider.active {
  border-color: rgba(167, 139, 250, 0.45);
  background: rgba(139, 92, 246, 0.12);
}
.result-item.kind-ai_provider .result-binding {
  color: #a78bfa;
  border-color: rgba(167, 139, 250, 0.28);
}
.result-item.kind-file {
  align-items: center;
  padding: 7px 10px;
  min-height: 38px;
}
.result-item.kind-file .result-icon {
  width: 28px;
  height: 28px;
  font-size: 13px;
  border-radius: 8px;
}
.result-item.kind-file .result-body {
  flex-direction: row;
  align-items: baseline;
  gap: 8px;
}
.result-item.kind-file .result-desc {
  flex: 1;
  min-width: 0;
  text-align: right;
}
/* 命令面板始终使用 Web 顶栏输入；勿隐藏 .palette-header（旧 native-input-mode 会导致输入框“消失”） */
@keyframes palette-in {
  from { transform: translateY(-6px); }
  to { transform: translateY(0); }
}
/* ===== 浅色主题（对齐 FloatingToolbar / 设置页 light） ===== */
body[data-theme="light"] {
  color-scheme: light;
  --panel-top: #ffffff;
  --panel-bottom: #f5f7fa;
  --glass-edge: rgba(255, 255, 255, 0.95);
  --glass-edge-soft: rgba(230, 126, 34, 0.14);
  --glass-warm: rgba(230, 126, 34, 0.28);
  --border-subtle: rgba(0, 0, 0, 0.08);
  --text: #2d2d2d;
  --text-soft: #555555;
  --text-main: #1a1a1a;
  --accent: #e67e22;
  --accent-2: #d35400;
}
body[data-theme="light"] .palette-panel::before {
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.92) 0%, rgba(255, 255, 255, 0) 30%);
}
body[data-theme="light"] .palette-panel::after {
  opacity: 0.95;
}
body[data-theme="light"] .palette-header {
  background: linear-gradient(180deg, #ffffff 0%, #ffffff 88%, rgba(255, 255, 255, 0.98) 100%);
}
body[data-theme="light"] .palette-panel.has-results .palette-header {
  border-bottom-color: rgba(0, 0, 0, 0.06);
}
body[data-theme="light"] .palette-search::placeholder {
  color: #8a8a8a;
}
body[data-theme="light"] .palette-debug-btn {
  background: #f0f7ff;
  border-color: rgba(37, 99, 235, 0.28);
  color: #2563eb;
}
body[data-theme="light"] .palette-debug-btn:hover {
  background: #fff;
  border-color: rgba(37, 99, 235, 0.45);
  color: #1d4ed8;
  box-shadow: 0 0 12px rgba(37, 99, 235, 0.1);
}
body[data-theme="light"] .palette-agent-debug-btn {
  background: #fff7ed;
  border-color: rgba(234, 88, 12, 0.25);
  color: #c2410c;
}
body[data-theme="light"] .palette-agent-debug-btn:hover {
  background: #ffedd5;
  border-color: rgba(234, 88, 12, 0.4);
  color: #9a3412;
  box-shadow: 0 0 12px rgba(234, 88, 12, 0.1);
}
body[data-theme="light"] .palette-status {
  color: #a65a12;
}
body[data-theme="light"] .palette-status.listening,
body[data-theme="light"] .palette-status.loading {
  color: #c85d00;
}
body[data-theme="light"] .palette-status.error {
  color: #c0392b;
}
body[data-theme="light"] .palette-panel.has-results .palette-results.is-scrolling {
  scrollbar-color: rgba(230, 126, 34, 0.45) transparent;
}
body[data-theme="light"] .palette-panel.has-results .palette-results.is-scrolling::-webkit-scrollbar-thumb {
  background: rgba(230, 126, 34, 0.38);
}
body[data-theme="light"] .result-item:hover {
  background: #fff3e8;
  border-color: rgba(0, 0, 0, 0.04);
}
body[data-theme="light"] .result-item.active {
  background: linear-gradient(90deg, #fff1e3 0%, #fff8f0 100%);
  border-color: rgba(230, 126, 34, 0.35);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.8);
}
body[data-theme="light"] .result-icon {
  background: #ffffff;
  border-color: rgba(0, 0, 0, 0.08);
  color: #d35400;
}
body[data-theme="light"] .result-item.kind-history .result-icon {
  color: #2563eb;
  background: #eff6ff;
  border-color: rgba(37, 99, 235, 0.16);
}
body[data-theme="light"] .result-item.kind-exec .result-icon {
  color: #15803d;
  background: #ecfdf3;
  border-color: rgba(21, 128, 61, 0.16);
}
body[data-theme="light"] .result-binding {
  color: #666666;
  border-color: rgba(0, 0, 0, 0.08);
  background: #fafafa;
}
body[data-theme="light"] .result-item.matched .result-title {
  color: #c85d00;
}
body[data-theme="light"] .result-item.kind-history .result-title {
  color: #1d4ed8;
}
body[data-theme="light"] .result-item.kind-exec .result-title {
  color: #166534;
}
body[data-theme="light"] .result-item.active .result-title {
  color: #1a1a1a;
}
.palette-panel.ai-streaming .palette-results {
  max-height: none;
  flex: 1 1 auto;
  min-height: 0;
  overflow: hidden;
  padding: 4px 8px 8px;
  display: flex;
  flex-direction: column;
}
.ai-stream-container {
  flex: 1 1 auto;
  min-height: 0;
  display: flex;
  flex-direction: column;
  border-radius: var(--radius-lg);
  border: 1px solid rgba(139, 92, 246, 0.22);
  background: rgba(12, 18, 28, 0.55);
  overflow: hidden;
}
.ai-stream-header {
  flex-shrink: 0;
  padding: 8px 12px;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.04em;
  color: #c4b5fd;
  border-bottom: 1px solid rgba(139, 92, 246, 0.15);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
.ai-stream-header-main {
  min-width: 0;
  flex: 1 1 auto;
}
.ai-stream-header-title {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}
.ai-stream-header-query {
  margin-top: 3px;
  font-size: 12px;
  font-weight: 500;
  letter-spacing: 0;
  text-transform: none;
  color: var(--text-main);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.ai-stream-badge {
  flex-shrink: 0;
  padding: 2px 8px;
  border-radius: 999px;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.02em;
}
.ai-stream-badge.streaming {
  color: #fbbf24;
  background: rgba(251, 191, 36, 0.12);
  border: 1px solid rgba(251, 191, 36, 0.28);
}
.ai-stream-badge.done {
  color: #86efac;
  background: rgba(34, 197, 94, 0.12);
  border: 1px solid rgba(34, 197, 94, 0.28);
}
.ai-stream-badge.handoff {
  color: #93c5fd;
  background: rgba(59, 130, 246, 0.12);
  border: 1px solid rgba(59, 130, 246, 0.28);
}
.ai-stream-badge.error {
  color: #ff9b7a;
  background: rgba(255, 90, 60, 0.12);
  border: 1px solid rgba(255, 90, 60, 0.28);
}
.ai-stream-body {
  flex: 1 1 auto;
  min-height: 120px;
  max-height: calc(380px - 120px);
  overflow-y: auto;
  padding: 12px 14px;
  font-size: 13px;
  line-height: 1.55;
  color: var(--text-main);
  white-space: pre-wrap;
  word-break: break-word;
}
.ai-stream-body.streaming::after {
  content: "▍";
  display: inline;
  color: var(--accent-2);
  animation: ai-cursor-blink 0.9s step-end infinite;
  margin-left: 2px;
}
@keyframes ai-cursor-blink {
  50% { opacity: 0; }
}
.ai-stream-footer {
  flex-shrink: 0;
  padding: 8px 12px;
  font-size: 11px;
  color: var(--text-soft);
  border-top: 1px solid rgba(255, 255, 255, 0.06);
}
.ai-stream-footer kbd {
  display: inline-block;
  padding: 1px 5px;
  margin: 0 2px;
  border-radius: 4px;

<div id="root"></div>
<script>
(function () {
  var IntentRouter = (function () {
    var ORDER = ["local", "ai", "action"];
    var LABELS = { local: "本地", ai: "问 AI", action: "动作" };
    var PLACEHOLDERS = {
      local: "搜索文件、路径或剪贴板…",
      ai: "选择模型，Enter 原地流式回答…",
      action: "描述任务 Enter 提交至上方所选引擎（龙虾/Hermes）…"
    };
    function nextIntent(cur) {
      var i = ORDER.indexOf(cur);
      return ORDER[(i < 0 ? 0 : i + 1) % ORDER.length];
    }
    function applyTag(el, intent) {
      if (!el) return;
      el.setAttribute("data-intent", intent);
      el.textContent = LABELS[intent] || intent;
      el.title = "Tab 切换意图";
    }
    return { ORDER: ORDER, LABELS: LABELS, PLACEHOLDERS: PLACEHOLDERS, nextIntent: nextIntent, applyTag: applyTag };
  })();

  var state = {
    input: "",
    intent: "action",
    actions: [],
    turboItems: [],
    aiProviders: [],
    selectedAiProvider: "",
    resultMode: "command",
    selected: 0,
    voiceStatus: "idle",
    voiceHint: "",
    showResults: false,
    turboQuery: "",
    querySeq: 0,
    _userPickedCommand: false,
    actionCmdBrowse: false,
    _actionQueryCache: []
  };
  var AGENT_PROVIDERS = [
    { id: "openclaw", label: "龙虾 OpenClaw", short: "龙虾" },
    { id: "hermes", label: "Hermes", short: "Hermes" }
  ];
  var actionState = {
    activeCardId: null,
    detailCardId: null,
    cards: {},
    _pendingCardId: null,
    _batchUpsert: 0,
    historyFilter: "all",
    focusMode: false,
    showAllDone: true
  };

  function isActionCardBatchUpsert() {
    return (actionState._batchUpsert || 0) > 0;
  }

  function beginActionCardBatchUpsert() {
    actionState._batchUpsert = (actionState._batchUpsert || 0) + 1;
  }

  function endActionCardBatchUpsert() {
    actionState._batchUpsert = Math.max(0, (actionState._batchUpsert || 0) - 1);
  }

  function shouldEagerPipelineFinalize(card) {
    return !!(card && (card.expanded || isActionCardRunning(card)));
  }
  state.agentProvider = "openclaw";

  function isActionCardRunning(card) {
    if (!card) return false;
    if (card.ended === true || card.ended === 1) return false;
    if (card.running === true || card.running === 1) return true;
    return card.uiState === "Planning" || card.uiState === "Running" || card.uiState === "Waiting";
  }

  function cardPlanProgressMeta(card) {
    if (!card || !card.blocks || !Array.isArray(card.blocks.plan) || !card.blocks.plan.length) return null;
    var total = card.blocks.plan.length;
    var done = 0;
    if (card.uiState === "Done") done = total;
    else if (card.uiState === "Running") done = Math.min(total, Math.max(1, card.blocks.status ? card.blocks.status.length : 1));
    return { done: done, total: total, label: "步骤 " + done + "/" + total };
  }

  function isAgentStatusPreview(text) {
    if (typeof PaletteBlockPipeline !== "undefined" && PaletteBlockPipeline.isStatusOnlyAgentText)
      return PaletteBlockPipeline.isStatusOnlyAgentText(text);
    var p = String(text || "").replace(/\s+/g, " ").trim();
    if (!p) return true;
    if (/chat\.send/i.test(p)) return true;
    if (/^\[执行中\]/.test(p)) return true;
    return /^[🔗⏳📨💭]/.test(p) || /^(正在|等待|任务已|仍连接|OpenClaw 流式|OpenClaw 处理|OpenClaw 已发送|已提交至 Gateway|同步 Niuma|流式输出中)/.test(p);
  }

  function dedupeRepeatedAgentText(text) {
    var t = String(text || "").trim();
    if (t.length < 40) return t;
    var blocks = t.split(/\n{2,}/).map(function (s) {
      return String(s || "").trim();
    }).filter(Boolean);
    if (blocks.length >= 2) {
      var seenB = {};
      var outB = [];
      blocks.forEach(function (b) {
        var key = b.replace(/\s+/g, " ").trim();
        if (!key || seenB[key]) return;
        seenB[key] = true;
        outB.push(b);
      });
      if (outB.length < blocks.length) return outB.join("\n\n");
    }
    var lines = t.split("\n").map(function (ln) {
      return String(ln || "").trim();
    }).filter(Boolean);
    if (lines.length >= 4) {
      var seenL = {};
      var outL = [];
      lines.forEach(function (ln) {
        var key = ln.replace(/\s+/g, " ").trim();
        if (!key || seenL[key]) return;
        seenL[key] = true;
        outL.push(ln);
      });
      if (outL.length < lines.length) return outL.join("\n");
    }
    return t;
  }

  function cardHasPipelineReply(card) {
    if (!card) return false;
    var blocks = (card.blockStore && card.blockStore.blocks) || card.pipelineBlocks || [];
    for (var i = 0; i < blocks.length; i++) {
      if (blocks[i] && blocks[i].type === "reply" && String(blocks[i].markdown || "").trim()) return true;
    }
    return !!(card.blocks && card.blocks.reply);
  }

  function countPipelineBlocksByType(blocks, type) {
    var n = 0;
    var list = blocks || [];
    for (var i = 0; i < list.length; i++) {
      if (list[i] && list[i].type === type) n++;
    }
    return n;
  }

  function cardHasPipelineA2ui(card) {
    var blocks = getCardPipelineBlocks(card);
    return countPipelineBlocksByType(blocks, "a2ui") > 0;
  }

  function getCardA2uiCandidates(card) {
    if (!card) return [];
    var rp = card.routeProfile || {};
    if (rp.uiCandidates && rp.uiCandidates.a2ui && rp.uiCandidates.a2ui.length) return rp.uiCandidates.a2ui;
    if (rp.a2uiCandidates && rp.a2uiCandidates.length) return rp.a2uiCandidates;
    if (card.a2uiCandidates && card.a2uiCandidates.length) return card.a2uiCandidates;
    if (
      typeof PaletteComponentMatcher !== "undefined" &&
      PaletteComponentMatcher.resolveA2uiCandidates
    )
      return PaletteComponentMatcher.resolveA2uiCandidates(rp);
    if (card.routeId === "research_compare") return ["ComparisonTable"];
    return [];
  }

  function getLatestReplyMarkdownFromBlocks(blocks) {
    var list = blocks || [];
    var best = "";
    var bestTurn = -1;

      var tid = b.turnId != null ? Number(b.turnId) : 1;
      if (tid >= bestTurn) {

        best = String(b.markdown);

    return best;

    var list = blocks || [];
    var latestTurn =
      typeof PaletteBlockPipeline !== "undefined" && PaletteBlockPipeline.maxTurnId

        : 1;

    for (var i = 0; i < list.length; i++) {

      var tid = b.turnId != null ? Number(b.turnId) : 1;

      var sum =
        typeof PaletteBlockPipeline !== "undefined" && PaletteBlockPipeline.a2uiBlockSummary

  function downloadPaletteText(filename, text, mime) {

  function resolveFollowUpQueryForTurn(card, turnId) {
    if (!card) return "";

      var userMsgs = card.messages.filter(function (m) {
        return m && m.role === "user" && String(m.text || "").trim();
      });
      var idx = Math.max(0, Number(turnId || 1) - 1);
      if (userMsgs[idx]) return String(userMsgs[idx].text || "").trim();
      if (userMsgs.length) return String(userMsgs[userMsgs.length - 1].text || "").trim();
    }
    return String(card._lastFollowUpQuery || card.activeQuery || "").trim();
  }

  function handleCardReplyAction(act, cardId, blockId, turnId) {
    var card = getActionCard(cardId);
    var block = getReplyBlockFromCard(card, blockId, turnId);
    var text = replyPlainTextFromBlock(block);
    if (!text && act !== "regen") {
      window.nmerPalette.setStatus("没有可操作的内容。", "error");
      return;
    }
    if (act === "copy" || act === "share") {
      if (copyPaletteText(text)) window.nmerPalette.setStatus("已复制到剪贴板。", "idle");
      else window.nmerPalette.setStatus("复制失败，请手动选择正文。", "error");
      return;
    }
    if (act === "tts") {
      togglePaletteReplyTts(cardId, blockId, text);
      return;
    }
    if (act === "export-md") {
      if (downloadPaletteText("palette-reply.md", text, "text/markdown;charset=utf-8"))
        window.nmerPalette.setStatus("已导出 Markdown。", "idle");
      return;
    }
    if (act === "export-txt") {
      if (downloadPaletteText("palette-reply.txt", text, "text/plain;charset=utf-8"))
        window.nmerPalette.setStatus("已导出纯文本。", "idle");
      return;
    }
    if (act === "regen") {
      var q = resolveFollowUpQueryForTurn(card, turnId);
      if (!q) {
        window.nmerPalette.setStatus("找不到对应提问，无法重答。", "error");
        return;
      }
      focusActionCard(cardId, { expand: true });
      submitAgentTask(q, {
        cardId: cardId,
        forceKind: card && card.uiState === "Waiting" ? "correction" : "append",
        fromCardFollowup: true,
        explicitCardFollowup: true,
        provider: (card && card.provider) || state.agentProvider
      });
      window.nmerPalette.setStatus("已重新提交该轮提问…", "loading");
    }

  function cardEndFinalizeNeeded(card, reqId, answer) {
    if (!card || !answer) return false;
    var ans = String(answer).trim();
    var key = String(reqId || card.reqId || "") + ":" + ans.length + ":" + ans.slice(0, 160);
    if (card._lastAgentEndKey === key && Date.now() - (card._lastAgentEndTick || 0) < 20000) return false;
    var blocks = getCardPipelineBlocks(card);
    if (!blocks.length) return true;
    var maxTurn =
      typeof PaletteBlockPipeline !== "undefined" && PaletteBlockPipeline.maxTurnId
        ? PaletteBlockPipeline.maxTurnId(blocks)
        : 1;
    for (var i = blocks.length - 1; i >= 0; i--) {
      var b = blocks[i];
      if (!b || b.type !== "reply") continue;
      var tid = b.turnId != null ? Number(b.turnId) : 1;
      if (tid !== maxTurn) continue;
      var md = String(b.markdown || "").trim();
      if (!md) break;
      if (md === ans) return false;
      if (ans.length > 48 && md.length > 48 && (ans.indexOf(md.slice(0, 80)) >= 0 || md.indexOf(ans.slice(0, 80)) >= 0))
        return false;
      break;
    }
    return true;
  }

  function cardMissingExpectedA2ui(card, blocks) {
    if (!card || card.uiState !== "Done") return false;
    if (countPipelineBlocksByType(blocks, "a2ui") > 0) return false;
    if (!cardHasPipelineReply(card) && !cardHasSubstantialRawAnswer(card)) return false;
    var cands = getCardA2uiCandidates(card);
    if (!cands.length) return false;
    var replyMd = getLatestReplyMarkdownFromBlocks(blocks) || String(card.rawAnswer || "");
    if (!replyMd.trim()) return false;
    if (typeof PaletteMiniA2UI !== "undefined" && PaletteMiniA2UI.extractMarkdownTables) {
      if (cands.indexOf("ComparisonTable") >= 0 && PaletteMiniA2UI.extractMarkdownTables(replyMd).length)
        return true;
      if (cands.indexOf("Steps") >= 0 && PaletteMiniA2UI.extractSteps && PaletteMiniA2UI.extractSteps(replyMd).length >= 2)
        return true;
      if (cands.indexOf("Alert") >= 0 && PaletteMiniA2UI.extractAlerts && PaletteMiniA2UI.extractAlerts(replyMd).length)
        return true;
    }
    return cands.indexOf("ComparisonTable") >= 0 && /\|/.test(replyMd);
  }

  function pipelineDomNeedsRerender(card, dom, blocks) {
    if (!dom || !blocks || !blocks.length) return true;
    var a2uiBlocks = countPipelineBlocksByType(blocks, "a2ui");
    var a2uiSlots = dom.querySelectorAll(".card-a2ui .a2ui-slot").length;
    if (a2uiBlocks > 0 && a2uiSlots < a2uiBlocks) return true;
    var replyBlocks = countPipelineBlocksByType(blocks, "reply");
    var replyBodies = dom.querySelectorAll(".card-replies .card-reply-body").length;
    if (replyBlocks > 0 && replyBodies < replyBlocks) {
      var legacyReply = dom.querySelector(".card-reply:not([hidden]) .card-reply-body");
      if (!legacyReply || replyBodies + 1 < replyBlocks) return true;
    }
    var domBlockIds = {};
    dom.querySelectorAll("[data-block-id]").forEach(function (el) {
      var bid = el.getAttribute("data-block-id");
      if (bid) domBlockIds[bid] = true;
    });
    for (var bi = 0; bi < blocks.length; bi++) {
      var b = blocks[bi];
      if (!b || !b.id) continue;
      if (b.type === "reply" || b.type === "a2ui" || b.type === "question") {
        if (!domBlockIds[b.id]) return true;
      }

    return false;

  function maybeHealDoneCardPipelineBlocks(card, cardId) {

      cardMissingExpectedA2ui(card, blocks);

  function cardLatestTurnHasReply(card) {

    var latestTurn =
      typeof PaletteBlockPipeline !== "undefined" && PaletteBlockPipeline.maxTurnId
        ? PaletteBlockPipeline.maxTurnId(blocks)
        : 1;
    if (isActionCardRunning(card) && card._activeTurnId) latestTurn = Math.max(latestTurn, card._activeTurnId);
    for (var i = 0; i < blocks.length; i++) {
      var b = blocks[i];
      if (!b || b.type !== "reply") continue;
      var tid = b.turnId != null ? Number(b.turnId) : 1;
      if (tid === latestTurn && String(b.markdown || "").trim()) return true;
    }
    return false;

  function agentAnswerHasSubstantiveStructure(text) {
    var t = String(text || "");
    if (/^(\d+[.)]\s|[-*•]\s|\*\*[^*]+\*\*|#{1,3}\s)/m.test(t)) return true;
    if (t.split(/\r?\n+/).length >= 4) return true;
    if (t.length >= 400) return true;
    if (/\|/.test(t) && /---/.test(t)) return true;
    return false;
  }

  function agentLooksLikeThinkingPreambleOnly(text) {
    var t = String(text || "").replace(/\s+/g, " ").trim();
    if (!t) return true;
    if (agentAnswerHasSubstantiveStructure(t)) return false;
    if (/^(正在|等待|任务已|OpenClaw|Gateway|📨|⏳|💭|🔗)/.test(t)) return true;
    if (
      !/(让我先|我先想|我先查|让我查|比较靠谱|想想到底|查一下|等我(先|一下)|稍等|思考中|我来查|我去查|我来搜|搜一下|给你做|给你个|我直接基于|let me (check|think|search)|i('ll| will) (check|search|look))/i.test(
        t
      )
    )
      return false;
    return t.length < 320;
  }

  function cardAnswerLooksIncomplete(card) {
    if (!card) return true;
    var raw = String(card.rawAnswer || "").trim();
    if (!raw) return true;
    if (agentLooksLikeThinkingPreambleOnly(raw)) return true;
    if (/\|/.test(raw) && /---/.test(raw)) return false;
    if (raw.length >= 900) return false;
    if (agentAnswerHasSubstantiveStructure(raw) && raw.length >= 400) return false;
    if (raw.length >= 1200) return false;
    if (
      (card.routeId === "research_compare" ||
        /对比|策略|vs /i.test(String(card.query || card.title || ""))) &&
      !/\|/.test(raw) &&
      raw.length < 480
    )
      return true;
    if (card.uiState === "Done" && cardMissingExpectedA2ui(card, getCardPipelineBlocks(card))) return true;
    return false;
  }

  function cardHasSubstantialRawAnswer(card) {
    if (!card) return false;
    var raw = String(card.rawAnswer || "").trim();
    if (!raw || isAgentStatusPreview(raw)) return false;
    if (agentLooksLikeThinkingPreambleOnly(raw)) return false;
    if (agentTextHasProtocolTags(raw)) return true;
    return raw.length >= 8;
  }

  function cardPreviewText(card) {
    if (!card) return "";
    var pipeBlocks =
      (card.blockStore && card.blockStore.blocks) ||
      card.pipelineBlocks ||
      [];
    if (Array.isArray(pipeBlocks) && pipeBlocks.length) {
      if (
        typeof PaletteBlockPipeline !== "undefined" &&
        PaletteBlockPipeline.blockPreviewSummaryWithSource
      ) {
        var pipeRes = PaletteBlockPipeline.blockPreviewSummaryWithSource(pipeBlocks);
        if (pipeRes && pipeRes.text) return pipeRes.text;
      } else if (typeof PaletteBlockPipeline !== "undefined" && PaletteBlockPipeline.blockPreviewSummary) {
        var pipeSum = PaletteBlockPipeline.blockPreviewSummary(pipeBlocks);
        if (pipeSum) return pipeSum;
      }
      for (var pi = pipeBlocks.length - 1; pi >= 0; pi--) {
        var pb = pipeBlocks[pi];
        if (pb && pb.type === "reply" && pb.markdown) return String(pb.markdown).slice(0, 160);
      }
      for (var pj = 0; pj < pipeBlocks.length; pj++) {
        var ps = pipeBlocks[pj];
        if (ps && ps.type === "plan" && ps.items && ps.items.length) {
          var planPipe = ps.items
            .slice(0, 2)
            .map(function (it, i) {
              return "步骤" + (i + 1) + "：" + (it.text || "");
            })
            .join(" · ");
          if (planPipe) return planPipe.slice(0, 160);
        }
      }
      for (var pk = pipeBlocks.length - 1; pk >= 0; pk--) {
        var pst = pipeBlocks[pk];
        if (pst && pst.type === "status" && pst.items && pst.items.length) {
          var stTxt = String(pst.items[pst.items.length - 1].text || "").trim();
          if (stTxt) return stTxt.slice(0, 160);
        }
      }
      for (var pa = pipeBlocks.length - 1; pa >= 0; pa--) {
        var a2b = pipeBlocks[pa];
        if (!a2b || a2b.type !== "a2ui") continue;
        if (a2b.component === "ComparisonTable") {
          var cols = (a2b.props && a2b.props.columns) || [];
          return ("对比表格 · " + cols.length + " 列").slice(0, 160);
        }
        if (a2b.component === "Steps") {
          var stepItems = (a2b.props && a2b.props.items) || [];
          return ("执行步骤 · " + stepItems.length + " 步").slice(0, 160);
        }
        if (a2b.component === "Alert") {
          var alertTxt = (a2b.props && a2b.props.text) || "";
          return String(alertTxt).trim().slice(0, 160) || "⚠ 警告";
        }
      }
      var q0 = card.query && String(card.query).trim();
      if (card.uiState === "Done") return "无详细记录";
      return q0 ? q0.slice(0, 120) : "";
    }
    if (card.blocks && Array.isArray(card.blocks.plan) && card.blocks.plan.length) {
      var planPrev = card.blocks.plan
        .slice(0, 2)
        .map(function (s, i) {
          return "步骤" + (i + 1) + "：" + s;
        })
        .join(" · ");
      if (planPrev) return planPrev.slice(0, 160);
    }
    if (card.blocks && card.blocks.reply) {
      var rb0 = String(card.blocks.reply.title || card.blocks.reply.content || card.blocks.reply.body || "").trim();
      if (rb0) return rb0.slice(0, 160);
    }
    if (card.blocks && Array.isArray(card.blocks.status) && card.blocks.status.length) {
      var st0 = card.blocks.status[card.blocks.status.length - 1];
      var lg0 = String(st0.title || st0.log || st0.body || "").trim();
      if (lg0) return lg0.slice(0, 160);
    }
    var raw = String(card.rawAnswer || "").trim();
    if (raw && !isAgentStatusPreview(raw))
      return raw.replace(/::\w+_(START|END)::/g, " ").replace(/\s+/g, " ").trim().slice(0, 160);
    if (card.parser && card.parser._buf && String(card.parser._buf).trim() && !isAgentStatusPreview(card.parser._buf))
      return String(card.parser._buf).trim().slice(0, 160);
    if (card.liveThought && String(card.liveThought).trim() && !isAgentStatusPreview(card.liveThought))
      return String(card.liveThought).trim().slice(0, 160);
    var rawFallback = String(card.rawAnswer || "").trim();
    if (rawFallback) return rawFallback.replace(/::\w+_(START|END)::/g, " ").replace(/\s+/g, " ").trim().slice(0, 160);
    var q = card.query && String(card.query).trim();
    var title = String(card.title || "").trim();
    if (q && q !== title) return q.slice(0, 120);
    if (card.uiState === "Done") return "无详细记录";
    return q ? q.slice(0, 120) : "";
  }

  function formatCardTimeLabel(card) {
    if (!card) return "—";
    var raw = String(card.createdAt || card.updatedAt || "").trim();
    if (/^\d{14}$/.test(raw)) {
      return raw.slice(4, 6) + "-" + raw.slice(6, 8) + " " + raw.slice(8, 10) + ":" + raw.slice(10, 12);
    }
    if (raw) {
      var d = new Date(raw);
      if (!isNaN(d.getTime())) {
        var mo = d.getMonth() + 1;
        var da = d.getDate();
        var h = d.getHours();
        var mi = d.getMinutes();
        return (mo < 10 ? "0" : "") + mo + "-" + (da < 10 ? "0" : "") + da + " " + (h < 10 ? "0" : "") + h + ":" + (mi < 10 ? "0" : "") + mi;
      }
      if (raw.length >= 12) return raw.slice(4, 6) + "-" + raw.slice(6, 8) + " " + raw.slice(8, 10) + ":" + raw.slice(10, 12);
    }
    return "—";
  }

  function cardContentCharCount(card) {
    if (!card) return 0;
    var n = 0;
    var blocks = getCardPipelineBlocks(card);
    var hasReplyBlocks = false;
    for (var i = 0; i < blocks.length; i++) {
      var b = blocks[i];
      if (!b) continue;
      if (b.type === "reply" && b.markdown) {
        hasReplyBlocks = true;
        n += String(b.markdown).length;
      } else if (b.type === "question" && b.markdown) n += String(b.markdown).length;
    }
    if (Array.isArray(card.messages)) {
      card.messages.forEach(function (m) {
        if (m && m.text) n += String(m.text).length;
      });
    } else if (card.query) {
      n += String(card.query).length;
    }
    if (!hasReplyBlocks) {
      var raw = String(card.rawAnswer || "").trim();
      if (raw && !isAgentStatusPreview(raw)) n += raw.length;
    }
    return n;
  }

  function estimateCardTokens(card) {
    if (!card) return 0;
    if (card.tokenUsage > 0) return Math.round(card.tokenUsage);
    return Math.max(0, Math.round(cardContentCharCount(card) / 3.5));
  }

  function stripMdHeading(text) {
    return String(text || "")
      .replace(/^#{1,6}\s+/gm, "")
      .replace(/\*\*/g, "")
      .replace(/`/g, "")
      .replace(/\s+/g, " ")
      .trim();
  }

  function replySummaryTextForTurn(blocks, turnId) {
    var reply = null;
    for (var i = 0; i < (blocks || []).length; i++) {
      var b = blocks[i];
      if (!b || b.type !== "reply") continue;
      if (Number(b.turnId != null ? b.turnId : 1) === Number(turnId)) reply = b;
    }
    if (!reply || !reply.markdown) return "";
    var md = String(reply.markdown);
    if (typeof PaletteBlockPipeline !== "undefined" && PaletteBlockPipeline.extractNonTablePreview) {
      var lead = PaletteBlockPipeline.extractNonTablePreview(md);
      if (lead) return stripMdHeading(lead).slice(0, 180);
    }
    return stripMdHeading(md).slice(0, 180);
  }

  function cardUserTurnQueries(card) {
    var out = [];
    if (Array.isArray(card.messages)) {
      card.messages.forEach(function (m) {
        if (m && m.role === "user" && String(m.text || "").trim())
          out.push({ text: String(m.text).trim(), at: m.at || "" });
      });
    }
    if (!out.length && card.query) out.push({ text: String(card.query).trim(), at: card.createdAt || card.updatedAt || "" });
    return out;
  }

  function cardTopicPreviewItems(card) {
    if (!card) return [];
    var blocks = getCardPipelineBlocks(card);
    var queries = cardUserTurnQueries(card);
    var maxTurn =
      typeof PaletteBlockPipeline !== "undefined" && PaletteBlockPipeline.maxTurnId
        ? Math.max(PaletteBlockPipeline.maxTurnId(blocks), queries.length, 1)
        : Math.max(queries.length, 1);
    var items = [];
    for (var t = 1; t <= maxTurn; t++) {
      var q = queries[t - 1] ? queries[t - 1].text : t === 1 ? String(card.query || "").trim() : "";
      if (!q && t > 1) q = String(card._lastFollowUpQuery || "").trim() || "补充提问";
      var summary = replySummaryTextForTurn(blocks, t);
      if (!summary && t === maxTurn) summary = stripMdHeading(getLatestReplyMarkdownFromBlocks(blocks)).slice(0, 180);
      if (!q && !summary) continue;
      items.push({ turnId: t, query: q || "补充提问", summary: summary || "（等待回复）" });
    }
    return items;
  }

  function cardMetaLineText(card) {
    if (!card) return "";
    var parts = [formatCardTimeLabel(card)];
    var chars = cardContentCharCount(card);
    if (chars > 0) parts.push(chars + " 字");
    var tok = estimateCardTokens(card);
    if (tok > 0) parts.push("~" + tok + " tok");
    return parts.join(" · ");
  }

  var cardHoverPreviewEl = null;
  var cardHoverPreviewTimer = null;
  var cardHoverPreviewHideTimer = null;
  var cardHoverPreviewCardId = "";
  var cardHoverPreviewAnchorId = "";

  function cardHoverPreviewTargetDom(cardId, anchorEl) {
    var dom = anchorEl && anchorEl.isConnected ? anchorEl : document.getElementById("card-" + cardId);
    return dom || null;
  }

  function isCardHoverPreviewHovering(cardId, anchorEl) {
    var dom = cardHoverPreviewTargetDom(cardId, anchorEl);
    if (dom && dom.matches(":hover")) return true;
    if (cardHoverPreviewEl && !cardHoverPreviewEl.hidden && cardHoverPreviewEl.matches(":hover")) return true;
    return false;
  }

  function cancelCardHoverPreviewShow() {
    if (cardHoverPreviewTimer) {
      clearTimeout(cardHoverPreviewTimer);
      cardHoverPreviewTimer = null;
    }
  }

  function hideVisibleCardHoverPreview() {
    cardHoverPreviewCardId = "";
    cardHoverPreviewAnchorId = "";
    if (cardHoverPreviewEl) cardHoverPreviewEl.hidden = true;
  }

  function scheduleShowCardHoverPreview(cardId, anchorEl, delayMs) {
    cancelCardHoverPreviewShow();
    cardHoverPreviewAnchorId = String(cardId || "");
    cardHoverPreviewTimer = setTimeout(function () {
      cardHoverPreviewTimer = null;
      var card = getActionCard(cardId);
      var dom = cardHoverPreviewTargetDom(cardId, anchorEl);
      if (!card || !dom || card.expanded || actionState.detailCardId) return;
      if (!isCardHoverPreviewHovering(cardId, dom)) return;
      showCardHoverPreview(card, dom);
    }, delayMs == null ? 180 : delayMs);
  }

  function ensureCardHoverPreviewEl() {
    if (!cardHoverPreviewEl) {
      cardHoverPreviewEl = document.createElement("div");
      cardHoverPreviewEl.className = "card-hover-preview";
      cardHoverPreviewEl.hidden = true;
      cardHoverPreviewEl.addEventListener("mouseenter", function () {
        if (cardHoverPreviewHideTimer) {
          clearTimeout(cardHoverPreviewHideTimer);
          cardHoverPreviewHideTimer = null;
        }
      });
      cardHoverPreviewEl.addEventListener("mouseleave", function () {
        scheduleHideCardHoverPreview();
      });
      cardHoverPreviewEl.addEventListener("click", function (e) {
        if (e.target.closest("a")) return;
        var cid = cardHoverPreviewCardId || cardHoverPreviewEl.getAttribute("data-card-id") || "";
        if (!cid) return;
        hideCardHoverPreview();
        focusActionCard(cid, { expand: true });
        setTimeout(function () {
          scrollToLatestReply(cid);
        }, 120);
      });
      document.body.appendChild(cardHoverPreviewEl);
    }
    return cardHoverPreviewEl;
  }

  function scheduleHideCardHoverPreview() {
    if (cardHoverPreviewHideTimer) clearTimeout(cardHoverPreviewHideTimer);
    cardHoverPreviewHideTimer = setTimeout(function () {
      cardHoverPreviewHideTimer = null;
      if (cardHoverPreviewEl && cardHoverPreviewEl.matches(":hover")) return;
      if (document.querySelector(".cmd-action-card.is-collapsed:hover")) return;
      cancelCardHoverPreviewShow();
      hideVisibleCardHoverPreview();
    }, 320);
  }

  function cardHoverLeaveShouldHide(cardEl, relatedTarget) {
    if (!cardEl) return true;
    if (relatedTarget) {
      if (cardEl.contains(relatedTarget)) return false;
      if (cardHoverPreviewEl && cardHoverPreviewEl.contains(relatedTarget)) return false;
    }
    return true;
  }

  function cardLatestUserText(card) {
    if (!card) return "";
    if (Array.isArray(card.messages) && card.messages.length) {
      for (var mi = card.messages.length - 1; mi >= 0; mi--) {
        var m = card.messages[mi];
        if (!m) continue;
        if (m.role === "user" && String(m.text || "").trim()) return String(m.text).trim();
      }
    }
    return String(card.query || "").trim();
  }

  function cardDetailPreviewHtml(card) {
    if (!card) return "";
    var title = esc(card.title || card.query || "代理任务");
    var meta = esc(cardMetaLineText(card));
    var items = cardTopicPreviewItems(card);
    var topicHtml = items
      .map(function (it, idx) {
        var qLabel = (idx === 0 ? "问" : "补" + (idx + 1)) + " · " + it.query.slice(0, 96);
        return (
          '<div class="chp-topic">' +
          '<div class="chp-topic-q">' +
          esc(qLabel) +
          "</div>" +
          '<div class="chp-topic-a">' +
          esc(it.summary) +
          "</div></div>"
        );
      })
      .join("");
    if (!topicHtml) {
      var fallback = stripMdHeading(cardPreviewText(card) || card.rawAnswer || "");
      topicHtml =
        '<div class="chp-topic"><div class="chp-topic-a">' +
        esc(fallback.slice(0, 240) || "暂无摘要") +
        "</div></div>";
    }
    return (
      '<div class="chp-title">' +
      title +
      "</div>" +
      '<div class="chp-meta-line">' +
      meta +
      "</div>" +
      '<div class="chp-topics">' +
      topicHtml +
      "</div>" +
      '<div class="chp-foot-hint">点击查看完整回复</div>'
    );
  }

  function showCardHoverPreview(card, anchorEl) {
    if (!card || !anchorEl || card.expanded || actionState.detailCardId) return;
    if (!isCardHoverPreviewHovering(card.id, anchorEl)) return;
    var pop = ensureCardHoverPreviewEl();
    cardHoverPreviewCardId = card.id;
    cardHoverPreviewAnchorId = card.id;
    pop.setAttribute("data-card-id", card.id);
    pop.innerHTML = cardDetailPreviewHtml(card);
    pop.hidden = false;
    var r = anchorEl.getBoundingClientRect();
    var top = r.bottom + 2;
    var left = Math.max(8, Math.min(r.left, window.innerWidth - 430));
    pop.style.visibility = "hidden";
    pop.style.top = top + "px";
    pop.style.left = left + "px";
    var popH = pop.offsetHeight || 200;
    if (top + popH + 8 > window.innerHeight) top = Math.max(8, r.top - 8 - popH);
    pop.style.top = top + "px";
    pop.style.visibility = "";
  }

  function hideCardHoverPreview() {
    cancelCardHoverPreviewShow();
    if (cardHoverPreviewHideTimer) {
      clearTimeout(cardHoverPreviewHideTimer);
      cardHoverPreviewHideTimer = null;
    }
    hideVisibleCardHoverPreview();
  }

  function removeActionLiveDock(stack) {
    var root = stack || document.querySelector(".action-card-stack");
    if (!root) return;
    var dock = root.querySelector("#action-live-dock");
    if (dock) dock.remove();
  }

  function updateActionLiveDock(_cardId) {
    removeActionLiveDock();
  }

  function normalizeAgentCardsArray(cards) {
    if (Array.isArray(cards)) return cards;
    if (cards && typeof cards === "object") {
      return Object.keys(cards)
        .sort(function (a, b) {
          return Number(a) - Number(b);
        })
        .map(function (k) {
          return cards[k];
        });
    }
    return [];
  }

  function createAgentParser(cardId) {
    if (typeof StreamTagParser !== "undefined") {
      return new StreamTagParser(function (b) {
        actionCardManager.onBlockUpdate(cardId, b);
      });
    }
    var stub = { _buf: "" };
    stub.reset = function () {
      stub._buf = "";
    };
    stub.onChunk = function (t) {
      stub._buf += String(t || "");
      var c = getActionCard(cardId);
      if (c && c.uiState === "Planning") actionCardManager.transitionCardState(cardId, "Running");
      var dom = document.getElementById("card-" + cardId);
      var log = dom && dom.querySelector(".card-status-log");
      if (log) {
        log.innerHTML =
          '<div class="b-status"><div class="b-status-title">[流式输出]</div><div class="b-status-log md-body">' +
          renderAgentPlainMarkdown(stub._buf) +
          "</div></div>";
        log.scrollTop = log.scrollHeight;
        syncActionCardStatusLogVisibility(dom);
      } else {
        setCardLiveThought(cardId, stub._buf, true);
      }
    };
    stub.flush = function () {};
    return stub;
  }

  function removeActionCard(cardId, syncHost) {
    var id = String(cardId || "");
    if (!id) return;
    if (actionState.detailCardId === id) actionState.detailCardId = null;
    delete actionState.cards[id];
    var el = document.getElementById("card-" + id);
    if (el) el.remove();
    if (actionState.activeCardId === id) {
      actionState.activeCardId = null;
      var dock = document.getElementById("action-live-dock");
      if (dock) dock.hidden = true;
    }
    if (syncHost !== false) {
      try {
        post({ type: "palette_agent_dismiss", cardId: id });
      } catch (_) {}
    }
  }

  function reconcilePendingAgentCard(serverDto) {
    var pending = actionState._pendingCardId;
    if (!pending || !serverDto || !serverDto.cardId) return;
    var realId = String(serverDto.cardId);
    if (realId === pending) {
      actionState._pendingCardId = null;
      return;
    }
    var pend = actionState.cards[pending];
    if (pend) {
      pend.id = realId;
      pend.reqId = serverDto.reqId || pend.reqId || "";
      pend.title = serverDto.title || pend.title;
      pend.query = serverDto.query || pend.query;
      pend.provider = serverDto.provider || pend.provider;
      if (serverDto.uiState) pend.uiState = serverDto.uiState;
      actionState.cards[realId] = pend;
      delete actionState.cards[pending];
      var pel = document.getElementById("card-" + pending);
      if (pel) {
        pel.id = "card-" + realId;
        pel.setAttribute("data-card-id", realId);
      }
      if (actionState.activeCardId === pending) actionState.activeCardId = realId;
    }
    actionState._pendingCardId = null;
  }

  function pullAgentCardsFromHostSync() {
    try {
      var ahk = getPaletteSyncAhk();
      if (ahk && typeof ahk.PullCommandPaletteAgentCards === "function") {
        var raw = String(ahk.PullCommandPaletteAgentCards("") || "[]");
        var data = JSON.parse(raw);
        if (Array.isArray(data)) {
          actionState._cardsSyncDone = true;
          if (data.length) {
            renderActionCardSync(data);
          } else if (!actionHasStoredCards() && state.intent === "action") {
            purgeActionEmptyHint();
          }
          return data.length;
        }
      }
    } catch (e) {
      agentDebugLog("pull_cards_sync", String(e && e.message || e), "warn");
    }
    return -1;
  }

  function showActionEmptyIfNeeded() {
    if (actionHasStoredCards() || state.input.trim() || state.actionCmdBrowse) return;
    state.actions = [];
    state.showResults = true;
    clearActionCmdResultsDom();
    purgeActionEmptyHint();
    var box = document.getElementById("results");
    if (box && !box.querySelector(".action-card-stack")) {
      var stack = document.createElement("div");
      stack.className = "action-card-stack";
      box.appendChild(stack);
    }
    showActionIntentEmpty();
    var panel = document.getElementById("palette-panel");
    if (panel) panel.classList.add("has-results");
    syncWindowSize();
  }

  function requestAgentCardSync() {
    var n = pullAgentCardsFromHostSync();
    if (n >= 0) {
      if (n === 0 && state.intent === "action") showActionEmptyIfNeeded();
      return;
    }
    try {
      post({ type: "palette_agent_pull" });
    } catch (_) {}
  }

  function actionHasStoredCards() {
    return Object.keys(actionState.cards).length > 0;
  }

  function refreshActionHistoryHead() {
    var box = document.getElementById("results");
    if (!box) return;
    var stack = box.querySelector(".action-card-stack");
    if (!stack) {
      if (Object.keys(actionState.cards).length < 1) return;
      stack = document.createElement("div");
      stack.className = "action-card-stack";
      box.insertBefore(stack, box.firstChild);
    }
    var toolbar = stack.querySelector(".action-history-toolbar");
    if (!toolbar) {
      toolbar = document.createElement("div");
      toolbar.className = "action-history-toolbar";
      toolbar.innerHTML =
        '<button type="button" class="action-history-filter active" data-filter="all">全部</button>' +
        '<button type="button" class="action-history-filter" data-filter="running">进行中</button>' +
        '<button type="button" class="action-history-filter" data-filter="done">已归档</button>' +
        '<button type="button" class="action-history-tool action-focus-mode" title="只展开当前任务">聚焦当前</button>' +
        '<button type="button" class="action-history-tool action-collapse-others" title="折叠非当前任务">折叠其他</button>' +
        '<button type="button" class="action-history-browse-cmd">本地命令</button>' +
        '<button type="button" class="action-history-clear">清除已完成</button>';
      stack.insertBefore(toolbar, stack.firstChild);
      var browseBtn = toolbar.querySelector(".action-history-browse-cmd");
      if (browseBtn) {
        browseBtn.addEventListener("click", function () {
          state.actionCmdBrowse = !state.actionCmdBrowse;
          browseBtn.classList.toggle("active", state.actionCmdBrowse);
          browseBtn.textContent = state.actionCmdBrowse ? "隐藏本地命令" : "本地命令";
          var rbox = document.getElementById("results");
          if (rbox) rbox.classList.toggle("show-cmd-browse", state.actionCmdBrowse);
          if (state.actionCmdBrowse && state._actionQueryCache && state._actionQueryCache.length) {
            state.actions = state._actionQueryCache.slice();
          }
          updateResults();
        });
      }
      toolbar.querySelectorAll(".action-history-filter").forEach(function (btn) {
        btn.addEventListener("click", function () {
          actionState.historyFilter = btn.getAttribute("data-filter") || "all";
          toolbar.querySelectorAll(".action-history-filter").forEach(function (b) {
            b.classList.toggle("active", b === btn);
          });
          renderActionHistoryList();
        });
      });
      var focusBtn = toolbar.querySelector(".action-focus-mode");
      if (focusBtn) {
        focusBtn.addEventListener("click", function () {
          actionState.focusMode = !actionState.focusMode;
          focusBtn.classList.toggle("active", actionState.focusMode);
          if (actionState.focusMode) collapseNonActiveCards();
          renderActionHistoryList();
        });
      }
      var collapseBtn = toolbar.querySelector(".action-collapse-others");
      if (collapseBtn) {
        collapseBtn.addEventListener("click", function () {
          collapseNonActiveCards();
          renderActionHistoryList();
        });
      }
      var clr = toolbar.querySelector(".action-history-clear");
      if (clr) {
        clr.addEventListener("click", function () {
          Object.keys(actionState.cards).forEach(function (id) {
            var c = actionState.cards[id];
            if (c && c.uiState === "Done") removeActionCard(id);
          });
          renderActionHistoryList();
          syncActionResultsLayout();
        });
      }
    }
    var head = stack.querySelector(".action-history-head");
    var n = Object.keys(actionState.cards).length;
    var runN = 0;
    var doneN = 0;
    Object.keys(actionState.cards).forEach(function (id) {
      var c = actionState.cards[id];
      if (!c) return;
      if (c.uiState === "Done") doneN++;
      else runN++;
    });
    if (n < 1) {
      if (head) head.remove();
      if (toolbar) toolbar.style.display = "none";
      return;
    }
    if (toolbar) toolbar.style.display = "flex";
    if (!head) {
      head = document.createElement("div");
      head.className = "action-history-head";
      var tb = stack.querySelector(".action-history-toolbar");
      if (tb && tb.nextSibling) stack.insertBefore(head, tb.nextSibling);
      else stack.insertBefore(head, stack.firstChild);
    }
    head.textContent =
      "任务 · 共 " + n + " 张（进行中 " + runN + " · 已归档 " + doneN + "）→ " + agentProviderLabel(state.agentProvider);
  }

  function actionDetailSectionTarget(dom, section) {
    if (!dom) return null;
    if (section === "structure") return dom.querySelector(".card-a2ui:not([hidden])");
    if (section === "answer") return dom.querySelector(".card-replies");
    if (section === "process")
      return dom.querySelector(".card-status-log:not(:empty)") ||
        dom.querySelector(".card-live-thought") ||
        dom.querySelector(".card-timeline");
    if (section === "followup") return dom.querySelector(".card-followup");
    return dom.querySelector(".cmd-action-card-head");
  }

  function scrollActionDetailSection(section) {
    var cardId = actionState.detailCardId;
    var dom = cardId ? document.getElementById("card-" + cardId) : null;
    var results = document.getElementById("results");
    var target = actionDetailSectionTarget(dom, section);
    if (!target || !results) return;
    var resultsRect = results.getBoundingClientRect();
    var targetRect = target.getBoundingClientRect();
    results.scrollTo({
      top: results.scrollTop + targetRect.top - resultsRect.top - 112,
      behavior: "smooth"
    });
    var nav = results.querySelector(".action-detail-nav");
    if (nav) {
      nav.querySelectorAll(".action-detail-tab").forEach(function (btn) {
        btn.classList.toggle("active", btn.getAttribute("data-section") === section);
      });
    }
  }

  function ensureActionDetailNav(stack) {
    if (!stack) return null;
    var nav = stack.querySelector(":scope > .action-detail-nav");
    if (nav) return nav;
    nav = document.createElement("div");
    nav.className = "action-detail-nav";
    nav.innerHTML =
      '<button type="button" class="action-detail-back">← 任务列表</button>' +
      '<div class="action-detail-identity">' +
      '<div class="action-detail-breadcrumb"><span>任务</span><span>/</span><span class="crumb-state"></span><span>/</span><span class="crumb-current"></span></div>' +
      '<div class="action-detail-title"></div></div>' +
      '<div class="action-detail-tabs">' +
      '<button type="button" class="action-detail-tab" data-section="structure">结构</button>' +
      '<button type="button" class="action-detail-tab" data-section="answer">回答</button>' +
      '<button type="button" class="action-detail-tab" data-section="process">过程</button>' +
      '<button type="button" class="action-detail-tab" data-section="followup">补充</button>' +
      "</div>";
    stack.insertBefore(nav, stack.firstChild);
    nav.querySelector(".action-detail-back").addEventListener("click", closeActionCardDetail);
    nav.querySelectorAll(".action-detail-tab").forEach(function (btn) {
      btn.addEventListener("click", function () {
        scrollActionDetailSection(btn.getAttribute("data-section") || "top");

  function syncActionDetailNav() {
    var box = document.getElementById("results");
    var stack = box && box.querySelector(".action-card-stack");
    var panel = document.getElementById("palette-panel");
    var cardId = actionState.detailCardId;
    var card = cardId ? getActionCard(cardId) : null;
    if (!box || !stack || !card) {
      if (stack) stack.classList.remove("detail-mode");
      if (box) box.classList.remove("action-detail-mode");
      if (panel) panel.classList.remove("action-detail-open");
      return;
    }
    var nav = ensureActionDetailNav(stack);

  function estimateActionStackHeight() {

      h += (tb ? tb.offsetHeight || 32 : 32) + (hd ? hd.offsetHeight || 20 : 20);
    } else {
      h += 52;

    if (counts.running) h += 28 + counts.running * 44;
    if (counts.doneVisible) {
      h += 28 + counts.doneVisible * 36;
      if (!actionState.showAllDone && counts.done > 4) h += 34;
    }
    if (!counts.running && !counts.doneVisible) {
      h += Object.keys(actionState.cards).length ? 56 : 0;

    if (hasExpandedActionCard()) {
      Object.keys(actionState.cards).forEach(function (cid) {
        var c = actionState.cards[cid];

        var dom = document.getElementById("card-" + cid);

  /** 展开卡片的真实内容高度（不依赖已被 WebView 裁切后的 offsetHeight） */
  function measureExpandedCardIntrinsicHeight(card, dom) {
    if (!dom) return 360;
    var headEl = dom.querySelector(".cmd-action-card-head");
    var total = headEl ? headEl.offsetHeight || 32 : 32;
    var body = dom.querySelector(".card-body");
    if (body) {
      body.querySelectorAll(
        ".card-a2ui:not([hidden]), .card-replies:not([hidden]), .card-live-thought:not([hidden]), .card-followup:not([hidden])"
      ).forEach(function (part) {
        total += Math.max(part.scrollHeight || 0, part.offsetHeight || 0, 0) + 4;
      });
      if (total <= (headEl ? headEl.offsetHeight || 32 : 32) + 8) {
        total += Math.max(body.scrollHeight || 0, body.offsetHeight || 0);
      }
    }
    var slotH = 0;
    dom.querySelectorAll(".card-a2ui:not([hidden]) .a2ui-slot").forEach(function (slot) {
      slotH += Math.max(slot.scrollHeight || 0, slot.offsetHeight || 0, 0) + 8;
    });
    if (slotH > 0) total = Math.max(total, (headEl ? headEl.offsetHeight : 32) + slotH + 36);
    var blocks = card ? getCardPipelineBlocks(card) : [];
    if (blocks.length) {
      var est = headEl ? headEl.offsetHeight || 32 : 32;
      for (var bi = 0; bi < blocks.length; bi++) {
        var b = blocks[bi];

          est += Math.min(480, Math.max(72, Math.ceil(txt.length / 2.5)));
        } else est += 48;
      }
      total = Math.max(total, est);
    }
    return Math.max(total, dom.scrollHeight || 0, 200);
  }

  function esc(t) {

  /** Phase A.1：轻量 Markdown → 安全 HTML（标题/段落/列表 + 表格） */
  function splitMdTableRow(line) {
    var t = String(line || "").trim();
    if (!t.includes("|")) return [];
    if (t.charAt(0) === "|") t = t.slice(1);
    if (t.charAt(t.length - 1) === "|") t = t.slice(0, -1);
    return t.split("|").map(function (c) {
      return c.trim();
    });
  }

  function isMdSeparatorRow(cells) {
    if (!cells || !cells.length) return false;
    return cells.every(function (c) {
      return /^:?-{2,}:?$/.test(String(c || "").trim());
    });
  }

  function stripMdInlineCell(text) {
    return String(text || "")
      .replace(/\*\*/g, "")
      .replace(/^✅\s*|^❌\s*|^⚠️?\s*/g, "")
      .trim();
  }

  function parseMarkdownSegments(text) {
    var lines = String(text || "").split(/\r?\n/);
    var segments = [];
    var buf = [];
    function flushBuf() {
      if (buf.length) segments.push({ type: "text", lines: buf.slice() });
      buf = [];
    }
    var i = 0;
    while (i < lines.length) {
      var header = splitMdTableRow(lines[i]);
      var sep = i + 1 < lines.length ? splitMdTableRow(lines[i + 1]) : [];
      if (header.length >= 2 && isMdSeparatorRow(sep)) {
        flushBuf();
        var rows = [];
        i += 2;
        while (i < lines.length) {
          var row = splitMdTableRow(lines[i]);
          if (row.length < 2) break;
          rows.push(row);
          i++;
        }
        segments.push({ type: "table", columns: header, rows: rows });
        continue;
      }
      buf.push(lines[i]);
      i++;
    }
    flushBuf();
    return segments;
  }

  function renderMdTableHtml(columns, rows) {
    var html =
      '<div class="a2ui-comparison"><table class="a2ui-table md-table"><thead><tr>';
    for (var ci = 0; ci < columns.length; ci++) {
      html += "<th>" + esc(stripMdInlineCell(columns[ci])) + "</th>";
    }
    html += "</tr></thead><tbody>";
    for (var ri = 0; ri < rows.length; ri++) {
      html += "<tr>";
      for (var cj = 0; cj < rows[ri].length; cj++) {
        html += "<td>" + esc(stripMdInlineCell(rows[ri][cj])) + "</td>";
      }
      html += "</tr>";
    }
    html += "</tbody></table></div>";
    return html;
  }

  function renderAgentPlainMarkdownLines(lines) {
    var html = [];
    for (var i = 0; i < lines.length; i++) {
      var line = lines[i];
      var m3 = line.match(/^###\s+(.+)$/);
      var m2 = line.match(/^##\s+(.+)$/);
      var m1 = line.match(/^#\s+(.+)$/);
      if (m3) html.push('<div class="md-h3">' + esc(m3[1]) + "</div>");
      else if (m2) html.push('<div class="md-h2">' + esc(m2[1]) + "</div>");
      else if (m1) html.push('<div class="md-h1">' + esc(m1[1]) + "</div>");
      else if (/^\s*[-*•]\s+/.test(line))
        html.push('<div class="md-li">' + esc(line.replace(/^\s*[-*•]\s+/, "• ")) + "</div>");
      else if (/^\s*\d+[.)]\s+/.test(line))
        html.push('<div class="md-li">' + esc(line) + "</div>");
      else if (line.trim() === "") html.push('<div class="md-p md-p-empty"></div>');
      else html.push('<div class="md-p">' + esc(line) + "</div>");
    }
    return html.join("");
  }

  function renderAgentPlainMarkdown(text) {
    var segments = parseMarkdownSegments(text);
    var html = [];
    for (var si = 0; si < segments.length; si++) {
      var seg = segments[si];
      if (seg.type === "table") html.push(renderMdTableHtml(seg.columns, seg.rows));
      else html.push(renderAgentPlainMarkdownLines(seg.lines));
    }
    return html.join("");
  }

  function syncLegacyBlocksFromPipeline(card, blocks) {
    if (!card) return;
    if (!card.blocks) card.blocks = { plan: [], status: [], question: null, reply: null };
    card.blocks.plan = [];
    card.blocks.status = [];
    card.blocks.question = null;
    card.blocks.reply = null;
    var list = Array.isArray(blocks) ? blocks : [];
    for (var i = 0; i < list.length; i++) {
      var b = list[i];
      if (!b) continue;
      if (b.type === "plan" && b.items && b.items.length) {
        card.blocks.plan = b.items.map(function (it) {
          return String(it.text || "");
        });
      } else if (b.type === "status" && b.items) {
        for (var j = 0; j < b.items.length; j++) {
          card.blocks.status.push({
            title: "[执行中]",
            log: b.items[j].text,
            body: b.items[j].text,
            seq: b.seq,
            closed: true
          });
        }
      } else if (b.type === "question") {
        card.blocks.question = {
          title: b.title,
          content: b.markdown,
          body: b.markdown,
          closed: true,
          seq: b.seq
        };
      } else if (b.type === "reply") {
        var replyTurn = b.turnId != null ? Number(b.turnId) : 1;

          card.blocks._replyTurnId = replyTurn;

            content: b.markdown,
            body: b.markdown,
            closed: true,
            seq: b.seq
          };
        }
      }
    }
  }

        var topGap = domRect.top - resultsRect.top - 8;

      try {

        tail.setAttribute("data-block-id", block.id || "");
