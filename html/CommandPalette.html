<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NMER Command Palette</title>
<style>
@font-face {
  font-family: "AppUi";
  src: local("Segoe UI");
  unicode-range: U+0000-024F, U+1E00-1EFF, U+2000-206F, U+20A0-20CF, U+2100-214F;
}
@font-face {
  font-family: "AppUi";
  src: local("DengXian"), local("Microsoft YaHei UI"), local("Microsoft YaHei");
  unicode-range: U+2E80-2EFF, U+2F00-2FDF, U+3000-303F, U+3040-30FF, U+3100-312F,
    U+31A0-31BF, U+3400-4DBF, U+4E00-9FFF, U+F900-FAFF;
}
:root {
  --panel-top: #1a2738;
  --panel-bottom: #121a28;
  --glass-edge: rgba(255, 255, 255, 0.22);
  --glass-edge-soft: rgba(255, 255, 255, 0.07);
  --glass-warm: rgba(255, 141, 42, 0.34);
  --border-subtle: rgba(255, 255, 255, 0.1);
  --text: #e8edf2;
  --text-soft: #9db0c6;
  --text-main: #fff9f2;
  --accent: #ff6600;
  --accent-2: #ff8d2a;
  --radius-lg: 12px;
  --ease: 0.22s cubic-bezier(0.22, 1, 0.36, 1);
  --font-ui: "AppUi", "Segoe UI", "DengXian", "Microsoft YaHei UI", "Microsoft YaHei", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body, #root, .palette-root {
  width: 100%;
  height: 100%;
  margin: 0;
  padding: 0;
  overflow: hidden;
  background: transparent !important;
}
body {
  font-family: var(--font-ui);
  color: var(--text-main);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
.palette-root {
  display: block;
  width: 100%;
  min-height: 100%;
}
.palette-panel {
  position: relative;
  display: flex;
  flex-direction: column;
  width: 100%;
  min-height: 100%;
  height: 100%;
  overflow: hidden;
  background: linear-gradient(180deg, var(--panel-top) 0%, var(--panel-bottom) 100%);
  animation: palette-in 0.22s var(--ease) both;
}
.palette-panel::before {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.09) 0%, rgba(255, 255, 255, 0) 26%);
  z-index: 0;
}
.palette-panel::after {
  content: "";
  position: absolute;
  inset: 0;
  padding: 1px;
  background: linear-gradient(135deg, var(--glass-edge), var(--glass-edge-soft) 44%, var(--glass-warm));
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor;
  mask-composite: exclude;
  pointer-events: none;
  opacity: 0.72;
  z-index: 2;
}
.palette-header {
  position: relative;
  z-index: 3;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 12px 8px 10px;
  min-height: 48px;
  background: linear-gradient(180deg, var(--panel-top) 0%, var(--panel-top) 88%, rgba(26, 39, 56, 0.98) 100%);
}
#intent-tag {
  flex: 0 0 auto;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 52px;
  height: 28px;
  padding: 0 10px;
  border-radius: 8px;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.02em;
  border: 1px solid transparent;
  cursor: default;
  user-select: none;
  transition: color 0.18s ease, background 0.18s ease, border-color 0.18s ease;
}
#intent-tag[data-intent="local"] {
  color: #8ec5ff;
  background: rgba(37, 99, 235, 0.14);
  border-color: rgba(100, 160, 255, 0.28);
}
#intent-tag[data-intent="ai"] {
  color: #d4b8ff;
  background: rgba(139, 92, 246, 0.16);
  border-color: rgba(167, 139, 250, 0.32);
}
#intent-tag[data-intent="action"] {
  color: #ffc896;
  background: rgba(255, 102, 0, 0.14);
  border-color: rgba(255, 141, 42, 0.32);
}
body[data-theme="light"] #intent-tag[data-intent="local"] {
  color: #1d4ed8;
  background: #eff6ff;
  border-color: rgba(37, 99, 235, 0.22);
}
body[data-theme="light"] #intent-tag[data-intent="ai"] {
  color: #6d28d9;
  background: #f5f3ff;
  border-color: rgba(109, 40, 217, 0.22);
}
body[data-theme="light"] #intent-tag[data-intent="action"] {
  color: #c85d00;
  background: #fff3e8;
  border-color: rgba(230, 126, 34, 0.28);
}
.palette-panel.has-results .palette-header {
  border-bottom: 1px solid rgba(255, 255, 255, 0.06);
}
.palette-search-icon {
  flex: 0 0 auto;
  width: 22px;
  height: 22px;
  color: var(--accent-2);
  display: flex;
  align-items: center;
  justify-content: center;
}
.palette-search-icon svg {
  width: 20px;
  height: 20px;
  display: block;
}
.palette-search {
  flex: 1;
  min-width: 0;
  height: 48px;
  min-height: 48px;
  border: none;
  border-radius: var(--radius-lg);
  background: transparent !important;
  color: var(--text-main) !important;
  -webkit-text-fill-color: var(--text-main);
  caret-color: var(--accent-2);
  font: 500 18px/48px var(--font-ui);
  letter-spacing: 0.01em;
  padding: 0 4px 0 0;
  outline: none;
  ime-mode: active;
}
.palette-search::placeholder {
  color: #7f92a8;
  font-weight: 400;
}
.palette-search-multiline {
  height: auto;
  min-height: 48px;
  max-height: 168px;
  line-height: 1.45;
  padding: 10px 4px 10px 0;
  resize: none;
  overflow-y: auto;
}
.palette-panel.intent-ai-multiline .palette-header {
  align-items: flex-start;
}
.palette-panel.intent-ai-multiline #intent-tag {
  margin-top: 10px;
}
.palette-panel.intent-ai-multiline .palette-debug-btn {
  margin-top: 6px;
}
.palette-panel.intent-ai-multiline .palette-agent-debug-btn {
  margin-top: 6px;
}
.palette-debug-btn {
  flex: 0 0 auto;
  width: 36px;
  height: 36px;
  margin-right: 2px;
  border: 1px solid rgba(96, 165, 250, 0.28);
  border-radius: 11px;
  background: #1a2438;
  color: #7dd3fc;
  font-size: 13px;
  font-weight: 600;
  letter-spacing: -0.02em;
  cursor: pointer;
  line-height: 1;
  padding: 0;
  transition: background var(--ease), border-color var(--ease), box-shadow var(--ease), color var(--ease);
}
.palette-debug-btn:hover {
  background: #22304a;
  border-color: rgba(125, 211, 252, 0.55);
  color: #bae6fd;
  box-shadow: 0 0 16px rgba(56, 189, 248, 0.16);
}
.palette-debug-btn:active {
  transform: scale(0.96);
}
.palette-agent-debug-btn {
  flex: 0 0 auto;
  width: 36px;
  height: 36px;
  margin-right: 2px;
  border: 1px solid rgba(245, 158, 66, 0.32);
  border-radius: 11px;
  background: #241a12;
  color: #fdba74;
  font-size: 13px;
  font-weight: 600;
  letter-spacing: -0.02em;
  cursor: pointer;
  line-height: 1;
  padding: 0;
  transition: background var(--ease), border-color var(--ease), box-shadow var(--ease), color var(--ease);
}
.palette-agent-debug-btn:hover {
  background: #2e2218;
  border-color: rgba(253, 186, 116, 0.55);
  color: #fed7aa;
  box-shadow: 0 0 16px rgba(245, 158, 66, 0.16);
}
.palette-agent-debug-btn:active {
  transform: scale(0.96);
}
.palette-agent-debug-btn[hidden] {
  display: none;
}
.palette-status {
  display: none;
  position: relative;
  z-index: 1;
  flex-shrink: 0;
  margin: 0;
  padding: 0 16px 8px 46px;
  font-size: 12px;
  line-height: 1.45;
  color: #ffc896;
}
.palette-status.show { display: block; }
.palette-status.listening,
.palette-status.loading { color: #ffb347; }
.palette-status.error { color: #ff7a59; }
.palette-results {
  position: relative;
  z-index: 1;
  flex: 1 1 auto;
  min-height: 0;
  max-height: 0;
  overflow: hidden;
  padding: 0 8px;
  scrollbar-width: none;
  -ms-overflow-style: none;
}
.palette-panel.has-results .palette-results {
  max-height: 320px;
  overflow-y: auto;
  padding: 6px 8px 8px;
}
.palette-panel.intent-action.has-results .palette-results {
  max-height: none;
  flex: 0 0 auto;
  min-height: 0;
  overflow: visible;
  overflow-x: hidden;
  padding-bottom: 8px;
}
.palette-panel.intent-action.has-results .palette-results.is-scrollable {
  max-height: min(520px, 58vh);
  overflow-y: auto;
  overflow-x: hidden;
}
.palette-panel.has-results .palette-results.is-scrolling {
  scrollbar-width: thin;
  scrollbar-color: rgba(255, 102, 0, 0.35) transparent;
}
.palette-results::-webkit-scrollbar { width: 0; height: 0; }
.palette-panel.has-results .palette-results.is-scrolling::-webkit-scrollbar { width: 5px; }
.palette-panel.has-results .palette-results.is-scrolling::-webkit-scrollbar-thumb {
  background: rgba(255, 102, 0, 0.32);
  border-radius: 999px;
}
.result-item {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  width: 100%;
  margin: 2px 0;
  padding: 9px 10px;
  border: 1px solid transparent;
  border-radius: var(--radius-lg);
  background: transparent;
  color: var(--text);
  text-align: left;
  cursor: pointer;
  transition: background var(--ease), border-color var(--ease);
}
.result-item:hover {
  background: #1f2d40;
  border-color: rgba(255, 255, 255, 0.05);
}
.result-item.active {
  background: linear-gradient(90deg, #3a2818 0%, #252018 100%);
  border-color: rgba(255, 141, 42, 0.38);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06);
}
.result-icon {
  flex: 0 0 auto;
  width: 32px;
  height: 32px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  line-height: 1;
  background: #1a2535;
  border: 1px solid rgba(255, 255, 255, 0.07);
  color: var(--accent-2);
}
.result-item.kind-history .result-icon {
  color: #8ec5ff;
  background: #172638;
  border-color: rgba(100, 160, 255, 0.18);
}
.result-item.kind-exec .result-icon {
  color: #8ee4a8;
  background: #152a22;
  border-color: rgba(80, 200, 120, 0.18);
}
.result-body {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.result-row {
  display: flex;
  width: 100%;
  align-items: baseline;
  gap: 8px;
}
.result-title {
  font-size: 15px;
  font-weight: 600;
  line-height: 1.25;
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.result-binding {
  flex: 0 0 auto;
  font-size: 10px;
  color: #8ea0b4;
  font-family: Consolas, "Cascadia Mono", monospace;
  white-space: nowrap;
  padding: 2px 7px;
  border-radius: 6px;
  border: 1px solid rgba(255, 255, 255, 0.08);
  background: #0f1622;
}
.result-desc {
  font-size: 12px;
  line-height: 1.35;
  color: var(--text-soft);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.result-item.matched .result-title { color: #ffb347; }
.result-item.kind-history .result-title { color: #b8daff; }
.result-item.kind-exec .result-title { color: #b8f0c8; }
.result-item.active .result-title { color: var(--text-main); }
.result-item.kind-ai_provider .result-icon {
  color: #c4b5fd;
  background: rgba(0, 0, 0, 0.28);
  border-color: rgba(255, 255, 255, 0.07);
  padding: 3px;
}
.result-item.kind-ai_provider .result-icon-img {
  width: 22px;
  height: 22px;
  object-fit: contain;
  display: block;
}
.result-item.kind-ai_provider.active {
  border-color: rgba(167, 139, 250, 0.45);
  background: rgba(139, 92, 246, 0.12);
}
.result-item.kind-ai_provider .result-binding {
  color: #a78bfa;
  border-color: rgba(167, 139, 250, 0.28);
}
.result-item.kind-file {
  align-items: center;
  padding: 7px 10px;
  min-height: 38px;
}
.result-item.kind-file .result-icon {
  width: 28px;
  height: 28px;
  font-size: 13px;
  border-radius: 8px;
}
.result-item.kind-file .result-body {
  flex-direction: row;
  align-items: baseline;
  gap: 8px;
}
.result-item.kind-file .result-desc {
  flex: 1;
  min-width: 0;
  text-align: right;
}
/* 命令面板始终使用 Web 顶栏输入；勿隐藏 .palette-header（旧 native-input-mode 会导致输入框“消失”） */
@keyframes palette-in {
  from { transform: translateY(-6px); }
  to { transform: translateY(0); }
}
/* ===== 浅色主题（对齐 FloatingToolbar / 设置页 light） ===== */
body[data-theme="light"] {
  color-scheme: light;
  --panel-top: #ffffff;
  --panel-bottom: #f5f7fa;
  --glass-edge: rgba(255, 255, 255, 0.95);
  --glass-edge-soft: rgba(230, 126, 34, 0.14);
  --glass-warm: rgba(230, 126, 34, 0.28);
  --border-subtle: rgba(0, 0, 0, 0.08);
  --text: #2d2d2d;
  --text-soft: #555555;
  --text-main: #1a1a1a;
  --accent: #e67e22;
  --accent-2: #d35400;
}
body[data-theme="light"] .palette-panel::before {
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.92) 0%, rgba(255, 255, 255, 0) 30%);
}
body[data-theme="light"] .palette-panel::after {
  opacity: 0.95;
}
body[data-theme="light"] .palette-header {
  background: linear-gradient(180deg, #ffffff 0%, #ffffff 88%, rgba(255, 255, 255, 0.98) 100%);
}
body[data-theme="light"] .palette-panel.has-results .palette-header {
  border-bottom-color: rgba(0, 0, 0, 0.06);
}
body[data-theme="light"] .palette-search::placeholder {
  color: #8a8a8a;
}
body[data-theme="light"] .palette-debug-btn {
  background: #f0f7ff;
  border-color: rgba(37, 99, 235, 0.28);
  color: #2563eb;
}
body[data-theme="light"] .palette-debug-btn:hover {
  background: #fff;
  border-color: rgba(37, 99, 235, 0.45);
  color: #1d4ed8;
  box-shadow: 0 0 12px rgba(37, 99, 235, 0.1);
}
body[data-theme="light"] .palette-agent-debug-btn {
  background: #fff7ed;
  border-color: rgba(234, 88, 12, 0.25);
  color: #c2410c;
}
body[data-theme="light"] .palette-agent-debug-btn:hover {
  background: #ffedd5;
  border-color: rgba(234, 88, 12, 0.4);
  color: #9a3412;
  box-shadow: 0 0 12px rgba(234, 88, 12, 0.1);
}
body[data-theme="light"] .palette-status {
  color: #a65a12;
}
body[data-theme="light"] .palette-status.listening,
body[data-theme="light"] .palette-status.loading {
  color: #c85d00;
}
body[data-theme="light"] .palette-status.error {
  color: #c0392b;
}
body[data-theme="light"] .palette-panel.has-results .palette-results.is-scrolling {
  scrollbar-color: rgba(230, 126, 34, 0.45) transparent;
}
body[data-theme="light"] .palette-panel.has-results .palette-results.is-scrolling::-webkit-scrollbar-thumb {
  background: rgba(230, 126, 34, 0.38);
}
body[data-theme="light"] .result-item:hover {
  background: #fff3e8;
  border-color: rgba(0, 0, 0, 0.04);
}
body[data-theme="light"] .result-item.active {
  background: linear-gradient(90deg, #fff1e3 0%, #fff8f0 100%);
  border-color: rgba(230, 126, 34, 0.35);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.8);
}
body[data-theme="light"] .result-icon {
  background: #ffffff;
  border-color: rgba(0, 0, 0, 0.08);
  color: #d35400;
}
body[data-theme="light"] .result-item.kind-history .result-icon {
  color: #2563eb;
  background: #eff6ff;
  border-color: rgba(37, 99, 235, 0.16);
}
body[data-theme="light"] .result-item.kind-exec .result-icon {
  color: #15803d;
  background: #ecfdf3;
  border-color: rgba(21, 128, 61, 0.16);
}
body[data-theme="light"] .result-binding {
  color: #666666;
  border-color: rgba(0, 0, 0, 0.08);
  background: #fafafa;
}
body[data-theme="light"] .result-item.matched .result-title {
  color: #c85d00;
}
body[data-theme="light"] .result-item.kind-history .result-title {
  color: #1d4ed8;
}
body[data-theme="light"] .result-item.kind-exec .result-title {
  color: #166534;
}
body[data-theme="light"] .result-item.active .result-title {
  color: #1a1a1a;
}
.palette-panel.ai-streaming .palette-results {
  max-height: none;
  flex: 1 1 auto;
  min-height: 0;
  overflow: hidden;
  padding: 4px 8px 8px;
  display: flex;
  flex-direction: column;
}
.ai-stream-container {
  flex: 1 1 auto;
  min-height: 0;
  display: flex;
  flex-direction: column;
  border-radius: var(--radius-lg);
  border: 1px solid rgba(139, 92, 246, 0.22);
  background: rgba(12, 18, 28, 0.55);
  overflow: hidden;
}
.ai-stream-header {
  flex-shrink: 0;
  padding: 8px 12px;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.04em;
  color: #c4b5fd;
  border-bottom: 1px solid rgba(139, 92, 246, 0.15);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
.ai-stream-header-main {
  min-width: 0;
  flex: 1 1 auto;
}
.ai-stream-header-title {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}
.ai-stream-header-query {
  margin-top: 3px;
  font-size: 12px;
  font-weight: 500;
  letter-spacing: 0;
  text-transform: none;
  color: var(--text-main);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.ai-stream-badge {
  flex-shrink: 0;
  padding: 2px 8px;
  border-radius: 999px;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.02em;
}
.ai-stream-badge.streaming {
  color: #fbbf24;
  background: rgba(251, 191, 36, 0.12);
  border: 1px solid rgba(251, 191, 36, 0.28);
}
.ai-stream-badge.done {
  color: #86efac;
  background: rgba(34, 197, 94, 0.12);
  border: 1px solid rgba(34, 197, 94, 0.28);
}
.ai-stream-badge.handoff {
  color: #93c5fd;
  background: rgba(59, 130, 246, 0.12);
  border: 1px solid rgba(59, 130, 246, 0.28);
}
.ai-stream-badge.error {
  color: #ff9b7a;
  background: rgba(255, 90, 60, 0.12);
  border: 1px solid rgba(255, 90, 60, 0.28);
}
.ai-stream-body {
  flex: 1 1 auto;
  min-height: 120px;
  max-height: calc(380px - 120px);
  overflow-y: auto;
  padding: 12px 14px;
  font-size: 13px;
  line-height: 1.55;
  color: var(--text-main);
  white-space: pre-wrap;
  word-break: break-word;
}
.ai-stream-body.streaming::after {
  content: "▍";
  display: inline;
  color: var(--accent-2);
  animation: ai-cursor-blink 0.9s step-end infinite;
  margin-left: 2px;
}
@keyframes ai-cursor-blink {
  50% { opacity: 0; }
}
.ai-stream-footer {
  flex-shrink: 0;
  padding: 8px 12px;
  font-size: 11px;
  color: var(--text-soft);
  border-top: 1px solid rgba(255, 255, 255, 0.06);
}
.ai-stream-footer kbd {
  display: inline-block;
  padding: 1px 5px;
  margin: 0 2px;
  border-radius: 4px;
  border: 1px solid rgba(255, 255, 255, 0.12);
  background: rgba(255, 255, 255, 0.06);
  font-size: 10px;
  color: var(--text);
}
.ai-stream-error {
  padding: 10px 12px;
  font-size: 12px;
  color: #ff9b7a;
  background: rgba(255, 90, 60, 0.08);
  border-top: 1px solid rgba(255, 90, 60, 0.2);
}
body[data-theme="light"] .ai-stream-container {
  background: rgba(255, 255, 255, 0.72);
  border-color: rgba(139, 92, 246, 0.28);
}
.palette-results.has-ai-bg-card {
  padding: 4px 8px 6px;
  overflow-x: hidden;
  overflow-y: auto;
}
.ai-results-stack {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.palette-ai-provider-list {
  overflow: visible;
  padding-right: 0;
}
.palette-ai-provider-list .result-item {
  min-height: 44px;
}
.palette-panel.has-ai-providers .palette-results {
  flex: 1 1 auto;

  var IntentRouter = (function () {
    var ORDER = ["local", "ai", "action"];

      local: "搜索文件、路径或剪贴板…",
      ai: "选择模型，Enter 原地流式回答…",
      action: "描述任务 Enter 提交至上方所选引擎（龙虾/Hermes）…"
    };
    function nextIntent(cur) {
      var i = ORDER.indexOf(cur);
      return ORDER[(i < 0 ? 0 : i + 1) % ORDER.length];
    }
    function applyTag(el, intent) {
      if (!el) return;
      el.setAttribute("data-intent", intent);
      el.textContent = LABELS[intent] || intent;
      el.title = "Tab 切换意图";
    }
    return { ORDER: ORDER, LABELS: LABELS, PLACEHOLDERS: PLACEHOLDERS, nextIntent: nextIntent, applyTag: applyTag };
  })();

    input: "",
    intent: "action",

  function cardPlanProgressMeta(card) {
    if (!card || !card.blocks || !Array.isArray(card.blocks.plan) || !card.blocks.plan.length) return null;
    var total = card.blocks.plan.length;
    var done = 0;
    if (card.uiState === "Done") done = total;
    else if (card.uiState === "Running") done = Math.min(total, Math.max(1, card.blocks.status ? card.blocks.status.length : 1));
    return { done: done, total: total, label: "步骤 " + done + "/" + total };
  }

  function isAgentStatusPreview(text) {
    var p = String(text || "").replace(/\s+/g, " ").trim();
    if (!p) return true;
    return /^[🔗⏳📨💭]/.test(p) || /^(正在|等待|任务已|仍连接|OpenClaw 流式|OpenClaw 处理|同步 Niuma|流式输出中)/.test(p);
  }

  function cardPreviewText(card) {
    if (!card) return "";
    var raw = String(card.rawAnswer || "").trim();
    if (raw && !isAgentStatusPreview(raw))
      return raw.replace(/::\w+_(START|END)::/g, " ").replace(/\s+/g, " ").trim().slice(0, 160);
    if (card.parser && card.parser._buf && String(card.parser._buf).trim() && !isAgentStatusPreview(card.parser._buf))
      return String(card.parser._buf).trim().slice(0, 160);
    if (card.liveThought && String(card.liveThought).trim() && !isAgentStatusPreview(card.liveThought))
      return String(card.liveThought).trim().slice(0, 160);
    if (card.blocks && card.blocks.reply) {
      var rb = String(card.blocks.reply.content || card.blocks.reply.body || "").trim();
      if (rb) return rb.slice(0, 160);
    }
    if (card.blocks && Array.isArray(card.blocks.status) && card.blocks.status.length) {
      var st = card.blocks.status[card.blocks.status.length - 1];
      var lg = String(st.log || st.body || st.title || "").trim();
      if (lg) return lg.slice(0, 160);
    }
    var rawFallback = String(card.rawAnswer || "").trim();
    if (rawFallback) return rawFallback.replace(/::\w+_(START|END)::/g, " ").replace(/\s+/g, " ").trim().slice(0, 160);
    var q = card.query && String(card.query).trim();
    var title = String(card.title || "").trim();
    if (q && q !== title) return q.slice(0, 120);
    if (card.uiState === "Done") return "无详细记录";
    return q ? q.slice(0, 120) : "";
  }

  function reconcilePendingAgentCard(serverDto) {
    var pending = actionState._pendingCardId;
    if (!pending || !serverDto || !serverDto.cardId) return;
    var realId = String(serverDto.cardId);
    if (realId === pending) {
      actionState._pendingCardId = null;
      return;
    }
    var pend = actionState.cards[pending];
    if (pend) {
      pend.id = realId;
      pend.reqId = serverDto.reqId || pend.reqId || "";
      pend.title = serverDto.title || pend.title;
      pend.query = serverDto.query || pend.query;
      pend.provider = serverDto.provider || pend.provider;
      if (serverDto.uiState) pend.uiState = serverDto.uiState;
      actionState.cards[realId] = pend;
      delete actionState.cards[pending];
      var pel = document.getElementById("card-" + pending);
      if (pel) {
        pel.id = "card-" + realId;
        pel.setAttribute("data-card-id", realId);

  function providerIconUrlList(pid) {
    pid = String(pid || "").trim();
    if (!PROVIDER_ICON_BASES[pid]) pid = "openai";
    var bases = PROVIDER_ICON_BASES[pid];
    if (!bases || !bases.length) bases = [pid];
    var list = [];
    var localKey = localAgentIconKey(pid);
    var localFiles = localKey ? LOCAL_AGENT_ICON_PRIOR[localKey] : null;
    if (localFiles && localFiles.length) {
      localFiles.forEach(function (file) {
        list.push(ICON_PRIMARY + file);
        list.push(ICON_SECOND + file);
      });
    }
    bases.forEach(function (base) {
      PROVIDER_ICON_EXTS.forEach(function (ext) {
        list.push(ICON_SECOND + base + ext);
      });
    });
    list.push(ICON_PRIMARY + pid + ".svg");
    list.push(ICON_SECOND + pid + ".svg");
    list.push(ICON_FALLBACK);
    var seen = {};
    var out = [];
    list.forEach(function (u) {
      if (!seen[u]) {
        seen[u] = 1;
        out.push(u);
      }
    });
    return out;
  }

  function iconUrlListForItem(item) {
    var list = [];

        if (u && list.indexOf(u) < 0) list.push(String(u));
      });

    providerIconUrlList(providerIconKeyForItem(item)).forEach(function (u) {
      if (list.indexOf(u) < 0) list.push(u);
    });
    return list.length ? list : [ICON_FALLBACK];
  }

    if (!card) return false;
    var f = actionState.historyFilter;
    if (f === "running") return card.uiState === "Planning" || card.uiState === "Running" || card.uiState === "Waiting";
    if (f === "done") return card.uiState === "Done";
    return true;
  }

  function getActionCard(cardId) {
    return actionState.cards[cardId] || null;
  }

  function resolveActionCard(cardId, reqId) {
    var cid = String(cardId || "");
    var rid = String(reqId || "");
    if (cid) {
      var c0 = getActionCard(cid);
      if (c0) return { card: c0, id: cid };
    }
    if (rid) {
      var ids = Object.keys(actionState.cards);
      for (var i = 0; i < ids.length; i++) {
        var c1 = actionState.cards[ids[i]];
        if (c1 && String(c1.reqId || "") === rid) return { card: c1, id: ids[i] };
      }
    }
    if (actionState.activeCardId) {
      var c2 = getActionCard(actionState.activeCardId);
      if (c2) return { card: c2, id: actionState.activeCardId };
    }
    var ids2 = Object.keys(actionState.cards);
    if (ids2.length === 1) return { card: actionState.cards[ids2[0]], id: ids2[0] };
    return { card: null, id: "" };
  }

  function setCardLiveThought(cardId, text, thinking) {
    var card = getActionCard(cardId);
    if (card) card.liveThought = String(text || "");
    refreshActionCardPreview(cardId);
    if (cardId === actionState.activeCardId) updateActionLiveDock(cardId);
    var dom = document.getElementById("card-" + cardId);
    if (!dom) return;
    if (dom.classList.contains("has-status-log")) return;
    var el = dom.querySelector(".card-live-thought");
    if (!el) return;
    el.textContent = card.liveThought || "等待引擎响应…";
    el.classList.toggle("thinking", !!thinking);
  }

  function refreshActionCardPreview(cardId) {
    var card = getActionCard(cardId);
    var dom = document.getElementById("card-" + cardId);
    if (!card || !dom) return;
    var previewEl = dom.querySelector(".card-preview-line");
    var metaEl = dom.querySelector(".card-meta-line");
    var compactEl = dom.querySelector(".card-compact-progress");
    var planChip = dom.querySelector(".card-plan-chip");
    var preview = cardPreviewText(card);
    if (previewEl) {
      previewEl.textContent = preview || "";
      previewEl.title = preview || card.query || "";
    }
    if (metaEl) metaEl.textContent = cardMetaLineText(card);
    if (compactEl) {
      compactEl.textContent = isActionCardRunning(card) ? preview || "执行中…" : preview || "已归档";
      compactEl.title = compactEl.textContent;
    }
    if (planChip) {
      var plan = cardPlanProgressMeta(card);
      if (plan) {
        planChip.hidden = false;
        planChip.textContent = plan.label;
      } else planChip.hidden = true;
    }
  }

  function collapseNonActiveCards() {
    var active = actionState.activeCardId;
    Object.keys(actionState.cards).forEach(function (id) {
      var c = actionState.cards[id];
      if (!c) return;
      c.expanded = id === active && (isActionCardRunning(c) || !!c.expanded);
      refreshActionCardDom(c);
    });
  }

  function collapseOtherDoneCards(exceptId) {
    Object.keys(actionState.cards).forEach(function (id) {
      if (id === exceptId) return;
      var c = actionState.cards[id];
      if (!c || c.uiState !== "Done") return;
      c.expanded = false;
      refreshActionCardDom(c);
    });
  }

  function syncActionCardStatusLogVisibility(dom) {
    if (!dom) return;
    var logBox = dom.querySelector(".card-status-log");
    var has = !!(logBox && logBox.querySelector(".b-status"));
    dom.classList.toggle("has-status-log", has);
  }

  function focusActionCard(cardId, opts) {
    opts = opts || {};
    actionState.activeCardId = cardId;
    var cur = getActionCard(cardId);
    if (cur) {
      if (isActionCardRunning(cur) || opts.expand) cur.expanded = true;
      refreshActionCardDom(cur);
      updateActionLiveDock(cardId);
    }
    if (actionState.focusMode) {
      Object.keys(actionState.cards).forEach(function (id) {
        if (id === cardId) return;
        var c = actionState.cards[id];
        if (!c) return;
        c.expanded = false;
        refreshActionCardDom(c);
      });
    } else if (!opts.skipOthers) {
      Object.keys(actionState.cards).forEach(function (id) {
        if (id === cardId) return;
        refreshActionCardDom(actionState.cards[id]);
      });
    }
    renderActionHistoryList();
    syncActionResultsLayout();
  }

  function toggleActionCardExpand(cardId) {
    var card = getActionCard(cardId);
    if (!card) return;
    card.expanded = !card.expanded;
    if (card.expanded) {
      actionState.activeCardId = cardId;
      if (card.uiState === "Done") collapseOtherDoneCards(cardId);
    }
    hideCardHoverPreview();
    refreshActionCardDom(card);
    renderActionHistoryList();
    syncActionResultsLayout();
    syncWindowSize();
  }

  function refreshActionCardDom(card) {
    if (!card) return;
    if (card.expanded == null) card.expanded = card.id === actionState.activeCardId;
    var dom = ensureActionCardDom(card);
    if (!dom) return;
    var prov = card.provider || state.agentProvider || "openclaw";
    var provEl = dom.querySelector(".card-provider-chip");
    if (provEl) {
      provEl.textContent = agentProviderLabel(prov);
      provEl.className = "card-provider-chip" + (prov === "hermes" ? " hermes" : "");
    }
    var titleEl = dom.querySelector(".cmd-action-card-title");
    if (titleEl) titleEl.textContent = card.title || card.query || "代理任务";
    var badge = dom.querySelector(".cmd-action-card-badge");
    if (badge) badge.textContent = actionCardUiLabel(card.uiState);
    var expandBtn = dom.querySelector(".card-expand-btn");
    if (expandBtn) expandBtn.textContent = card.expanded ? "▼" : "▶";
    dom.className =
      "cmd-action-card state-" +
      (card.uiState || "Planning") +
      (card.expanded ? " is-expanded" : " is-collapsed") +
      (card.id === actionState.activeCardId ? " is-active" : "") +
      (dom.classList.contains("has-status-log") ? " has-status-log" : "");
    var loader = dom.querySelector(".card-pulse-loader");
    if (loader) loader.style.display =
      card.expanded && (card.uiState === "Planning" || card.uiState === "Running") ? "block" : "none";
    if (card.expanded || (card.id === actionState.activeCardId && isActionCardRunning(card))) {
      setCardLiveThought(
        card.id,
        card.liveThought || "",
        card.uiState === "Planning" || card.uiState === "Running"
      );
    }
    refreshActionCardPreview(card.id);
    if (card.id === actionState.activeCardId) updateActionLiveDock(card.id);
    var cancelBtn = dom.querySelector(".card-cancel-btn");
    if (cancelBtn) cancelBtn.hidden = !isActionCardRunning(card);
    var follow = dom.querySelector(".card-followup");
    if (follow) follow.hidden = !card.expanded;
    var fin = dom.querySelector(".card-followup-input");
    if (fin) {
      fin.placeholder =
        card.uiState === "Waiting"
          ? "回答大脑提问后点发送…"
          : card.uiState === "Done"
            ? "追加新指令…"
            : "补充要求（不中断当前任务）…";
    }
  }

  function bindActionCardEvents(card, dom) {
    if (!card || !dom || dom.dataset.eventsBound) return;
    dom.dataset.eventsBound = "1";
    var head = dom.querySelector(".cmd-action-card-head");
    if (head) {
      head.addEventListener("click", function (e) {
        if (e.target.closest(".card-mini-btn")) return;
        if (e.target.closest(".card-expand-btn")) {
          toggleActionCardExpand(card.id);
          return;
        }
        if (card.uiState === "Done" && !isActionCardRunning(card)) {
          toggleActionCardExpand(card.id);
          return;
        }
        focusActionCard(card.id);
      });
      head.addEventListener("mouseenter", function () {
        if (card.expanded) return;
        if (cardHoverPreviewTimer) clearTimeout(cardHoverPreviewTimer);
        cardHoverPreviewTimer = setTimeout(function () {
          showCardHoverPreview(card, dom);
        }, 300);
      });
      head.addEventListener("mouseleave", function () {
        hideCardHoverPreview();
      });
    }
    dom.addEventListener("mouseleave", function () {
      hideCardHoverPreview();
    });
    var expandBtn = dom.querySelector(".card-expand-btn");
    if (expandBtn) {
      expandBtn.addEventListener("click", function (e) {
        e.stopPropagation();
        toggleActionCardExpand(card.id);
      });
    }
    var cancelBtn = dom.querySelector(".card-cancel-btn");
    if (cancelBtn) {
      cancelBtn.addEventListener("click", function (e) {
        e.stopPropagation();
        post({ type: "palette_agent_cancel", cardId: card.id });
      });
    }
    var deleteBtn = dom.querySelector(".card-delete-btn");
    if (deleteBtn) {
      deleteBtn.addEventListener("click", function (e) {
        e.stopPropagation();
        removeActionCard(card.id, true);
        renderActionHistoryList();
        syncActionResultsLayout();
      });
    }
    var sendBtn = dom.querySelector(".card-followup-btn");
    var fin = dom.querySelector(".card-followup-input");
    function sendFollowup() {
      var t = fin ? String(fin.value || "").trim() : "";
      if (!t) return;
      focusActionCard(card.id);
      submitAgentTask(t, {
        cardId: card.id,
        forceKind: card.uiState === "Waiting" ? "correction" : card.uiState === "Done" ? "append" : "correction",
        fromCardFollowup: true,
        provider: card.provider || state.agentProvider
      });
      if (fin) fin.value = "";
    }
    if (sendBtn) sendBtn.addEventListener("click", function (e) { e.stopPropagation(); sendFollowup(); });
    if (fin) {
      fin.addEventListener("click", function (e) { e.stopPropagation(); });
      fin.addEventListener("keydown", function (e) {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          e.stopPropagation();
          sendFollowup();
        }
      });
    }
  }

  function ensureActionCardDom(card) {
    var box = document.getElementById("results");
    if (!box || !card) return null;
    var id = "card-" + card.id;
    var el = document.getElementById(id);
    if (!el) {
      el = document.createElement("article");
      el.id = id;
      el.className = "cmd-action-card is-collapsed";
      el.innerHTML =
        '<div class="card-pulse-loader" style="display:none"></div>' +
        '<div class="cmd-action-card-head">' +
        '<button type="button" class="card-expand-btn" aria-label="展开">▼</button>' +
        '<span class="card-state-dot" aria-hidden="true"></span>' +
        '<span class="card-provider-chip">龙虾</span>' +
        '<div class="card-head-main">' +
        '<span class="cmd-action-card-title"></span>' +
        '<span class="card-preview-line"></span>' +
        '<span class="card-meta-line"></span>' +
        "</div>" +
        '<div class="card-head-actions">' +
        '<span class="card-plan-chip" hidden></span>' +
        '<span class="cmd-action-card-badge"></span>' +
        '<button type="button" class="card-mini-btn card-cancel-btn" title="取消任务">取消</button>' +
        '<button type="button" class="card-mini-btn card-delete-btn" title="移除此卡片">删除</button>' +
        "</div></div>" +
        '<div class="card-compact-progress"></div>' +
        '<div class="card-live-thought thinking">等待引擎响应…</div>' +
        '<div class="card-body">' +
        '<div class="card-timeline"></div>' +
        '<div class="card-status-log"></div>' +
        '<div class="card-question" hidden></div>' +
        '<div class="card-reply" hidden></div>' +
        "</div>" +
        '<div class="card-followup">' +
        '<input type="text" class="card-followup-input" />' +
        '<button type="button" class="card-followup-btn">补充</button>' +
        "</div>";
      var stack0 = box.querySelector(".action-card-stack");
      if (!stack0) {
        stack0 = document.createElement("div");
        stack0.className = "action-card-stack";
        box.insertBefore(stack0, box.firstChild);
      }
      var list0 = ensureActionCardListHost(stack0);
      if (list0) list0.appendChild(el);
      else stack0.appendChild(el);
      refreshActionCardDom(card);
    }
    bindActionCardEvents(card, el);
    return el;
  }

  function ensureActionCardListHost(stack) {
    var runSec = ensureActionCardSection(stack, "running");
    return runSec ? runSec.querySelector(".action-card-list") : null;
  }

  function ensureActionCardSection(stack, sectionId) {
    if (!stack) return null;
    var sec = stack.querySelector('.action-card-section[data-section="' + sectionId + '"]');
    if (!sec) {
      sec = document.createElement("div");
      sec.className = "action-card-section";
      sec.setAttribute("data-section", sectionId);
      sec.innerHTML =
        '<div class="action-card-section-head"></div><div class="action-card-list"></div>';
      stack.appendChild(sec);
    }
    return sec;
  }

  function sortCardIds(ids) {
    var active = actionState.activeCardId;
    return ids.sort(function (a, b) {
      if (a === active) return -1;
      if (b === active) return 1;
      return String(actionState.cards[b].updatedAt || "").localeCompare(String(actionState.cards[a].updatedAt || ""));
    });
  }

  function mountActionCardIntoList(card, listHost) {
    if (!card || !listHost) return;
    var dom = ensureActionCardDom(card);
    if (!dom) return;
    dom.style.display = "";
    dom.style.visibility = "visible";
    dom.style.height = "";
    dom.style.overflow = "";
    listHost.appendChild(dom);
    refreshActionCardDom(card);
  }

  function renderActionHistoryList() {
    var box = document.getElementById("results");
    if (!box) return;
    var stack = box.querySelector(".action-card-stack");
    if (!stack) {
      stack = document.createElement("div");
      stack.className = "action-card-stack";
      var cmdKeep = box.querySelector(".action-cmd-list");
      if (cmdKeep) box.insertBefore(stack, cmdKeep);
      else box.insertBefore(stack, box.firstChild);
    }
    refreshActionHistoryHead();
    removeActionLiveDock(stack);

    var oldFlat = stack.querySelector(":scope > .action-card-list");
    if (oldFlat) oldFlat.remove();
    stack.querySelectorAll(".action-done-more-btn").forEach(function (b) {
      b.remove();
    });

    var runningIds = [];
    var doneIds = [];
    Object.keys(actionState.cards).forEach(function (cid) {
      var c = actionState.cards[cid];
      if (!c) return;
      if (!cardMatchesHistoryFilter(c)) {
        var hideEl = document.getElementById("card-" + cid);
        if (hideEl) hideEl.style.display = "none";
        return;
      }
      if (isActionCardRunning(c)) runningIds.push(cid);
      else doneIds.push(cid);
    });

    sortCardIds(runningIds);
    sortCardIds(doneIds);

    var showRunning = actionState.historyFilter === "all" || actionState.historyFilter === "running";
    var showDone = actionState.historyFilter === "all" || actionState.historyFilter === "done";

    stack.querySelectorAll(".action-card-section").forEach(function (sec) {
      sec.style.display = "none";
    });

    if (showRunning && runningIds.length) {
      var runSec = ensureActionCardSection(stack, "running");
      runSec.style.display = "";
      var runHead = runSec.querySelector(".action-card-section-head");
      if (runHead) {
        runHead.innerHTML =
          '<span>进行中</span><span class="section-count">' + runningIds.length + "</span>" +
          '<span class="section-hint">实时进度与操作见下方任务卡</span>';
      }
      var runList = runSec.querySelector(".action-card-list");
      if (runList) {
        runList.innerHTML = "";
        runningIds.forEach(function (cid) {
          var card = actionState.cards[cid];
          if (!card) return;
          if (actionState.focusMode && cid !== actionState.activeCardId) {
            card.expanded = false;
          } else if (cid === actionState.activeCardId || runningIds.length === 1) {
            card.expanded = true;
          } else if (card.expanded == null) {
            card.expanded = false;
          }
          mountActionCardIntoList(card, runList);
        });
      }
    }

    if (showDone && doneIds.length) {
      var doneSec = ensureActionCardSection(stack, "done");
      doneSec.style.display = "";
      var doneHead = doneSec.querySelector(".action-card-section-head");
      var doneLimit = actionState.showAllDone ? doneIds.length : 4;
      var doneVisible = doneIds.slice(0, doneLimit);
      if (doneHead) {
        doneHead.innerHTML =
          '<span>已归档</span><span class="section-count">' + doneIds.length + "</span>" +
          '<span class="section-hint">默认紧凑 · 点击展开 · 悬浮预览</span>';
      }
      var doneList = doneSec.querySelector(".action-card-list");
      if (doneList) {
        doneList.innerHTML = "";
        doneVisible.forEach(function (cid) {
          var card = actionState.cards[cid];
          if (!card) return;
          if (actionState.focusMode && cid !== actionState.activeCardId) card.expanded = false;
          else if (cid !== actionState.activeCardId || !card.expanded) card.expanded = false;
          mountActionCardIntoList(card, doneList);
        });
      }
      if (!actionState.showAllDone && doneIds.length > doneLimit) {
        var moreBtn = document.createElement("button");
        moreBtn.type = "button";
        moreBtn.className = "action-done-more-btn";
        moreBtn.textContent = "展开更多已归档（+" + (doneIds.length - doneLimit) + "）";
        moreBtn.addEventListener("click", function () {
          actionState.showAllDone = true;
          renderActionHistoryList();
        });
        doneSec.appendChild(moreBtn);
      }
    }

    if (runningIds.length + doneIds.length > 0) {
      var panel = document.getElementById("palette-panel");
      if (panel) panel.classList.add("has-results", "intent-action");
      box.classList.add("palette-results", "has-action-cards");
      requestAnimationFrame(function () {
        syncActionResultsScrollMode();
        syncWindowSize();
      });
    } else {
      removeActionLiveDock(stack);
      if (state.intent === "action" && !state.input.trim() && !state.actionCmdBrowse) {
        purgeActionEmptyHint();
        var empty = document.createElement("div");
        empty.className = "action-intent-empty";
        empty.textContent =
          "暂无历史任务。输入描述后 Enter 提交至 " +
          agentProviderLabel(state.agentProvider) +
          "；提交后会在此按「进行中 / 已归档」分区显示。";
        stack.appendChild(empty);
      }
    }
  }

  var actionCardManager = {
    transitionCardState: function (cardId, newState) {
      var card = getActionCard(cardId);
      if (!card) return;
      card.uiState = newState;
      var dom = ensureActionCardDom(card);
      if (!dom) return;
      dom.className =
        "cmd-action-card state-" +
        newState +
        (card.expanded ? " is-expanded" : " is-collapsed") +
        (card.id === actionState.activeCardId ? " is-active" : "") +
        (dom.classList.contains("has-status-log") ? " has-status-log" : "");
      var loader = dom.querySelector(".card-pulse-loader");
      var badge = dom.querySelector(".cmd-action-card-badge");
      var inputEl = getInputEl();
      if (badge) badge.textContent = actionCardUiLabel(newState);
      if (loader)
        loader.style.display =
          card.expanded && (newState === "Planning" || newState === "Running") ? "block" : "none";
      refreshActionCardPreview(cardId);
      if (cardId === actionState.activeCardId) updateActionLiveDock(cardId);
      if (inputEl) {
        if (newState === "Planning") inputEl.placeholder = "引擎正在重新规划任务流…";
        else if (newState === "Running") inputEl.placeholder = "正在执行云端代理具身流，请稍候…";
        else if (newState === "Waiting") {
          inputEl.placeholder = "大脑向您提问！请就地输入修正回复…";
          dom.classList.add("waiting-user-reply");
          inputEl.focus();
        } else if (newState === "Done") {
          inputEl.placeholder = "当前任务已归档。敲击回车可在此卡片追加新命令…";
          dom.classList.remove("waiting-user-reply");
          inputEl.value = "";
        }
      }
      if (newState === "Running") {
        var logEl = dom.querySelector(".card-status-log");
        if (logEl) logEl.scrollTop = logEl.scrollHeight;
      }
      syncActionResultsLayout();
    },
    onBlockUpdate: function (cardId, block) {
      var card = getActionCard(cardId);
      if (!card || !block) return;
      var dom = ensureActionCardDom(card);
      if (!dom) return;
      if (block.type === "plan") {
        if (block.closed) {
          card.blocks.plan = block.steps || [];
          if (block.replan) actionCardManager.transitionCardState(cardId, "Planning");
          var tl = dom.querySelector(".card-timeline");
          if (tl) {
            tl.innerHTML = (block.steps || [])
              .map(function (s, i) {
                return '<div class="card-timeline-step">' + esc("步骤" + (i + 1) + "：" + s) + "</div>";
              })
              .join("");
          }
          refreshActionCardPreview(cardId);
          if (card.uiState === "Planning") actionCardManager.transitionCardState(cardId, "Running");
        }
      } else if (block.type === "status") {
        if (!card.blocks.status) card.blocks.status = [];
        var idx = card.blocks.status.length - 1;
        if (!block.closed && idx >= 0 && card.blocks.status[idx] && card.blocks.status[idx].seq === block.seq) {
          card.blocks.status[idx] = block;
        } else if (block.closed) {
          card.blocks.status.push(block);
        } else {
          card.blocks.status.push(block);
        }
        var open = card.blocks.status[card.blocks.status.length - 1];
        var logBox = dom.querySelector(".card-status-log");
        if (logBox) {
          var tail = logBox.querySelector('.b-status[data-seq="' + block.seq + '"]');
          if (!tail) {
            tail = document.createElement("div");
            tail.className = "b-status";
            tail.setAttribute("data-seq", String(block.seq));
            tail.innerHTML = '<div class="b-status-title"></div><div class="b-status-log"></div>';
            logBox.appendChild(tail);
          }
          if (tail) {
            tail.querySelector(".b-status-title").textContent = open.title || "[执行中]";
            tail.querySelector(".b-status-log").textContent = open.log || open.body || "";
          }
          logBox.scrollTop = logBox.scrollHeight;
          syncActionCardStatusLogVisibility(dom);
        }
        refreshActionCardPreview(cardId);
        if (cardId === actionState.activeCardId) updateActionLiveDock(cardId);
        if (card.uiState !== "Waiting" && card.uiState !== "Done") actionCardManager.transitionCardState(cardId, "Running");
      } else if (block.type === "orphan" && block.closed) {
        var orphanBody = String(block.content || block.body || "").trim();
        if (orphanBody) {
          var orphanLog = dom.querySelector(".card-status-log");
          if (orphanLog) {
            var orphanNorm = orphanBody.replace(/\s+/g, " ").trim();
            var orphanNodes = orphanLog.querySelectorAll(".b-status");
            for (var oi = orphanNodes.length - 1; oi >= 0; oi--) {
              var prevTxt = orphanNodes[oi].querySelector(".b-status-log");
              if (prevTxt && prevTxt.textContent.replace(/\s+/g, " ").trim() === orphanNorm) return;
            }
            var orphanHit = orphanLog.querySelector('.b-status[data-seq="' + block.seq + '"]');
            if (!orphanHit) {
              orphanHit = document.createElement("div");
              orphanHit.className = "b-status";
              orphanHit.setAttribute("data-seq", String(block.seq));
              orphanHit.innerHTML =
                '<div class="b-status-title">[回复]</div><div class="b-status-log"></div>';
              orphanLog.appendChild(orphanHit);
            }
            orphanHit.querySelector(".b-status-log").textContent = orphanBody;
            orphanLog.scrollTop = orphanLog.scrollHeight;
            syncActionCardStatusLogVisibility(dom);
          }
        }
        refreshActionCardPreview(cardId);
        if (cardId === actionState.activeCardId) updateActionLiveDock(cardId);
        if (card.uiState !== "Waiting" && card.uiState !== "Done") actionCardManager.transitionCardState(cardId, "Running");
      } else if (block.type === "question" && block.closed) {
        card.blocks.question = block;
        card.waitingForUser = true;
        var qEl = dom.querySelector(".card-question");
        if (qEl) {
          qEl.hidden = false;
          qEl.innerHTML =
            '<div class="card-question-title">' +
            esc(block.title || "需要您的确认") +
            "</div><div>" +
            esc(block.content || block.body || "") +
            "</div>";
        }
        actionCardManager.transitionCardState(cardId, "Waiting");
      } else if (block.type === "reply" && block.closed) {
        card.blocks.reply = block;
        card.waitingForUser = false;
        var rEl = dom.querySelector(".card-reply");
        if (rEl) {
          rEl.hidden = false;
          rEl.innerHTML =
            '<div class="card-reply-title">' +
            esc(block.title || "任务完结") +
            "</div><div>" +
            esc(block.content || block.body || "") +
            "</div>";
        }
        actionCardManager.transitionCardState(cardId, "Done");
      }
    }
  };

  function syncActionResultsLayout() {
    var panel = document.getElementById("palette-panel");
    var box = document.getElementById("results");
    if (!panel || !box) return;
    var hasCards = !!box.querySelector(".cmd-action-card") || Object.keys(actionState.cards).length > 0;
    state.showResults = hasCards || state.showResults;
    panel.classList.toggle("has-results", hasCards || state.showResults);
    panel.classList.toggle("intent-action", state.intent === "action");
    box.classList.toggle("has-action-cards", hasCards);
    if (hasCards) {
      box.classList.add("palette-results");
      panel.classList.add("has-results");
      renderActionHistoryList();
    }
    syncActionResultsScrollMode();
    syncWindowSize();
    requestAnimationFrame(syncWindowSize);
  }

  function upsertActionCardFromDto(dto) {
    if (!dto) return;
    var id = String(dto.cardId || dto.id || "");
    if (!id) return;
    reconcilePendingAgentCard(dto);
    var wasNew = !actionState.cards[id];
    var card = actionState.cards[id];
    if (!card) {
      card = {
        id: id,
        uiState: dto.uiState || "Planning",
        blocks: { plan: [], status: [], question: null, reply: null },
        parser: createAgentParser(id),
        waitingForUser: false,
        sessionRef: dto.sessionRef || "",
        provider: normalizeAgentProvider(dto.provider || state.agentProvider || "openclaw"),
        title: dto.title || dto.query || "代理任务",
        query: dto.query || dto.title || "",
        reqId: dto.reqId || "",
        _protoStarted: false,
        expanded: false,
        liveThought: "",
        rawAnswer: dto.rawAnswer || "",
        updatedAt: dto.updatedAt || ""
      };
      actionState.cards[id] = card;
    }
    card.uiState = dto.uiState || card.uiState;
    card.title = dto.title || dto.query || card.title;
    card.query = dto.query || card.query;
    card.reqId = dto.reqId || card.reqId;
    card.sessionRef = dto.sessionRef || card.sessionRef;
    if (dto.provider) card.provider = normalizeAgentProvider(dto.provider);
    if (dto.updatedAt) card.updatedAt = dto.updatedAt;
    if (dto.rawAnswer != null) {
      card.rawAnswer = String(dto.rawAnswer || "");
      if (card.rawAnswer && !isAgentStatusPreview(card.rawAnswer))
        card.liveThought = card.rawAnswer.slice(0, 280) + (card.rawAnswer.length > 280 ? "…" : "");
    }
    if (dto.liveThought != null && String(dto.liveThought) !== "") {
      if (!card.rawAnswer || isAgentStatusPreview(card.rawAnswer) || !isAgentStatusPreview(dto.liveThought))
        card.liveThought = String(dto.liveThought);
    }
    if (card.expanded === undefined) card.expanded = id === actionState.activeCardId;
    if (wasNew || isActionCardRunning(card)) actionState.activeCardId = id;
    if (actionState.focusMode && (wasNew || id === actionState.activeCardId)) collapseNonActiveCards();
    refreshActionCardDom(card);
    actionCardManager.transitionCardState(id, card.uiState);
    if (dto.rawAnswer && card.parser) {
      var rawSig = String(dto.rawAnswer);
      if (card._rawReplaySig !== rawSig) {
        card._rawReplaySig = rawSig;
        card.parser.reset();
        card._protoStarted = /::(PLAN|STATUS|QUESTION|REPLY)_START::/.test(rawSig);
        card.parser.onChunk(rawSig);
        if (card.uiState === "Done" || dto.uiState === "Done") card.parser.flush();
      }
    }
    renderActionHistoryList();
  }

  function submitAgentTask(text, opts) {
    opts = opts || {};
    var q = readInputValue().trim() || resolveAgentSubmitText(text);
    if (!q) return;
    agentDebugLog("submit_text", "q=" + q.slice(0, 80));
    var prov = normalizeAgentProvider(opts.provider || state.agentProvider || "openclaw");
    var targetId = opts.cardId || (opts.fromCardFollowup ? actionState.activeCardId : "");
    var active = targetId ? getActionCard(targetId) : null;
    var kind = opts.forceKind || "new";
    var cardId = "";
    if (opts.fromCardFollowup && active) {
      cardId = active.id;
      kind = opts.forceKind || (active.uiState === "Waiting" ? "correction" : active.uiState === "Done" ? "append" : "correction");
    } else if (opts.forceKind && opts.cardId) {
      cardId = String(opts.cardId);
      kind = opts.forceKind;
    } else {
      kind = "new";
      cardId = "";
    }
    if (kind === "new" && isAgentProviderKeyword(q)) {
      window.nmerPalette.setStatus("请输入具体任务内容，不要只输入引擎名称（龙虾 / Hermes / openclaw）", "error");
      getInputEl()?.focus();
      return;
    }
    if (active && active.parser && kind !== "new") {
      active.parser.reset();
      active._protoStarted = false;
      active.uiState = kind === "append" ? "Planning" : "Running";
      active.liveThought = "已收到补充，继续执行…";
      actionCardManager.transitionCardState(active.id, active.uiState);
      refreshActionCardDom(active);
    }
    var submitMsg = {
      type: "palette_agent_submit",
      text: q,
      query: q,
      kind: kind,
      cardId: cardId,
      provider: prov
    };
    agentDebugLog("submit_start", "kind=" + kind + " text=" + String(q).slice(0, 60));
    var provGuess = prov;
    var hostOk = false;
    var posted = postAgentSubmitMsg(submitMsg);
    if (posted) {
      agentDebugLog("submit_post", "via=postMessage primary");
      hostOk = true;
    }
    if (!hostOk) {
      var ahkRet = "";
      try {
        ahkRet = submitAgentToHostSync(submitMsg);
        agentDebugLog("bridge_ret", (ahkRet || "(empty)").slice(0, 120));
        hostOk = applyAgentSubmitBridgeRet(ahkRet, submitMsg, provGuess);
        if (!hostOk) {
          window.nmerPalette.setStatus(
            "⚠ 提交失败：" + (ahkRet && ahkRet.indexOf("err:") === 0 ? ahkRet.slice(4) : "请完全退出托盘后重启牛马.ahk"),
            "error"
          );
          agentDebugLog("submit_failed", ahkRet || "empty", "err");
          return;
        }
      } catch (eSub) {
        agentDebugLog("bridge_exc", String(eSub && eSub.message || eSub).slice(0, 120), "warn");
        window.nmerPalette.setStatus("⚠ 提交失败：宿主桥接异常", "error");
        return;
      }
    }
    agentDebugLog("submit_ui", "card=" + actionState.activeCardId);
    state._userPickedCommand = false;
    if (kind === "new") purgeActionEmptyHint();
    if (kind === "new" || kind === "append") {
      var inputEl = getInputEl();
      if (inputEl && !opts.fromCardFollowup) {
        inputEl.value = "";
        state.input = "";
      }
    }
    window.nmerPalette.setStatus(
      "已提交至 " +
        agentProviderLabel(prov) +
        (kind === "new" ? " · 新建任务" : " · 续聊") +
        "：「" +
        (q.length > 80 ? q.slice(0, 80) + "…" : q) +
        "」",
      "loading"
    );
    state.actionCmdBrowse = false;
    var rbox = document.getElementById("results");
    if (rbox) rbox.classList.remove("show-cmd-browse");
    ensureActionResultsVisible();
    renderActionHistoryList();
    syncActionResultsLayout();
    requestAnimationFrame(function () {
      ensureActionResultsVisible();
      renderActionHistoryList();
      syncActionResultsLayout();
      syncWindowSize();
    });
  }

  function ensureActionResultsVisible() {
    var panel = document.getElementById("palette-panel");
    var box = document.getElementById("results");
    if (!panel || !box) return;
    purgeActionEmptyHint();
    var hasCards = Object.keys(actionState.cards).length > 0;
    if (!hasCards) return;
    state.showResults = true;
    panel.classList.add("has-results", "intent-action");
    box.classList.add("palette-results", "has-action-cards");
    box.classList.remove("show-cmd-browse");
    var stack = box.querySelector(".action-card-stack");
    if (!stack) {
      stack = document.createElement("div");
      stack.className = "action-card-stack";
      box.insertBefore(stack, box.firstChild);
    }
    ensureActionCardListHost(stack);
  }

  function renderActionCardSync(cards) {
    cards = normalizeAgentCardsArray(cards);
    var hostIds = {};
    for (var hi = 0; hi < cards.length; hi++) {
      var hid = String(cards[hi].cardId || cards[hi].id || "");
      if (hid) hostIds[hid] = true;
    }
    Object.keys(actionState.cards).forEach(function (id) {
      if (!hostIds[id] && id !== actionState._pendingCardId) removeActionCard(id, false);
    });
    for (var i = 0; i < cards.length; i++) upsertActionCardFromDto(cards[i]);
    if (!cards.length && !actionHasStoredCards()) return;
    purgeActionEmptyHint();
    if (!actionState.activeCardId || !getActionCard(actionState.activeCardId)) {
      var pick = "";
      Object.keys(actionState.cards).forEach(function (cid) {
        if (!pick && isActionCardRunning(actionState.cards[cid])) pick = cid;
      });
      if (!pick) {
        var all = Object.keys(actionState.cards);
        sortCardIds(all);
        if (all.length) pick = all[0];
      }
      if (pick) {
        actionState.activeCardId = pick;
        if (isActionCardRunning(actionState.cards[pick])) actionState.cards[pick].expanded = true;
      }
    }
    if (Object.keys(actionState.cards).length === 1) {
      var sole = Object.keys(actionState.cards)[0];
      actionState.activeCardId = sole;
      actionState.cards[sole].expanded = isActionCardRunning(actionState.cards[sole]);
    }
    if (actionState.focusMode) collapseNonActiveCards();
    renderActionHistoryList();
    syncActionResultsLayout();
    if (actionHasStoredCards()) {
      window.nmerPalette.setStatus(
        "已加载 " + Object.keys(actionState.cards).length + " 个历史任务",
        "success"
      );
    }
  }

  function applyAgentCardNew(d) {
    if (!d) return;
    var nid = String(d.cardId || d.id || "");
    upsertActionCardFromDto({
      cardId: d.cardId || d.id,
      reqId: d.reqId,
      uiState: d.uiState || "Planning",
      title: d.title,
      query: d.query,
      provider: d.provider,
      sessionRef: d.sessionRef,
      rawAnswer: d.rawAnswer,
      updatedAt: d.updatedAt,
      liveThought: d.liveThought
    });
    if (nid) {
      actionState.activeCardId = nid;
      var nc = getActionCard(nid);
      if (nc && isActionCardRunning(nc)) nc.expanded = true;
    }
    purgeActionEmptyHint();
    ensureActionResultsVisible();
    syncActionResultsLayout();
    syncWindowSize();
  }

  function ensureShell() {
    if (root.dataset.ready) return;
    root.innerHTML =
      '<main class="palette-root">' +
      '<section class="palette-panel" id="palette-panel" aria-label="命令面板">' +
      '<header class="palette-header">' +
      '<span id="intent-tag" data-intent="action" title="Tab 切换意图">动作</span>' +
      '<input id="command-input" class="palette-search" type="text" lang="zh-CN" autocomplete="off" spellcheck="false" placeholder="搜索文件、路径或剪贴板…" />' +
      '<button type="button" id="debug-btn" class="palette-debug-btn" title="命令面板诊断 (Ctrl+Shift+D 搜索 / Ctrl+Shift+A 动作托管)" aria-label="打开命令面板诊断">诊</button>' +
      "</header>" +
      '<p id="voice-hint" class="palette-status"></p>' +
      '<div id="action-agent-bar" class="action-agent-bar" hidden>' +
      '<span class="action-agent-label">托管引擎</span>' +
      '<div class="action-agent-chips"></div></div>' +
      '<div id="results" class="palette-results"></div>' +
      "</section></main>";
    root.dataset.ready = "1";
    syncIntentUI();
    bindUI();
    bindActionSubmitButton();
    post({ type: "palette_ready" });
    setTimeout(probeAgentHostBridge, 400);
    setTimeout(requestAgentCardSync, 120);
  }

  function bindResultsScrollHide(box) {
    if (!box || box.dataset.scrollBound) return;
    box.dataset.scrollBound = "1";
    box.addEventListener(
      "scroll",
      function () {
        box.classList.add("is-scrolling");
        clearTimeout(scrollHideTimer);
        scrollHideTimer = setTimeout(function () {
          box.classList.remove("is-scrolling");
        }, 750);
      },
      { passive: true }
    );
  }

  function updateVoiceHint() {
    var el = document.getElementById("voice-hint");
    if (!el) return;
    var show = state.voiceStatus !== "idle";
    el.className = "palette-status" + (show ? " show " + esc(state.voiceStatus) : "");
    el.textContent = show ? state.voiceHint : "";
    document.getElementById("palette-panel")?.classList.toggle("has-status", show);
    syncWindowSize();
  }

  function renderTurboResults(box, rows) {
    var frag = document.createDocumentFragment();
    var cap = Math.min(20, rows.length);
    for (var i = 0; i < cap; i++) {
      var item = rows[i];
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "result-item kind-file" + (i === state.selected ? " active" : "");
      btn.setAttribute("data-idx", String(i));
      if (item.path) btn.setAttribute("data-path", item.path);
      var icon = document.createElement("span");
      icon.className = "result-icon";
      icon.setAttribute("aria-hidden", "true");
      icon.textContent = kindIcon(item.kind || "file");
      var body = document.createElement("span");
      body.className = "result-body";
      var title = document.createElement("span");
      title.className = "result-title";
      title.textContent = item.label || item.title || "";
      var desc = document.createElement("span");
      desc.className = "result-desc";
      desc.textContent = item.desc || item.subtitle || item.path || "";
      body.appendChild(title);
      body.appendChild(desc);
      btn.appendChild(icon);
      btn.appendChild(body);
      frag.appendChild(btn);
    }
    box.replaceChildren(frag);
  }

  function renderActionCmdList(rows) {
    var box = document.getElementById("results");
    if (!box) return;
    var cmdHost = box.querySelector(".action-cmd-list");
    if (!rows || !rows.length) {
      if (cmdHost) cmdHost.remove();
      return;
    }
    if (!cmdHost) {
      cmdHost = document.createElement("div");
      cmdHost.className = "action-cmd-list";
      var stack = box.querySelector(".action-card-stack");
      if (stack) box.appendChild(cmdHost);
      else box.appendChild(cmdHost);
    }
    if (state.resultMode === "turbo") renderTurboResults(cmdHost, rows);
    else renderCommandResults(cmdHost, rows);
    bindResultClicks(cmdHost);
  }

  function renderCommandResults(box, rows) {
    if (!box) return;
    if (state.intent === "action" && box.id === "results") {
      renderActionCmdList(rows);
      return;
    }
    box.innerHTML = rows
      .map(function (item, idx) {
        var active = idx === state.selected ? " active" : "";
        var matched = item.matched ? " matched" : "";
        var kind = item.kind ? " kind-" + esc(item.kind) : "";
        var binding = item.binding ? '<span class="result-binding">' + esc(item.binding) + "</span>" : "";
        if (!binding && item.kind === "ai_provider") {
          if (String(item.id || "") === state.selectedAiProvider) binding = '<span class="result-binding">已选</span>';
          else if (isAiConfigured(item)) binding = '<span class="result-binding">已配置</span>';
        }
        var icon = item.kind === "ai_provider" ? renderProviderIconHtml(item) : kindIcon(item.kind || "command");
        return (
          '<button class="result-item' + active + matched + kind + '" type="button" data-idx="' + idx + '">' +
          '<span class="result-icon" aria-hidden="true">' + icon + "</span>" +
          '<span class="result-body">' +
          '<div class="result-row"><span class="result-title">' + esc(item.label || item.name || "") + "</span>" + binding + "</div>" +
          '<span class="result-desc">' + esc(item.desc || "") + "</span></span></button>"
        );
      })
      .join("");
    hydrateResultIcons(box);
  }

  function bindResultClicks(box) {
    box.querySelectorAll("[data-idx]").forEach(function (node) {
      node.addEventListener("click", function (e) {
        var idx = Number(e.currentTarget.getAttribute("data-idx"));
        if (idx < 0) return;
          state.selected = idx;
        var rows = currentRows();
        var item = rows[idx];
        if (item && item.kind === "ai_provider") {
          pickAiProvider(item.id);
          return;
        }
          updateResults();
          executeSelected();
      });
    });
  }

  function updateResults() {
    if (aiPhase === "compact" && state.intent === "ai") {
      refreshAiProvidersUnderCard();
      return;
    }
    if (state.intent === "action") purgeAiResultsDom();
    var box = document.getElementById("results");
    var panel = document.getElementById("palette-panel");
    if (!box || !panel) return;
    var rows = currentRows();
    var hasActionCards = actionHasStoredCards() || !!box.querySelector(".cmd-action-card");
    state.showResults = rows.length > 0 || hasActionCards || state.intent === "action";
    panel.classList.toggle("has-results", state.showResults);
    panel.classList.toggle("has-ai-providers", state.intent === "ai" && rows.length > 0);
    box.classList.toggle("has-action-cards", hasActionCards);
    box.classList.toggle("show-cmd-browse", !!state.actionCmdBrowse);
    if (state.intent === "action" && !hasActionCards && !state.actionCmdBrowse && !state.input.trim()) {
      requestAgentCardSync();
      renderActionHistoryList();
      purgeActionEmptyHint();
      syncWindowSize();
      return;
    }
    if (state.intent === "action" && hasActionCards) {
      renderActionHistoryList();
      var cmdHost = box.querySelector(".action-cmd-list");
      if (!rows.length || !state.actionCmdBrowse) {
        if (cmdHost) cmdHost.remove();
      } else {
        if (!cmdHost) {
          cmdHost = document.createElement("div");
          cmdHost.className = "action-cmd-list";
          box.appendChild(cmdHost);
        }
        if (state.resultMode === "turbo") renderTurboResults(cmdHost, rows);
        else renderCommandResults(cmdHost, rows);
        bindResultClicks(cmdHost);
        var activeNode = cmdHost.querySelector(".result-item.active");
        if (activeNode) scrollResultItemIntoView(box, activeNode);
      }
      bindResultsScrollHide(box);
      syncWindowSize();
      return;
    }
    if (state.intent === "action") {
      if (hasActionCards) {
        renderActionHistoryList();
        if (state.actionCmdBrowse && rows.length) renderActionCmdList(rows);
        else {
          var ch = box.querySelector(".action-cmd-list");
          if (ch) ch.remove();
        }
      } else if (state.actionCmdBrowse && rows.length) {
        renderActionCmdList(rows);
      } else if (!state.input.trim()) {
        pullAgentCardsFromHostSync();
        if (!actionHasStoredCards()) showActionEmptyIfNeeded();
        return;
      }
      bindResultsScrollHide(box);
      syncWindowSize();
      return;
    }
    box.className = "palette-results" + (hasActionCards ? " has-action-cards" : "");
    if (state.resultMode === "turbo") renderTurboResults(box, rows);
    else renderCommandResults(box, rows);
    bindResultsScrollHide(box);
    bindResultClicks(box);
    var activeNode2 = box.querySelector(".result-item.active");
    if (activeNode2) scrollResultItemIntoView(box, activeNode2);
    syncWindowSize();
  }

  function runQuery(immediate) {
    if (composing) return;
    state.input = readInputValue();
    if (state.intent === "ai") {
      state.actions = state.aiProviders.slice();
      state.resultMode = "command";
      state.turboItems = [];
      if (state.selected >= state.actions.length) state.selected = 0;
      ensureHeaderInputVisible();
      updateResults();
      syncInputHeight();
      syncWindowSize();
      return;
    }
    if (fetchTimer) clearTimeout(fetchTimer);
    var q = state.input.trim();
    var delay = state.intent === "local" ? 50 : 100;
    var run = function () {
      state.querySeq += 1;
      var seq = state.querySeq;
      if (state.intent === "local" && q) {
        state.turboQuery = q;
        state.resultMode = "turbo";
        post({ type: "palette_turbo_search", query: q, intent: "local", limit: 20, seq: seq });
        return;
      }
      if (state.intent === "action" && Object.keys(actionState.cards).length > 0 && !state.actionCmdBrowse) {
        renderActionHistoryList();
        syncActionResultsLayout();
        return;
      }
      if (state.intent === "action" && !q && !state.actionCmdBrowse) {
        if (actionHasStoredCards()) {
          renderActionHistoryList();
          syncActionResultsLayout();
        } else {
          requestAgentCardSync();
          purgeActionEmptyHint();
          syncWindowSize();
        }
        return;
      }
      state.resultMode = "command";
      state.turboItems = [];
      post({ type: "palette_query", input: state.input, seq: seq });
    };
    if (immediate) run();
    else fetchTimer = setTimeout(run, delay);
  }

  function sendAiQuery() {
    if (aiPhase === "streaming") return;
    if (aiPhase === "compact" || aiPhase === "done" || aiPhase === "error") {
      if (aiPhase === "compact") post({ type: "palette_ai_dismiss" });
      resetAiStreamState();
    }
    state.input = readInputValue();
    startAiMorphing(state.input.trim(), state.selectedAiProvider || "");
  }

  function executeSelected() {
    if (state.intent === "ai") {
      var rows = currentRows();
      var item = rows[state.selected];
      if (item && item.kind === "ai_provider") {
        pickAiProvider(item.id);
        return;
      }
      sendAiQuery();
      return;
    }
    var rows = currentRows();
    var item = rows[state.selected];
    if (!item) return;
    if (state.resultMode === "turbo") {
      post({
        type: "palette_turbo_execute",
        path: String(item.path || ""),
        title: String(item.label || item.title || ""),
        kind: String(item.kind || "file"),
        query: state.input
      });
      hidePalette();
      return;
    }
    post({
      type: "palette_execute",
      cmdId: String(item.id || item.cmdId || ""),
      query: state.input,
      kind: String(item.kind || "command"),
      label: String(item.label || item.name || "")
    });
  }

  function syncActionResultsScrollMode() {
    var results = document.getElementById("results");
    var stack = results && results.querySelector(".action-card-stack");
    if (!results || !stack) return;
    var cap = Math.min(ACTION_RESULTS_SCROLL_CAP, Math.floor(window.innerHeight * 0.58));
    var needScroll = stack.scrollHeight > cap + 4;
    results.classList.toggle("is-scrollable", needScroll);
    return needScroll ? cap + 8 : stack.offsetHeight + 8;
  }

  function measureActionPanelExtra(results) {
    var extra = 0;
    var agentBar = document.getElementById("action-agent-bar");
    if (agentBar && !agentBar.hidden) {
      extra += Math.max(ACTION_AGENT_BAR_H, agentBar.offsetHeight || ACTION_AGENT_BAR_H) + 4;
    }
    if (!results) return extra + 48;
    var stack = results.querySelector(".action-card-stack");
    var toolbarH = 0;
    var tb = results.querySelector(".action-history-toolbar");
    var hd = results.querySelector(".action-history-head");
    if (tb) toolbarH += tb.offsetHeight || 28;
    if (hd) toolbarH += hd.offsetHeight || 22;
    if (stack) {
      var listH = syncActionResultsScrollMode();
      if (listH == null) listH = stack.offsetHeight || stack.scrollHeight || ACTION_CARD_MIN_H;
      extra += toolbarH + listH + 10;
      return extra;
    }
    var cardCount = Object.keys(actionState.cards).length;
    if (cardCount > 0) {
      extra += toolbarH + Math.max(ACTION_CARD_MIN_H, cardCount * 38);
      return extra;
    }
    var actEmpty = results.querySelector(".action-intent-empty");
    var actHead = results.querySelector(".action-history-head");
    if (actEmpty || actHead) {
      extra += Math.max(
        68,
        (actEmpty ? actEmpty.offsetHeight : 0) + (actHead ? actHead.offsetHeight : 0) + 24
      );
      return extra;
    }
    if (state.actionCmdBrowse || results.querySelector(".result-item")) {
      var rowH2 = 54;
      var rowsN = Math.max(1, currentRows().length);
      var listH2 = Math.min(320, rowsN * rowH2 + 14);
      if (results.scrollHeight > 0) listH2 = Math.min(320, results.scrollHeight + 14);
      extra += Math.max(80, listH2);
      return extra;
    }
    return extra + 64;
  }

  function measureContentHeight() {
    var panel = document.getElementById("palette-panel");
    var header = panel?.querySelector(".palette-header");
    var status = document.getElementById("voice-hint");
    var results = document.getElementById("results");
    if (!panel || !header) return state.intent === "action" ? ACTION_IDLE_MIN_H : 120;
    var headerH = header.offsetHeight || 0;
    if (headerH < 48) headerH = 48;
    var h = headerH;
    if (status && status.classList.contains("show")) {
      h += status.offsetHeight || 24;
    }
    if (state.intent === "action") {
      h += measureActionPanelExtra(results);
      var capA = 720;
      return Math.min(capA, Math.max(ACTION_IDLE_MIN_H, Math.ceil(h)));
    }
    var cap = state.intent === "ai" ? AI_LIST_MAX_HEIGHT : 520;
    var remain = cap - h - 8;
    if (remain < 120) remain = 120;
    if (state.showResults && results) {
      var actionCards = results.querySelectorAll(".cmd-action-card");
      if (actionCards && actionCards.length) {
        var acH = 24;
        for (var aci = 0; aci < actionCards.length; aci++) acH += actionCards[aci].offsetHeight + 8;
        h += Math.min(560, Math.max(ACTION_CARD_MIN_H, acH + 16));
      } else if (state.intent === "ai") {
        var card = document.querySelector(".ai-bg-card");
        var hint = document.querySelector(".palette-ai-provider-hint");
        var rowCount = Math.max(0, currentRows().length);
        var need =
          (card ? card.offsetHeight + 8 : 0) +
          (hint ? hint.offsetHeight + 4 : 0) +
          rowCount * AI_PROVIDER_ROW_H +
          12;
        h += Math.min(remain, need);
      } else {
        var rowH = state.resultMode === "turbo" ? 40 : 54;
        var rows = Math.max(1, currentRows().length);
        var listH = Math.min(320, rows * rowH + 14);
        if (results.scrollHeight > 0) listH = Math.min(320, results.scrollHeight + 14);
        h += listH;
      }
    }
    return Math.min(cap, Math.max(120, Math.ceil(h)));
  }

  function resetAiStreamState() {
    aiPhase = "idle";
    aiStreamText = "";
    aiStreamReqId = "";
    aiBgCardPayload = null;
    isBackgroundStreaming = false;
    pendingChunkBuf = "";
    if (scrollRaf) {
      cancelAnimationFrame(scrollRaf);
      scrollRaf = 0;
    }
    var panel = document.getElementById("palette-panel");
    if (panel) {
      panel.classList.remove("ai-streaming", "has-ai-bg-card");
    }
  }

  function aiAnswerPreview(text, maxLen) {
    var t = String(text || "").replace(/\s+/g, " ").trim();
    if (!t) return "";
    var n = maxLen || 56;
    if (t.length <= n) return t;
    return t.slice(0, n) + "…";
  }

  function aiBgCardBadge(phase, handoff) {
    if (phase === "done") return { text: "已完成", cls: "done" };
    if (phase === "error") return { text: "失败", cls: "error" };
    if (handoff) return { text: "后台中", cls: "handoff" };
    return { text: "回答中", cls: "streaming" };
  }

  function updateAiBackgroundCard() {
    var card = document.querySelector(".ai-bg-card");
    if (!card || !aiBgCardPayload) return;
    var d = aiBgCardPayload;
    var phase = String(d.phase || "streaming");
    var q = String(d.query || "").trim();
    var ans = String(aiStreamText || d.answer || "").trim();
    var badge = aiBgCardBadge(phase, d.handoff);
    var errMsg = String(d.message || d.error || "").trim();
    var preview = phase === "error" ? (errMsg || "请求失败，请检查 API Key 与网络") : aiAnswerPreview(ans, 64);
    var title = document.querySelector(".ai-bg-card-title");
    var prev = document.querySelector(".ai-bg-card-preview");
    var badgeEl = document.querySelector(".ai-bg-card-badge");
    if (title) title.textContent = "问：" + (q || "AI 对话");
    if (prev) prev.textContent = preview ? "答：" + preview : "点击展开查看";
    if (badgeEl) {
      badgeEl.className = "ai-bg-card-badge " + badge.cls;
      badgeEl.textContent = badge.text;
    }
  }

  function showAiBackgroundCard(d) {
    aiBgCardPayload = d || {};
    var phase = String(d.phase || "streaming");
    var q = String(d.query || "").trim();
    prepareAiIntentForNewQuestion(d.provider ? String(d.provider) : "");
    aiStreamReqId = String(d.reqId || "");
    aiStreamText = String(d.answer || "");
    isBackgroundStreaming = false;
    pendingChunkBuf = "";
    aiPhase = "compact";

    var box = document.getElementById("results");
    var panel = document.getElementById("palette-panel");
    if (!box || !panel) return;
    box.innerHTML = "";
    box.className = "palette-results has-ai-bg-card";
    panel.classList.remove("ai-streaming");
    panel.classList.add("has-ai-bg-card", "has-ai-providers");
    state.showResults = true;

    var stack = document.createElement("div");
    stack.className = "ai-results-stack";

    var badge = aiBgCardBadge(phase, d.handoff);
    var errMsg0 = String(d.message || d.error || "").trim();
    var preview = phase === "error" ? (errMsg0 || "请求失败，请检查 API Key 与网络") : aiAnswerPreview(aiStreamText, 64);
    if (phase === "error" && errMsg0) aiBgCardPayload.message = errMsg0;
    var card = document.createElement("div");
    card.className = "ai-bg-card";
    card.setAttribute("role", "button");
    card.setAttribute("tabindex", "0");
    card.innerHTML =
      '<div class="ai-bg-card-icon">💬</div>' +
      '<div class="ai-bg-card-body">' +
      '<div class="ai-bg-card-title">问：' + esc(q || "AI 对话") + "</div>" +
      '<div class="ai-bg-card-preview">' + esc(preview ? "答：" + preview : "点击展开查看") + "</div>" +
      "</div>" +
      '<span class="ai-bg-card-badge ' + badge.cls + '">' + badge.text + "</span>" +
      '<div class="ai-bg-card-actions">' +
      '<button type="button" class="ai-bg-card-btn expand" title="展开">↗</button>' +
      '<button type="button" class="ai-bg-card-btn close" title="关闭">×</button>' +
      "</div>";

    card.addEventListener("click", function (e) {
      if (e.target.closest(".ai-bg-card-btn.close")) return;
      if (e.target.closest(".ai-bg-card-btn.expand") || !e.target.closest(".ai-bg-card-btn")) {
        expandAiBackgroundCard();
      }
    });
    card.querySelector(".ai-bg-card-btn.expand")?.addEventListener("click", function (e) {
      e.stopPropagation();
      expandAiBackgroundCard();
    });
    card.querySelector(".ai-bg-card-btn.close")?.addEventListener("click", function (e) {
      e.stopPropagation();
      dismissAiBackgroundCard();
    });
    card.addEventListener("keydown", function (e) {
      if (e.key === "Enter") {
        e.preventDefault();
        expandAiBackgroundCard();
      }
    });
    stack.appendChild(card);

    var hint = document.createElement("div");
    hint.className = "palette-ai-provider-hint";
    hint.textContent = "选择模型，在上方输入新问题";
    stack.appendChild(hint);

    var listWrap = document.createElement("div");
    listWrap.className = "palette-ai-provider-list";
    stack.appendChild(listWrap);

    box.appendChild(stack);
    updateAiBackgroundCard();
    refreshAiProvidersUnderCard();

    if (phase === "done") {
      window.nmerPalette.setStatus("输入新问题 · 选模型后 Enter 发送", "idle");
    } else if (phase === "error") {
      window.nmerPalette.setStatus("上次请求失败 · 可换模型后重试", "error");
    } else if (d.handoff) {
      window.nmerPalette.setStatus("后台生成中 · 点击卡片查看", "loading");
    } else {
      window.nmerPalette.setStatus("正在回答 · 点击卡片查看进度", "loading");
    }
    ensureHeaderInputVisible();
