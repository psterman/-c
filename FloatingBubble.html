<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background-color: #121212;
      color-scheme: dark;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    /* 鍗曞眰鐏板渾 + 灞呬腑鍥炬爣锛屾棤宓屽鍙岃壊鍦?*/
    .wrap {
      width: 100%;
      height: 100%;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #121212;
      border-radius: 50%;
      overflow: hidden;
      isolation: isolate;
      transform: translateZ(0) scale(1);
      backface-visibility: hidden;
      will-change: transform, opacity;
      box-shadow: 0 0 0 1px rgba(255,255,255,.07);
      transition: transform .28s cubic-bezier(.22,1,.36,1), opacity .24s ease, box-shadow .28s ease;
    }
    .wrap.fb-enter {
      animation: fbPopIn .34s cubic-bezier(.22,1,.36,1);
    }
    @keyframes fbPopIn {
      0% { transform: scale(.72); opacity: .15; }
      65% { transform: scale(1.06); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }
    .wrap::before {
      content: "";
      position: absolute;
      inset: 1.25px;
      border-radius: 50%;
      pointer-events: none;
      /* 鍐呯缉 1px 鐨勫悓鑹插渾灞傦紝閬綇鏈€澶栧湀閿娇杈?*/
      background: inherit;
      box-shadow: inset 0 0 0 0.75px rgba(255,255,255,.11);
      z-index: 0;
    }
    .wrap img#logo {
      position: relative;
      z-index: 1;
      width: 76%;
      height: 76%;
      max-width: 36px;
      max-height: 36px;
      object-fit: contain;
      pointer-events: none;
    }
    html[data-theme="light"] body {
      background-color: #F7F7F7;
      color-scheme: light;
    }
    html[data-theme="light"] .wrap {
      background-color: #F7F7F7;
      box-shadow: 0 0 0 1px rgba(0,0,0,.045);
    }
    html[data-theme="light"] .wrap::before {
      box-shadow: inset 0 0 0 0.75px rgba(0,0,0,.06);
    }
  </style>
</head>
<body>
  <div class="wrap" id="root">
    <img id="logo" alt="" draggable="false" />
  </div>
  <script>
    function post(m) {
      try {
        if (window.chrome && window.chrome.webview && window.chrome.webview.postMessage) {
          window.chrome.webview.postMessage(JSON.stringify(m));
        }
      } catch (e) {}
    }
    var holdTimer = null;
    var HOLD_MS = 60;
    var dragStartScreenX = 0;
    var dragStartScreenY = 0;
    var MOVE_PX = 5;
    var dragSent = false;
    var root = document.getElementById('root');
    var logo = document.getElementById('logo');

    function clearHold() {
      if (holdTimer) {
        clearTimeout(holdTimer);
        holdTimer = null;
      }
    }
    function onPointerDown(e) {
      if (e.button !== 0) return;
      dragSent = false;
      dragStartScreenX = e.screenX;
      dragStartScreenY = e.screenY;
      try {
        if (root.setPointerCapture) root.setPointerCapture(e.pointerId);
      } catch (_) {}
      clearHold();
      holdTimer = setTimeout(function () {
        holdTimer = null;
        if (e.buttons & 1 && !dragSent) {
          dragSent = true;
          post({ type: 'drag_host' });
        }
      }, HOLD_MS);
    }
    function onPointerMove(e) {
      if (e.buttons !== 1 || dragSent) return;
      var dx = e.screenX - dragStartScreenX;
      var dy = e.screenY - dragStartScreenY;
      if (dx * dx + dy * dy >= MOVE_PX * MOVE_PX) {
        clearHold();
        dragSent = true;
        post({ type: 'drag_host' });
      }
    }
    function onPointerUp(e) {
      try {
        if (e && root.releasePointerCapture) root.releasePointerCapture(e.pointerId);
      } catch (_) {}
      var hadDrag = dragSent;
      clearHold();
      if (e && e.button === 0 && !hadDrag) {
        post({ type: 'bubble_mode_menu', x: e.screenX || 0, y: e.screenY || 0, reason: 'click' });
      }
      dragSent = false;
    }
    root.addEventListener('pointerdown', onPointerDown);
    root.addEventListener('pointermove', onPointerMove);
    root.addEventListener('pointerup', onPointerUp);
    root.addEventListener('pointercancel', onPointerUp);
    root.addEventListener('contextmenu', function (e) {
      e.preventDefault();
      post({ type: 'context_menu', x: e.screenX || 0, y: e.screenY || 0 });
    });
    if (window.chrome && window.chrome.webview) {
      window.chrome.webview.addEventListener('message', function (ev) {
        try {
          var raw = ev.data;
          var d = typeof raw === 'string' ? JSON.parse(raw) : raw;
          if (d && d.type === 'RESET_STATE') {
            try {
              if (typeof window.onWebViewResetState === 'function') window.onWebViewResetState();
            } catch (err2) {}
            return;
          }
          if (d && d.type === 'set_logo' && d.url) {
            logo.src = d.url;
            return;
          }
          if (d && d.type === 'set_theme') {
            var tm = String((d.themeMode || d.theme || '')).toLowerCase() === 'light' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', tm);
            return;
          }
          if (d && d.type === 'bubble_enter') {
            root.classList.remove('fb-enter');
            void root.offsetWidth;
            root.classList.add('fb-enter');
            setTimeout(function () { root.classList.remove('fb-enter'); }, 380);
            return;
          }
        } catch (err) {}
      });
    }
    post({ type: 'bubble_ready' });
  </script>
</body>
</html>
